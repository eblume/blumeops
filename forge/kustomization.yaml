apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Generated into the talos pod's ConfigMap by the talos kustomization
# (argocd/manifests/talos), which merges in lanes.json. Talos reads repos.json
# and branch-protections.json (the required checks it gates on) from that
# ConfigMap; forge reconcilers read both in place from this directory.
configMapGenerator:
  - name: talos-repos
    files:
      - repos.json
      - branch-protections.json
