    type: nixos
    release: self
    last-reviewed: 2026-10-14
    current-version: "v1.10.7"
    upstream-source: https://forge.ops.eblu.me/eblume/hephaestus/releases
    notes: >-
      hephd spoke for the ringtail agent (nixos/ringtail/agent-heph-spoke.nix),
