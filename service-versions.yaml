# Service / Tooling/ Application Version Tracking
#
# Tracks when each BlumeOps service was last reviewed for version freshness.
# Used by `mise run service-review` to surface stale services.
#
# Fields:
#   name            - kebab-case service identifier
#   type            - argocd | ansible | nixos | fly | mise | container
#   release         - optional; `self` = version advanced by the service's own
#                     release pipeline (review pipeline health, not an upstream
#                     bump); absent = upstream-tracked
#   parent          - optional; the parent service entry for an attached service
#   last-reviewed   - date (YYYY-MM-DD) or null
#   current-version - deployed version string or null
#   upstream-source - URL to upstream releases/changelog
#   notes           - optional deployment context (how the service is deployed);
#                     not a per-review log — put review findings in the changelog
#                     fragment / heph instead

