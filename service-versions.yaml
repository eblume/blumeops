  - name: heph
    type: nixos
    release: self
    last-reviewed: 2026-10-21
    current-version: "v1.10.9"
    upstream-source: https://forge.ops.eblu.me/eblume/hephaestus/releases
    notes: >-
      indri hub: the hephd now runs from the `hephaestus` flake input in
      darwin/indri/flake.nix (tag + tag-commit rev, `cli` output, nixpkgs
      follows indri's nixos-26.05), generation-owned LaunchAgent
      mcquack.eblume.heph (eblume/blumeops#1655). The authorized-sub is a
      seeded on-host secret file (darwin/indri/secrets.json) the agent's
      static wrapper cats into argv at startup - hephd accepts the flag
      argv-only. No --self-update flag: nothing auto-updates. The PWA shell
      is a store copy of the same pinned input's `heph-pwa/` directory with
      the `pwa-version.js` stamp baked in at build time (V5-83 link 1,
      eblume/blumeops#1760) - a version bump is a flake input bump and the
      auto-apply (provision-indri, class auto) switches hephd and the PWA
      shell together on merge. The retired ansible role's mutable checkout
      (`~/.cache/heph-pwa-src`) is now an orphan; earlier generations still
      serve the PWA from it, so keep it until the rollback floor passes this
      generation (then optional `rm -rf`). A hub
      rollback is a plain `sudo darwin-rebuild --rollback`. A boot-once
      LaunchAgent (mcquack.eblume.heph-cargo-bin-cleanup, the indri twin of
      ringtail's heph-cargo-bin-cleanup) removes the retired ~/.cargo/bin
      bins (heph, hephd, and the v1.8.0-era heph-tui/heph-quickadd) so no
      shell can shadow the store bins. The ringtail spokes keep their own
      pin: the `hephaestus` input in nixos/ringtail/flake.nix.

