      source-controlled change to `hephTag`, and the agent-heph-install
      oneshot recompiles on the next provision-ringtail. Deliberate: an
      in-boundary agent shouldn't auto-fetch+run new code. current-version
      is a hard pin. Review cadence exists so the pin doesn't rot into
      sync-version skew with the hub; bump in step with the hub.

