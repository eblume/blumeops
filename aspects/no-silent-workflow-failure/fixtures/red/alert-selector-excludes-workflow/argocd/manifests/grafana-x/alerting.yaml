apiVersion: 1
groups:
  - orgId: 1
    name: ci
    folder: Infrastructure Alerts
    interval: 30s
    rules:
      - uid: other-stale
        title: OtherStale
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: time() - forgejo_actions_last_success_timestamp_seconds{repo="fixture/alert-selector-excludes-workflow",workflow="other"}
              refId: A
