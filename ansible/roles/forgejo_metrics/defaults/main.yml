---
# forgejo-metrics on indri is nix-managed (darwin/indri, PR 4 of the
# nix-darwin series): the generation owns the unit and the collector script,
# so a normal provision must not touch it. Flip this to true only for the
# rollback re-write (darwin-rebuild --rollback first, then
# `mise run provision-indri -- --tags forgejo_metrics -e forgejo_metrics_ansible_managed=true`),
# per docs/how-to/indri/provision.md §Rolling back a service flip. The API
# key file task is intentionally not gated: key placement stays
# controller-side op.
forgejo_metrics_ansible_managed: false

# Forgejo metrics collection configuration

# Forgejo server URL
forgejo_metrics_url: "http://localhost:3001"

# Path to file containing Forgejo API token (should have 600 permissions)
forgejo_metrics_api_key_file: "/Users/erichblume/.forgejo-api-key"

# Metrics collection interval in seconds
forgejo_metrics_interval: 60

# Output directory for prometheus textfile collector
forgejo_metrics_dir: /opt/homebrew/var/node_exporter/textfile

# Script installation path
forgejo_metrics_script: /Users/erichblume/.local/bin/forgejo-metrics

# Log directory for metrics script output
forgejo_metrics_log_dir: /opt/homebrew/var/log
