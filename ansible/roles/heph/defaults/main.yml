---
# hephaestus hub (server mode) on indri.
# Other devices (e.g. gilbert) are spokes that sync against this hub.
# See [[set-up-sync-hub]] and [[host-heph-pwa]] in the hephaestus repo.
#
# The hub daemon itself is generation-owned: darwin/indri pins the hephaestus
# flake (v1.10.9, cli output) and owns the mcquack.eblume.heph LaunchAgent that
# execs the store hephd (eblume/blumeops#1655). The role's daemon legs
# (cargo install, version gate, plist, the op-read leg) retired with the
# rollback window over; this role keeps only the PWA shell checkout + its
# pwa-version.js stamp and the data dir.

# Pinned release tag: the PWA shell checkout and its pwa-version.js stamp.
# hephd self-update is OFF, so nothing changes the daemon's version out from
# under us (the daemon's own version is the darwin/indri flake input's pin).
# Bump on each release, then `mise run provision-indri -- --tags heph`.
# See docs/reference/services/hephaestus.md.
heph_version: v1.10.9

# Anonymous public HTTPS clone — used for the PWA source checkout, so
# provisioning needs no ssh-agent.
heph_repo_url: https://forge.ops.eblu.me/eblume/hephaestus.git

heph_data_dir: /Users/erichblume/.local/share/heph

# Version-pinned source checkout; the PWA static shell is served directly from
# its heph-pwa/ subdir (no copy), keeping shell and hub in lockstep at heph_version.
heph_pwa_src_dir: /Users/erichblume/.cache/heph-pwa-src
heph_web_root: "{{ heph_pwa_src_dir }}/heph-pwa"
