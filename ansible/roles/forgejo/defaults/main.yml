---
# Forgejo configuration
# Secrets are fetched from 1Password in the playbook pre_tasks

forgejo_app_name: Forgejo
forgejo_app_slogan: "Beyond coding. We Forge."
forgejo_run_user: erichblume
forgejo_run_mode: prod

# Source build paths
forgejo_repo_dir: /Users/erichblume/code/3rd/forgejo
forgejo_binary: "{{ forgejo_repo_dir }}/forgejo"

# Source build version + toolchain.
# Bumping forgejo_version here IS the upgrade: the role fetches from the forge
# mirror (origin), checks out this tag, and rebuilds when the running binary
# doesn't match. Deploy with `mise run provision-indri -- --tags forgejo`.
#
# !! DO NOT bump this blindly. Forgejo runs DB migrations automatically on the
#    next start — there is no review-before-migrate step, and major migrations
#    are effectively one-way. Before changing this value, especially across a
#    MAJOR version (the leading number), you MUST:
#      1. Read the release notes for every version in between for breaking
#         changes / manual-intervention items (see [[upgrade-forgejo]]).
#      2. Confirm a fresh forgejo.db backup exists (borgmatic dumps it nightly;
#         take an ad-hoc one for a same-day major bump).
#      3. For a major bump also set forgejo_go_version to satisfy the target
#         tag's go.mod `toolchain` directive (v15 requires go1.26.4).
forgejo_version: "v15.0.3"
forgejo_go_version: "1.26.4"
forgejo_node_version: "24"
forgejo_build_tags: "bindata timetzdata sqlite sqlite_unlock_notify"
forgejo_mise_bin: /etc/profiles/per-user/erichblume/bin/mise
# Build source = the forge mirror (origin); codeberg remains as a manual
# upstream remote and is left untouched by the role.
forgejo_mirror_url: https://forge.ops.eblu.me/mirrors/forgejo.git

# Data paths (migrated from brew to ~/forgejo)
forgejo_work_path: /Users/erichblume/forgejo
forgejo_config_path: "{{ forgejo_work_path }}/custom/conf/app.ini"
forgejo_data_path: "{{ forgejo_work_path }}/data"
forgejo_repo_root: "{{ forgejo_data_path }}/forgejo-repositories"
forgejo_lfs_path: "{{ forgejo_data_path }}/lfs"
forgejo_log_path: "{{ forgejo_work_path }}/log"
forgejo_log_dir: /Users/erichblume/Library/Logs

# Server settings
forgejo_http_addr: 0.0.0.0
forgejo_http_port: 3001
forgejo_domain: forge.eblu.me
forgejo_ssh_domain: forge.ops.eblu.me
forgejo_root_url: "https://{{ forgejo_domain }}/"
forgejo_offline_mode: true

# SSH settings (built-in SSH server)
forgejo_disable_ssh: false
forgejo_start_ssh_server: true
forgejo_builtin_ssh_user: forgejo
forgejo_ssh_port: 2222
forgejo_ssh_listen_port: 2200
forgejo_lfs_start_server: true

# Database (SQLite)
forgejo_db_type: sqlite3
forgejo_db_path: "{{ forgejo_data_path }}/forgejo.db"

# Service settings
forgejo_disable_registration: true
forgejo_require_signin_view: false

# Session
forgejo_session_provider: file

# Logging
forgejo_log_mode: console
forgejo_log_level: info

# Actions (Forgejo CI)
forgejo_actions_enabled: true
forgejo_actions_default_url: https://code.forgejo.org
