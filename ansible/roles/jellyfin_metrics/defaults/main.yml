---
# jellyfin-metrics on indri is nix-managed (darwin/indri, PR 4 of the
# nix-darwin series): the generation owns the unit and the collector script,
# so a normal provision must not touch it. Flip this to true only for the
# rollback re-write (darwin-rebuild --rollback first, then
# `mise run provision-indri -- --tags jellyfin_metrics -e jellyfin_metrics_ansible_managed=true`),
# per docs/how-to/indri/provision.md §Rolling back a service flip. The API
# key file task is intentionally not gated: key placement stays
# controller-side op.
jellyfin_metrics_ansible_managed: false

# Jellyfin metrics collection configuration

# Jellyfin server URL
jellyfin_metrics_url: "http://localhost:8096"

# Path to file containing Jellyfin API key (should have 600 permissions)
jellyfin_metrics_api_key_file: "/Users/erichblume/.jellyfin-api-key"

# Metrics collection interval in seconds
jellyfin_metrics_interval: 60

# Output directory for prometheus textfile collector
jellyfin_metrics_dir: /opt/homebrew/var/node_exporter/textfile

# Script installation path
jellyfin_metrics_script: /Users/erichblume/.local/bin/jellyfin-metrics

# Log directory for metrics script output
jellyfin_metrics_log_dir: /opt/homebrew/var/log
