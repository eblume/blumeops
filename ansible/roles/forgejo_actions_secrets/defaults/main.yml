---
# Forgejo Actions Secrets role configuration
#
# This role syncs repository-level Actions secrets from 1Password to Forgejo
# via the Forgejo API.

forgejo_actions_secrets_api_url: "https://forge.eblu.me/api/v1"
forgejo_actions_secrets_owner: eblume

# Secrets to sync per repo.
# Each entry: {repo: "name", secrets: [{name: "SECRET_NAME", value_var: "ansible_fact_name"}]}
forgejo_actions_secrets_repos:
  - repo: blumeops
    secrets:
      # The per-purpose secrets that used to live here (ARGOCD_AUTH_TOKEN,
      # FLY_DEPLOY_TOKEN, ZOT_CI_API_KEY, MAIN_PUSH_TOKEN) migrated to
      # job-time `op read` of blumeops-ci items via BLUMEOPS_CI_OP_TOKEN
      # ([[blumeops-ci-item-migration]]). This role no longer syncs them;
      # delete the stale Actions secrets by hand once the migrated
      # workflows are verified.
      #
      # Lets the Agent Repo Access workflow reconcile the `agents` bot's
      # collaborations against repos.json, and warrant-bot-drift read
      # collaborator perms + branch protections. An eblume PAT scoped to
      # write:repository,read:user (item forge-repo-write-token) —
      # collaborator ops need repo-admin *permission* (eblume owns the repos)
      # but only the repository token *scope*, plus read:user for the drift
      # job's site-admin check, so CI no longer holds the all-scopes admin
      # PAT (heph 01KZ5ESS2G, 2026-08-22). The role itself still
      # authenticates its secret PUTs with forgejo_api_token, which never
      # leaves the human-run provisioning step.
      #
      # This is the deliberate shape of "CI gets more than the agents vault":
      # a human runs `mise run provision-indri -- --tags forgejo_actions_secrets`
      # from gilbert, under biometric `op`, to push a curated subset of the
      # blumeops vault into Forgejo. The vault itself stays out of CI's reach.
      #
      # NOT `FORGEJO_…`: Forgejo reserves the `FORGEJO_` prefix for the
      # Actions tokens it injects itself and rejects the create with HTTP 400
      # (the same reason the `cv` entry below is FORGE_TOKEN).
      - name: FORGE_REPO_WRITE_TOKEN
        value_var: forgejo_secret_repo_write_token
      # Read-only op service account scoped to the blumeops-ci vault
      # ([[warrant-approval-gated-runs]] Phase 2): privileged workflows
      # `op read` runtime secrets with it at job time. The vault starts
      # empty — items migrate in via the audited per-workflow review
      # (heph 01KZ0G21JS), never wholesale.
      - name: BLUMEOPS_CI_OP_TOKEN
        value_var: forgejo_secret_blumeops_ci_op_token
  - repo: cv
    secrets:
      - name: FORGE_TOKEN
        value_var: forgejo_api_token
  # Auto-release secrets ([[horkos]] extraction, 2026-08): merge to main in
  # these repos builds + pushes the image and opens a pin-bump PR on
  # blumeops. The zot push key is read from blumeops-ci at job time with
  # BLUMEOPS_CI_OP_TOKEN — sharing that token with talos/horkos release CI
  # is the one-CI-trust-tier decision (2026-08-21, logged on heph
  # 01KZ5ESS0W…): all eblume/* CI is one tier. RELEASE_FORGE_TOKEN is
  # warrant-bot's PAT (write on blumeops only — branch push + PR open, can
  # never merge or dispatch).
  - repo: talos
    secrets:
      - name: BLUMEOPS_CI_OP_TOKEN
        value_var: forgejo_secret_blumeops_ci_op_token
      - name: RELEASE_FORGE_TOKEN
        value_var: forgejo_secret_release_forge_token
  - repo: horkos
    secrets:
      - name: BLUMEOPS_CI_OP_TOKEN
        value_var: forgejo_secret_blumeops_ci_op_token
      - name: RELEASE_FORGE_TOKEN
        value_var: forgejo_secret_release_forge_token
