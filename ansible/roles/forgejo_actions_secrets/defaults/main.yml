---
# Forgejo Actions Secrets role configuration
#
# Authoritative sync of repository-level Actions secrets from 1Password to
# Forgejo: declared secrets are PUT (created/updated), undeclared live ones
# are DELETEd, and `--check` reports name-level drift (values are write-only,
# so value drift is invisible to the role).

forgejo_actions_secrets_api_url: "https://forge.eblu.me/api/v1"
forgejo_actions_secrets_owner: eblume

# The fact this role authenticates with: an eblume PAT scoped to
# write:repository,read:user (item forge-repo-write-token). Repo-admin
# endpoints (collaborator/Actions-secret ops) work on it because eblume owns
# the repos; the site-admin api-token is no longer used by this role.
forgejo_actions_secrets_token_var: forgejo_secret_repo_write_token

# Secrets to sync per repo.
# Each entry: {repo: "name", secrets: [{name: "SECRET_NAME", value_var: "ansible_fact_name"}]}
# NOT `FORGEJO_…`: Forgejo reserves the `FORGEJO_` prefix for the Actions
# tokens it injects itself and rejects the create with HTTP 400.
forgejo_actions_secrets_repos:
  # The only two stored secrets any workflow reads (agent-repo-access,
  # horkos-forge-drift, argocd-deploy, build-blumeops, build-container,
  # deploy-fly, run-script).
  - repo: blumeops
    secrets:
      # FORGE_REPO_WRITE_TOKEN lets agent-repo-access reconcile the `agents`
      # bot's collaborations against repos.json and horkos-forge-drift read
      # collaborator perms + branch protections. An eblume PAT scoped to
      # write:repository,read:user — collaborator ops need repo-admin
      # *permission* (eblume owns the repos) but only the repository token
      # *scope*, plus read:user for the drift job's site-admin check, so CI
      # holds no all-scopes admin PAT (heph 01KZ5ESS2G). A human runs
      # `mise run provision-indri -- --tags forgejo_actions_secrets` from
      # gilbert under biometric `op`; the vault stays out of CI's reach.
      - name: FORGE_REPO_WRITE_TOKEN
        value_var: forgejo_secret_repo_write_token
      # BLUMEOPS_CI_OP_TOKEN: read-only op service account scoped to the
      # blumeops-ci vault ([[warrant-approval-gated-runs]] Phase 2) that
      # privileged workflows `op read` runtime secrets with at job time.
      - name: BLUMEOPS_CI_OP_TOKEN
        value_var: forgejo_secret_blumeops_ci_op_token
  # cv's release CI is stored-secret-free; the empty list makes provisioning
  # authoritative here (the first run deletes the stale FORGE_TOKEN).
  - repo: cv
    secrets: []
  # ZOT_PUSH_API_KEY is the stripped release CI's only stored secret: the
  # per-repo push-only zot identity from the blumeops/talos accessControl;
  # the master field is kept in sync by `mise run zot-apikey-rotate talos-zot`.
  # When the #1039 step-2b flip moves release.yaml's --dest-creds to
  # `ci-zot-talos`, point value_var (and the playbook's op read) at the
  # `ci-zot-talos-api` master field in the same PR — a provisioning run
  # that still declares the old field would push the old key back.
  - repo: talos
    secrets:
      - name: ZOT_PUSH_API_KEY
        value_var: forgejo_secret_talos_zot_api
  # Same shape as talos: the per-repo push-only zot identity from the
  # blumeops/horkos accessControl; master field kept in sync by
  # `mise run zot-apikey-rotate horkos-zot` (same flip note: `ci-zot-horkos-api`).
  - repo: horkos
    secrets:
      - name: ZOT_PUSH_API_KEY
        value_var: forgejo_secret_horkos_zot_api
