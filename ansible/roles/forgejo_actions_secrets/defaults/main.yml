---
# Forgejo Actions Secrets role configuration
#
# This role syncs repository-level Actions secrets from 1Password to Forgejo
# via the Forgejo API.

forgejo_actions_secrets_api_url: "https://forge.eblu.me/api/v1"
forgejo_actions_secrets_owner: eblume

# Secrets to sync per repo.
# Each entry: {repo: "name", secrets: [{name: "SECRET_NAME", value_var: "ansible_fact_name"}]}
forgejo_actions_secrets_repos:
  - repo: blumeops
    secrets:
      - name: ARGOCD_AUTH_TOKEN
        value_var: forgejo_secret_argocd_token
      - name: FLY_DEPLOY_TOKEN
        value_var: forgejo_secret_fly_deploy_token
      - name: ZOT_CI_API_KEY
        value_var: forgejo_secret_zot_ci_api_key
      # eblume-owned PAT (write:repository) whitelisted to push protected `main`;
      # the release workflows push their commit with it because the automatic
      # Actions token can't be push-whitelisted (Forgejo #11159).
      - name: MAIN_PUSH_TOKEN
        value_var: forgejo_secret_main_push_token
      # Lets the Agent Repo Access workflow reconcile the `agents` bot's
      # collaborations against containers/agent-ws/repos.json. Collaborator
      # management is an admin-level operation, so this reuses forgejo_api_token
      # (the same eblume PAT this role authenticates with — writing Actions
      # secrets is itself admin-level) rather than minting a second one.
      #
      # This is the deliberate shape of "CI gets more than the agents vault":
      # a human runs `mise run provision-indri -- --tags forgejo_actions_secrets`
      # from gilbert, under biometric `op`, to push a curated subset of the
      # blumeops vault into Forgejo. The vault itself stays out of CI's reach.
      #
      # NOT `FORGEJO_ADMIN_TOKEN`: Forgejo reserves the `FORGEJO_` prefix for the
      # Actions tokens it injects itself and rejects the create with HTTP 400
      # (the same reason the `cv` entry below is FORGE_TOKEN).
      - name: FORGE_ADMIN_TOKEN
        value_var: forgejo_api_token
  - repo: cv
    secrets:
      - name: FORGE_TOKEN
        value_var: forgejo_api_token
