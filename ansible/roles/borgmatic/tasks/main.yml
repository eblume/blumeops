---
# Borgmatic is installed via mise (pipx) and called directly by LaunchAgents.
# This role manages installation, config, and the scheduled LaunchAgents.

- name: Install borgmatic via mise
  ansible.builtin.command: mise install pipx:borgmatic@{{ borgmatic_version }}
  register: borgmatic_install
  changed_when: "'installed' in borgmatic_install.stderr"

- name: Ensure borgmatic config directory exists
  ansible.builtin.file:
    path: "{{ borgmatic_config_dir }}"
    state: directory
    mode: '0700'

# .pgpass is used by pg_dump for database backups
# Password is fetched in playbook pre_tasks as borgmatic_db_password
- name: Write .pgpass file for borgmatic PostgreSQL backups
  ansible.builtin.copy:
    content: |
      # Managed by ansible (borgmatic role) - k8s PostgreSQL backup credentials
      # 5433 = immich-pg, 5434 = ringtail blumeops-pg
      pg.ops.eblu.me:5433:*:borgmatic:{{ borgmatic_db_password }}
      pg.ops.eblu.me:5434:*:borgmatic:{{ borgmatic_db_password }}
    dest: ~/.pgpass
    mode: '0600'
  no_log: true

# BorgBase offsite backup - SSH key and host verification
- name: Deploy BorgBase SSH private key
  ansible.builtin.copy:
    content: "{{ borgbase_ssh_private_key }}\n"
    dest: "{{ borgmatic_borgbase_ssh_key_path }}"
    mode: '0600'
  no_log: true

- name: Add BorgBase host keys to known_hosts
  ansible.builtin.known_hosts:
    name: "{{ item }}"
    key: "{{ item }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGU0mISTyHBw9tBs6SuhSq8tvNM8m9eifQxM+88TowPO"
    state: present
  loop:
    - u3ugi1x1.repo.borgbase.com
    - xcrtl5tg.repo.borgbase.com

- name: Ensure dump staging directory exists
  ansible.builtin.file:
    path: "{{ borgmatic_k8s_dump_dir }}"
    state: directory
    mode: '0700'
  when: (borgmatic_k8s_sqlite_dumps | length > 0) or (borgmatic_k8s_file_dumps | length > 0) or (borgmatic_k8s_tar_dumps | length > 0) or (borgmatic_local_sqlite_dumps | length > 0)

# Pre-tier-split runs staged the talos tar here (k8s-dumps/ was a source
# of the main config); the talos-data config stages into
# k8s-dumps-talos/ now, so any leftover is stale and must not ride into
# archives.
- name: Remove stale talos-data tar from k8s-dumps dir
  ansible.builtin.file:
    path: "{{ borgmatic_k8s_dump_dir }}/talos-data.tar"
    state: absent

- name: Ensure ~/bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/bin"
    state: directory
    mode: '0755'
  when: (borgmatic_k8s_sqlite_dumps | length > 0) or (borgmatic_k8s_file_dumps | length > 0) or (borgmatic_k8s_tar_dumps | length > 0)

- name: Deploy k8s SQLite dump helper script
  ansible.builtin.template:
    src: k8s-sqlite-dump.sh.j2
    dest: "{{ ansible_facts.env.HOME }}/bin/borgmatic-k8s-sqlite-dump"
    mode: '0755'
  when: borgmatic_k8s_sqlite_dumps | length > 0

- name: Deploy k8s file dump helper script
  ansible.builtin.template:
    src: k8s-file-dump.sh.j2
    dest: "{{ ansible_facts.env.HOME }}/bin/borgmatic-k8s-file-dump"
    mode: '0755'
  when: borgmatic_k8s_file_dumps | length > 0

- name: Deploy k8s tar dump helper script
  ansible.builtin.template:
    src: k8s-tar-dump.sh.j2
    dest: "{{ ansible_facts.env.HOME }}/bin/borgmatic-k8s-tar-dump"
    mode: '0755'
  when: borgmatic_k8s_tar_dumps | length > 0

- name: Deploy borgmatic configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ borgmatic_config }}"
    mode: '0600'

- name: Deploy borgmatic talos-data configuration
  ansible.builtin.template:
    src: talos-data.yaml.j2
    dest: "{{ borgmatic_talos_data_config }}"
    mode: '0600'

- name: Deploy borgmatic LaunchAgent plist
  ansible.builtin.template:
    src: borgmatic.plist.j2
    dest: ~/Library/LaunchAgents/mcquack.eblume.borgmatic.plist
    mode: '0644'
  notify: Reload borgmatic

- name: Check if borgmatic LaunchAgent is loaded
  ansible.builtin.command: launchctl list mcquack.eblume.borgmatic
  register: borgmatic_launchctl_check
  changed_when: false
  failed_when: false

- name: Load borgmatic LaunchAgent if not loaded
  ansible.builtin.command: launchctl load ~/Library/LaunchAgents/mcquack.eblume.borgmatic.plist
  when: borgmatic_launchctl_check.rc != 0
  changed_when: true
  failed_when: false

# --- Tier B (operational) backups: rotating tier (forgejo, config, dumps) ---

# k8s-dumps-op is a source_directories entry in operational.yaml with
# source_directories_must_exist: true, so it must exist before the first
# operational create (the hook's mkdir runs later, during the run).
- name: Ensure operational dump staging directory
  ansible.builtin.file:
    path: "{{ borgmatic_operational_dump_dir }}"
    state: directory
    mode: '0700'

- name: Deploy borgmatic operational configuration
  ansible.builtin.template:
    src: operational.yaml.j2
    dest: "{{ borgmatic_operational_config }}"
    mode: '0600'

- name: Deploy borgmatic-ops LaunchAgent plist
  ansible.builtin.template:
    src: borgmatic-ops.plist.j2
    dest: ~/Library/LaunchAgents/mcquack.eblume.borgmatic-ops.plist
    mode: '0644'
  notify: Reload borgmatic-ops

- name: Check if borgmatic-ops LaunchAgent is loaded
  ansible.builtin.command: launchctl list mcquack.eblume.borgmatic-ops
  register: borgmatic_ops_launchctl_check
  changed_when: false
  failed_when: false

- name: Load borgmatic-ops LaunchAgent if not loaded
  ansible.builtin.command: launchctl load ~/Library/LaunchAgents/mcquack.eblume.borgmatic-ops.plist
  when: borgmatic_ops_launchctl_check.rc != 0
  changed_when: true
  failed_when: false

# --- Immich photo library backup (BorgBase offsite only) ---

- name: Deploy borgmatic photos configuration
  ansible.builtin.template:
    src: photos.yaml.j2
    dest: "{{ borgmatic_photos_config }}"
    mode: '0600'

- name: Deploy borgmatic-photos LaunchAgent plist
  ansible.builtin.template:
    src: borgmatic-photos.plist.j2
    dest: ~/Library/LaunchAgents/mcquack.eblume.borgmatic-photos.plist
    mode: '0644'
  notify: Reload borgmatic-photos

- name: Check if borgmatic-photos LaunchAgent is loaded
  ansible.builtin.command: launchctl list mcquack.eblume.borgmatic-photos
  register: borgmatic_photos_launchctl_check
  changed_when: false
  failed_when: false

- name: Load borgmatic-photos LaunchAgent if not loaded
  ansible.builtin.command: launchctl load ~/Library/LaunchAgents/mcquack.eblume.borgmatic-photos.plist
  when: borgmatic_photos_launchctl_check.rc != 0
  changed_when: true
  failed_when: false

# --- Immich photo library verification (weekly check + test restore) ---

- name: Ensure borgmatic verification marker directory exists
  ansible.builtin.file:
    path: "{{ borgmatic_verify_marker_dir }}"
    state: directory
    mode: '0755'

- name: Deploy borgmatic-verify-photos script
  ansible.builtin.template:
    src: borgmatic-verify-photos.sh.j2
    dest: /Users/erichblume/.local/bin/borgmatic-verify-photos
    mode: '0755'

- name: Deploy borgmatic-verify-photos LaunchAgent plist
  ansible.builtin.template:
    src: borgmatic-verify-photos.plist.j2
    dest: ~/Library/LaunchAgents/mcquack.eblume.borgmatic-verify-photos.plist
    mode: '0644'
  notify: Reload borgmatic-verify-photos

- name: Check if borgmatic-verify-photos LaunchAgent is loaded
  ansible.builtin.command: launchctl list mcquack.eblume.borgmatic-verify-photos
  register: borgmatic_verify_launchctl_check
  changed_when: false
  failed_when: false

- name: Load borgmatic-verify-photos LaunchAgent if not loaded
  ansible.builtin.command: launchctl load ~/Library/LaunchAgents/mcquack.eblume.borgmatic-verify-photos.plist
  when: borgmatic_verify_launchctl_check.rc != 0
  changed_when: true
  failed_when: false
