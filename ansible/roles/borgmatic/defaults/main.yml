---
# borgmatic on indri is nix-managed (darwin/indri, PR 11 of the nix-darwin
# series): the generation owns this role's LaunchAgent plists (borgmatic,
# borgmatic-ops, borgmatic-photos, borgmatic-verify-photos), so a normal
# provision must not re-deploy or reload them. Flip this to true only
# for the rollback re-write (darwin-rebuild --rollback first, then
# `mise run provision-indri -- --tags borgmatic -e borgmatic_ansible_managed=true`),
# per docs/how-to/indri/provision.md §Rolling back a service flip.

borgmatic_ansible_managed: false

borgmatic_config: /Users/erichblume/.config/borgmatic/config.yaml
borgmatic_config_dir: /Users/erichblume/.config/borgmatic
borgmatic_log_dir: /Users/erichblume/Library/Logs

# Full path to borg binary since LaunchAgent doesn't have homebrew in PATH
borgmatic_local_path: /opt/homebrew/bin/borg

# Borgmatic version — keep in sync with mise.toml in the repo root.
# Ansible installs this via `mise install` so indri doesn't need the repo cloned.
borgmatic_version: "2.1.10"

# Full path to borgmatic binary — called directly by LaunchAgents to avoid
# routing through mise, which triggers macOS TCC permission dialogs for
# protected folders (e.g. ~/Documents) that hang headless LaunchAgent sessions.
# Uses mise's "latest" symlink so version bumps don't break the LaunchAgent path.
borgmatic_bin: /Users/erichblume/.local/share/mise/installs/pipx-borgmatic/latest/bin/borgmatic

# borg (not borgmatic) — the one-off repo-config flip in tasks/main.yml
borgmatic_borg_bin: /opt/homebrew/bin/borg

# Schedule: runs daily at 2:00 AM
borgmatic_schedule_hour: 2
borgmatic_schedule_minute: 0

# Archive tier — kept forever in the never-pruned indri-* archives.
# /Volumes/shower, the borgmatic config, and the remaining (re-fetchable or
# service-state) dumps stay in the operational tier.
borgmatic_source_directories:
  - /Users/erichblume/code/personal/zk
  - /Users/erichblume/Documents
  # ~/forgejo minus the live WAL DB (snapshotted in the before-hook of
  # config.yaml.j2), the pull mirrors, and the regenerable/ephemeral churn
  # (excluded in borgmatic_exclude_patterns below). The git repos are the
  # primary source
  # of truth — only blumeops has a GitHub mirror — so they are never-lose,
  # not operational.
  - /Users/erichblume/forgejo
  # Never-lose dump staging dir (same path as borgmatic_archive_dump_dir
  # below); the hook's mkdir runs later, during the 02:00 run.
  - /Users/erichblume/.local/share/borgmatic/k8s-dumps-archive

# ~/forgejo exclusions for the never-pruned tier: the full mirrors org
# (re-fetchable from upstream) and the live WAL DB (snapshotted via .backup
# instead), plus the regenerable or ephemeral churn measured on indri
# 2026-10-13 — actions_log 84 MB and growing with every CI run, indexers
# 26 MB, queues 6 MB, actions_artifacts 6 MB (ephemeral by design) — which
# would otherwise be kept forever on BorgBase.
borgmatic_exclude_patterns:
  - /Users/erichblume/forgejo/data/forgejo.db*
  - /Users/erichblume/forgejo/data/forgejo-repositories/mirrors
  - /Users/erichblume/forgejo/data/actions_artifacts
  - /Users/erichblume/forgejo/data/actions_log
  - /Users/erichblume/forgejo/data/indexers
  - /Users/erichblume/forgejo/data/queues
  - /Users/erichblume/forgejo/data/sessions
  - /Users/erichblume/forgejo/data/tmp
  - /Users/erichblume/forgejo/log

# Archive-tier repos (never pruned): the historical mixed archives plus the
# new indri-* and talos-data-* archives live here.
borgmatic_repositories:
  - path: /Volumes/backups/borg/
    label: sifaka-borg-backups
    encryption: repokey
    append_only: true
  - path: ssh://u3ugi1x1@u3ugi1x1.repo.borgbase.com/./repo
    label: borgbase-offsite
    encryption: repokey
    append_only: true

# BorgBase SSH key (fetched from 1Password in playbook pre_tasks)
borgmatic_borgbase_ssh_key_path: /Users/erichblume/.ssh/borgbase_ed25519

# SSH key for the ringtail dump endpoint (user `borgmatic`, forced command —
# nixos/ringtail). Not the BorgBase key: IdentitiesOnly keeps them separate.
borgmatic_ringtail_ssh_key_path: /Users/erichblume/.ssh/borgmatic_ringtail_ed25519

# K8s SQLite databases to dump before backup: an online .backup via
# kubectl exec, done by the ringtail dump endpoint (nixos/ringtail/
# borgmatic-dump.sh). Each entry's name selects a row of that table — pod
# coordinates live there, not here; the dump lands in
# borgmatic_operational_dump_dir/<name>.db.
borgmatic_k8s_sqlite_dumps:
  - name: mealie
    target: ssh:borgmatic@ringtail

# K8s SQLite databases dumped by the archive (never-lose) config — same
# endpoint machinery as borgmatic_k8s_sqlite_dumps; the snapshot lands in
# borgmatic_archive_dump_dir/<name>.db and rides in the indri-* archives.
borgmatic_archive_k8s_sqlite_dumps:
  - name: horkos
    target: ssh:borgmatic@ringtail
    # horkos (approval-queue dispatch) DB — only copy of queue state;
    # Python image ships python3 so the endpoint's in-pod sqlite3 .backup works as-is.

# K8s services that produce their own consistent backup files on a PVC
# (rather than us running an online dump via kubectl exec): the ringtail dump
# endpoint (nixos/ringtail/borgmatic-dump.sh) scans its table row's dir for the
# newest backup file and streams it to
# borgmatic_operational_dump_dir/<name>.db. The dump name is the only
# per-entry dial sent over SSH; the endpoint table holds the rest. See ~/bin/borgmatic-k8s-file-dump.
borgmatic_k8s_file_dumps:
  # navidrome writes its own WAL-safe DB backups (users, play counts,
  # playlists) on a cron via ND_BACKUP_* — the minimal nix image has no
  # python3/sqlite3 to dump online, so we just ferry navidrome's newest
  # snapshot. Requires coreutils in the image for the in-pod ls/cat.
  - name: navidrome
    target: ssh:borgmatic@ringtail
  # audiobookshelf's built-in scheduled backup zips config+metadata to
  # /metadata/backups (fixed-width timestamp, so lexically sortable), so we
  # ferry the newest one off. Requires coreutils in the image for the
  # in-pod ls/cat.
  - name: audiobookshelf
    target: ssh:borgmatic@ringtail
  # pulumi-stack-backup CronJob exports both Pulumi Cloud stacks' state daily
  # (--show-secrets) to a PVC, named stack_<YYYYmmddTHHMMSSZ>.json (fixed-width
  # UTC timestamp, lexically sortable). One ferry per stack, staged as
  # k8s-dumps-op/pulumi-<stack>-state.db (the ferry names every file-dump target
  # .db regardless of content). Stack config is not exported: its secrets come
  # from Pulumi ESC (backed by 1Password) and the rest is in git.
  # The files contain plaintext secret values (Tailscale auth keys) — the borg
  # repository encryption is the compensating control.
  #
  # The CronJob pod is Succeeded (short-lived) by ferry time, so the ringtail
  # dump endpoint reads the local-path PV's host path directly (no pod exec —
  # see nixos/ringtail/borgmatic-dump.sh). The endpoint is self-contained: a
  # missing or empty export keeps the previous staged export and exits 0 (so a
  # dead export can't abort the nightly), while a genuine infra error (PVC/PV
  # unresolvable, k3s down) still exits non-zero and aborts.
  - name: pulumi-tail8d86e-state
    target: ssh:borgmatic@ringtail
  - name: pulumi-eblu-me-state
    target: ssh:borgmatic@ringtail

# K8s pods whose data dir is tarred in-pod and streamed back — no
# sqlite3 or python3 needed, just tar: the ringtail dump endpoint
# (nixos/ringtail/borgmatic-dump.sh) tars its table row's dir to
# borgmatic_operational_dump_dir/<name>.tar. The dump name is the only
# per-entry dial sent over SSH; the endpoint table holds the rest. See ~/bin/borgmatic-k8s-tar-dump.
borgmatic_k8s_tar_dumps:
  # talos agent-service state: all session transcripts
  # (data/sessions/<timestamp>_<sessionId>.jsonl) plus meta.json,
  # crons.json, settings.json. session-index.sqlite is excluded from the
  # tar (derived cache over the jsonl, rebuilt on cold start).
  # Every session is stored forever (heph 01M0GA6JPGQF96AM5JZKA37YSV).
  - name: talos-data
    target: ssh:borgmatic@ringtail

# K8s pods tarred for the archive (never-lose) config — same endpoint
# machinery as borgmatic_k8s_tar_dumps; the tar lands in
# borgmatic_archive_dump_dir/<name>.tar and rides in the indri-* archives.
borgmatic_archive_k8s_tar_dumps:
  # paperless-ngx document library — originals, archived, thumbnails — on
  # the sifaka NFS media PVC (sifaka's only protection is RAID-5, so this
  # is the offsite copy; see [[backups]]). Multi-container pod — the
  # endpoint table row names the container. The DB side is covered by
  # borgmatic_archive_postgresql_databases (name: paperless).
  - name: paperless-media
    target: ssh:borgmatic@ringtail

# Local (on-indri) SQLite databases captured in a before-backup hook via the
# sqlite3 online .backup API. We deliberately avoid borgmatic's native
# sqlite_databases hook: it dumps via `sqlite3 .dump`, which has a documented
# silent-failure mode on WAL databases (exit code stays 0 on a torn read —
# borgmatic #295 / SQLite forum). The .backup API is WAL-safe and returns a
# real exit code, so a failed snapshot aborts the whole borgmatic run loudly.
# Snapshots land in borgmatic_archive_dump_dir (an archive-tier source) and
# ride in the indri-* archives.
borgmatic_archive_sqlite_dumps:
  # heph hub canonical store — the only copy of all task/context data once
  # spokes are pure replicas (see [[hephaestus]]). WAL mode, continuously
  # written by every spoke sync, so a plain file copy could tear.
  - name: heph
    path: /Users/erichblume/.local/share/heph/heph.db
  # forgejo — primary source of truth for blumeops. WAL mode (see the -wal
  # file), so it must be snapshotted via the online .backup API, not copied
  # raw from source_directories. The git repositories themselves come from the
  # /Users/erichblume/forgejo source dir above.
  - name: forgejo
    path: /Users/erichblume/forgejo/data/forgejo.db

# Encryption passcommand (reads borg passphrase)
borgmatic_encryption_passcommand: cat /Users/erichblume/.borg/config.yaml

# The main config is the never-pruned archive tier (zk, Documents, forgejo,
# and the never-lose dumps heph/forgejo/horkos/paperless) — no retention
# keys and no prune action. Tier B retention lives in operational.yaml.

# Retry a failing repository action (e.g. a broken SSH pipe mid-upload to the
# BorgBase offsite repo) instead of losing the whole night. borg checkpoints an
# interrupted `create`, so each retry resumes rather than restarting. retry_wait
# backs off linearly (300s, 600s, 900s), so worst-case added delay is ~30min —
# well inside the 2h gap before the 4:00 AM photos backup. See [[borgmatic]].
borgmatic_retries: 3
borgmatic_retry_wait: 300

# talos-data (agent session transcripts) — kept forever, never pruned
# (heph 01M0GA6JPGQF96AM5JZKA37YSV). Separate config so the main
# config's prune can't reach its `talos-data-*` archives, and so a
# failed main run can't be masked by a fresh talos archive. A future
# tier split that wants to prune it is a deliberate PR on its own.
borgmatic_talos_data_config: /Users/erichblume/.config/borgmatic/talos-data.yaml
# Dump staging dir for talos-data ONLY; the main config does not back
# it up, so its source sets stay disjoint from the operational
# k8s-dumps-op/ staging.
borgmatic_talos_data_dump_dir: /Users/erichblume/.local/share/borgmatic/k8s-dumps-talos

# Tier B (operational) backups — rotating tier, scheduled 03:00. Never
# mixed into the archive-tier `indri-*` archives: own config, own
# `operational-*` prefix, own local repo. The retention keys are enforced
# by the ops agent's `create prune compact` action, matched to the
# `operational-*` prefix (see eblume/blumeops#1417).
borgmatic_operational_config: /Users/erichblume/.config/borgmatic/operational.yaml
borgmatic_operational_schedule_hour: 3
borgmatic_operational_schedule_minute: 0

# Tier B (operational) repo — local sifaka only for now; a BorgBase copy
# needs a dashboard-created key, so that's a separate deliberate step.
# Sibling of the archive-tier root: borg 1.x refuses to create a
# repository inside an existing one. The role creates it (repo-create,
# idempotent — see tasks/main.yml).
borgmatic_operational_repositories:
  - path: /Volumes/backups/borg-operational/
    label: sifaka-operational
    encryption: repokey
    # false: this repo rotates — on borg 1.4 an append-only repo makes
    # `compact` a silent no-op, so pruned archives' segments would never
    # be reclaimed. Client-side append_only on a local SMB mount protects
    # nothing against indri anyway (see [[borgmatic]]).
    append_only: false
borgmatic_operational_source_directories:
  - /Users/erichblume/.config/borgmatic
  - /Users/erichblume/.local/share/borgmatic/k8s-dumps-op
  - /Volumes/shower
borgmatic_operational_dump_dir: /Users/erichblume/.local/share/borgmatic/k8s-dumps-op
# Never-lose dump staging dir for the archive (main) config: heph, forgejo,
# horkos and paperless-media snapshots. Sibling of the operational and
# talos-data staging dirs; 0700 pre-created by tasks/main.yml because
# source_directories_must_exist: true.
borgmatic_archive_dump_dir: /Users/erichblume/.local/share/borgmatic/k8s-dumps-archive
# Retention — enforced by the ops agent's prune action. keep_yearly: -1
# means unlimited, so each year's final archive is kept forever.
borgmatic_operational_keep_daily: 7
borgmatic_operational_keep_weekly: 4
borgmatic_operational_keep_monthly: 12
borgmatic_operational_keep_yearly: -1

# PostgreSQL databases to backup (streamed via pg_dump)
# Password is read from ~/.pgpass (managed by this role)
# pg_dump_command must be full path since LaunchAgent doesn't have homebrew in PATH
# Paperless pg dump (document metadata: titles, tags, correspondents) —
# never-lose: scanned documents without their metadata are much less useful.
# Streams into the indri-* archives alongside the paperless-media tar.
borgmatic_archive_postgresql_databases:
  - name: paperless
    hostname: pg.ops.eblu.me
    port: 5434
    username: borgmatic

# --- Immich photo library backup (BorgBase offsite only) ---
borgmatic_photos_config: /Users/erichblume/.config/borgmatic/photos.yaml
borgmatic_photos_source_directories:
  - /Volumes/photos/library
  - /Volumes/photos/upload
borgmatic_photos_borgbase_repo: ssh://xcrtl5tg@xcrtl5tg.repo.borgbase.com/./repo
# Schedule: runs daily at 4:00 AM (offset from main backup at 2:00 AM)
borgmatic_photos_schedule_hour: 4
borgmatic_photos_schedule_minute: 0
# Retention: photos are precious, keep more history
borgmatic_photos_keep_daily: 7
borgmatic_photos_keep_monthly: 12
borgmatic_photos_keep_yearly: 1000

# Verification: weekly repo+archives check, monthly full-data check, sampled
# test-restore, via the mcquack.eblume.borgmatic-verify-photos LaunchAgent.
borgmatic_verify_bin: /Users/erichblume/.local/bin/borgmatic-verify-photos
# The interpreter the borgmatic console script (borgmatic_bin) uses, i.e. the
# TCC-granted responsible identity. The verify LaunchAgent launches its bash
# script under THIS python (as a subprocess) rather than exec'ing the bash
# script directly, or TCC attributes the live /Volumes/photos read to /bin/bash
# (no Network Volumes grant) and the sampled test-restore dies with EPERM. Kept
# on the same pipx "latest" symlink so it tracks borgmatic upgrades like borgmatic_bin.
# The venv lives in <version>/borgmatic/, and bin/ holds only the console scripts;
# this is the path in borgmatic_bin's shebang.
borgmatic_verify_python: /Users/erichblume/.local/share/mise/installs/pipx-borgmatic/latest/borgmatic/bin/python
borgmatic_verify_marker_dir: /opt/homebrew/var/state/borgmatic-verification
# launchd calendar: Weekday 2 = Tuesday; Day 2 = 2nd of each month
borgmatic_verify_schedule_days: [2]
borgmatic_verify_schedule_month_days: [2]
borgmatic_verify_schedule_hour: 6
borgmatic_verify_schedule_minute: 0

borgmatic_pg_dump_command: /opt/homebrew/opt/postgresql@18/bin/pg_dump
borgmatic_postgresql_databases:
  # k8s PostgreSQL (CloudNativePG) via Caddy L4 proxy.
  # port 5434 = ringtail blumeops-pg. The minikube cluster's 5432 route
  # is retired with [[retire-minikube]] phase 2.
  # migrated to ringtail blumeops-pg (wave-1 + retire-minikube phases 1-2)
  - name: authentik
    hostname: pg.ops.eblu.me
    port: 5434
    username: borgmatic
  - name: miniflux
    hostname: pg.ops.eblu.me
    port: 5434
    username: borgmatic
  - name: teslamate
    hostname: pg.ops.eblu.me
    port: 5434
    username: borgmatic
  # immich-pg cluster (VectorChord) via Caddy L4 on port 5433
  - name: immich
    hostname: pg.ops.eblu.me
    port: 5433
    username: borgmatic
