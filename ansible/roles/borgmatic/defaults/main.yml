---
borgmatic_config: /Users/erichblume/.config/borgmatic/config.yaml
borgmatic_config_dir: /Users/erichblume/.config/borgmatic
borgmatic_log_dir: /Users/erichblume/Library/Logs

# Full path to borg binary since LaunchAgent doesn't have homebrew in PATH
borgmatic_local_path: /opt/homebrew/bin/borg

# Borgmatic version — keep in sync with mise.toml in the repo root.
# Ansible installs this via `mise install` so indri doesn't need the repo cloned.
borgmatic_version: "2.1.7"

# Full path to borgmatic binary — called directly by LaunchAgents to avoid
# routing through mise, which triggers macOS TCC permission dialogs for
# protected folders (e.g. ~/Documents) that hang headless LaunchAgent sessions.
# Uses mise's "latest" symlink so version bumps don't break the LaunchAgent path.
borgmatic_bin: /Users/erichblume/.local/share/mise/installs/pipx-borgmatic/latest/bin/borgmatic

# Schedule: runs daily at 2:00 AM
borgmatic_schedule_hour: 2
borgmatic_schedule_minute: 0

# Archive tier — kept forever in the never-pruned indri-* archives. Operational sources (forgejo, DB dumps, service state, /Volumes/shower) moved to operational.yaml.
borgmatic_source_directories:
  - /Users/erichblume/code/personal/zk
  - /Users/erichblume/Documents

# Archive-tier repos (never pruned): the historical mixed archives plus the
# new indri-* and talos-data-* archives live here.
borgmatic_repositories:
  - path: /Volumes/backups/borg/
    label: sifaka-borg-backups
    encryption: repokey
    append_only: true
  - path: ssh://u3ugi1x1@u3ugi1x1.repo.borgbase.com/./repo
    label: borgbase-offsite
    encryption: repokey
    append_only: true

# BorgBase SSH key (fetched from 1Password in playbook pre_tasks)
borgmatic_borgbase_ssh_key_path: /Users/erichblume/.ssh/borgbase_ed25519

# Directory for pre-backup database dumps from k8s pods
borgmatic_k8s_dump_dir: /Users/erichblume/.local/share/borgmatic/k8s-dumps

# K8s SQLite databases to dump before backup via kubectl exec
# Each entry runs: kubectl exec <pod-selector> -- sqlite3 <path> ".backup /tmp/backup.db"
# then copies the dump to borgmatic_k8s_dump_dir/<name>.db
borgmatic_k8s_sqlite_dumps:
  - name: mealie
    namespace: mealie
    label_selector: app=mealie
    db_path: /app/data/mealie.db
    # migrated to ringtail (wave-1); ssh to ringtail and run k3s kubectl
    # there.
    target: ssh:eblume@ringtail
  - name: horkos
    namespace: horkos
    label_selector: app=horkos
    db_path: /data/horkos.db
    target: ssh:eblume@ringtail
    # horkos (approval-queue dispatch) DB — only copy of queue state;
    # Python image ships python3 so the helper's in-pod sqlite3 .backup works as-is.

# K8s services that produce their own consistent SQLite backup files on a
# PVC (rather than us running an online dump via kubectl exec). Each entry's
# `dir` is scanned for the newest backup file, which is streamed back and
# stored at borgmatic_k8s_dump_dir/<name>.db. Uses the same `target` modes as
# borgmatic_k8s_sqlite_dumps. See ~/bin/borgmatic-k8s-file-dump.
borgmatic_k8s_file_dumps:
  # navidrome writes its own WAL-safe DB backups (users, play counts,
  # playlists) on a cron via ND_BACKUP_* — the minimal nix image has no
  # python3/sqlite3 to dump online, so we just ferry navidrome's newest
  # snapshot. Files are named navidrome_backup_<YYYY.MM.DD_HH.MM.SS>.db
  # (fixed-width timestamp, so lexically sortable). Requires coreutils in the
  # image for the in-pod ls/cat.
  - name: navidrome
    namespace: navidrome
    label_selector: app=navidrome
    dir: /data/backup
    glob: 'navidrome_backup_*.db'
    target: ssh:eblume@ringtail
  # audiobookshelf's built-in scheduled backup zips config+metadata to
  # /metadata/backups (named <YYYY-MM-DD[T]HHmm>.audiobookshelf, fixed-width
  # timestamp, so lexically sortable), so we ferry the newest one off.
  # Requires coreutils in the image for the in-pod ls/cat.
  - name: audiobookshelf
    namespace: audiobookshelf
    label_selector: app=audiobookshelf
    dir: /metadata/backups
    glob: '*.audiobookshelf'
    target: ssh:eblume@ringtail
  # pulumi-stack-backup CronJob exports both Pulumi Cloud stacks' state daily
  # (--show-secrets) to a PVC, named stack_<YYYYmmddTHHMMSSZ>.json (fixed-width
  # UTC timestamp, lexically sortable). One ferry per stack, staged as
  # k8s-dumps/pulumi-<stack>-state.db (the ferry names every file-dump target
  # .db regardless of content). Stack config is not exported: its secrets come
  # from Pulumi ESC (backed by 1Password) and the rest is in git.
  # The files contain plaintext secret values (Tailscale auth keys) — the borg
  # repository encryption is the compensating control.
  #
  # The CronJob pod is Succeeded (short-lived) by ferry time, so these ferries
  # use `pv:` mode: ringtail reads the local-path PV's host path directly (no
  # pod exec — see ~/bin/borgmatic-k8s-file-dump). `pvc_name` is the PVC the
  # PV is bound to. `pv:` mode is self-contained: a missing or empty export
  # keeps the previous staged export and exits 0 (so a dead export can't abort
  # the nightly), while a genuine infra error (PVC/PV unresolvable, ssh/k3s
  # down) still exits non-zero and aborts.
  - name: pulumi-tail8d86e-state
    namespace: pulumi-stack-backup
    label_selector: app=pulumi-stack-backup
    dir: /tail8d86e
    glob: 'stack_*.json'
    target: pv:eblume@ringtail
    pvc_name: pulumi-stack-backup
  - name: pulumi-eblu-me-state
    namespace: pulumi-stack-backup
    label_selector: app=pulumi-stack-backup
    dir: /eblu-me
    glob: 'stack_*.json'
    target: pv:eblume@ringtail
    pvc_name: pulumi-stack-backup

# K8s pods whose data dir is tarred in-pod and streamed back — no
# sqlite3 or python3 needed, just tar. Each entry's `dir` is tarred to
# borgmatic_k8s_dump_dir/<name>.tar. Uses the same `target` modes as
# borgmatic_k8s_sqlite_dumps. See ~/bin/borgmatic-k8s-tar-dump.
borgmatic_k8s_tar_dumps:
  # talos agent-service state: all session transcripts
  # (data/sessions/<timestamp>_<sessionId>.jsonl) plus meta.json,
  # crons.json, settings.json. session-index.sqlite rides in the tar.
  # Every session is stored forever (heph 01M0GA6JPGQF96AM5JZKA37YSV).
  - name: talos-data
    namespace: talos
    label_selector: app=talos
    dir: /home/talos/data
    target: ssh:eblume@ringtail
  # paperless-ngx document library — originals, archived, thumbnails — on
  # the sifaka NFS media PVC (sifaka's only protection is RAID-5, so this
  # is the offsite copy; see [[backups]]). Multi-container pod, so the
  # container is named explicitly. The DB side is already covered by
  # borgmatic_postgresql_databases (name: paperless).
  - name: paperless-media
    namespace: paperless
    label_selector: app=paperless
    dir: /usr/src/paperless/media
    container: web
    target: ssh:eblume@ringtail

# Local (on-indri) SQLite databases captured in a before-backup hook via the
# sqlite3 online .backup API. We deliberately avoid borgmatic's native
# sqlite_databases hook: it dumps via `sqlite3 .dump`, which has a documented
# silent-failure mode on WAL databases (exit code stays 0 on a torn read —
# borgmatic #295 / SQLite forum). The .backup API is WAL-safe and returns a
# real exit code, so a failed snapshot aborts the whole borgmatic run loudly.
# Snapshots land in borgmatic_k8s_dump_dir (already in source_directories).
borgmatic_local_sqlite_dumps:
  # heph hub canonical store — the only copy of all task/context data once
  # spokes are pure replicas (see [[hephaestus]]). WAL mode, continuously
  # written by every spoke sync, so a plain file copy could tear.
  - name: heph
    path: /Users/erichblume/.local/share/heph/heph.db
  # forgejo — primary source of truth for blumeops. WAL mode (see the -wal
  # file), so it must be snapshotted via the online .backup API, not copied
  # raw from source_directories. The git repositories themselves come from the
  # /Users/erichblume/forgejo source dir above.
  - name: forgejo
    path: /Users/erichblume/forgejo/data/forgejo.db

# Encryption passcommand (reads borg passphrase)
borgmatic_encryption_passcommand: cat /Users/erichblume/.borg/config.yaml

# The main config is the never-pruned archive tier (zk, Documents) — no retention keys and no prune action. Tier B retention lives in operational.yaml.

# Retry a failing repository action (e.g. a broken SSH pipe mid-upload to the
# BorgBase offsite repo) instead of losing the whole night. borg checkpoints an
# interrupted `create`, so each retry resumes rather than restarting. retry_wait
# backs off linearly (300s, 600s, 900s), so worst-case added delay is ~30min —
# well inside the 2h gap before the 4:00 AM photos backup. See [[borgmatic]].
borgmatic_retries: 3
borgmatic_retry_wait: 300

# talos-data (agent session transcripts) — kept forever, never pruned
# (heph 01M0GA6JPGQF96AM5JZKA37YSV). Separate config so the main
# config's prune can't reach its `talos-data-*` archives, and so a
# failed main run can't be masked by a fresh talos archive. A future
# tier split that wants to prune it is a deliberate PR on its own.
borgmatic_talos_data_config: /Users/erichblume/.config/borgmatic/talos-data.yaml
# Dump staging dir for talos-data ONLY; the main config does not back
# it up, so its source sets stay disjoint (k8s-dumps/ is a main
# source_directory).
borgmatic_talos_data_dump_dir: /Users/erichblume/.local/share/borgmatic/k8s-dumps-talos

# Tier B (operational) backups — rotating tier, scheduled 03:00. Never
# mixed into the archive-tier `indri-*` archives: own config, own
# `operational-*` prefix, own local repo. Retention keys here are inert
# until a separate PR adds prune+compact to the operational agent (see
# eblume/blumeops#1417).
borgmatic_operational_config: /Users/erichblume/.config/borgmatic/operational.yaml
borgmatic_operational_schedule_hour: 3
borgmatic_operational_schedule_minute: 0

# Tier B (operational) repo — local sifaka only for now; a BorgBase copy
# needs a dashboard-created key, so that's a separate deliberate step.
borgmatic_operational_repositories:
  - path: /Volumes/backups/borg/operational/
    label: sifaka-operational
    encryption: repokey
    append_only: true
borgmatic_operational_source_directories:
  # ~/forgejo minus the live WAL DB (snapshotted in the before-hook below)
  # and the pull mirrors (re-fetchable from upstream, excluded below).
  - /Users/erichblume/forgejo
  - /Users/erichblume/.config/borgmatic
  - /Users/erichblume/.local/share/borgmatic/k8s-dumps-op
  - /Volumes/shower
borgmatic_operational_exclude_patterns:
  - /Users/erichblume/forgejo/data/forgejo.db*
  # Pull mirrors under the `mirrors` org (29 repos, ~7.7 GB) re-fetch from
  # upstream; keeping them out of every archive saves ~93% of the forgejo
  # source's nightly churn.
  - /Users/erichblume/forgejo/data/forgejo-repositories/mirrors
borgmatic_operational_dump_dir: /Users/erichblume/.local/share/borgmatic/k8s-dumps-op
# Retention — inert until prune is enabled (separate PR). keep_yearly: -1
# means unlimited, so each year's final archive is kept forever.
borgmatic_operational_keep_daily: 7
borgmatic_operational_keep_weekly: 4
borgmatic_operational_keep_monthly: 12
borgmatic_operational_keep_yearly: -1

# PostgreSQL databases to backup (streamed via pg_dump)
# Password is read from ~/.pgpass (managed by this role)
# pg_dump_command must be full path since LaunchAgent doesn't have homebrew in PATH
# --- Immich photo library backup (BorgBase offsite only) ---
borgmatic_photos_config: /Users/erichblume/.config/borgmatic/photos.yaml
borgmatic_photos_source_directories:
  - /Volumes/photos/library
  - /Volumes/photos/upload
borgmatic_photos_borgbase_repo: ssh://xcrtl5tg@xcrtl5tg.repo.borgbase.com/./repo
# Schedule: runs daily at 4:00 AM (offset from main backup at 2:00 AM)
borgmatic_photos_schedule_hour: 4
borgmatic_photos_schedule_minute: 0
# Retention: photos are precious, keep more history
borgmatic_photos_keep_daily: 7
borgmatic_photos_keep_monthly: 12
borgmatic_photos_keep_yearly: 1000

# Verification: weekly repo+archives check, monthly full-data check, sampled
# test-restore, via the mcquack.eblume.borgmatic-verify-photos LaunchAgent.
borgmatic_verify_bin: /Users/erichblume/.local/bin/borgmatic-verify-photos
borgmatic_verify_marker_dir: /opt/homebrew/var/state/borgmatic-verification
# launchd calendar: Weekday 2 = Tuesday; Day 2 = 2nd of each month
borgmatic_verify_schedule_days: [2]
borgmatic_verify_schedule_month_days: [2]
borgmatic_verify_schedule_hour: 6
borgmatic_verify_schedule_minute: 0

borgmatic_pg_dump_command: /opt/homebrew/opt/postgresql@18/bin/pg_dump
borgmatic_postgresql_databases:
  # k8s PostgreSQL (CloudNativePG) via Caddy L4 proxy.
  # port 5434 = ringtail blumeops-pg. The minikube cluster's 5432 route
  # is retired with [[retire-minikube]] phase 2.
  # migrated to ringtail blumeops-pg (wave-1 + retire-minikube phases 1-2)
  - name: authentik
    hostname: pg.ops.eblu.me
    port: 5434
    username: borgmatic
  - name: miniflux
    hostname: pg.ops.eblu.me
    port: 5434
    username: borgmatic
  - name: teslamate
    hostname: pg.ops.eblu.me
    port: 5434
    username: borgmatic
  - name: paperless
    hostname: pg.ops.eblu.me
    port: 5434
    username: borgmatic
  # immich-pg cluster (VectorChord) via Caddy L4 on port 5433
  - name: immich
    hostname: pg.ops.eblu.me
    port: 5433
    username: borgmatic
