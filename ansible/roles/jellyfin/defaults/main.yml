---
# Jellyfin media server configuration

# Port Jellyfin listens on
jellyfin_port: 8096

# Data directory (standard macOS location)
jellyfin_data_dir: "{{ ansible_facts.env.HOME }}/Library/Application Support/jellyfin"

# Media path (NFS mount from sifaka)
jellyfin_media_path: /Volumes/allisonflix

# Pinned release. To upgrade: bump both version and sha256 (the sha256 is the
# one Homebrew's cask formula publishes for the same DMG), then
# `mise run provision-indri -- --tags jellyfin`.
jellyfin_version: "10.11.11"

# arch as named by repo.jellyfin.org; indri is Apple Silicon
jellyfin_macos_arch: arm64
jellyfin_release_dmg: "https://repo.jellyfin.org/files/server/macos/stable/v{{ jellyfin_version }}/{{ jellyfin_macos_arch }}/jellyfin_{{ jellyfin_version }}-{{ jellyfin_macos_arch }}.dmg"
jellyfin_release_sha256: f345914f10b988f56fd453b07128faa23dfcd561405216ffd04e32a47e9f6c9c

# Install location; versioned so a bump lands side-by-side with the old one.
# Replaces the Homebrew cask's /Applications/Jellyfin.app.
jellyfin_install_dir: "{{ ansible_facts.env.HOME }}/opt/jellyfin-{{ jellyfin_version }}"
jellyfin_app_path: "{{ jellyfin_install_dir }}/Jellyfin.app"
jellyfin_binary: "{{ jellyfin_app_path }}/Contents/MacOS/jellyfin"

# Web client path (different from binary location in the app bundle)
jellyfin_webdir: "{{ jellyfin_app_path }}/Contents/Resources/jellyfin-web"

# Log directory
jellyfin_log_dir: "{{ ansible_facts.env.HOME }}/Library/Logs"

# SSO plugin configuration
jellyfin_sso_plugin_version: "4.0.0.3"
jellyfin_sso_client_id: jellyfin
jellyfin_sso_client_secret: ""
jellyfin_sso_provider_name: authentik
jellyfin_plugins_dir: "{{ jellyfin_data_dir }}/plugins"
