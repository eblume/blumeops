---
# Pinned release install: Homebrew is not involved, so the version only
# moves when this repo's defaults change.
- name: Check if pinned Jellyfin release is installed
  ansible.builtin.stat:
    path: "{{ jellyfin_binary }}"
  register: jellyfin_binary_stat

- name: Ensure versioned install directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_install_dir }}"
    state: directory
    mode: '0755'

- name: Download pinned Jellyfin release DMG
  ansible.builtin.get_url:
    url: "{{ jellyfin_release_dmg }}"
    dest: "/tmp/jellyfin_{{ jellyfin_version }}-{{ jellyfin_macos_arch }}.dmg"
    mode: '0644'
    checksum: "sha256:{{ jellyfin_release_sha256 }}"
  when: not jellyfin_binary_stat.stat.exists

- name: Detach any mounts of the pinned DMG left by interrupted runs
  # Detach by image path: finds every mount of this image wherever it
  # landed (/Volumes/Jellyfin, "Jellyfin 1", the pinned point); a loop over
  # guessed mountpoints misses re-attached copies.
  ansible.builtin.command: hdiutil detach "/tmp/jellyfin_{{ jellyfin_version }}-{{ jellyfin_macos_arch }}.dmg"
  register: jellyfin_stray_detach
  failed_when: false
  changed_when: jellyfin_stray_detach.rc == 0
  when: not jellyfin_binary_stat.stat.exists

- name: Remove a stale mountpoint directory left by an interrupted run
  # hdiutil normally removes the directory on detach; a leftover one makes
  # attach fail. Safe to delete: this role always attaches read-only.
  ansible.builtin.file:
    path: "{{ jellyfin_dmg_mountpoint }}"
    state: absent
  when: not jellyfin_binary_stat.stat.exists

- name: Mount Jellyfin DMG at the pinned mountpoint
  # No -quiet: it suppresses hdiutil's error messages, so a failing attach
  # leaves the play log without a reason.
  ansible.builtin.command: hdiutil attach -nobrowse -noverify -noautoopen -mountpoint "{{ jellyfin_dmg_mountpoint }}" "/tmp/jellyfin_{{ jellyfin_version }}-{{ jellyfin_macos_arch }}.dmg"
  changed_when: true
  when: not jellyfin_binary_stat.stat.exists

- name: Verify Jellyfin.app is visible at the pinned mountpoint
  ansible.builtin.stat:
    path: "{{ jellyfin_dmg_mountpoint }}/Jellyfin.app"
  register: jellyfin_mountpoint_app_stat
  when: not jellyfin_binary_stat.stat.exists

- name: Assert the DMG mounted at the pinned point
  ansible.builtin.assert:
    that:
      - jellyfin_mountpoint_app_stat.stat.exists
    fail_msg: >-
      hdiutil attach returned success but
      {{ jellyfin_dmg_mountpoint }}/Jellyfin.app is missing; the image may
      have mounted elsewhere - run `hdiutil info` on indri.
    success_msg: "mounted at {{ jellyfin_dmg_mountpoint }}"
  when: not jellyfin_binary_stat.stat.exists

- name: Remove any partially deployed app bundle
  ansible.builtin.file:
    path: "{{ jellyfin_app_path }}"
    state: absent
  when: not jellyfin_binary_stat.stat.exists

- name: Copy Jellyfin.app from DMG
  # cp -Rp: preserves bundle permissions and symlinks exactly
  ansible.builtin.command: cp -Rp "{{ jellyfin_dmg_mountpoint }}/Jellyfin.app" "{{ jellyfin_install_dir }}/"
  changed_when: true
  when: not jellyfin_binary_stat.stat.exists

- name: Unmount Jellyfin DMG
  ansible.builtin.command: hdiutil detach "{{ jellyfin_dmg_mountpoint }}"
  register: jellyfin_dmg_detach
  changed_when: true
  when: not jellyfin_binary_stat.stat.exists

- name: Fail if DMG did not unmount
  ansible.builtin.assert:
    that: jellyfin_dmg_detach.rc == 0
    quiet: true
  when: not jellyfin_binary_stat.stat.exists

- name: Strip quarantine xattr so Gatekeeper does not hold first launch
  ansible.builtin.command: xattr -dr com.apple.quarantine "{{ jellyfin_app_path }}"
  changed_when: false
  failed_when: false
  when: not jellyfin_binary_stat.stat.exists

- name: Remove DMG from /tmp
  ansible.builtin.file:
    path: "/tmp/jellyfin_{{ jellyfin_version }}-{{ jellyfin_macos_arch }}.dmg"
    state: absent
  when: not jellyfin_binary_stat.stat.exists

- name: Uninstall Homebrew cask (the role now owns the binary)
  community.general.homebrew_cask:
    name: jellyfin
    state: absent

- name: Ensure Jellyfin data directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_data_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Jellyfin LaunchAgent plist
  ansible.builtin.template:
    src: mcquack.jellyfin.plist.j2
    dest: ~/Library/LaunchAgents/mcquack.jellyfin.plist
    mode: '0644'
  notify: Reload jellyfin

- name: Check if Jellyfin LaunchAgent is loaded
  ansible.builtin.command: launchctl list mcquack.jellyfin
  register: jellyfin_launchctl_check
  changed_when: false
  failed_when: false

- name: Load Jellyfin LaunchAgent if not loaded
  ansible.builtin.command: launchctl load ~/Library/LaunchAgents/mcquack.jellyfin.plist
  when: jellyfin_launchctl_check.rc != 0
  changed_when: true
  failed_when: false

# SSO plugin installation
- name: Ensure SSO-Auth plugin directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_plugins_dir }}/SSO-Auth_{{ jellyfin_sso_plugin_version }}"
    state: directory
    mode: '0755'

- name: Download SSO-Auth plugin archive
  ansible.builtin.get_url:
    url: "https://github.com/9p4/jellyfin-plugin-sso/releases/download/v{{ jellyfin_sso_plugin_version }}/sso-authentication_{{ jellyfin_sso_plugin_version }}.zip"
    dest: "/tmp/sso-authentication_{{ jellyfin_sso_plugin_version }}.zip"
    mode: '0644'

- name: Extract SSO-Auth plugin
  ansible.builtin.unarchive:
    src: "/tmp/sso-authentication_{{ jellyfin_sso_plugin_version }}.zip"
    dest: "{{ jellyfin_plugins_dir }}/SSO-Auth_{{ jellyfin_sso_plugin_version }}"
    remote_src: true
  notify: Reload jellyfin

- name: Ensure plugin configurations directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_plugins_dir }}/configurations"
    state: directory
    mode: '0755'

- name: Deploy SSO-Auth plugin configuration
  ansible.builtin.template:
    src: sso-auth.xml.j2
    dest: "{{ jellyfin_plugins_dir }}/configurations/SSO-Auth.xml"
    mode: '0644'
  notify: Reload jellyfin

# Branding — add SSO login button to login page
- name: Ensure Jellyfin config directory exists
  ansible.builtin.file:
    path: "{{ jellyfin_data_dir }}/config"
    state: directory
    mode: '0755'

- name: Deploy Jellyfin branding configuration
  ansible.builtin.template:
    src: branding.xml.j2
    dest: "{{ jellyfin_data_dir }}/config/branding.xml"
    mode: '0644'
  notify: Reload jellyfin
