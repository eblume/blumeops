---
# Forgejo runner role — nix-darwin-owned LaunchAgent, role-rendered config.
# See [[configure-launchd-runner]] for one-time setup (runner registration)
# and the cutover plan from the k8s runner.
#
# Skipped by default (plist + load only): the nix-darwin generation owns
# this service's LaunchAgent (PR 7 of the indri series), and its binary is
# the nixpkgs package, not a source build - the role no longer builds or
# version-checks the ~/code/3rd/forgejo-runner checkout, but still checks
# that its binary exists, because the rollback re-write points at it. The
# plist and load tasks below remain the rollback re-write, run with
# `mise run provision-indri -- --tags forgejo_runner -e forgejo_runner_ansible_managed=true`
# only; config rendering (the runner token) and the cache maintenance
# agents stay ansible-side. See defaults/main.yml.

- name: Verify forgejo-runner checkout binary exists
  # Guards the rollback re-write's target: a launchctl load of a missing
  # program returns 0, then launchd crash-loops the KeepAlive job.
  ansible.builtin.stat:
    path: "{{ forgejo_runner_binary }}"
  register: forgejo_runner_binary_stat

- name: Fail if forgejo-runner checkout binary missing
  ansible.builtin.fail:
    msg: |
      forgejo-runner binary not found at {{ forgejo_runner_binary }}.
      It is the rollback re-write's target (the plist + load tasks, run
      only with -e forgejo_runner_ansible_managed=true); a missing one
      would leave the runner silently down after the re-write. Rebuild the
      checkout at the tag the indri flake's nixpkgs input pins:
        ssh indri 'cd ~/code/3rd/forgejo-runner && git fetch --tags && git checkout v13.1.0 && make build'
  when: not forgejo_runner_binary_stat.stat.exists

- name: Remove untracked local mise pin
  # A per-checkout mise.toml shadows indri's global mise config, which is
  # declared in the indri nix-darwin flake (the flake is the single source
  # of truth for the toolchain).
  ansible.builtin.file:
    path: "{{ forgejo_runner_repo_dir }}/mise.toml"
    state: absent

- name: Ensure forgejo-runner home directory exists
  ansible.builtin.file:
    path: "{{ forgejo_runner_home }}"
    state: directory
    mode: '0700'

- name: Deploy forgejo-runner config (contains runner token)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ forgejo_runner_config_path }}"
    mode: '0600'
  notify: Restart forgejo-runner

# --- Docker Desktop registry mirror (zot pull-through cache) ---
# Docker Desktop survives the docker-free plan as the dagger engine
# host only (right-sized 2cpu/4GiB — see [[retire-minikube]] phase 6).
# Merge, don't clobber: daemon.json carries Docker Desktop's own
# settings (builder gc etc). The daemon only re-reads this on restart,
# so we notify instead of restarting.

# A missing daemon.json is the legitimate no-config state (start from {}); a
# failed read is not and aborts the play.
- name: Check for Docker Desktop daemon.json
  ansible.builtin.stat:
    path: "{{ forgejo_runner_docker_daemon_json }}"
  register: forgejo_runner_daemon_json_stat

- name: Read Docker Desktop daemon.json
  ansible.builtin.slurp:
    src: "{{ forgejo_runner_docker_daemon_json }}"
  register: forgejo_runner_daemon_json_raw
  when: forgejo_runner_daemon_json_stat.stat.exists

- name: Merge registry mirror into daemon.json settings
  ansible.builtin.set_fact:
    forgejo_runner_daemon_json_merged: >-
      {{ ((forgejo_runner_daemon_json_raw.content | default('') | b64decode | from_json)
          if forgejo_runner_daemon_json_stat.stat.exists else {})
         | combine({'registry-mirrors': [forgejo_runner_registry_mirror]}) }}

- name: Write Docker Desktop daemon.json with registry mirror
  ansible.builtin.copy:
    content: "{{ forgejo_runner_daemon_json_merged | to_nice_json }}\n"
    dest: "{{ forgejo_runner_docker_daemon_json }}"
    mode: '0644'
  notify: Note Docker Desktop restart required

# --- LaunchAgent ---

- name: Deploy forgejo-runner LaunchAgent plist
  ansible.builtin.template:
    src: forgejo-runner.plist.j2
    dest: "{{ forgejo_runner_launch_agent_plist }}"
    mode: '0644'
  notify: Restart forgejo-runner
  when: forgejo_runner_ansible_managed | bool

- name: Check if forgejo-runner LaunchAgent is loaded
  ansible.builtin.command: "launchctl list {{ forgejo_runner_launch_agent_label }}"
  register: forgejo_runner_launchctl_check
  changed_when: false
  failed_when: false
  when: forgejo_runner_ansible_managed | bool

- name: Load forgejo-runner LaunchAgent if not loaded
  ansible.builtin.command: "launchctl load {{ forgejo_runner_launch_agent_plist }}"
  when:
    - forgejo_runner_ansible_managed | bool
    - forgejo_runner_launchctl_check.rc != 0
  changed_when: true
  failed_when: false

# --- Monthly uv cache prune (eblume/blumeops#1065) ---
# Prune removes per-script environments, so the script stops the runner
# first; the trap in the script restores it even on failure.

- name: Deploy runner cache prune script
  ansible.builtin.template:
    src: runner-cache-prune.sh.j2
    dest: "{{ forgejo_runner_cache_prune_script }}"
    mode: '0755'
  when: forgejo_runner_cache_prune_enabled

- name: Deploy runner cache prune LaunchAgent plist
  ansible.builtin.template:
    src: runner-cache-prune.plist.j2
    dest: "{{ forgejo_runner_cache_prune_plist }}"
    mode: '0644'
  notify: Restart runner cache prune
  when: forgejo_runner_cache_prune_enabled

- name: Check if runner cache prune LaunchAgent is loaded
  ansible.builtin.command: "launchctl list {{ forgejo_runner_cache_prune_label }}"
  register: forgejo_runner_cache_prune_launchctl_check
  changed_when: false
  failed_when: false
  when: forgejo_runner_cache_prune_enabled

- name: Load runner cache prune LaunchAgent if not loaded
  ansible.builtin.command: "launchctl load {{ forgejo_runner_cache_prune_plist }}"
  when:
    - forgejo_runner_cache_prune_enabled
    - forgejo_runner_cache_prune_launchctl_check.rc != 0
  changed_when: true
  failed_when: false
# --- Nightly CI cache sweep (eblume/blumeops#1063) ---

- name: Ensure runner cache sweep script directory exists
  ansible.builtin.file:
    path: "{{ forgejo_runner_home }}/bin"
    state: directory
    mode: '0755'
  when: forgejo_runner_sweep_enabled

- name: Deploy runner cache sweep script
  ansible.builtin.template:
    src: runner-cache-sweep.sh.j2
    dest: "{{ forgejo_runner_sweep_script }}"
    mode: '0755'
  when: forgejo_runner_sweep_enabled

- name: Deploy runner cache sweep LaunchAgent plist
  ansible.builtin.template:
    src: runner-cache-sweep.plist.j2
    dest: "{{ forgejo_runner_sweep_plist }}"
    mode: '0644'
  notify: Reload runner-cache-sweep
  when: forgejo_runner_sweep_enabled

- name: Check if runner cache sweep LaunchAgent is loaded
  ansible.builtin.command: launchctl list {{ forgejo_runner_sweep_label }}
  register: forgejo_runner_sweep_launchctl_check
  changed_when: false
  failed_when: false
  when: forgejo_runner_sweep_enabled

- name: Load runner cache sweep LaunchAgent if not loaded
  ansible.builtin.command: launchctl load {{ forgejo_runner_sweep_plist }}
  when: forgejo_runner_sweep_enabled and forgejo_runner_sweep_launchctl_check.rc != 0
  changed_when: true
  failed_when: false

- name: Unload runner cache sweep LaunchAgent if disabled
  ansible.builtin.command: launchctl unload {{ forgejo_runner_sweep_plist }}
  when: not forgejo_runner_sweep_enabled
  failed_when: false
  changed_when: true

- name: Remove runner cache sweep LaunchAgent plist if disabled
  ansible.builtin.file:
    path: "{{ forgejo_runner_sweep_plist }}"
    state: absent
  when: not forgejo_runner_sweep_enabled

- name: Remove runner cache sweep script if disabled
  ansible.builtin.file:
    path: "{{ forgejo_runner_sweep_script }}"
    state: absent
  when: not forgejo_runner_sweep_enabled

# --- Build runner (indri-build, eblume/blumeops#1357) ---
# Second, unprivileged forgejo runner (the `indri-build` label): the
# dedicated macOS user runs the daemon and a colima VM hosts the jobs'
# docker. The daemon's directory layout (home 0700, Library/Logs,
# forgejo-runner workdir, colima profile dir) is created by the nix-darwin
# activation, not here. Until the human registers the runner (docs/how-to/
# forgejo-runner/configure-launchd-runner.md §indri-build runner), the
# "Forgejo Secrets" 1Password item carries no runner_indri_build_* /
# indri-build-github-pat fields, so the config render is gated on all three
# facts being present and a pre-registration pass renders nothing and can
# never fail. The colima profile is not secret and is rendered
# unconditionally (idempotent) so the colima daemon has its config as soon
# as the activation created the profile dir. New tasks carry the
# `forgejo_build_runner` tag (not `forgejo_runner`) so the existing
# `--tags rebuild` and `--tags forgejo_runner` paths keep their exact
# semantics. The daemon home and /Library/LaunchDaemons are outside
# erichblume's reach, so every write below escalates (erichblume's NOPASSWD
# sudo, as in the indri play's rebuild tasks).

- name: Skip build runner config until its 1Password identity exists
  ansible.builtin.debug:
    msg: >-
      forgejo_runner_build_uuid / forgejo_runner_build_token /
      forgejo_runner_build_mise_github_token not all set: the build runner
      is not registered yet. Register it (docs/how-to/forgejo-runner/
      configure-launchd-runner.md §indri-build runner), add
      runner_indri_build_uuid / runner_indri_build_token and
      indri-build-github-pat to the "Forgejo Secrets" 1Password item, then
      re-run provision-indri.
  when:
    - forgejo_runner_build_uuid | length == 0
    - forgejo_runner_build_token | length == 0
    - forgejo_runner_build_mise_github_token | length == 0
  tags: [forgejo_build_runner]

- name: Deploy build runner config (contains runner token)
  ansible.builtin.template:
    src: config-build.yaml.j2
    dest: "{{ forgejo_runner_build_config_path }}"
    mode: '0600'
    owner: indri-build
    group: staff
    become: true
  notify: Restart forgejo-runner-build
  when:
    - forgejo_runner_build_uuid | length > 0
    - forgejo_runner_build_token | length > 0
    - forgejo_runner_build_mise_github_token | length > 0
  tags: [forgejo_build_runner]

- name: Deploy build runner colima profile (not secret)
  ansible.builtin.template:
    src: colima.yaml.j2
    dest: "{{ forgejo_runner_build_colima_yaml }}"
    mode: '0600'
    owner: indri-build
    group: staff
    become: true
  tags: [forgejo_build_runner]

# --- Build runner LaunchDaemon (rollback re-write only) ---
# The nix-darwin generation owns this daemon's live plist; these tasks are
# the rollback re-write, run with
# `mise run provision-indri -- --tags forgejo_runner,forgejo_build_runner -e
# forgejo_runner_build_ansible_managed=true` - exactly like the original
# runner's gate.
#
# Caveat: darwin-rebuild --rollback also unloads mcquack.eblume.colima-build
# (the generation no longer defines it), and the role does not re-write the
# colima daemon. A rolled-back indri therefore has a re-written runner with
# no engine host until colima is re-provisioned.

- name: Deploy build runner LaunchDaemon plist
  ansible.builtin.template:
    src: forgejo-runner-build.plist.j2
    dest: "{{ forgejo_runner_build_plist }}"
    mode: '0644'
    become: true
  notify: Restart forgejo-runner-build
  when: forgejo_runner_build_ansible_managed | bool
  tags: [forgejo_build_runner]

- name: Check if build runner LaunchDaemon is loaded
  ansible.builtin.command: "launchctl print system/{{ forgejo_runner_build_label }}"
  register: forgejo_runner_build_launchctl_check
  changed_when: false
  failed_when: false
  become: true
  when: forgejo_runner_build_ansible_managed | bool
  tags: [forgejo_build_runner]

- name: Load build runner LaunchDaemon if not loaded
  ansible.builtin.command: "launchctl load -w {{ forgejo_runner_build_plist }}"
  become: true
  when:
    - forgejo_runner_build_ansible_managed | bool
    - forgejo_runner_build_launchctl_check.rc != 0
  changed_when: true
  failed_when: false
  tags: [forgejo_build_runner]
