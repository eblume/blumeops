---
# Forgejo runners on indri. The main runner (mcquack.eblume.forgejo-runner)
# and its cache agents are generation-owned end to end (eblume/blumeops#1528)
# — this role holds only the build runner half below (eblume/blumeops#1627).
# See [[configure-launchd-runner]].

# --- Build runner (indri-build, eblume/blumeops#1357) ---
# Second, unprivileged forgejo runner (the `indri-build` label): the
# dedicated macOS user runs the daemon and a colima VM hosts the jobs'
# docker. The daemon's directory layout (home 0700, Library/Logs,
# forgejo-runner workdir, colima profile dir) is created by the nix-darwin
# activation, not here. Until the human registers the runner (docs/how-to/
# forgejo-runner/configure-launchd-runner.md §indri-build runner), the
# "Forgejo Secrets" 1Password item carries no runner_indri_build_* fields,
# so the config render is gated on all three facts being present and a
# pre-registration pass renders nothing and can never fail; the colima
# profile is gated on the uuid alone. New tasks carry the
# `forgejo_build_runner` tag on top of the role's `forgejo_runner`, so
# `--tags forgejo_runner` runs them (and the identity pre_tasks they need).
# Home writes run AS indri-build (see the staging note below); the rollback
# plist still writes to /Library/LaunchDaemons as root.

- name: Skip build runner config until its 1Password identity exists
  ansible.builtin.debug:
    msg: >-
      forgejo_runner_build_uuid / forgejo_runner_build_token /
      forgejo_runner_build_mise_github_token not all set: the build runner
      is not registered yet. Register it (docs/how-to/forgejo-runner/
      configure-launchd-runner.md §indri-build runner), add
      runner_indri_build_uuid / runner_indri_build_token to the
      "Forgejo Secrets" 1Password item, then re-run provision-indri.
  # Any one of the three missing: registration is partial, the config must
  # not render.
  when: >-
    not (forgejo_runner_build_uuid | length > 0
         and forgejo_runner_build_token | length > 0
         and forgejo_runner_build_mise_github_token | length > 0)
  tags: [forgejo_build_runner]

# Home writes happen AS indri-build, never as root: the home is
# attacker-controlled, and a root write would follow a symlink planted at
# ~indri-build/forgejo-runner or config.yaml. Ansible's own become_user
# cannot do that here: over Tailscale SSH every remote exit code reads 0, so
# its `setfacl` hand-off of the module file to the unprivileged user
# "succeeds" on macOS (which has no setfacl) and the macOS `chmod +a`
# fallback never runs. Instead, root renders into a root-owned staging dir
# outside the home (safe for root), and a plain `sudo -u indri-build install`
# copies each file into place with the build user's own permissions.

- name: Create build runner staging dir (root-owned, outside the build home)
  # check_mode: false so the scratch dir exists when --check stages into it.
  ansible.builtin.file:
    path: "{{ forgejo_runner_build_stage_dir }}"
    state: directory
    owner: root
    group: indri-build
    mode: '0750'
  become: true
  changed_when: false
  check_mode: false
  when: forgejo_runner_build_uuid | length > 0
  tags: [forgejo_build_runner]

- name: Stage build runner config (contains runner token)
  # check_mode: false so --check compares against this render: the stage
  # dir is scratch, never the live state.
  ansible.builtin.template:
    src: config-build.yaml.j2
    dest: "{{ forgejo_runner_build_stage_dir }}/config.yaml"
    owner: root
    group: indri-build
    mode: '0640'
  become: true
  changed_when: false
  check_mode: false
  when:
    - forgejo_runner_build_uuid | length > 0
    - forgejo_runner_build_token | length > 0
    - forgejo_runner_build_mise_github_token | length > 0
  tags: [forgejo_build_runner]

- name: Compare staged build runner config with the live one
  # Runs outside check mode so --check reports the real drift; the live
  # file sits in the 0700 build home, so the read goes through the same
  # sudo as the install.
  ansible.builtin.shell: >-
    sudo -n -u indri-build /bin/sh -c
    'cd / && cmp -s "$1" "$2"'
    _ {{ (forgejo_runner_build_stage_dir ~ '/config.yaml') | quote }}
    {{ forgejo_runner_build_config_path | quote }}
  register: forgejo_runner_build_config_compare
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - forgejo_runner_build_uuid | length > 0
    - forgejo_runner_build_token | length > 0
    - forgejo_runner_build_mise_github_token | length > 0
  tags: [forgejo_build_runner]

- name: Report build runner config drift (check mode)
  ansible.builtin.debug:
    msg: "would install {{ forgejo_runner_build_config_path }} (live copy differs from the staged render)"
  when:
    - forgejo_runner_build_uuid | length > 0
    - forgejo_runner_build_token | length > 0
    - forgejo_runner_build_mise_github_token | length > 0
    - ansible_check_mode
    - forgejo_runner_build_config_compare.rc != 0
  tags: [forgejo_build_runner]

- name: Install build runner config as indri-build
  ansible.builtin.shell: >-
    sudo -n -u indri-build /bin/sh -c
    'cd / && /usr/bin/install -m 0600 "$1" "$2"'
    _ {{ (forgejo_runner_build_stage_dir ~ '/config.yaml') | quote }}
    {{ forgejo_runner_build_config_path | quote }}
  changed_when: true
  notify: Restart forgejo-runner-build
  when:
    - not ansible_check_mode
    - forgejo_runner_build_uuid | length > 0
    - forgejo_runner_build_token | length > 0
    - forgejo_runner_build_mise_github_token | length > 0
    - forgejo_runner_build_config_compare.rc != 0
  tags: [forgejo_build_runner]

# The colima profile is rendered when the runner is registered (uuid
# present), not before: keeps the pre-registration state "nothing
# build-related is active". The colima daemon idles on its own wait loop
# until this file exists, then starts the VM. Gated on the uuid alone (not
# the token/PAT) - it carries no secret.
- name: Stage build runner colima profile
  # check_mode: false so --check compares against this render: the stage
  # dir is scratch, never the live state.
  ansible.builtin.template:
    src: colima.yaml.j2
    dest: "{{ forgejo_runner_build_stage_dir }}/colima.yaml"
    owner: root
    group: indri-build
    mode: '0640'
  become: true
  changed_when: false
  check_mode: false
  when: forgejo_runner_build_uuid | length > 0
  tags: [forgejo_build_runner]

# colima reads ~/.colima/<profile>/colima.yaml only for an instance that
# already exists: a brand-new instance is seeded from the user's colima
# template (defaults - 2 CPU, 2 GiB, `mounts: []`) and colima then saves
# that seed over the profile. So the same file is installed as the template
# first (fresh instances, incl. a rebuilt VM) and as the profile second
# (existing instances). The daemon wrapper waits on the profile, so the
# template is in place before the first `colima start`.
- name: Compare staged build runner colima template with the live one
  ansible.builtin.shell: >-
    sudo -n -u indri-build /bin/sh -c
    'cd / && cmp -s "$1" "$2"'
    _ {{ (forgejo_runner_build_stage_dir ~ '/colima.yaml') | quote }}
    {{ forgejo_runner_build_colima_template | quote }}
  register: forgejo_runner_build_colima_template_compare
  changed_when: false
  check_mode: false
  failed_when: false
  when: forgejo_runner_build_uuid | length > 0
  tags: [forgejo_build_runner]

- name: Report build runner colima template drift (check mode)
  ansible.builtin.debug:
    msg: "would install {{ forgejo_runner_build_colima_template }} (live copy differs from the staged render)"
  when:
    - forgejo_runner_build_uuid | length > 0
    - ansible_check_mode
    - forgejo_runner_build_colima_template_compare.rc != 0
  tags: [forgejo_build_runner]

- name: Install build runner colima template as indri-build
  ansible.builtin.shell: >-
    sudo -n -u indri-build /bin/sh -c
    'cd / && mkdir -p "$(dirname "$2")" && /usr/bin/install -m 0600 "$1" "$2"'
    _ {{ (forgejo_runner_build_stage_dir ~ '/colima.yaml') | quote }}
    {{ forgejo_runner_build_colima_template | quote }}
  changed_when: true
  when:
    - not ansible_check_mode
    - forgejo_runner_build_uuid | length > 0
    - forgejo_runner_build_colima_template_compare.rc != 0
  tags: [forgejo_build_runner]

- name: Compare staged build runner colima profile with the last installed one
  # colima rewrites the live profile with its own fully-defaulted keys on
  # start, so the compare cannot look at the live file - it looks at a
  # copy of the last render the role installed instead (written right
  # after a successful install). The copy's absence (first boot) counts
  # as drift, so the profile is installed then. Trade-off: a hand edit
  # to the live profile is no longer detected; nothing relies on it.
  ansible.builtin.shell: >-
    sudo -n -u indri-build /bin/sh -c
    'cd / && /usr/bin/cmp -s "$1" "$2"'
    _ {{ (forgejo_runner_build_stage_dir ~ '/colima.yaml') | quote }}
    {{ (forgejo_runner_build_stage_dir ~ '/colima.yaml.applied') | quote }}
  register: forgejo_runner_build_colima_compare
  changed_when: false
  check_mode: false
  failed_when: false
  when: forgejo_runner_build_uuid | length > 0
  tags: [forgejo_build_runner]

- name: Report build runner colima profile drift (check mode)
  ansible.builtin.debug:
    msg: "would install {{ forgejo_runner_build_colima_yaml }} and restart the colima-build VM (last installed render differs from the staged one)"
  when:
    - forgejo_runner_build_uuid | length > 0
    - ansible_check_mode
    - forgejo_runner_build_colima_compare.rc != 0
  tags: [forgejo_build_runner]

- name: Install build runner colima profile as indri-build
  ansible.builtin.shell: >-
    sudo -n -u indri-build /bin/sh -c
    'cd / && /usr/bin/install -m 0600 "$1" "$2"'
    _ {{ (forgejo_runner_build_stage_dir ~ '/colima.yaml') | quote }}
    {{ forgejo_runner_build_colima_yaml | quote }}
  changed_when: true
  notify: Restart colima-build VM
  when:
    - not ansible_check_mode
    - forgejo_runner_build_uuid | length > 0
    - forgejo_runner_build_colima_compare.rc != 0
  tags: [forgejo_build_runner]

- name: Record the build runner colima profile just installed
  # Baseline for the compare above: a copy of the render the role
  # actually installed, so colima's rewrite of the live profile is
  # ignored. Root-owned, like the stage dir.
  ansible.builtin.copy:
    src: "{{ forgejo_runner_build_stage_dir }}/colima.yaml"
    dest: "{{ forgejo_runner_build_stage_dir }}/colima.yaml.applied"
    owner: root
    group: indri-build
    mode: '0640'
    remote_src: true
  become: true
  when:
    - not ansible_check_mode
    - forgejo_runner_build_uuid | length > 0
    - forgejo_runner_build_colima_compare.rc != 0
  tags: [forgejo_build_runner]

# --- Build runner docker client config ---
# The build runner's image pulls go through the dagger CLI running as
# indri-build on the macOS host: the buildkit server inside the colima VM
# asks the CLI back for registry credentials (buildkit session-auth
# callback), the CLI re-reads the user's docker client config for each
# lookup, and execs the configured credential helper on the host. The
# colima VM's dockerd never reads that file. A Docker-Desktop-era helper
# reference (credsStore: osxkeychain, left over from before the colima
# migration, eblume/blumeops#1382) therefore breaks every uncached image
# pull - the helper is not installed on the host any more (eblume/
# hephaestus.nvim release run 47, 2026-10-15: "get credentials: rpc error
# ... exec: docker-credential-osxkeychain: executable file not found in
# $PATH"). The role strips the helper keys and keeps the rest of the
# config (runtime auths are legitimate); the next dagger run picks the
# change up on its own, so no VM restart is needed. The file can carry
# registry credentials, so it is never printed and never fetched to the
# control node.

- name: Check build runner docker config for a host-only credential helper
  ansible.builtin.shell: |
    sudo -n -u indri-build /bin/sh -c '
    set -eu
    f="$1"
    cd /
    # File absent: nothing to repair.
    test -f "$f" || exit 1
    # rc: 0 = host-only helper configured, 1 = clean or absent,
    # 2 = unreadable config (the failure).
    /usr/bin/python3 - "$f" << "PY"
    import json, sys
    try:
        cfg = json.load(open(sys.argv[1]))
        if not isinstance(cfg, dict):
            sys.exit(2)
    except Exception:
        sys.exit(2)
    sys.exit(0 if ("credsStore" in cfg or "credHelpers" in cfg) else 1)
    PY
    ' _ {{ forgejo_runner_build_docker_config | quote }}
  register: forgejo_runner_build_docker_config_check
  changed_when: false
  failed_when: forgejo_runner_build_docker_config_check.rc == 2
  check_mode: false
  when: forgejo_runner_build_uuid | length > 0
  tags: [forgejo_build_runner]

- name: Report build runner docker config repair (check mode)
  ansible.builtin.debug:
    msg: "would strip host-only credential helpers (credsStore/credHelpers) from {{ forgejo_runner_build_docker_config }}"
  when:
    - forgejo_runner_build_uuid | length > 0
    - ansible_check_mode
    - forgejo_runner_build_docker_config_check.rc == 0
  tags: [forgejo_build_runner]

- name: Strip host-only credential helpers from the build runner docker config
  ansible.builtin.shell: |
    sudo -n -u indri-build /bin/sh -c '
    set -eu
    f="$1"
    cd /
    test -f "$f"
    /usr/bin/python3 - "$f" << "PY"
    import json, os, sys, tempfile
    p = sys.argv[1]
    cfg = json.load(open(p))
    changed = False
    for k in ("credsStore", "credHelpers"):
        if k in cfg:
            del cfg[k]
            changed = True
    if changed:
        fd, tmp = tempfile.mkstemp(dir=os.path.dirname(p))
        with os.fdopen(fd, "w") as fh:
            json.dump(cfg, fh, indent=4)
            fh.write("\n")
        os.replace(tmp, p)
    PY
    ' _ {{ forgejo_runner_build_docker_config | quote }}
  changed_when: true
  when:
    - not ansible_check_mode
    - forgejo_runner_build_uuid | length > 0
    - forgejo_runner_build_docker_config_check.rc == 0
  tags: [forgejo_build_runner]

# --- Build runner LaunchDaemon (rollback re-write only) ---
# The nix-darwin generation owns this daemon's live plist; these tasks are
# the rollback re-write, run with
# `mise run provision-indri -- --tags forgejo_runner,forgejo_build_runner -e
# forgejo_runner_build_ansible_managed=true` - exactly like the original
# runner's gate.
#
# Caveat: darwin-rebuild --rollback also unloads mcquack.eblume.colima-build
# (the generation no longer defines it), and the role does not re-write the
# colima daemon. A rolled-back indri therefore has a re-written runner with
# no engine host until colima is re-provisioned.

- name: Stage build runner binary for the rollback re-write
  # A fresh copy on every re-write: the plist execs the staged path, not
  # the source checkout (which sits in erichblume's 0750 home, unreadable
  # to indri-build).
  ansible.builtin.copy:
    src: "{{ forgejo_runner_binary }}"
    dest: "{{ forgejo_runner_build_binary }}"
    remote_src: true
    mode: '0755'
    owner: root
    group: wheel
  become: true
  when: forgejo_runner_build_ansible_managed | bool
  tags: [forgejo_build_runner]

- name: Deploy build runner LaunchDaemon plist
  ansible.builtin.template:
    src: forgejo-runner-build.plist.j2
    dest: "{{ forgejo_runner_build_plist }}"
    mode: '0644'
  become: true
  notify: Restart forgejo-runner-build
  when: forgejo_runner_build_ansible_managed | bool
  tags: [forgejo_build_runner]

- name: Check if build runner LaunchDaemon is loaded
  ansible.builtin.command: "launchctl print system/{{ forgejo_runner_build_label }}"
  register: forgejo_runner_build_launchctl_check
  changed_when: false
  failed_when: false
  become: true
  when: forgejo_runner_build_ansible_managed | bool
  tags: [forgejo_build_runner]

- name: Load build runner LaunchDaemon if not loaded
  ansible.builtin.command: "launchctl load -w {{ forgejo_runner_build_plist }}"
  become: true
  when:
    - forgejo_runner_build_ansible_managed | bool
    - forgejo_runner_build_launchctl_check.rc != 0
  changed_when: true
  failed_when: false
  tags: [forgejo_build_runner]
