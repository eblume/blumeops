---
# Forgejo Actions runner — native LaunchAgent on indri.
# Replaces the minikube-hosted runner ([[retire-minikube]] phase 0).
# Runner identity (uuid/token) is fetched from 1Password in the
# playbook pre_tasks ("Forgejo Secrets" → runner_indri_uuid/token).

# Source build paths — same mirror-checkout pattern as the forgejo role.
# Version pin governs the verification check; build by hand:
#   ssh indri 'cd ~/code/3rd/forgejo-runner && git fetch --tags && git checkout v12.13.2 && make build'
forgejo_runner_version: v12.13.2
forgejo_runner_repo_dir: /Users/erichblume/code/3rd/forgejo-runner
forgejo_runner_binary: "{{ forgejo_runner_repo_dir }}/forgejo-runner"

# Daemon home: config + job scratch space.
forgejo_runner_home: /Users/erichblume/forgejo-runner
forgejo_runner_config_path: "{{ forgejo_runner_home }}/config.yaml"
forgejo_runner_log_dir: /Users/erichblume/Library/Logs

forgejo_runner_forge_url: https://forge.ops.eblu.me/
forgejo_runner_capacity: 2
forgejo_runner_timeout: 3h

# Zero-permission GitHub PAT (public read only) injected into every job as
# MISE_GITHUB_TOKEN so mise tool resolution runs authenticated. Fetched from
# 1Password in the playbook pre_tasks ("Forgejo Secrets" →
# forge-ci-github-pat); empty renders no env entry.
forgejo_runner_mise_github_token: ""

# Labels advertised to forge, all host-mode ([[retire-minikube]]
# phase 6): jobs run directly as erichblume with the mise toolchain.
# `k8s` was a compat holdover from the retired minikube cluster and
# has been dropped from workflows repo-wide; `indri` is the honest
# name and the only label advertised now.
forgejo_runner_labels:
  - indri
  # `priv` moved to the dedicated ringtail-priv-runner ([[warrant-approval-gated-runs]]
  # Phase 2 — sandboxed DynamicUser instead of host-mode erichblume).
  # Sequencing: provision-ringtail must register that runner BEFORE
  # provision-indri applies this label drop, or priv dispatches queue.

# Host toolchain for CI jobs, installed via `mise use --global`.
#
# Every version here MIRRORS a pin that lives somewhere else — this list is
# never the source of truth, and bumping an entry on its own is drift, not an
# upgrade. What each one has to match:
#
#   dagger      dagger.json engineVersion (a client/engine mismatch fails the
#               job; the engine runs as a container in the right-sized Docker
#               Desktop, 2cpu/4GiB)
#   prek        mise.toml
#   flyctl      mise.toml — used by the deploy-fly workflow
#   argocd      service-versions.yaml `argocd`
#   actionlint  the highest actionlint `rev` across the prek.toml files that
#   stylua      run these hooks — blumeops for actionlint, hephaestus.nvim for
#               both (a *-system hook runs the host binary, so one host version
#               has to satisfy every repo the runner builds)
#
# So the review order is: bump the source of truth first, then realign here.
forgejo_runner_host_tools:
  - dagger@0.21.9
  - prek@0.4.14
  - flyctl@0.4.87
  # argocd stays as a mise-x fallback for any argocd job that lands on this
  # runner; the primary path is the ringtail-priv-runner's nixpkgs argocd.
  - argocd@3.3.12
  # The two lint binaries prek cannot fetch for itself. prek downloads the
  # environment for most hooks, but a `*-system` hook by definition runs
  # whatever is on PATH — so `actionlint-system` and `stylua-system` are the
  # host's responsibility. Absent, they do not skip: prek reports the hook as
  # failed, which is why blumeops' own actionlint hook has never caught a
  # workflow error and hephaestus.nvim's prek step is stubbed out with an echo.
  - actionlint@1.7.12
  - stylua@2.4.1

# Zot pull-through cache for docker.io pulls, merged into Docker
# Desktop's daemon.json. host.docker.internal resolves to indri from
# inside the Docker Desktop VM (replaces host.minikube.internal:5050).
forgejo_runner_registry_mirror: http://host.docker.internal:5050
forgejo_runner_docker_daemon_json: /Users/erichblume/.docker/daemon.json
