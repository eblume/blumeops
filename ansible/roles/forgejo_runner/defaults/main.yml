---
# Forgejo Actions runners - build runner half (eblume/blumeops#1357). The
# main runner (LaunchAgent, config.yaml, cache maintenance agents) is
# generation-owned end to end (eblume/blumeops#1528); this file carries what
# the role still renders, plus the two values the build config template
# shares with the main runner (forge URL, job timeout - the latter must stay
# below the sweep's age threshold in darwin/indri/mcquack-runner-cache-sweep.sh).

# Source checkout the build runner's rollback re-write stages its binary
# from (the staged copy is what the re-written plist execs - the checkout
# sits in erichblume's 0750 home, unreadable to indri-build).
forgejo_runner_repo_dir: /Users/erichblume/code/3rd/forgejo-runner
forgejo_runner_binary: "{{ forgejo_runner_repo_dir }}/forgejo-runner"

forgejo_runner_forge_url: https://forge.ops.eblu.me/
forgejo_runner_timeout: 3h  # must stay below the sweep's age threshold (darwin/indri/mcquack-runner-cache-sweep.sh)

# Host toolchain for CI jobs lives in indri's declarative global mise
# config (darwin/indri/configuration.nix, entry `[tools]`), the single
# source of truth — every pin there mirrors one held elsewhere (prek.toml
# for prek/actionlint/stylua, service-versions.yaml for argocd, mise.toml
# for flyctl, the dagger CLI pin), and bumping the source of truth is what
# changes the host tool, not this role.

# --- Second runner: indri-build (eblume/blumeops#1357) ---
# An unprivileged forgejo-runner daemon (label `indri-build`) running as the
# dedicated macOS user `indri-build` (no sudo), with colima as its container
# engine host (a root VM running as the build user). Identity (uuid/token) is
# fetched in the playbook pre_tasks ("Forgejo Secrets" →
# runner_indri_build_uuid / runner_indri_build_token)
# and is empty until a human registers the runner - every config render below
# is gated on `forgejo_runner_build_uuid | length > 0`, so the pre-registration
# pass renders nothing and the role never fails on it.

# Skipped by default: the nix-darwin generation owns this daemon's
# /Library/LaunchDaemons plist (like the original runner's LaunchAgent), so a
# normal provision must not re-deploy or reload it. Flip this to true only
# for the rollback re-write (darwin-rebuild --rollback first, then
# `mise run provision-indri -- --tags forgejo_runner,forgejo_build_runner -e
# forgejo_runner_build_ansible_managed=true`).
forgejo_runner_build_ansible_managed: false

# Daemon home: config + job scratch space for the build runner.
forgejo_runner_build_home: /Users/indri-build/forgejo-runner
forgejo_runner_build_config_path: "{{ forgejo_runner_build_home }}/config.yaml"
# Root-owned staging for the files the role installs into the build home
# (see the build runner tasks): root renders here, indri-build copies in.
forgejo_runner_build_stage_dir: /usr/local/etc/forgejo-runner-build

# Shared daemon identity so maintenance agents reference the label and plist
# path instead of hardcoding them. The flake owns the live plist; this plist
# path is the role-rendered rollback re-write target, same pattern as
# forgejo_runner_launch_agent_plist for the original runner.
forgejo_runner_build_label: mcquack.eblume.forgejo-runner-build
forgejo_runner_build_plist: /Library/LaunchDaemons/mcquack.eblume.forgejo-runner-build.plist

# Rollback re-write binary: staged from the source checkout's build (the
# role copies it here, the live source copy stays in erichblume's home,
# which indri-build cannot read once it has its own primary group). Staged
# in /usr/local/libexec, owned by root: the build user only execs it. The
# live daemon runs the nixpkgs package via the flake's waiter script.
forgejo_runner_build_binary: /usr/local/libexec/forgejo-runner-build

# Labels advertised to forge. `indri-build` only: jobs run as the
# unprivileged build user with docker via colima.
forgejo_runner_build_labels:
  - indri-build

# Slot count, separate from the main runner's (the nix-darwin generation's
# entry in forge/runners.json): one PR push starts 6-8 check jobs at once on
# this runner, so 2 slots queued 25% of them >30s (eblume/blumeops#1518).
forgejo_runner_build_capacity: 4

# Runner identity - empty until the human registers the runner (see
# docs/how-to/forgejo-runner/configure-launchd-runner.md §indri-build runner)
# and adds the fields to the "Forgejo Secrets" 1Password item. The config
# render is gated on all three being non-empty (uuid, token, PAT), so the
# role never fails on the pre-registration pass and never renders a config
# whose MISE_GITHUB_TOKEN would fall back to the forge-injected
# GITHUB_TOKEN - the hazard the original config's comment warns about.
forgejo_runner_build_uuid: ""
forgejo_runner_build_token: ""

# Zero-permission GitHub PAT (public read only) for the BUILD runner's mise
# resolution: the shared forge-ci-github-pat, the same token erichblume's
# runner and the forge mirrors use. A separate token would only buy a
# narrower revocation for a token that can do nothing, at the price of a
# second manual rotation. Fetched in the playbook pre_tasks.
forgejo_runner_build_mise_github_token: ""

# Colima profile: rendered here so the profile exists before the daemon's
# boot-wait loop lets colima start. The explicit mounts list in
# colima.yaml.j2 bounds what a container job can mount - it is not an
# isolation control for host-mode jobs (they never enter the VM).
forgejo_runner_build_colima_profile_dir: /Users/indri-build/.colima/indri-build
forgejo_runner_build_colima_yaml: "{{ forgejo_runner_build_colima_profile_dir }}/colima.yaml"
# The seed colima uses for a brand-new instance (see the build runner tasks).
forgejo_runner_build_colima_template: /Users/indri-build/.colima/_templates/default.yaml
forgejo_runner_build_colima_label: mcquack.eblume.colima-build

# The indri-build user's docker client config on the macOS host. The build
# runner's image pulls go through the host's dagger CLI, whose buildkit
# server (in the colima VM) asks it back for registry credentials, so the
# CLI re-reads this file and execs the configured credential helper on the
# host for every lookup. It is not role-rendered (Docker Desktop wrote it
# before the colima migration, eblume/blumeops#1382) and can still point
# at a helper that no longer exists on the host - which breaks every image
# pull (see the build runner tasks).
forgejo_runner_build_docker_config: /Users/indri-build/.docker/config.json
