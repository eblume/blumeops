---
# Forgejo Actions runner — native LaunchAgent on indri.
# Replaces the minikube-hosted runner ([[retire-minikube]] phase 0).
# Runner identity (uuid/token) is fetched from 1Password in the
# playbook pre_tasks ("Forgejo Secrets" → runner_indri_uuid/token).

# Source build paths — same mirror-checkout pattern as the forgejo role.
# Version pin governs the verification check; build by hand:
#   ssh indri 'cd ~/code/3rd/forgejo-runner && git fetch --tags && git checkout v13.1.0 && make build'
# (go comes from indri's declarative go pin — the nix-darwin flake's global
# mise config; GOTOOLCHAIN=auto switches per go.mod, see [[upgrade-forgejo]]
# §Go toolchain.)
# then restart the LaunchAgent (a version-only bump changes no template, so
# the role's restart handler does not fire — the old binary keeps running):
#   ssh indri 'launchctl unload ~/Library/LaunchAgents/mcquack.eblume.forgejo-runner.plist; launchctl load ~/Library/LaunchAgents/mcquack.eblume.forgejo-runner.plist'
forgejo_runner_version: v13.1.0
forgejo_runner_repo_dir: /Users/erichblume/code/3rd/forgejo-runner
forgejo_runner_binary: "{{ forgejo_runner_repo_dir }}/forgejo-runner"

# Daemon home: config + job scratch space.
forgejo_runner_home: /Users/erichblume/forgejo-runner
forgejo_runner_config_path: "{{ forgejo_runner_home }}/config.yaml"
forgejo_runner_log_dir: /Users/erichblume/Library/Logs

# Shared LaunchAgent identity for the runner so maintenance agents
# reference the label/plist path instead of hardcoding it.
forgejo_runner_launch_agent_label: mcquack.eblume.forgejo-runner
forgejo_runner_launch_agent_plist: ~/Library/LaunchAgents/mcquack.eblume.forgejo-runner.plist

forgejo_runner_forge_url: https://forge.ops.eblu.me/
forgejo_runner_capacity: 2
forgejo_runner_timeout: 3h  # must stay below forgejo_runner_sweep_age_minutes

# Zero-permission GitHub PAT (public read only) injected into every job as
# MISE_GITHUB_TOKEN so mise tool resolution runs authenticated. Fetched from
# 1Password in the playbook pre_tasks ("Forgejo Secrets" →
# forge-ci-github-pat); empty renders no env entry.
forgejo_runner_mise_github_token: ""

# Labels advertised to forge, all host-mode ([[retire-minikube]]
# phase 6): jobs run directly as erichblume with the mise toolchain.
# `k8s` was a compat holdover from the retired minikube cluster and
# has been dropped from workflows repo-wide; `indri` is the honest
# name and the only label advertised now.
forgejo_runner_labels:
  - indri
  # `priv` moved to the dedicated ringtail-priv-runner ([[warrant-approval-gated-runs]]
  # Phase 2 — sandboxed DynamicUser instead of host-mode erichblume).
  # Sequencing: provision-ringtail must register that runner BEFORE
  # provision-indri applies this label drop, or priv dispatches queue.

# Host toolchain for CI jobs lives in indri's declarative global mise
# config (darwin/indri/configuration.nix, entry `[tools]`), the single
# source of truth — every pin there mirrors one held elsewhere (prek.toml
# for prek/actionlint/stylua, service-versions.yaml for argocd, mise.toml
# for flyctl, the dagger CLI pin), and bumping the source of truth is what
# changes the host tool, not this role.

# Zot pull-through cache for docker.io pulls, merged into Docker
# Desktop's daemon.json. host.docker.internal resolves to indri from
# inside the Docker Desktop VM (replaces host.minikube.internal:5050).
forgejo_runner_registry_mirror: http://host.docker.internal:5050
forgejo_runner_docker_daemon_json: /Users/erichblume/.docker/daemon.json

# --- Monthly uv cache prune (eblume/blumeops#1065) ---
# Orphaned wheel archives (archive-v0) accumulate as dependency pins
# move; `uv cache prune` reclaims them, but it also removes per-script
# environments, so it must run with the runner stopped. The LaunchAgent
# fires monthly (day 1, 03:30 — clear of borgmatic at 02:00); the script
# boots the runner out, waits for it to drain, prunes, and bootstraps
# the runner back (trap-guarded). Jobs queued during the window wait on
# forge.
forgejo_runner_cache_prune_enabled: true
forgejo_runner_cache_prune_label: mcquack.eblume.runner-cache-prune
forgejo_runner_cache_prune_day: 1
forgejo_runner_cache_prune_hour: 3
forgejo_runner_cache_prune_minute: 30
forgejo_runner_cache_prune_drain_max_s: 10800  # mirrors shutdown_timeout (3h)
forgejo_runner_cache_prune_script: /Users/erichblume/.local/bin/mcquack-runner-cache-prune
forgejo_runner_cache_prune_plist: ~/Library/LaunchAgents/mcquack.eblume.runner-cache-prune.plist
# The uv cache both maintenance agents target. Exported into the agent
# environment so launchd's `uv` operates on the same dir interactive
# shells use (uv's macOS default would be ~/Library/Caches/uv).
forgejo_runner_uv_cache_dir: /Users/erichblume/.cache/uv

# Nightly launchd sweep of leaked per-script uv environments (eblume/
# blumeops#1063; "Cache Maintenance" in docs/reference/services/
# forgejo-runner.md). The age threshold must stay larger than the
# runner's 3h job timeout: a live job's env is created when its job
# starts, so 4h guarantees a live env is never swept.
forgejo_runner_sweep_enabled: true
forgejo_runner_sweep_label: mcquack.eblume.runner-cache-sweep
forgejo_runner_sweep_script: "{{ forgejo_runner_home }}/bin/runner-cache-sweep.sh"
forgejo_runner_sweep_plist: ~/Library/LaunchAgents/mcquack.eblume.runner-cache-sweep.plist
forgejo_runner_sweep_hour: 5
forgejo_runner_sweep_minute: 30
forgejo_runner_sweep_age_minutes: 240
# Host-mode jobs run as erichblume (HOME=/Users/erichblume), so the caches
# leak under the user home, not the daemon home above; the uv cache is
# forgejo_runner_uv_cache_dir.
forgejo_runner_sweep_prek_cache_dir: /Users/erichblume/.cache/prek
