---
- name: Restart forgejo-runner
  ansible.builtin.shell: |
    launchctl unload {{ forgejo_runner_launch_agent_plist }} 2>/dev/null || true
    launchctl load {{ forgejo_runner_launch_agent_plist }}
  changed_when: true

- name: Restart runner cache prune
  ansible.builtin.shell: |
    launchctl unload {{ forgejo_runner_cache_prune_plist }} 2>/dev/null || true
    launchctl load {{ forgejo_runner_cache_prune_plist }}
  changed_when: true

- name: Reload runner-cache-sweep
  ansible.builtin.shell: |
    launchctl unload {{ forgejo_runner_sweep_plist }} 2>/dev/null || true
    launchctl load {{ forgejo_runner_sweep_plist }}
  changed_when: true

- name: Note Docker Desktop restart required
  ansible.builtin.debug:
    msg: >-
      daemon.json changed: restart Docker Desktop on indri to activate
      the registry mirror. While minikube still exists, a Docker
      restart takes the cluster down — pick a quiet moment.

- name: Restart forgejo-runner-build
  # System-domain daemon: needs sudo (the runner daemon runs as the
  # unprivileged indri-build user), and kickstart restarts the loaded job in
  # place. The guard keeps a not-yet-loaded job from failing the handler.
  ansible.builtin.shell: |
    sudo -n launchctl kickstart -k system/{{ forgejo_runner_build_label }} 2>/dev/null || true
  changed_when: true
