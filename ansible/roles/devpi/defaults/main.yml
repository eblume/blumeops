---
# devpi on indri is nix-managed (darwin/indri, PR 10 of the nix-darwin
# series): the generation owns the LaunchAgent plist, so a normal
# provision must not re-deploy or reload it. Flip this to true only
# for the rollback re-write (darwin-rebuild --rollback first, then
# `mise run provision-indri -- --tags devpi -e devpi_ansible_managed=true`),
# per docs/how-to/indri/provision.md §Rolling back a service flip.

devpi_ansible_managed: false

# devpi PyPI caching mirror (native launchd, replaces minikube StatefulSet)

devpi_home: /Users/erichblume/devpi
devpi_venv: "{{ devpi_home }}/venv"
devpi_server_dir: "{{ devpi_home }}/server-dir"
devpi_binary: "{{ devpi_venv }}/bin/devpi-server"
devpi_init_binary: "{{ devpi_venv }}/bin/devpi-init"

devpi_python_version: "3.12"
devpi_server_version: "6.20.3"
devpi_web_version: "5.1.1"

devpi_host: 127.0.0.1
devpi_port: 3141
devpi_outside_url: "https://pypi.ops.eblu.me"

devpi_log_dir: /Users/erichblume/Library/Logs

# uv binary on indri — mise shim; the version is the `uv` pin in the indri
# nix-darwin flake (darwin/indri/configuration.nix), so bumps are a flake PR
devpi_uv_binary: /Users/erichblume/.local/share/mise/shims/uv
