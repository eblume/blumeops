---
# Note: Zot is built from source, not installed via homebrew.
#
# ONE-TIME SETUP (before running ansible):
#
# 1. Clone zot from forge mirror (use localhost:3001 - hairpinning doesn't work):
#    ssh indri 'git clone http://localhost:3001/eblume/zot.git ~/code/3rd/zot'
#
# 2. Build (creates bin/zot-darwin-arm64) — go comes from the indri
#    declarative go pin (the nix-darwin flake's mise config); GOTOOLCHAIN=
#    auto switches per go.mod ([[upgrade-forgejo]] §Go toolchain):
#    ssh indri 'cd ~/code/3rd/zot && mise x -- make binary'
#
# 3. Run ansible to deploy config and LaunchAgent
#
# UPGRADE: `git fetch --tags && git checkout vX.Y.Z` in the clone,
# `mise x -- make binary`, then `launchctl kickstart -k gui/$(id -u)/mcquack.eblume.zot`
# — ansible only restarts the LaunchAgent when the rendered config changes.

# Skipped by default: the nix-darwin generation owns this service's
# LaunchAgent plist (PR 5 of the indri series). The plist and load
# tasks below remain the rollback re-write, run with
# -e zot_ansible_managed=true only; config/credentials rendering and
# the binary checks stay ansible-side. See defaults/main.yml.

- name: Remove untracked local mise pin
  # A per-checkout mise.toml shadows indri's global mise config, which is
  # declared in the indri nix-darwin flake (the flake is the single source
  # of truth for the toolchain).
  ansible.builtin.file:
    path: "{{ zot_repo_dir }}/mise.toml"
    state: absent

- name: Verify zot binary exists
  ansible.builtin.stat:
    path: "{{ zot_binary }}"
  register: zot_binary_stat

- name: Fail if zot binary not found
  ansible.builtin.fail:
    msg: |
      Zot binary not found at {{ zot_binary }}.
      Please build from source first:
        ssh indri 'cd ~/code/3rd/zot && mise x -- make binary'
  when: not zot_binary_stat.stat.exists

- name: Ensure zot data directory exists
  ansible.builtin.file:
    path: "{{ zot_data_dir }}"
    state: directory
    mode: '0755'

- name: Ensure zot config directory exists
  ansible.builtin.file:
    path: "{{ zot_config_dir }}"
    state: directory
    mode: '0755'

- name: Deploy zot config
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ zot_config_dir }}/config.json"
    mode: '0644'
  notify: Restart zot

- name: Deploy zot OIDC credentials
  ansible.builtin.template:
    src: oidc-credentials.json.j2
    dest: "{{ zot_config_dir }}/oidc-credentials.json"
    mode: '0600'
  notify: Restart zot
  when: zot_oidc_client_secret is defined

- name: Remove retired zot launch wrapper
  ansible.builtin.file:
    path: "{{ zot_config_dir }}/zot-serve.sh"
    state: absent

- name: Deploy zot LaunchAgent plist
  ansible.builtin.template:
    src: zot.plist.j2
    dest: ~/Library/LaunchAgents/mcquack.eblume.zot.plist
    mode: '0644'
  notify: Restart zot
  when: zot_ansible_managed | bool

# The wrapper keeps new progress-bar frames out of this log; this clears the
# frames already accumulated (they are the bulk of the file by bytes, and Loki
# rejects them anyway — the normal lines are already shipped). Truncating also
# snaps alloy's saved tail position back to a real offset: it treats
# size < position as truncation and re-tails from zero. No-op once clean.
- name: Truncate zot stderr log if it holds progress-bar frames
  ansible.builtin.shell: |
    if LC_ALL=C grep -q 'iB / ' '{{ zot_log_dir }}/mcquack.zot.err.log'; then
      : > '{{ zot_log_dir }}/mcquack.zot.err.log'
      echo truncated
    fi
  register: zot_errlog_truncate
  changed_when: "'truncated' in zot_errlog_truncate.stdout"

- name: Check if zot LaunchAgent is loaded
  ansible.builtin.command: launchctl list mcquack.eblume.zot
  register: zot_launchctl_check
  changed_when: false
  failed_when: false
  when: zot_ansible_managed | bool

- name: Load zot LaunchAgent if not loaded
  ansible.builtin.command: launchctl load ~/Library/LaunchAgents/mcquack.eblume.zot.plist
  when:
    - zot_ansible_managed | bool
    - zot_launchctl_check.rc != 0
  changed_when: true
  failed_when: false
