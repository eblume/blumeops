---
# zot on indri is nix-managed (darwin/indri, PR 5 of the nix-darwin
# series): the generation owns the LaunchAgent plist, so a normal
# provision must not re-deploy or reload it. Flip this to true only
# for the rollback re-write (darwin-rebuild --rollback first, then
# `mise run provision-indri -- --tags zot -e zot_ansible_managed=true`),
# per docs/how-to/indri/provision.md §Rolling back a service flip.

zot_ansible_managed: false

zot_repo_dir: /Users/erichblume/code/3rd/zot
zot_binary: "{{ zot_repo_dir }}/bin/zot-darwin-arm64"
zot_data_dir: /Users/erichblume/zot
zot_config_dir: /Users/erichblume/.config/zot
zot_port: 5050
zot_log_dir: /Users/erichblume/Library/Logs
zot_external_url: https://registry.ops.eblu.me
zot_oidc_issuer: https://authentik.ops.eblu.me/application/o/zot/

# Pull-through cache registries (on-demand sync)
zot_sync_registries:
  - name: docker.io
    url: https://registry-1.docker.io
  - name: ghcr.io
    url: https://ghcr.io
  - name: quay.io
    url: https://quay.io

# CVE scanning (trivy). Disable temporarily when the trivy update path is
# wedging startup — see the 2026-08-14 registry outage.
zot_cve_enabled: true
