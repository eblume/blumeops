[defaults]
inventory = inventory/hosts.yml
interpreter_python = auto_silent
roles_path = roles
host_key_checking = False

[privilege_escalation]
become = False

[ssh_connection]
# A provision restarts sshd and the network stack under itself. When the far end
# goes away mid-task the TCP connection is not closed, it is simply silent — and
# without keepalives ssh waits on it forever, so a playbook that has in fact
# finished its work hangs until someone notices. ServerAliveInterval turns that
# into a bounded failure (~5 min), which `retries`/`wait_for_connection` can then
# recover from.
#
# ControlPersist keeps the multiplexed master alive across tasks; ConnectTimeout
# bounds the *initial* dial, which the ServerAlive pair does not cover.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=20 -o ConnectTimeout=30
