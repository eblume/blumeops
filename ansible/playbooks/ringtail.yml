---
- name: Configure ringtail (NixOS)
  hosts: ringtail
  become: true

  vars:
    # The transient unit the activation runs in. A fixed name (rather than
    # systemd-run's generated one) is what lets the poll below find the run
    # again after the SSH connection has been re-established.
    _rebuild_unit: blumeops-nixos-rebuild
    # Ceiling for one activation, in seconds. Generous on purpose: this bounds
    # the wait, and a timeout here kills a switch partway through, which is the
    # outcome the whole change exists to avoid.
    _rebuild_timeout: 3600

  pre_tasks:
    - name: Fetch 1Password Connect credentials from 1Password
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/1Password Connect/credentials-file"
      register: _op_credentials
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Fetch 1Password Connect token from 1Password
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/1Password Connect/token"
      register: _op_token
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Fetch Forgejo runner registration token from 1Password
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/Forgejo Secrets/runner_reg"
      register: _runner_reg
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Ensure /etc/forgejo-runner directory exists
      ansible.builtin.file:
        path: /etc/forgejo-runner
        state: directory
        mode: "0700"

    - name: Write Forgejo runner token file
      ansible.builtin.copy:
        content: "TOKEN={{ _runner_reg.stdout }}"
        dest: /etc/forgejo-runner/token.env
        mode: "0600"
      no_log: true

    - name: Ensure /etc/k3s directory exists
      ansible.builtin.file:
        path: /etc/k3s
        state: directory
        mode: "0700"

    - name: Generate k3s token if not present
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['hexdigits'], length=32) }}"
        dest: /etc/k3s/token
        mode: "0600"
        force: false

    # --- Agent user + heph spoke (see docs/explanation/agent-containerization.md) ---
    # The workspace ran on the host; it now runs as a k3s pod. Only the op-token
    # the heph spoke needs is placed here — the Forgejo bot SSH key is gone (the
    # containerized agent authenticates to the forge over HTTPS+token, not ssh).
    - name: Fetch agents-ringtail-rw service-account token from 1Password
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/agents-ringtail Service Account/credential"
      register: _agents_op_token
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Ensure /etc/agents directory exists
      ansible.builtin.file:
        path: /etc/agents
        state: directory
        owner: "1500"
        group: "1500"
        mode: "0700"

    - name: Write agents service-account token file
      ansible.builtin.copy:
        content: "{{ _agents_op_token.stdout }}"
        dest: /etc/agents/op-token
        owner: "1500"
        group: "1500"
        mode: "0400"
      no_log: true

    - name: Remove retired workspace bot SSH key (agent no longer uses ssh)
      ansible.builtin.file:
        path: /etc/agents/ssh
        state: absent

  tasks:
    - name: Ensure blumeops repo is present
      ansible.builtin.git:
        repo: "https://forge.ops.eblu.me/eblume/blumeops.git"
        dest: /etc/blumeops
        version: "{{ ringtail_commit | default('main') }}"
        force: true
      register: _repo

    # Activation restarts sshd, tailscaled and the network stack — the very
    # things this play is talking over. Run inline, `nixos-rebuild` is a child of
    # the ssh session, so a session teardown mid-activation kills it partway
    # through; and even when it survives, ansible is left waiting on a socket
    # that will never answer. Handing it to systemd as a transient unit puts the
    # activation outside the session's lifetime, so the connection dropping
    # becomes something to reconnect to rather than something that interrupts a
    # half-applied switch.
    - name: Clear any leftover rebuild unit from a previous run
      ansible.builtin.command:
        cmd: systemctl reset-failed {{ _rebuild_unit }}
      changed_when: false
      failed_when: false
      when: _repo.changed

    # The journal is persistent here, so a query by unit name alone returns
    # every past run's output as well as this one's — which would leave the
    # `changed` test below matching an activation from weeks ago. Take the
    # host's clock first and read the journal forward from it.
    - name: Note the host clock before starting the rebuild
      ansible.builtin.command:
        cmd: date +%s
      register: _rebuild_started_at
      changed_when: false
      when: _repo.changed

    - name: Start NixOS rebuild, detached from this SSH session
      ansible.builtin.command:
        # Absolute path and an explicit PATH: a transient unit gets systemd's
        # default environment, which on NixOS has neither nixos-rebuild nor the
        # nix/systemctl it shells out to.
        #
        # --no-block matters: without it systemd-run sits on the D-Bus job
        # until the oneshot finishes, so the task is tied to the session and
        # the bus after all. The 26.05 switch restarted dbus-broker
        # mid-activation and the wait died with "D-Bus connection terminated
        # while waiting for jobs" — ansible failed while the unit ran on to
        # a successful switch. Return as soon as the unit is queued and let
        # the reconnect + poll below do the waiting they were written for.
        cmd: >-
          systemd-run --no-block --unit={{ _rebuild_unit }} --service-type=oneshot
          --property=TimeoutStartSec={{ _rebuild_timeout }}
          --setenv=PATH=/run/current-system/sw/bin:/usr/bin:/bin
          --setenv=HOME=/root
          /run/current-system/sw/bin/nixos-rebuild switch
          --flake /etc/blumeops/nixos/ringtail#ringtail
      changed_when: true
      when: _repo.changed

    # The activation is what breaks the connection, so reconnect before asking
    # anything else. Ansible treats a dropped ssh as *unreachable*, which ends
    # the play outright rather than feeding into a task's `retries` — so the wait
    # has to be explicit, not implied by the poll below.
    - name: Wait for SSH to come back after activation
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 600
      when: _repo.changed

    # Queried with no state, systemd_service just reports — `status` is the full
    # `systemctl show` property set, so this one task carries both the poll
    # (ActiveState) and the verdict (Result) read below.
    - name: Wait for the rebuild to finish
      ansible.builtin.systemd_service:
        name: "{{ _rebuild_unit }}"
      register: _rebuild_state
      until: _rebuild_state.status.ActiveState not in ["activating", "active", "reloading"]
      retries: "{{ (_rebuild_timeout | int / 10) | int }}"
      delay: 10
      when: _repo.changed

    # The unit's output went to the journal, not to ansible. Pull it back so a
    # failure is legible here instead of "exit 1, go read the box", and so the
    # activation line this play keys `changed` off is still available.
    - name: Collect rebuild output
      ansible.builtin.command:
        cmd: >-
          journalctl --unit={{ _rebuild_unit }} --no-pager --output=cat
          --since=@{{ _rebuild_started_at.stdout }}
      register: _rebuild_log
      changed_when: "'activating the configuration' in _rebuild_log.stdout"
      when: _repo.changed

    # `Result` is systemd's verdict on the run — "success", or one of exit-code,
    # timeout, signal, oom-kill. ActiveState alone cannot say: a finished
    # Type=oneshot unit is `inactive` whether it succeeded or not.
    - name: Fail if the rebuild did not succeed
      ansible.builtin.fail:
        msg: |
          nixos-rebuild switch did not succeed (systemd Result: {{ _rebuild_state.status.Result }}).
          Journal for {{ _rebuild_unit }}:
          {{ _rebuild_log.stdout }}
      when: _repo.changed and _rebuild_state.status.Result != "success"

    # Transient units linger once they have run; without this the next provision
    # trips over a unit that already exists.
    - name: Release the rebuild unit
      ansible.builtin.command:
        cmd: systemctl reset-failed {{ _rebuild_unit }}
      changed_when: false
      failed_when: false
      when: _repo.changed

    - name: Verify tailscale is connected
      ansible.builtin.command: tailscale status --self --json
      register: _ts_status
      changed_when: false
      failed_when: "'Running' not in _ts_status.stdout"

  post_tasks:
    - name: Wait for k3s to be ready
      ansible.builtin.command: k3s kubectl get nodes
      register: _k3s_ready
      changed_when: false
      retries: 30
      delay: 5
      until: _k3s_ready.rc == 0

    - name: Create 1password namespace
      ansible.builtin.command: k3s kubectl create namespace 1password
      register: _ns
      changed_when: _ns.rc == 0
      failed_when: _ns.rc != 0 and 'AlreadyExists' not in _ns.stderr

    - name: Create or update op-credentials secret
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl create secret generic op-credentials \
            --namespace=1password \
            --from-literal=1password-credentials.json='{{ _op_credentials.stdout }}' \
            --dry-run=client -o yaml | k3s kubectl apply -f -
        executable: /run/current-system/sw/bin/bash
      register: _op_credentials_apply
      changed_when: "'configured' in _op_credentials_apply.stdout or 'created' in _op_credentials_apply.stdout"
      no_log: true

    - name: Create or update onepassword-token secret
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          k3s kubectl create secret generic onepassword-token \
            --namespace=1password \
            --from-literal=token={{ _op_token.stdout }} \
            --dry-run=client -o yaml | k3s kubectl apply -f -
        executable: /run/current-system/sw/bin/bash
      register: _op_token_apply
      changed_when: "'configured' in _op_token_apply.stdout or 'created' in _op_token_apply.stdout"
      no_log: true
