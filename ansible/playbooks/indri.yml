---
- name: Configure indri
  hosts: indri

  vars:
    # mise comes from Homebrew, ensured by the indri generation's Brewfile
    # (`homebrew.brews` in `darwin/indri/configuration.nix`); tag-scoped role
    # runs assume it is already present (the rebuild path ensures it). This
    # is the one binary every mise call in the play and the roles goes
    # through. See [[indri]] §Toolchain.
    indri_mise_bin: /opt/homebrew/bin/mise
  # Fetch 1Password credentials upfront to minimize prompts
  # Each role also fetches its own credentials (with 'when: <var> is not defined')
  # so they still work when running with --tags
  pre_tasks:
    - name: Fetch borgmatic database password
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/mw2bv5we7woicjza7hc6s44yvy/db-password"
      delegate_to: localhost
      register: _borgmatic_db_pw
      changed_when: false
      no_log: true
      check_mode: false
      tags: [borgmatic]

    - name: Set borgmatic database password fact
      ansible.builtin.set_fact:
        borgmatic_db_password: "{{ _borgmatic_db_pw.stdout }}"
      no_log: true
      tags: [borgmatic]

    - name: Fetch BorgBase SSH private key
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/noiobufntsxyzageu7mvlp2nbe/ssh-private-key"
      delegate_to: localhost
      register: _borgbase_ssh_key
      changed_when: false
      no_log: true
      check_mode: false
      tags: [borgmatic]

    - name: Set BorgBase SSH key fact
      ansible.builtin.set_fact:
        borgbase_ssh_private_key: "{{ _borgbase_ssh_key.stdout }}"
      no_log: true
      tags: [borgmatic]

    # Forgejo secrets
    - name: Fetch forgejo LFS JWT secret
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/w3663ffnvkewbftncqxtcpeavy/lfs-jwt-secret"
      delegate_to: localhost
      register: _forgejo_lfs_jwt
      changed_when: false
      no_log: true
      check_mode: false
      tags: [forgejo]

    - name: Fetch forgejo internal token
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/w3663ffnvkewbftncqxtcpeavy/internal-token"
      delegate_to: localhost
      register: _forgejo_internal_token
      changed_when: false
      no_log: true
      check_mode: false
      tags: [forgejo]

    - name: Fetch forgejo OAuth2 JWT secret
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/w3663ffnvkewbftncqxtcpeavy/oauth2-jwt-secret"
      delegate_to: localhost
      register: _forgejo_oauth2_jwt
      changed_when: false
      no_log: true
      check_mode: false
      tags: [forgejo]

    - name: Set forgejo secrets facts
      ansible.builtin.set_fact:
        forgejo_lfs_jwt_secret: "{{ _forgejo_lfs_jwt.stdout }}"
        forgejo_internal_token: "{{ _forgejo_internal_token.stdout }}"
        forgejo_oauth2_jwt_secret: "{{ _forgejo_oauth2_jwt.stdout }}"
      no_log: true
      tags: [forgejo]

    # Zot OIDC client secret
    - name: Fetch zot OIDC client secret
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/oor7os5kapczgpbwv7obkca4y4/zot-client-secret"
      delegate_to: localhost
      register: _zot_oidc_secret
      changed_when: false
      no_log: true
      check_mode: false
      tags: [zot]

    - name: Set zot OIDC client secret fact
      ansible.builtin.set_fact:
        zot_oidc_client_secret: "{{ _zot_oidc_secret.stdout }}"
      no_log: true
      tags: [zot]

    # Caddy Gandi token for ACME DNS-01 challenges
    - name: Fetch Gandi PAT for Caddy
      ansible.builtin.command:
        cmd: op read "op://ih6djacnpiqzb3byv3v4rafmfe/nji2aezc6zgm3dcl35ouqx2p54/pat"
      delegate_to: localhost
      register: _caddy_gandi_token
      changed_when: false
      no_log: true
      check_mode: false
      tags: [caddy]

    - name: Set Caddy Gandi token fact
      ansible.builtin.set_fact:
        caddy_gandi_token: "{{ _caddy_gandi_token.stdout }}"
      no_log: true
      tags: [caddy]

    # Jellyfin SSO client secret
    - name: Fetch Jellyfin OIDC client secret
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/oor7os5kapczgpbwv7obkca4y4/jellyfin-client-secret"
      delegate_to: localhost
      register: _jellyfin_oidc_secret
      changed_when: false
      no_log: true
      check_mode: false
      tags: [jellyfin]

    - name: Set Jellyfin OIDC client secret fact
      ansible.builtin.set_fact:
        jellyfin_sso_client_secret: "{{ _jellyfin_oidc_secret.stdout }}"
      no_log: true
      tags: [jellyfin]

    # Devpi root password (PyPI mirror admin)
    - name: Fetch devpi root password
      ansible.builtin.command:
        cmd: op read "op://vg6xf6vvfmoh5hqjjhlhbeoaie/kyhzfifryqnuk7jeyibmmjvxxm/add more/root password"
      delegate_to: localhost
      register: _devpi_root_password
      changed_when: false
      no_log: true
      check_mode: false
      tags: [devpi]

    - name: Set devpi root password fact
      ansible.builtin.set_fact:
        devpi_root_password: "{{ _devpi_root_password.stdout }}"
      no_log: true
      tags: [devpi]

    # /etc/resolver/ts.net must be a real file on the system volume, not a
    # nix-darwin /etc/static symlink: the Nix Store APFS volume mounts tens
    # of seconds after boot, and if mDNSResponder scans /etc/resolver before
    # the mount the dangling link is skipped and never rescanned - tailnet
    # MagicDNS (*.ts.net) stays dark until a manual ln -sfn. Written before
    # the rebuild block below so the file pre-exists the switch: the
    # switch's etc script deletes the stale symlink once the nix-darwin
    # declaration is gone, while a real (undeclared) file survives it.
    # follow: false replaces the store symlink rather than writing through
    # it. Tagged `rebuild` as well, so the zero-prompt `--tags rebuild`
    # path converges it before the switch too. See [[provision]] §Reboot test.
    - name: Write the tailnet MagicDNS resolver as a real file
      ansible.builtin.copy:
        content: "nameserver 100.100.100.100\n"
        dest: /etc/resolver/ts.net
        owner: root
        group: wheel
        mode: "0644"
        follow: false
      become: true
      tags: [rebuild, tailnet-dns]

    - name: Verify the resolver is a regular file, not a store symlink
      ansible.builtin.stat:
        path: /etc/resolver/ts.net
      become: true
      register: indri_tsnet_resolver
      check_mode: false
      tags: [rebuild, tailnet-dns]

    - name: Fail if the resolver is not a real file
      ansible.builtin.fail:
        msg: "/etc/resolver/ts.net is not a regular file: {{ indri_tsnet_resolver.stat }}"
      when: not ansible_check_mode and not (indri_tsnet_resolver.stat.exists and indri_tsnet_resolver.stat.isreg)
      tags: [rebuild, tailnet-dns]

    # nix-darwin rebuild: checkout the bound blumeops commit as a root-owned
    # /etc/blumeops and run darwin-rebuild switch detached from the
    # controlling session (nohup): the switch is long and would outlive any
    # tool-call timeout otherwise. Nothing nix-darwin activates touches sshd -
    # Tailscale SSH is the one service nix-darwin does not own - so the
    # controlling session is not at risk from the switch itself. All of it
    # is tagged `rebuild` so
    # `mise run provision-indri -- --tags rebuild` is the zero-1Password-
    # prompt apply path. See [[provision]].
    #
    # These live at the end of pre_tasks, not under `tasks:`, because ansible
    # runs `tasks:` after `roles:` - the generation must be current before the
    # service roles run (the ordering PRs 2-8's service flips rely on).
    - name: Checkout the bound blumeops commit for the nix-darwin flake
      ansible.builtin.git:
        repo: "https://forge.ops.eblu.me/eblume/blumeops.git"
        dest: /etc/blumeops
        version: "{{ indri_commit | default('main') }}"
        force: true
      become: true
      register: indri_blumeops_repo
      tags: [rebuild]

    # /run/current-system is what nix-darwin's activation (re)creates, but it
    # does not exist yet before the first switch, so the system profile symlink -
    # which always points at the current generation - is the fallback.
    - name: Resolve darwin-rebuild (current system, else the system profile)
      ansible.builtin.shell: >-
        test -x /run/current-system/sw/bin/darwin-rebuild
        && echo /run/current-system/sw/bin/darwin-rebuild
        || echo /nix/var/nix/profiles/system/sw/bin/darwin-rebuild
      become: true
      register: indri_darwin_rebuild
      changed_when: false
      check_mode: false
      when: indri_blumeops_repo.changed
      tags: [rebuild]

    # The detached shell writes <sha>.status (started <epoch> at launch, its
    # verdict last); the wait below polls for it. A timeout here does not kill the rebuild - it
    # keeps running detached; read /var/log/indri-rebuild/<sha>.log.
    #
    # indri_rebuild_wait=false (the provision-indri workflow) skips the wait:
    # the play launches the switch and exits. A switch that reloads the
    # forgejo-runner agent kills any job still waiting on it (launchd clamps
    # ExitTimeOut to 60 s in the gui domain), so the forge job reports
    # "launched", not the outcome - the .status/.log sidecars are the
    # verdict (#1266). Human runs keep the default wait: the service roles
    # below need the generation current before they run.
    #
    # sudo -H: macOS sudo keeps $HOME (env_keep), so without it the nix build
    # that root runs leaves root-owned files in ~erichblume/.cache/nix and
    # breaks the user-run indri-flake-check and the CI job on the indri runner.

    # The SHA is resolved up front, and the block below keeps no Jinja string
    # literals and no backslash continuations: the multiline shell argument
    # pre-parser chokes on both.
    - name: Resolve the apply target (a SHA, or main)
      ansible.builtin.set_fact:
        indri_apply_target: "{{ indri_commit | default('main') }}"
      tags: [rebuild]

    - name: Start darwin-rebuild switch, detached from the controlling session
      ansible.builtin.shell: |
        set -euo pipefail
        sudo -n mkdir -p /var/log/indri-rebuild
        # A leftover sidecar from an earlier switch of this SHA would read as
        # the verdict of this switch.
        sudo -n rm -f /var/log/indri-rebuild/{{ indri_apply_target }}.status
        # The detached shell (root via sudo -H) holds an atomic mkdir lock, reclaimed
        # as stale once its pid dies: two concurrent switches would race with the
        # older SHA finishing last (macOS has no flock).
        sudo -n -H nohup sh -c '
        cd /
        sha="{{ indri_apply_target }}"
        n=0
        while ! sudo -n mkdir /var/log/indri-rebuild/.switch.lock 2>/dev/null; do
          n=$((n + 1))
          read -r holder < /var/log/indri-rebuild/.switch.lock/pid 2>/dev/null || holder=
          if [ -n "$holder" ] && ! ps -p "$holder" >/dev/null 2>&1; then
            sudo -n rm -rf /var/log/indri-rebuild/.switch.lock
            continue
          fi
          if [ "$n" -ge 180 ]; then
            echo lock-held > /var/log/indri-rebuild/"$sha".status.tmp && mv /var/log/indri-rebuild/"$sha".status.tmp /var/log/indri-rebuild/"$sha".status
            exit 75
          fi
          sleep 10
        done
        echo $$ > /var/log/indri-rebuild/.switch.lock/pid
        trap "sudo -n rm -rf /var/log/indri-rebuild/.switch.lock" EXIT
        # origin/main moved past this SHA. Skip only when a newer run is
        # coming: a trigger-paths merge (the push filter in
        # .forgejo/workflows/provision-indri.yaml - keep it in sync) already
        # started one; a merge to anything else starts nothing. The != main
        # guard skips human runs, which apply the live tip by design.
        if [ "$sha" != "main" ] && git -C /etc/blumeops fetch origin --quiet && [ "$(git -C /etc/blumeops rev-parse origin/main)" != "$sha" ] && git -C /etc/blumeops merge-base --is-ancestor "$sha" origin/main && ! git -C /etc/blumeops diff --quiet "$sha" origin/main -- darwin/indri/; then
          echo superseded > /var/log/indri-rebuild/"$sha".status.tmp && mv /var/log/indri-rebuild/"$sha".status.tmp /var/log/indri-rebuild/"$sha".status
          exit 0
        fi
        # Non-terminal sidecar while the switch is in flight: the watcher
        # alerts on it if no verdict follows (hang, panic, power loss). The
        # last line overwrites it with the exit code.
        echo "started $(date +%s)" > /var/log/indri-rebuild/"$sha".status.tmp && mv /var/log/indri-rebuild/"$sha".status.tmp /var/log/indri-rebuild/"$sha".status
        {{ indri_darwin_rebuild.stdout }} switch --flake /etc/blumeops/darwin/indri#indri > /var/log/indri-rebuild/{{ indri_apply_target }}.log 2>&1; echo $? > /var/log/indri-rebuild/{{ indri_apply_target }}.status.tmp && mv /var/log/indri-rebuild/{{ indri_apply_target }}.status.tmp /var/log/indri-rebuild/{{ indri_apply_target }}.status
        ' </dev/null >/dev/null 2>&1 &
        REBUILD_PID=$!
        # A backgrounded job that fails to launch dies before the wait below
        # could notice; ps is ownership-neutral, kill -0 is not. A job that exits
        # within the check window (superseded) has written its verdict sidecar instead.
        sleep 2
        if ! ps -p "$REBUILD_PID" >/dev/null 2>&1 && [ ! -f /var/log/indri-rebuild/{{ indri_apply_target }}.status ]; then
          echo "darwin-rebuild failed to launch" >&2
          exit 1
        fi
      changed_when: true
      check_mode: false
      when: indri_blumeops_repo.changed and not ansible_check_mode
      tags: [rebuild]

    - name: Report the launched switch (not waiting for it)
      ansible.builtin.debug:
        msg: >-
          darwin-rebuild switch launched detached for {{ indri_commit | default('main') }};
          not waiting. Outcome: /var/log/indri-rebuild/{{ indri_commit | default('main') }}.status
          (verdict, written when the switch ends) and .log on indri.
      when: indri_blumeops_repo.changed and not ansible_check_mode and not (indri_rebuild_wait | default(true) | bool)
      tags: [rebuild]

    - name: Wait for the darwin-rebuild to finish
      ansible.builtin.shell: "st=$(cat /var/log/indri-rebuild/{{ indri_commit | default('main') }}.status 2>/dev/null || echo none); case $st in started*) exit 1 ;; none) exit 1 ;; esac"
      register: indri_rebuild_done
      changed_when: false
      failed_when: false
      check_mode: false
      until: indri_rebuild_done.rc == 0
      retries: 120
      delay: 30
      when: indri_blumeops_repo.changed and not ansible_check_mode and (indri_rebuild_wait | default(true) | bool)
      tags: [rebuild]

    - name: Read the darwin-rebuild log
      ansible.builtin.command: "tail -c 4000 /var/log/indri-rebuild/{{ indri_commit | default('main') }}.log"
      register: indri_rebuild_log
      changed_when: false
      check_mode: false
      when: indri_blumeops_repo.changed and not ansible_check_mode and (indri_rebuild_wait | default(true) | bool)
      tags: [rebuild]

    - name: Read the darwin-rebuild exit status
      ansible.builtin.command: "cat /var/log/indri-rebuild/{{ indri_commit | default('main') }}.status"
      register: indri_rebuild_status
      changed_when: false
      check_mode: false
      when: indri_blumeops_repo.changed and not ansible_check_mode and (indri_rebuild_wait | default(true) | bool)
      tags: [rebuild]

    - name: Fail if the darwin-rebuild did not succeed
      ansible.builtin.fail:
        msg: |
          darwin-rebuild switch exited with {{ indri_rebuild_status.stdout }}
          (log: /var/log/indri-rebuild/{{ indri_commit | default('main') }}.log):
          {{ indri_rebuild_log.stdout | default('') }}
      when: indri_rebuild_status.stdout is defined and indri_rebuild_status.stdout not in ['0', 'superseded']
      tags: [rebuild]

  roles:
    - role: borgmatic
      tags: borgmatic
    - role: forgejo
      tags: forgejo
    - role: zot
      tags: zot
    - role: devpi
      tags: devpi
    - role: jellyfin
      tags: jellyfin
    - role: caddy
      tags: caddy
