app = "blumeops-proxy"
primary_region = "sjc"

[build]

[[vm]]
memory = "512mb"

[deploy]
strategy = "immediate"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "15s"
interval = "10s"
method = "GET"
path = "/healthz"
timeout = "5s"

# Expose Tailscale's WireGuard port so direct peer-to-peer connections can
# establish instead of falling back to DERP relay. Requires a dedicated IPv4.
[[services]]
internal_port = 41641
protocol = "udp"

[[services.ports]]
port = 41641

# --- Static forge mirror (fly/git-mirror/README.md, Part of eblume/blumeops#1208) ---
# Holds the pushed bare repos + generated stagit site under
# /volume/git-mirror. Sized for the seven allowlisted repos (~1 GB today)
# with headroom; created idempotently by `mise run fly-setup`. On
# machine replacement the volume reattaches and the post-start
# init (start.sh) recreates the site from the repos.
#
# The tailscale node key is also persisted here (/volume/tailscale,
# bind-mounted over /var/lib/tailscale in start.sh): a reboot reconnects
# with the existing identity without the auth key, so the mirror's SSH
# push endpoint (sshd :22, forced git-shell only, tailnet-reachable via
# WireGuard) stays addressable across restarts. The key is still
# ephemeral (pulumi/tailscale), so a long-offline node is reclaimed and
# its next boot re-auths with the key.
[[mounts]]
source = "git_mirror"   # Fly volume names: [a-z0-9_] only, no hyphens
destination = "/volume"
