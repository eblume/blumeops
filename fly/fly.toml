app = "blumeops-proxy"
primary_region = "sjc"

[build]

[[vm]]
memory = "512mb"

[deploy]
strategy = "immediate"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "15s"
interval = "10s"
method = "GET"
path = "/healthz"
timeout = "5s"

# Expose Tailscale's WireGuard port so direct peer-to-peer connections can
# establish instead of falling back to DERP relay. Requires a dedicated IPv4.
[[services]]
internal_port = 41641
protocol = "udp"

[[services.ports]]
port = 41641

# --- Static forge mirror (fly/git-mirror/README.md, Part of eblume/blumeops#1208) ---
# Holds the pushed bare repos + generated stagit site under
# /volume/git-mirror. Sized for the seven allowlisted repos (~1 GB today)
# with headroom; created idempotently by `mise run fly-setup`. On
# machine replacement the volume reattaches and the post-start
# init (start.sh) recreates the site from the repos.
#
# The tailscale node key is also persisted here (/volume/tailscale,
# bind-mounted over /var/lib/tailscale in start.sh): with a durable node
# identity the fly node keeps its `flyio-proxy` MagicDNS name and CGNAT IP
# across restarts, which is what makes the mirror's SSH push endpoint
# (sshd :22, forced git-shell only, tailnet-reachable via WireGuard)
# addressable over a stable name. This retires the documented node-name
# drift — see [[manage-flyio-proxy#Tailscale Node Name Drift]].
[[mounts]]
source = "git-mirror"
destination = "/volume"
