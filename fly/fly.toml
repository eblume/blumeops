app = "blumeops-proxy"
primary_region = "sjc"

[build]

[[vm]]
memory = "512mb"

[deploy]
strategy = "immediate"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "15s"
interval = "10s"
method = "GET"
path = "/healthz"
timeout = "5s"

# Expose Tailscale's WireGuard port so direct peer-to-peer connections can
# establish instead of falling back to DERP relay. Requires a dedicated IPv4.
[[services]]
internal_port = 41641
protocol = "udp"

[[services.ports]]
port = 41641
