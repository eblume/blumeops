            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        # Share viewer asset lookups
        location = /api/search/metadata {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- API: unauthenticated server info the web app fetches on load ---
        location ~ ^/api/server/(ping|version-history|version|features|config|media-types)$ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Catch-all — deny by default: this host serves shared albums only.
        location / {
            return 403 "photos.eblu.me serves shared albums only — the app lives on the tailnet.\n";
        }
    }

    # --- eblu.me / www.eblu.me (apex landing — under construction) ---
    # Served straight from the edge (files baked into the image), NOT proxied
    # to indri like the other public sites. It's a single static splash, so
    # skipping the Tailscale/Caddy hop keeps the page up even when indri or the
    # tunnel is down — the right property for the front door. When this grows
    # into a real site, migrate it to a Caddy static vhost on indri (the
    # docs.eblu.me / cv.eblu.me pattern) and proxy it like the others.
    server {
        listen 8080;
        server_name eblu.me www.eblu.me;

        limit_req zone=general burst=20 nodelay;

        root /usr/share/nginx/html/landing;

        add_header X-Clacks-Overhead "GNU Terry Pratchett" always;

        location / {
            # Any path shows the splash while the site is under construction.
            try_files $uri /index.html;
        }
    }

    # Catch-all: reject unknown hosts, but serve health check
    server {
        listen 8080 default_server;

        location /healthz {
            return 200 "ok\n";
        }

        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }

        location / {
            return 444;
        }
    }
}
