worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # JSON access log for Alloy to tail → Loki + metric extraction
    log_format json_log escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"client_ip":"$http_fly_client_ip",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_cache_status":"$upstream_cache_status",'
            '"http_host":"$http_host",'
            '"http_user_agent":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/access.json.log json_log;

    # Rate limiting zones — define per-service zones as needed
    limit_req_zone $http_fly_client_ip zone=general:10m rate=10r/s;

    # Dumb-HTTP clone traffic: thousands of small requests per loose-
    # object fetch — looser than the general zone. (limit_req_zone must
    # live at the http level; the limit_req directive using it is inside
    # the /eblume/*.git location below, where it overrides the
    # server-level general limit.)
    limit_req_zone $http_fly_client_ip zone=mirror_git:10m rate=20r/s;

    # Photos-specific zones: a family group on one NAT scrolling share-page
    # thumbnails can clear tighter limits, so photos_general keeps the loose
    # 50r/s (burst=200 at the server). photos_auth guards
    # the shared-link password check (3r/s, burst=5).
    limit_req_zone $http_fly_client_ip zone=photos_general:10m rate=50r/s;
    limit_req_zone $http_fly_client_ip zone=photos_auth:10m rate=3r/s;

    # fail2ban deny list — banned IPs are written here by fail2ban and
    # checked via the $forge_banned variable. The file is touched at
    # container start to ensure it exists.
    geo $http_fly_client_ip $forge_banned {
        default 0;
        include /etc/nginx/forge-deny.conf;
    }

    # fail2ban deny list for the photos.eblu.me shared-link surface —
    # written by the photos-share jail (fly/fail2ban/jail.d/photos.conf).
    geo $http_fly_client_ip $photos_banned {
        default 0;
        include /etc/nginx/photos-deny.conf;
    }

    # Proxy cache: 200MB, evict after 24h of no access
    proxy_cache_path /tmp/cache levels=1:2 keys_zone=services:10m
                     max_size=200m inactive=24h;

    # WebSocket-aware Connection header. Only send "upgrade" when the client
    # actually requests a protocol switch; otherwise empty string to preserve
    # upstream keepalive connections.
    map $http_upgrade $connection_upgrade {
        default "";
        websocket upgrade;
    }

    # Declared AI crawlers — denied with a bare 403 at the edge, before the
    # Anubis proxy hop. Anubis already DENYs all of these (and remains the
    # wall for anything that spoofs a browser UA), but its deny page is
    # ~2.4 KB of HTML per request through a Go proxy round-trip. During the
    # 2026-06-11 surge these bots were ~88% of all requests (ClaudeBot
    # 524k/day, meta-externalagent 195k, GPTBot 148k, Amazonbot 16k) and
    # their rejection pages were >99% of remaining egress — enough to
    # saturate the shared-cpu-1x VM. See
    # docs/explanation/ai-scraper-mitigation.md, Tier 2c.
    # facebookexternalhit (link previews) is deliberately NOT listed; only
    # meta-externalagent (Meta's AI trainer).
    map $http_user_agent $deny_bot {
        default                  0;
        "~*meta-externalagent"   1;
        "~*GPTBot"               1;
        "~*ChatGPT-User"         1;
        "~*OAI-SearchBot"        1;
        "~*ClaudeBot"            1;
        "~*Claude-Web"           1;
        "~*anthropic-ai"         1;
        "~*Amazonbot"            1;
        "~*Bytespider"           1;
        "~*CCBot"                1;
        "~*PerplexityBot"        1;
        "~*SemrushBot"           1;
    }

    # --- Upstream ---
    # DNS resolved via Tailscale MagicDNS at config load.
    resolver 100.100.100.100 valid=30s;
    resolver_timeout 5s;

    # All services route through Caddy on indri. Indri's host-level Tailscale
    # can establish direct WireGuard peering, avoiding the DERP relay
    # bottleneck that k8s-hosted Tailscale Ingress pods cannot escape.
    # :8443 is Caddy's fly-only listener (fly_proxied services); the ACL
    # grants the fly node tcp:8443 to the flyio-origin tag only.
    upstream indri_backend {
        server indri.tail8d86e.ts.net:8443;
        keepalive 16;
    }

    # --- docs.eblu.me (static site) ---
    server {
        listen 8080;
        server_name docs.eblu.me;

        limit_req zone=general burst=20 nodelay;

        # Serve a friendly error page when upstreams are unreachable
        # (indri offline, Tailscale tunnel down, emergency shutoff, etc.)
        # proxy_cache_use_stale still takes priority when cached content exists.
        error_page 502 503 504 /error.html;
        location = /error.html {
            root /usr/share/nginx/html;
            internal;
        }
        location / {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name docs.ops.eblu.me;
            proxy_set_header Host docs.ops.eblu.me;
            proxy_intercept_errors on;

            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;

            # Cache aggressively — static site only.
            # Do NOT use these settings for dynamic services.
            proxy_cache services;
            proxy_cache_valid 200 1d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;

            # Prevent cache-busting: ignore query strings and
            # client cache-control headers.
            # Safe for static sites; breaks dynamic services.
            proxy_cache_key $host$uri;
            proxy_ignore_headers Cache-Control Set-Cookie;

            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Clacks-Overhead "GNU Terry Pratchett" always;
        }

    }

    # --- cv.eblu.me (static site) ---
    server {
        listen 8080;
        server_name cv.eblu.me;

        limit_req zone=general burst=20 nodelay;

        error_page 502 503 504 /error.html;
        location = /error.html {
            root /usr/share/nginx/html;
            internal;
        }

        location / {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name cv.ops.eblu.me;
            proxy_set_header Host cv.ops.eblu.me;
            proxy_intercept_errors on;

            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;

            proxy_cache services;
            proxy_cache_valid 200 1d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            proxy_cache_key $host$uri;
            proxy_ignore_headers Cache-Control Set-Cookie;

            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Clacks-Overhead "GNU Terry Pratchett" always;
        }
    }

    # --- forge.eblu.me (static forge mirror) ---
    # The public face of the exposed repos: stagit HTML + git dumb HTTP
    # served from the /volume mount, identical to the staging vhost below.
    # The old relay to the private forge (Anubis 8923 -> internal 8081 ->
    # indri Caddy) is retired here — every path the static site does not
    # serve 302s to forge.ops.eblu.me (see the mirror backend's
    # @mirror_fallback). The Anubis B proof-of-work gateway (127.0.0.1:8924,
    # COOKIE_DYNAMIC_DOMAIN) fronts the browse path; git/API clients hit the
    # /eblume/*.git location below and are never challenged. Part of
    # eblume/blumeops#1208 (the public/private split).
    server {
        listen 8080;
        server_name forge.eblu.me;

        # Block fail2ban-banned IPs (shared deny file with the staging vhost).
        if ($forge_banned) {
            return 403 "Temporarily blocked. Try again later.\n";
        }

        # Declared AI crawlers get a bare 403 before Anubis — see the
        # $deny_bot map above (ai-scraper-mitigation.md Tier 2c).
        if ($deny_bot) {
            return 403 "AI crawlers are not welcome here. robots.txt was ignored.\n";
        }

        # General rate limit — same zone as the staging mirror vhost.
        limit_req zone=general burst=50 nodelay;

        # Dumb-HTTP pack responses can be as large as the whole repo.
        client_max_body_size 512m;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        error_page 502 503 504 /error.html;
        location = /error.html {
            root /usr/share/nginx/html;
            internal;
        }

        location = /healthz {
            return 200 "ok\n";
        }

        # Serve robots.txt directly — keep the scraper stack on this host.
        # The whole mirror is Disallowed: we want git clients, not crawlers
        # indexing the browse HTML (the clone endpoint is dumb-HTTP git, not
        # a crawl target).
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Git dumb HTTP clone target — /eblume/<name>.git, one bare repo per
        # allowlisted entry, served statically straight from the volume (no
        # Anubis hop: git clients must not be challenged or redirected, and
        # dumb HTTP is byte-for-byte static). The .git suffix is what
        # separates clone URLs from stagit browse paths (/eblume/<name>/...).
        # This URL shape is the mirror's public contract — existing consumers
        # clone https://forge.eblu.me/eblume/<name>.git and it keeps working
        # byte-for-byte.
        location ~ ^/eblume/([^/]+\.git)/(.*)$ {
            # Dumb clones fetch loose objects one request at a time; a
            # location-level limit_req overrides the server-level one.
            limit_req zone=mirror_git burst=100 nodelay;

            alias /volume/git-mirror/repos/eblume/$1/$2;
        }

        # Browsers get one Anubis proof-of-work challenge, then a cookie;
        # git/API clients pass straight through (stock policy). Anubis B
        # (127.0.0.1:8924, start.sh) fronts the browse path; its
        # COOKIE_DYNAMIC_DOMAIN scopes the challenge cookie to this host.
        # Everything the static site does not serve (issues, PRs, releases,
        # archive, API, ...) 302s to forge.ops.eblu.me from the mirror
        # backend's @mirror_fallback.
        location / {
            proxy_pass http://127.0.0.1:8924;
            proxy_intercept_errors on;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            add_header X-Clacks-Overhead "GNU Terry Pratchett" always;
        }
    }

    # --- shower.eblu.me (tombstone) ---
    # The shower app is archived; the domain intentionally keeps resolving
    # so old QR codes and links land somewhere honest instead of a 404.
    # 410 Gone is the right status for "this existed and was deliberately
    # removed": crawlers and link-checkers stop retrying, and browsers
    # render the body.
    server {
        listen 8080;
        server_name shower.eblu.me;

        error_page 410 /tombstone.html;
        location = /tombstone.html {
            root /usr/share/nginx/html;
            internal;
        }

        location / {
            return 410;
        }
    }

    # --- photos.eblu.me (Immich shared-link family albums) ---
    # Only the Immich shared-link surface is public: album share pages,
    # the assets they fetch, and the session endpoints those pages call.
    # The app itself lives on the tailnet at photos.ops.eblu.me.
    # Everything else 403s at the edge with a pointer to the tailnet
    # host. Authorization is `?key=`/cookie, so nothing dynamic may be
    # cached — only the content-hashed SvelteKit bundle under /_app/ is.
    server {
        listen 8080;
        server_name photos.eblu.me;

        # Per-IP rate limit. photos_general (50r/s, burst=200): a family
        # group on one NAT scrolling the share page thumbnails can clear
        # tighter limits in a burst.
        limit_req zone=photos_general burst=200 nodelay;

        # Shared-link uploads when the link toggle allows; the per-link
        # toggle in Immich is the real gate.
        client_max_body_size 512m;

        # Security headers — the share page does not embed itself.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "same-origin" always;
        # GNU Terry Pratchett — keep the name moving.
        add_header X-Clacks-Overhead "GNU Terry Pratchett" always;

        error_page 502 503 504 /error.html;
        location = /error.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Block fail2ban-banned IPs
        if ($photos_banned) {
            return 403 "Temporarily blocked. Try again later.\n";
        }

        # Reject indexers — there's nothing here we want crawled.
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # --- Explicit 403s ---
        # Blocked even though the catch-all covers them, so intent is
        # legible: this is the shared-link surface only, and the app
        # lives on the tailnet.
        # Login
        location /auth/ {
            return 403 "photos.eblu.me serves shared albums only — the app lives on the tailnet.\n";
        }
        # Auth API
        location /api/auth/ {
            return 403 "photos.eblu.me serves shared albums only — the app lives on the tailnet.\n";
        }
        # OAuth
        location /api/oauth/ {
            return 403 "photos.eblu.me serves shared albums only — the app lives on the tailnet.\n";
        }
        # User API — the web app expects a non-200 for anonymous share
        # viewers; 403 is handled the same as 401.
        location /api/users {
            return 403 "photos.eblu.me serves shared albums only — the app lives on the tailnet.\n";
        }
        # Admin
        location /api/admin/ {
            return 403 "photos.eblu.me serves shared albums only — the app lives on the tailnet.\n";
        }
        location = /api/server/statistics {
            return 403 "photos.eblu.me serves shared albums only — the app lives on the tailnet.\n";
        }
        location = /api/api-keys {
            return 403 "photos.eblu.me serves shared albums only — the app lives on the tailnet.\n";
        }
        location /api/sessions {
            return 403 "photos.eblu.me serves shared albums only — the app lives on the tailnet.\n";
        }

        # --- Frontend (verified against immich v3.0.2 web routes) ---
        # NO proxy_cache on /api/, /share/, or /s/ — responses are
        # authorized by ?key=/cookie, so caching any of them would leak
        # one visitor's album to another. Only the content-hashed bundle
        # under /_app/ below is cached.
        # Share page
        location ~ ^/share/[^/]+$ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        # Share page, custom slug
        location ~ ^/s/[^/]+$ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        # SvelteKit bundle — cacheable: files are content-hashed, so a
        # deployed change lands at new URLs automatically.
        location /_app/ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_cache services;
            proxy_cache_valid 200 1d;
            proxy_cache_key $host$uri;
            proxy_ignore_headers Cache-Control Set-Cookie;
            # add_header is all-or-nothing per config level, so the five
            # server-level security headers must be repeated here or this
            # location's X-Cache-Status would suppress every one of them.
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Clacks-Overhead "GNU Terry Pratchett" always;
            add_header X-Cache-Status $upstream_cache_status;
        }
        # Remaining static assets — plain proxy, no cache: conservative,
        # they can change with server config.
        location = /custom.css {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        # Any favicon variant
        location ~* ^/favicon {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location = /apple-icon-180.png {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location = /manifest.json {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location ~ ^/manifest-icon-.*\.png$ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        # Root-level only — `.*` would also match slashes and let API paths
        # like /api/jobs_skeleton.png through to the backend.
        location ~ ^/[^/]*_skeleton\.png$ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location /.well-known/ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- API: shared-link session ---
        # Tighter rate limit — this is the shared-link password check.
        location = /api/shared-links/me {
            limit_req zone=photos_auth burst=5 nodelay;

            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location = /api/shared-links/login {
            limit_req zone=photos_auth burst=5 nodelay;

            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- API: content ---
        # Album metadata for album links (the /api/albums collection stays 403).
        location ~ ^/api/albums/[^/]+$ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        # Upload — stream the request body through (no disk buffering).
        location = /api/assets {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_request_buffering off;
        }
        # Transcoded video — stream responses.
        location ~ ^/api/assets/[^/]+/video/playback$ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
        }
        # HLS playlist + segments + DELETE session teardown — stream.
        location ~ ^/api/assets/[^/]+/video/stream/ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_buffering off;
        }
        # Asset detail, full-res, and grid thumbnails — the three asset
        # content routes the share page fetches. Video playback/streaming
        # match their own locations above; everything else under
        # /api/assets/ (jobs, random, sub-routes the share page never
        # calls) falls to the catch-all 403.
        location ~ ^/api/assets/[^/]+(?:/(?:thumbnail|original))?$ {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        # Share grid pager
        location = /api/timeline/buckets {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        location = /api/timeline/bucket {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $http_fly_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        # "Download all"
        location = /api/download/info {
            proxy_pass https://indri_backend$request_uri;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_ssl_name photos.ops.eblu.me;
            proxy_intercept_errors on;
            proxy_set_header Host photos.ops.eblu.me;
            proxy_set_header X-Real-IP $http_fly_client_ip;
