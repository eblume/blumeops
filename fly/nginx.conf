        # Catch-all — deny by default: this host serves shared albums only.
        location / {
            return 403 "photos.eblu.me serves shared albums only — the app lives on the tailnet.\n";
        }
    }

    # --- eblu.me / www.eblu.me (apex landing — under construction) ---
    # Served straight from the edge (files baked into the image), NOT proxied
    # to indri like the other public sites. It's a single static splash, so
    # skipping the Tailscale/Caddy hop keeps the page up even when indri or the
    # tunnel is down — the right property for the front door. When this grows
    # into a real site, migrate it to a Caddy static vhost on indri (the
    # docs.eblu.me / cv.eblu.me pattern) and proxy it like the others.
    server {
        listen 8080;
        server_name eblu.me www.eblu.me;

        limit_req zone=general burst=20 nodelay;

        root /usr/share/nginx/html/landing;

        add_header X-Clacks-Overhead "GNU Terry Pratchett" always;

        location / {
            # Any path shows the splash while the site is under construction.
            try_files $uri /index.html;
        }
    }

    # --- blumeops-proxy.fly.dev (static forge mirror — staging) ---
    # Read-only mirror of the allowlisted public repos, pushed from the
    # private forge (see fly/git-mirror/README.md): stagit HTML under
    # /volume/git-mirror/site + bare repos under /volume/git-mirror/repos
    # served over git dumb HTTP. This is the pre-cutover staging vhost on
    # the app's free hostname (Part of eblume/blumeops#1208); the
    # cutover PR makes forge.eblu.me serve this same root and deletes the
    # internal forge relay blocks.
    #
    # Serves from the Fly volume mount at /volume. The vhost is inert
    # until the volume is attached (fly-setup) and init has run
    # (start.sh post-start), until then the 302 catch-all is the only
    # meaningful behaviour.
    server {
        listen 8080;
        server_name blumeops-proxy.fly.dev;

        # Block fail2ban-banned IPs (shared with the forge vhost's deny file).
        if ($forge_banned) {
            return 403 "Temporarily blocked. Try again later.\n";
        }

        # Declared AI crawlers get a bare 403 before Anubis — see the
        # $deny_bot map above (ai-scraper-mitigation.md Tier 2c).
        if ($deny_bot) {
            return 403 "AI crawlers are not welcome here. robots.txt was ignored.\n";
        }

        # General rate limit — same zone as the public forge vhost.
        limit_req zone=general burst=50 nodelay;

        # Dumb-HTTP pack responses can be as large as the whole repo.
        client_max_body_size 512m;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        error_page 502 503 504 /error.html;
        location = /error.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Health check — Fly probes /healthz on the APP hostname
        # (blumeops-proxy.fly.dev), so this vhost must answer it too, not
        # only the default server.
        location = /healthz {
            return 200 "ok\n";
        }

        # Serve robots.txt directly — keep the scraper stack on this host.
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        # Git dumb HTTP clone target — /eblume/<name>.git, one bare repo
        # per allowlisted entry, served statically straight from the
        # volume (no Anubis hop: git clients must not be challenged or
        # redirected, and dumb HTTP is byte-for-byte static). The .git
        # suffix is what separates clone URLs from stagit browse paths
        # (/eblume/<name>/…). This URL shape is the mirror's public
        # contract — existing consumers clone
        # https://forge.eblu.me/eblume/<name>.git and must keep working
        # byte-for-byte through the cutover PR.
        # Dumb clones fetch loose objects one request at a time, so the
        # server-level general zone would cap a clone at ~10 objects/s;
        # clone traffic gets its own looser zone.
        limit_req zone=mirror_git burst=100 nodelay;

        location ~ ^/eblume/([^/]+\.git)/(.*)$ {
            alias /volume/git-mirror/repos/eblume/$1/$2;
        }

        # Browsers get one Anubis proof-of-work challenge, then a cookie;
        # git/API clients pass straight through (stock policy). Anubis B
        # (127.0.0.1:8924, start.sh) fronts the browse path; the
        # COOKIE_DYNAMIC_DOMAIN env scopes its challenge cookie to the
        # request's hostname, so the forge.eblu.me challenge stays
        # unaffected.
        location / {
            proxy_pass http://127.0.0.1:8924;
            proxy_intercept_errors on;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_fly_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            add_header X-Clacks-Overhead "GNU Terry Pratchett" always;
        }
    }

    # --- static mirror backend (internal) ---
    # Target of the mirror vhost's Anubis instance (8924 → 8925): requests
    # that pass the challenge land here, still carrying the original Host.
    # access_log off — the edge block already logs every client request;
    # logging here would double-count in the Loki-derived metrics.
    server {
        listen 127.0.0.1:8925;
        access_log off;

        client_max_body_size 512m;

        error_page 502 503 504 /error.html;
        location = /error.html {
            root /usr/share/nginx/html;
            internal;
        }

        # stagit static site — shared assets (style.css et al) at the
        # root, per-repo directories at <owner>/<name>/. try_files on an
        # exact existing file; the repo listing is index.html at the root.
        # (Dumb-HTTP clones never reach this host — they are served by
        # the edge vhost's /eblume/*.git location.)
        location / {
            root /volume/git-mirror/site;
            # $uri: a generated page (log.html, commit/…, file/…);
            # $uri/index.html: the site root and each repo dir (the
            # repo index is a symlink to log.html). Anything else —
            # /issues/, /pulls/, /api/, /user/… — is not on the static
            # site and falls through to the 302.
            try_files $uri $uri/index.html @mirror_fallback;
        }

        # 302 to the private forge: every path the static site does not
        # serve (issues, PRs, releases, API, login, …). Tailnet clients
        # reach the real thing at forge.ops.eblu.me; the public internet
        # dead-ends on the tailnet-only name — intended.
        location @mirror_fallback {
            return 302 https://forge.ops.eblu.me$request_uri;
        }
    }

    # Catch-all: reject unknown hosts, but serve health check
    server {
        listen 8080 default_server;

        location /healthz {
            return 200 "ok\n";
        }

        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }

        location / {
            return 444;
        }
    }
}
