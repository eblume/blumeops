[photos-share]
enabled  = true
filter   = photos-share
logpath  = /var/log/nginx/access.json.log
# maxretry 15 instead of 5: the anonymous /me probe on a password-
# protected link 401s once per visitor before the password form (immich
# v3.0.2, shared-link.service.ts), so a family on one NAT opening a new
# link within 10 min would consume a 5-retry budget. 15 keeps family
# visits safe; scripted brute force is still caught, and the 3r/s
# photos_auth nginx zone throttles the check rate regardless.
maxretry = 15
findtime = 600
bantime  = 3600
banaction = nginx-deny
# Per-service deny file (see action.d/nginx-deny.conf) — matches the
# $photos_banned geo in nginx.conf; keeps photos bans out of the
# forge deny list and vice versa.
nginx_deny_file = /etc/nginx/photos-deny.conf
