# Filter for Immich shared-link password failures via the nginx JSON
# access log. A wrong link key and a wrong link password both come
# back as 401 from Immich; 403 covers edge rejects on the same paths.

[Definition]

failregex = "client_ip":"<HOST>".*"request_uri":"\/api\/shared-links\/(login|me)[^"]*".*"status":(401|403)

ignoreregex =
