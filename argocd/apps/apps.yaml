# App-of-apps root Application
# Watches argocd/apps/ and creates/manages all Application resources
#
# Deliberately NOT automated, unlike the workload apps it manages. Two reasons:
# a new Application appearing in the cluster is the one change that earns a
# human's second look, and automated sync here would revert the
# `argocd app set <app> --revision <sha>` overrides that deploy-from-branch and
# the ArgoCD Deploy workflow both depend on.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.ops.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  # To pick up new apps: argocd app sync apps
