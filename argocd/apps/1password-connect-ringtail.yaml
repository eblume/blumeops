# 1Password Connect for ringtail k3s cluster
# Same manifests as indri, different destination
#
# Prerequisites:
# 1. Bootstrap secrets via ansible (provision-ringtail creates 1password namespace,
#    op-credentials and onepassword-token secrets)
# 2. Sync BEFORE external-secrets-ringtail
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 1password-connect-ringtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.ops.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/1password-connect
  destination:
    server: https://kubernetes.default.svc
    namespace: 1password
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
