# External Secrets Operator CRDs for ringtail k3s cluster
# Same CRDs source as indri, different destination
#
# Must be synced BEFORE external-secrets-ringtail operator app.
#
# Deliberately NOT automated, for the same reason as cloudnative-pg-ringtail:
# it tracks a mutable tag on a mirror rather than blumeops main, so "the
# revision moved" is not "a human merged a PR". CRD churn under an operator
# also wants a deliberate hand.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-crds-ringtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.ops.eblu.me:2222/mirrors/external-secrets.git
    targetRevision: helm-chart-2.2.0
    path: config/crds/bases
    directory:
      exclude: 'kustomization.yaml'
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
