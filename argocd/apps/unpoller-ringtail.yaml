# UnPoller on ringtail k3s.
#
# [[retire-minikube]] phase 1. Stateless; cutover is scale-down on
# minikube + sync here. Metrics flow via alloy-ringtail scrape →
# remote_write (no tailscale ingress — nothing routes to unpoller).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unpoller-ringtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/unpoller-ringtail
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      # This app renders config through a kustomize configMapGenerator, so
      # every content edit produces a new hash-suffixed ConfigMap. prune
      # deletes the superseded one; without it the app reads OutOfSync
      # forever and trips ArgoCDAppOutOfSync on a correct deploy.
      prune: true
    syncOptions:
      - CreateNamespace=true
