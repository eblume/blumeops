# Grafana configuration (ingress, dashboards, secrets) on ringtail k3s.
#
# [[retire-minikube]] phase 3. Synced at its cutover window (after the
# minikube PVC copy and tailscale ingress name release).
# Depends on: grafana-ringtail (for the Service to exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-config-ringtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/grafana-config-ringtail
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
