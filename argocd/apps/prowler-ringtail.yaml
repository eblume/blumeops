# Prowler on ringtail k3s.
#
# [[retire-minikube]] phase 1 (final service) — this also flips the scan
# target: prowler scans the cluster it runs in, so weekly CIS reports now
# cover ringtail instead of minikube. The mutelist was reworked for the
# k3s profile (2026-06), keeping only entries that match live k3s
# resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prowler-ringtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/prowler-ringtail
  destination:
    server: https://kubernetes.default.svc
    namespace: prowler
  # PSA exempt: hostPID + hostPath (the scanner itself reads the node it audits)
  syncPolicy:
    automated:
      # This app renders config through a kustomize configMapGenerator, so
      # every content edit produces a new hash-suffixed ConfigMap. prune
      # deletes the superseded one; without it the app reads OutOfSync
      # forever and trips ArgoCDAppOutOfSync on a correct deploy.
      prune: true
    syncOptions:
      - CreateNamespace=true
