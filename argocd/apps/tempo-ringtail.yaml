# Tempo on ringtail k3s.
#
# [[retire-minikube]] phase 3. Synced at its cutover window (after the
# minikube PVC copy and tailscale ingress name release).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo-ringtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.ops.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/tempo-ringtail
  destination:
    server: https://ringtail.tail8d86e.ts.net:6443
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
