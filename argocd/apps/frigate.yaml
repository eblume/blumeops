---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frigate
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/frigate
  destination:
    server: https://kubernetes.default.svc
    namespace: frigate
  syncPolicy:
    automated:
      # This app renders config through a kustomize configMapGenerator, so
      # every content edit produces a new hash-suffixed ConfigMap. prune
      # deletes the superseded one; without it the app reads OutOfSync
      # forever and trips ArgoCDAppOutOfSync on a correct deploy.
      prune: true
    syncOptions:
      - CreateNamespace=true
    # No pod-security labels: frigate is a documented PSA exception
    # (docs/reference/operations/security.md decision table) - the upstream
    # tensorrt image has an s6-overlay root entrypoint and no supported
    # non-root path, so warn/audit at restricted would only emit noise on
    # every sync. Revisit if upstream ships a non-root image.
    # The labels were stripped from the live namespace by a one-time sync
    # with `managedNamespaceMetadata: {labels: {}}` (2026-09-05). That block
    # is gone now: the API server drops the empty map on storage, so keeping
    # it left the apps Application permanently OutOfSync.
