# Homepage - Service Dashboard / Start Page
#
# Custom container built from gethomepage/homepage, kustomize manifests.
# Dashboard at go.ops.eblu.me / go.tail8d86e.ts.net
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/homepage
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      # This app renders config through a kustomize configMapGenerator, so
      # every content edit produces a new hash-suffixed ConfigMap. prune
      # deletes the superseded one; without it the app reads OutOfSync
      # forever and trips ArgoCDAppOutOfSync on a correct deploy.
      prune: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
