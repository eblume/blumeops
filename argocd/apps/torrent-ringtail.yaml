# torrent on ringtail k3s.
#
# [[retire-minikube]] phase 1. Staging deployment; the minikube app stays
# parked until cutover. All state is on the sifaka torrents NFS export —
# no data copy needed, only the ingress device-name handoff.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: torrent-ringtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/torrent-ringtail
  destination:
    server: https://kubernetes.default.svc
    namespace: torrent
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
