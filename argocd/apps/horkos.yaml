---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: horkos
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/horkos
  destination:
    server: https://kubernetes.default.svc
    namespace: horkos
  # MANUAL sync, deliberately (unlike the warrant app it replaces, whose
  # auto-sync also raced argocd-deploy dispatches — heph 01KZBPDB2WH9QK):
  # horkos is the approval gate for privileged runs, and the gate must not
  # redeploy itself from a merge alone. Deploying it = merge the release
  # pin PR, then `argocd app sync horkos` — two human acts.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
