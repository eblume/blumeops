# CloudNativePG Operator for ringtail k3s cluster
# Deploys the operator only; PostgreSQL clusters are created separately.
# (The minikube sibling app was removed with the indri-k8s decommission.)
#
# Deliberately NOT automated. Automated sync is safe on the blumeops apps
# because "the revision moved" there means "a human merged a PR"; this app
# tracks a mutable tag on a mirror, where a re-mirrored or force-moved upstream
# tag would deploy itself with no review. Sync operator upgrades by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-ringtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.ops.eblu.me:2222/mirrors/cloudnative-pg.git
    targetRevision: v1.29.1
    path: releases
    directory:
      include: 'cnpg-1.29.1.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Required for large CRDs that exceed annotation size limit
