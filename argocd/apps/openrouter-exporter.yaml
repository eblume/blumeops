# OpenRouter exporter on ringtail k3s.
#
# Stateless. Metrics flow via alloy-ringtail scrape → remote_write.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openrouter-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.ops.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/openrouter-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: openrouter-exporter
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
