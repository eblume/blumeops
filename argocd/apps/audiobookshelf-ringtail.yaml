# Audiobookshelf on ringtail k3s; serves the Audiobooks/ subtree of the sifaka music share (eblume/blumeops#1120).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: audiobookshelf-ringtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/audiobookshelf-ringtail
  destination:
    server: https://kubernetes.default.svc
    namespace: audiobookshelf
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
