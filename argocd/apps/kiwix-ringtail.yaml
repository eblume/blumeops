# kiwix on ringtail k3s.
#
# [[retire-minikube]] phase 1. All state is on the sifaka torrents NFS
# export — no data copy was needed, only the ingress device-name handoff.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiwix-ringtail
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://forgejo@forge.eblu.me:2222/eblume/blumeops.git
    targetRevision: main
    path: argocd/manifests/kiwix-ringtail
  destination:
    server: https://kubernetes.default.svc
    namespace: kiwix
  syncPolicy:
    automated:
      # This app renders config through a kustomize configMapGenerator, so
      # every content edit produces a new hash-suffixed ConfigMap. prune
      # deletes the superseded one; without it the app reads OutOfSync
      # forever and trips ArgoCDAppOutOfSync on a correct deploy.
      prune: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/audit: restricted
  # Ignore zim-hash annotation - updated dynamically by zim-watcher CronJob
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /metadata/annotations/kiwix.blumeops~1zim-hash
