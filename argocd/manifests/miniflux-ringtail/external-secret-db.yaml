# ExternalSecret rendering miniflux's DATABASE_URL against the ringtail
# blumeops-pg ([[retire-minikube]] phase 1). Replaces the hand-created
# miniflux-db secret on minikube. The password is alphanumeric-only
# (no URL-encoding hazards in the templated URL).
#
# 1Password item: "Miniflux DB" in blumeops vault
# Field: "db_password"
#
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-db
  namespace: miniflux
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: miniflux-db
    creationPolicy: Owner
    template:
      data:
        url: "postgres://miniflux:{{ .password }}@blumeops-pg-rw.databases.svc.cluster.local/miniflux?sslmode=disable"
  data:
  - secretKey: password
    remoteRef:
      key: Miniflux DB
      property: db_password
