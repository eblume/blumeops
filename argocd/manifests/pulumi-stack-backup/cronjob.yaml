# Daily `pulumi stack export --show-secrets` for the two Pulumi Cloud stacks,
# exported into the PVC. Stack config is not exported: its secrets come from
# Pulumi ESC (1Password-backed) and the rest is in git. The k8s CronJob
# schedule runs in the cluster's local time (ringtail = America/Los_Angeles)
# and borgmatic on indri ferries the newest export per stack at 02:00 in the
# same (indri-local, also Pacific) time, so 01:10 lands 50 min before the
# ferry. The access token arrives as an env var (ExternalSecret, refreshed
# hourly; the token rotates every 20 days — its expiry is 30 days — which
# stays out of this job);
# PULUMI_CREDENTIALS_PATH is an emptyDir so no token ever touches the PVC.
# The exports contain plaintext secret values (Tailscale auth keys): the borg repository encryption is the only compensating control.
# See docs/how-to/pulumi/restore-pulumi-state.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pulumi-stack-backup
  namespace: pulumi-stack-backup
spec:
  schedule: "10 1 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 1209600 # Auto-delete after 14 days
      template:
        metadata:
          labels:
            # Selected by the borgmatic ferry (label_selector: app=pulumi-stack-backup)
            app: pulumi-stack-backup
        spec:
          securityContext:
            runAsNonRoot: true
            # The export container runs as uid 65534 (nobody, see image User).
            # The local-path PV root is created root-owned; fsGroup makes the
            # mount group-writable so nobody can write the exports.
            fsGroup: 65534
            # Avoids re-chgrp'ing the whole PVC on every mount (talos does the
            # same).
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: export
              image: registry.ops.eblu.me/blumeops/pulumi-stack-backup:kustomized
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: PULUMI_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: pulumi-access-token
                      key: token
                - name: PULUMI_CREDENTIALS_PATH
                  value: /var/empty
                - name: PULUMI_CONFIG_PASSPHRASE
                  value: ""
                - name: PULUMI_SKIP_UPDATE_CHECK
                  value: "1"
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail

                  [[ -n "${PULUMI_ACCESS_TOKEN:-}" ]] || {
                    echo "pulumi-stack-backup: PULUMI_ACCESS_TOKEN missing" >&2
                    exit 1
                  }

                  export PULUMI_ORGANIZATION=eblume

                  ts=$(date -u +%Y%m%dT%H%M%SZ)
                  # `pulumi stack export` runs with no project in the working
                  # dir, so --stack must be fully qualified: org/project/stack.
                  for qstack in eblume/blumeops-tailnet/tail8d86e eblume/blumeops-dns/eblu-me; do
                    stack=${qstack##*/}
                    dir=/exports/${stack}
                    mkdir -p "$dir"
                    # Clear any .partial left by a crashed run (never matches
                    # the ferry globs, but shouldn't accumulate on the PVC).
                    rm -f "$dir"/*.partial

                    # Write to .partial and mv into place on success: an
                    # interrupted export would otherwise leave a partial file
                    # that the ferry (which only checks non-empty) would ship.
                    f="$dir/stack_${ts}.json"
                    pulumi stack export --show-secrets --file "$f.partial" --stack "$qstack"
                    [[ -s "$f.partial" ]] || { echo "empty export $f" >&2; exit 1; }
                    mv -f "$f.partial" "$f"

                    # Bounds the PVC. Coreutils only — the image has no grep.
                    # (Also sweeps the config_* files earlier runs wrote.)
                    shopt -s nullglob
                    rm -f "$dir"/config_*
                    files=( "$dir"/stack_* )
                    if (( ${#files[@]} > 1000 )); then
                      printf '%s\n' "${files[@]}" | sort | \
                        head -n $(( ${#files[@]} - 1000 )) | \
                        while IFS= read -r old; do rm -f "$old"; done
                    fi
                    shopt -u nullglob
                    echo "exported $stack -> $dir (ts=$ts)"
                  done
              volumeMounts:
                - name: exports
                  mountPath: /exports
                - name: scratch
                  mountPath: /var/empty
          volumes:
            - name: exports
              persistentVolumeClaim:
                claimName: pulumi-stack-backup
            - name: scratch
              emptyDir: {}
          restartPolicy: OnFailure
