# ArgoCD repo-creds template for the `forge.eblu.me` spelling of the forge.
#
# Same host, same SSH key, same host key as `repo-creds-forge` — only the
# hostname in the URL differs. Applications tracking eblume/blumeops name the
# forge `forge.eblu.me` so that ArgoCD's git webhook can match them: the
# webhook builds its match regex from the push payload's
# `repository.html_url`, which Forgejo derives from ROOT_URL
# (https://forge.eblu.me/), and compares it literally against
# `spec.source.repoURL`. See docs/reference/services/argocd.md.
#
# Inside the cluster that name resolves to indri over the tailnet via the
# CoreDNS rewrite shipped in nixos/ringtail/configuration.nix, so the git
# connection is the same tailnet SSH session as before — it never reaches the
# public Fly proxy.
#
# `repo-creds-forge` is deliberately kept alongside this: the mirrors/* repos
# (cloudnative-pg, external-secrets) still use the forge.ops.eblu.me spelling,
# and ArgoCD picks credentials by longest matching URL prefix.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-creds-forge-alias
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: repo-creds-forge-alias
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: "ssh://forgejo@forge.eblu.me:2222/"
        insecure: "false"
        sshPrivateKey: "{{ .privateKey }}"
        sshKnownHosts: "[forge.eblu.me]:2222 ssh-rsa "
  data:
  - secretKey: privateKey
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: argocd-forge-ssh-key
      metadataPolicy: None
      property: private-key-openssh
