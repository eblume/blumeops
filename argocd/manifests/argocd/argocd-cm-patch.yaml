# ArgoCD ConfigMap patch
#
# - workflow-bot: service account for CI/CD automation
# - ci-argocd: replacement for workflow-bot (rename in flight, blumeops#1163)
# - agents-readonly: read-only inspection account for agent pods (talos)
# - talos-argocd-readonly: replacement for agents-readonly (rename in flight, blumeops#1163)
# - OIDC: Authentik SSO for admin login
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: https://argocd.ops.eblu.me
  # workflow-bot: service account for CI/CD automation
  # - apiKey: allows generating API tokens via `argocd account generate-token`
  accounts.workflow-bot: apiKey
  # ci-argocd: same CI/CD automation role as workflow-bot (rename in flight,
  # blumeops#1163); identical scope in argocd-rbac-cm-patch.yaml. Old account
  # stays until consumers cut over and the cleanup leg deletes it.
  accounts.ci-argocd: apiKey
  # agents-readonly: lets talos agent pods inspect deployment state
  # (app get/diff/health) without a human account. apiKey only — no UI
  # login. Token lives in the *agents* 1Password vault; the pod reads it
  # at runtime via its op service account, so it is never staged in etcd.
  # RBAC scope (read-only, no sync) in argocd-rbac-cm-patch.yaml.
  # Heph 01M0HAQ40Y8P3TYZ5958PVQQ6J.
  accounts.agents-readonly: apiKey
  # talos-argocd-readonly: same read-only pod inspection role as
  # agents-readonly (rename in flight, blumeops#1163); identical scope in
  # argocd-rbac-cm-patch.yaml. Old account stays until the cleanup leg.
  accounts.talos-argocd-readonly: apiKey
  oidc.config: |
    name: Authentik
    issuer: https://authentik.ops.eblu.me/application/o/argocd/
    clientID: argocd
    requestedScopes:
      - openid
      - profile
      - email
