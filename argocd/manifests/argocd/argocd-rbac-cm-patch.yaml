# ArgoCD RBAC ConfigMap patch
#
# - workflow-bot: minimal CI/CD permissions (sync, get, update; project reads)
# - agents-readonly: read-only inspection for agent pods (get only, no sync)
# - admins: Authentik admins group mapped to ArgoCD admin role
# - admin: local break-glass account — keeps ArgoCD admin rights for when
#   Authentik SSO is unavailable (without this it has no permissions, since
#   policy.default is unset)
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
data:
  scopes: '[groups]'
  policy.csv: |
    p, role:workflow-bot, applications, sync, *, allow
    p, role:workflow-bot, applications, get, *, allow
    # update: lets the argocd-deploy workflow run `app set --revision <sha>`
    # ([[warrant-approval-gated-runs]] Phase 1) — branch/SHA deploys and
    # main-resets are the whole point of that privileged workflow.
    p, role:workflow-bot, applications, update, *, allow
    # projects/get: `argocd app get` resolves the app's project before it
    # answers, so without this the argocd-deploy workflow's closing "Report
    # application state" step — its audit record — is denied. Scoped `*`
    # rather than `default` so a new project cannot silently reopen that
    # hole; reading project metadata grants nothing on its own.
    #
    # THIS GRANT HAS A VERSION FLOOR. Under CVE-2025-55190 (CVSS 10.0) this
    # exact permission leaked repository and cluster credentials — here, the
    # forge SSH private key in `repo-creds-forge` — through
    # /api/v1/projects/{project}/detailed, which returned them unsanitized.
    # Fixed in 3.1.2 / 3.0.14 / 2.14.16 / 2.13.9; we pin v3.3.12. Scoping to
    # `default` would not have helped: the leak was in the project every
    # application already uses. Do not roll ArgoCD back below 3.1.2 while
    # this line exists.
    p, role:workflow-bot, projects, get, *, allow
    g, workflow-bot, role:workflow-bot
    # agents-readonly: the talos pods' read surface (heph 01M0HAQ4…) — a
    # deliberately different trust profile from workflow-bot: agents may
    # *look*, never mutate. applications/get covers app state, health,
    # resource tree, live manifests and diffs; ArgoCD masks Secret data
    # values server-side (`++++++++`) in all of those, so the 1Password-
    # sourced Secrets that external-secrets materializes are not readable
    # through this grant. What is deliberately ABSENT: sync/update/delete/
    # action/override (no mutation), logs (its own RBAC resource since 3.0,
    # and pod logs can carry secrets), exec, repositories/clusters/
    # certificates. projects/get is required for `argocd app get` to
    # resolve the app's project, and shares the CVE-2025-55190 version
    # floor documented above — do not roll below 3.1.2 while it exists.
    p, role:agents-readonly, applications, get, *, allow
    p, role:agents-readonly, projects, get, *, allow
    g, agents-readonly, role:agents-readonly
    g, admins, role:admin
    g, admin, role:admin
