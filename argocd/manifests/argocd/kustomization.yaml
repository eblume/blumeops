apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # Pin to specific version for intentional upgrades
  # ArgoCD v3.5.6
  - https://raw.githubusercontent.com/argoproj/argo-cd/c2b1e3017e2cec86b122172e861dcd026453ae44/manifests/install.yaml
  - ingress-tailscale.yaml
  - external-secret-repo-forge.yaml
  - external-secret-webhook.yaml

patches:
  - path: argocd-cmd-params-cm.yaml
  - path: argocd-ssh-known-hosts-cm.yaml
  - path: argocd-cm-patch.yaml
  - path: argocd-rbac-cm-patch.yaml
  - path: argocd-resources-patch.yaml
  - path: argocd-security-patch.yaml
