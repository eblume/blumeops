# Shared signing secret for the Forgejo -> ArgoCD push webhook.
#
# Forgejo signs every delivery with hex HMAC-SHA256 over the body and sends it
# as X-Gogs-Signature (alongside X-Gitea-*, X-Forgejo-* and X-Hub-* copies of
# the same digest). ArgoCD checks the Gogs headers BEFORE the GitHub ones —
# upstream's own comment says "Gogs needs to be checked before GitHub since it
# carries both Gogs and (incompatible) GitHub headers" — so a Forgejo hook is
# verified against `webhook.gogs.secret`, not `webhook.github.secret`.
#
# creationPolicy: Merge, NOT Owner. `argocd-secret` is ArgoCD's own store for
# server.secretkey, admin.password and the account API tokens; owning it here
# would hand those keys to external-secrets and wipe them. Merge patches in
# just the one key and leaves the rest to ArgoCD. The Application syncs with
# ServerSideApply=true, so the added key survives reconciliation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      data:
        webhook.gogs.secret: "{{ .gogsSecret }}"
  data:
  - secretKey: gogsSecret
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: argocd-webhook-secret
      metadataPolicy: None
      property: gogs-secret
