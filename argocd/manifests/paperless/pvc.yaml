# PersistentVolumeClaim for Paperless document library
# Binds to the NFS PV for sifaka:/volume1/paperless
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: paperless-media-nfs-pv
  resources:
    requests:
      storage: 500Gi
