apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  namespace: monitoring
  labels:
    app: unpoller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unpoller
  template:
    metadata:
      labels:
        app: unpoller
    spec:
      containers:
        - name: unpoller
          image: registry.ops.eblu.me/blumeops/unpoller:kustomized
          ports:
            - containerPort: 9130
              name: metrics
          env:
            - name: UP_UNIFI_DEFAULT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unpoller-unifi
                  key: api-key
          volumeMounts:
            - name: config
              mountPath: /etc/unpoller
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: unpoller-config
