---
# Human-door secrets ([[warrant-approval-gated-runs]] v0.2a): the warrant
# OIDC client secret (shared with authentik via the same vault item) and
# the session-signing key. Note what is NOT here: no dispatch credential,
# no vault tokens — v0.2a authenticates humans, it grants nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warrant-oidc
  namespace: warrant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: warrant-oidc
    creationPolicy: Owner
  data:
    - secretKey: WARRANT_HUMAN_CLIENT_SECRET
      remoteRef:
        key: "Authentik (blumeops)"
        property: warrant-client-secret
    - secretKey: WARRANT_SESSION_KEY
      remoteRef:
        key: "Authentik (blumeops)"
        property: warrant-session-key
