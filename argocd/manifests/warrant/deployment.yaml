---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warrant
  namespace: warrant
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC (SQLite)
  selector:
    matchLabels:
      app: warrant
  template:
    metadata:
      labels:
        app: warrant
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1500
      containers:
        - name: warrant
          image: registry.ops.eblu.me/blumeops/warrant:kustomized
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WARRANT_DB
              value: /data/warrant.db
          securityContext:
            runAsNonRoot: true
            runAsUser: 1500
            runAsGroup: 1500
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: warrant-data
        - name: tmp
          emptyDir: {}
