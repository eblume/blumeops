---
# The dispatch credential (v0.3.0): warrant-bot's write:repository PAT,
# minted by `mise run warrant-bot-provision`. Present in the pod but inert
# until WARRANT_DISPATCH_ENABLED=1 — deploying the capability and arming it
# are separate decisions.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warrant-dispatch
  namespace: warrant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: warrant-dispatch
    creationPolicy: Owner
  data:
    - secretKey: WARRANT_DISPATCH_TOKEN
      remoteRef:
        key: warrant-dispatch-token
        property: token
