---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: warrant-tailscale
  namespace: warrant
  annotations:
    tailscale.com/proxy-class: "default"
    tailscale.com/proxy-group: "ingress"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Warrant"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "mdi-file-sign"
    gethomepage.dev/description: "Privileged-run approval queue"
    gethomepage.dev/href: "https://warrant.ops.eblu.me"
    gethomepage.dev/pod-selector: "app=warrant"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: warrant
      port:
        number: 80
  tls:
    - hosts:
        - warrant
