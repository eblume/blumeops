# Reviewed against v12.8.2 defaults (2026-04-20)
log:
  level: info

runner:
  capacity: 2
  timeout: 3h
  shutdown_timeout: 3h
  # Env vars injected into all job containers
  envs:
    DOCKER_HOST: tcp://127.0.0.1:2375
    TZ: America/Los_Angeles

container:
  network: "host"
  # Connect to DinD sidecar via TCP (not socket)
  docker_host: tcp://127.0.0.1:2375

server:
  connections:
    forgejo:
      url: https://forge.ops.eblu.me/
      uuid: ${FORGEJO_RUNNER_UUID}
      token: ${FORGEJO_RUNNER_TOKEN}
      labels:
        - k8s:docker://registry.ops.eblu.me/blumeops/runner-job-image:v0.20.6-9b6be09
