apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - statefulset.yaml
  - service.yaml
  - ingress-tailscale.yaml
  - ingress-tailscale-otlp.yaml

images:
  - name: grafana/tempo
    newName: registry.ops.eblu.me/blumeops/tempo
    newTag: "v3.0.3-417e15a-nix"

configMapGenerator:
  - name: tempo-config
    files:
      - tempo.yaml
