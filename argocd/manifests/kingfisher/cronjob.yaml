---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kingfisher
  namespace: kingfisher
spec:
  schedule: "0 4 * * 0"  # Sunday 4am (after Prowler k8s scan at 3am)
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800  # Auto-delete after 7 days
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kingfisher
              image: registry.ops.eblu.me/blumeops/kingfisher:kustomized
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -e
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  OUTDIR=/reports/kingfisher
                  mkdir -p "$OUTDIR"

                  # Exit codes: 0=clean, 200=findings, 205=validated findings.
                  # All are successful scans; only other codes are real errors.
                  rc=0
                  kingfisher scan gitea \
                    --api-url https://forge.ops.eblu.me/api/v1/ \
                    --clone-url-base https://forge.ops.eblu.me/ \
                    --user eblume \
                    --repo-type all \
                    --no-update-check \
                    --tls-mode lax \
                    --allow-internal-ips \
                    --format html \
                    --output "$OUTDIR/scan-${STAMP}.html" \
                  || rc=$?

                  if [ "$rc" -eq 0 ] || [ "$rc" -eq 200 ] || [ "$rc" -eq 205 ]; then
                    exit 0
                  fi
                  exit "$rc"
              env:
                - name: KF_GITEA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: kingfisher-forgejo-token
                      key: KF_GITEA_TOKEN
              volumeMounts:
                - name: reports
                  mountPath: /reports
              resources:
                requests:
                  memory: 256Mi
                  cpu: 100m
                limits:
                  memory: 1Gi
          restartPolicy: OnFailure
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: kingfisher-reports
