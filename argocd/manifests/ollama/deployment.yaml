---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  # Scaled to zero by default: the service shares the RTX 4080 with gaming,
  # so it is an on-demand workload. The 12GB UD-IQ3_S quant of Qwen3.8-27B
  # runs fully GPU-resident at 128K context (q4_0 KV, ~36 tok/s decode);
  # the official ~18GB quant does not fit - eblume/talos#64. Scale up for
  # an evaluation window with `mise run ollama-up` (human task), down with
  # `mise run ollama-down`. The 24Gi memory limit stays generous: with
  # mmap + full GPU residency, the 32GB host RAM is the real hazard.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: nvidia
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: ollama/ollama:kustomized
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: "q4_0"
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "24Gi"
              cpu: "4000m"
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: model-sync
          image: ollama/ollama:kustomized
          command: ["/bin/bash", "/scripts/sync-models.sh"]
          env:
            - name: MODEL_LIST
              value: /config/models.txt
            - name: OLLAMA_HOST
              value: "http://localhost:11434"
          volumeMounts:
            - name: models-config
              mountPath: /config
            - name: sync-script
              mountPath: /scripts
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
        - name: models-config
          configMap:
            name: ollama-models
        - name: sync-script
          configMap:
            name: ollama-sync-script
            defaultMode: 0755
