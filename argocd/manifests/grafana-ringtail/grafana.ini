[analytics]
check_for_updates = false
reporting_enabled = false

# Machine read-access for agents ([[warrant-approval-gated-runs]] /
# heph 01KXREAB): the agents-m2m JWT (verified 2026-08-03, groups claim
# requires scope="openid profile") grants Viewer via auth.jwt —
# generic_oauth below is browser-interactive and can't serve machines.
# Consumers send the token in the X-JWT-Assertion header; the Grafana
# account materializes on first call via auto_sign_up.
[auth.jwt]
enabled = true
header_name = X-JWT-Assertion
jwk_set_url = https://authentik.ops.eblu.me/application/o/agents-m2m/jwks/
expect_claims = {"iss": "https://authentik.ops.eblu.me/application/o/agents-m2m/"}
username_claim = preferred_username
email_claim = email
auto_sign_up = true
role_attribute_path = contains(groups[*], 'agents-sa') && 'Viewer' || 'None'

[auth.generic_oauth]
allow_sign_up = true
api_url = https://authentik.ops.eblu.me/application/o/userinfo/
auth_url = https://authentik.ops.eblu.me/application/o/authorize/
auto_login = false
client_id = grafana
client_secret = $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
enabled = true
name = Authentik
role_attribute_path = contains(groups[*], 'admins') && 'Admin' || 'Viewer'
skip_org_role_sync = false
scopes = openid profile email
token_url = https://authentik.ops.eblu.me/application/o/token/

[log]
mode = console

[paths]
data = /var/lib/grafana/
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[security]
allow_embedding = false

[server]
root_url = https://grafana.ops.eblu.me

[unified_alerting]
enabled = true
evaluation_timeout = 30s
min_interval = 10s
