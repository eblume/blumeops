  - orgId: 1
    name: flyio-proxy-health
    folder: Infrastructure Alerts
    interval: 30s
    rules:
      - uid: flyio-upstream-unreachable
        title: FlyioUpstreamUnreachable
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            Fly.io proxy returning elevated 502s — upstream DNS may be stale. Run: mise run fly-reload
          runbook_url: https://docs.eblu.me/how-to/operations/manage-flyio-proxy
        labels:
          severity: warning
          service: flyio-proxy
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                sum(rate(flyio_nginx_http_requests_total{instance="flyio-proxy",status="502"}[5m]))
                / sum(rate(flyio_nginx_http_requests_total{instance="flyio-proxy"}[5m]))
                > 0.5
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
              refId: C

  # Log shipping end-to-end: alloy on indri tails LaunchAgent log files and
  # pushes them to Loki, and the failure mode seen in practice is total
  # silence — a stream stops arriving and nothing notices (the forge's own
  # log was absent for two months before anyone looked). Each rule asks Loki
  # for one stream's line count over a window sized to that stream's
  # guaranteed traffic. A stream with no lines returns no series at all, so
  # detection rides on noDataState: Alerting, and the summaries are static
  # text — a NoData instance carries no query labels to template with. One
  # rule per stream, because NoData is rule-level: folding the streams into
  # one query would let any single live stream mask the silence of the rest.
  #
  # Only streams with guaranteed daily traffic are watched. Host inspection
  # of the declared-but-unwatched files shows they either write nothing
  # anymore (alloy.out, borgmatic.out, forgejo-runner.out, forgejo.err) or
  # too sparsely to distinguish "quiet day" from "broken" without a window
  # so wide the alert stops being useful (jellyfin.{out,err}, alloy.err,
  # borgmatic.err). borgmatic freshness has BorgmaticStale. One exception:
  # zot.err is actively written and its lines do not reach Loki — a broken
  # tail under investigation (heph 01KZKPRWGHH301688YP32Z7BC0); add a rule
  # for it once it ships. If alloy itself dies, all four rules go NoData
  # together — that pattern is the "alloy is down" signature, and the
  # runbook leads with it.
  - orgId: 1
    name: log-shipping
    folder: Infrastructure Alerts
    interval: 300s
    rules:
      - uid: log-silent-forgejo
        title: LogStreamSilentForgejo
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No lines from indri's forgejo log (mcquack.forgejo.out.log)
            reached Loki in 24h. The forge logs every request, so shipping
            is broken: alloy tail, Loki push, or ingest.
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-log-stream-silent
        labels:
          severity: warning
          service: forgejo
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: >-
                sum(count_over_time({host="indri", service="forgejo", stream="stdout"}[24h]))
              queryType: range
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

      - uid: log-silent-forgejo-runner
        title: LogStreamSilentForgejoRunner
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No lines from indri's forgejo-runner log
            (mcquack.forgejo-runner.err.log) reached Loki in 48h. The runner
            logs every CI job to stderr and scheduled workflows run daily, so
            either CI is not running or its log is not shipping.
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-log-stream-silent
        labels:
          severity: warning
          service: forgejo-runner
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: >-
                sum(count_over_time({host="indri", service="forgejo-runner", stream="stderr"}[48h]))
              queryType: range
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

      - uid: log-silent-zot
        title: LogStreamSilentZot
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No lines from indri's zot log (mcquack.zot.out.log) reached Loki
            in 24h. The registry logs steadily (pull-through cache + CI
            traffic), so shipping is broken.
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-log-stream-silent
        labels:
          severity: warning
          service: zot
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: >-
                sum(count_over_time({host="indri", service="zot", stream="stdout"}[24h]))
              queryType: range
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

      - uid: log-silent-tailscaled
        title: LogStreamSilentTailscaled
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No lines from indri's tailscaled log
            (/opt/homebrew/var/log/tailscaled.log) reached Loki in 24h.
            tailscaled logs constantly, so shipping is broken.
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-log-stream-silent
        labels:
          severity: warning
          service: tailscale
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: >-
                sum(count_over_time({host="indri", service="tailscale"}[24h]))
              queryType: range
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: talos-workspaces
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: talos-worktree-dangling
        title: TalosWorktreeDangling
        condition: C
        # Fires when a dangling worktree registration persists past a boot
        # interval. noDataState: OK — a missing series means the talos pod is
        # not exporting (covered by the pod-health group); only a positive
        # value is the signal.
        for: 1h
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            {{ index $labels "repo" }} has dangling worktree registrations in the talos pod pool clone
        labels:
          severity: warning
          service: talos
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                sum by (repo) (talos_pool_worktree_registrations_dangling)
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
              refId: C

      - uid: talos-pool-unhealthy
        title: TalosPoolUnhealthy
        condition: C
        # Fires when a pool clone stays flagged unhealthy. source="fetch"
        # means a runtime fetch classified corrupt — restart the pod to run
        # boot repair; source="repair" means the boot repair itself left the
        # clone unclean — a restart will not fix it. noDataState: OK — a
        # missing series means the talos pod is not exporting (covered by the
        # pod-health group); only a positive value is the signal.
        for: 10m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            {{ index $labels "repo" }} pool clone is flagged unhealthy in the talos pod (source="fetch": runtime corrupt fetch — restart the pod to run boot repair; source="repair": boot repair left the clone unclean — a restart will not fix it)
        labels:
          severity: warning
          service: talos
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                max by (repo) (talos_pool_unhealthy)
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
              refId: C

      - uid: talos-store-watermark
        title: TalosStoreWatermark
        condition: C
        # Fires when store + /tmp usage stays above 85% of the pod's
        # ephemeral-storage limit. The hourly sweep's watermark gc is the
        # active bound; this catches a sustained overrun (e.g. something
        # other than store growth filling the layer) before the kubelet
        # evicts the pod. noDataState: OK — a missing series means the
        # talos pod is not exporting (covered by the pod-health group).
        for: 30m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            talos pod ephemeral storage (store + /tmp) above 85% of its limit for 30m
        labels:
          severity: warning
          service: talos
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                talos_store_bytes + talos_tmp_bytes - 0.85 * talos_ephemeral_limit_bytes
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: authentik-blueprints
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: authentik-blueprint-error
        title: AuthentikBlueprintError
        condition: C
        # Recency-based on purpose: authentik's hourly clear_failed_blueprints
        # task *deletes* failing instances and discovery re-creates them, so
        # status != "successful" for 30m could reset every hour and never
        # fire. The 75m window bridges that hourly delete/re-create cycle
        # without stacking on the exporter's own 2h error-carry (the exporter
        # keys on path, since pk and name change on every re-create), so this
        # asks "was this path in error within the last 75m". noDataState OK:
        # a path that never errors emits no series.
        # The 4500s query range must cover the 75m max_over_time window.
        for: 10m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            authentik blueprint {{ index $labels "path" }} is in error state
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-authentik-blueprint
        labels:
          severity: warning
          service: authentik
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 4500
              to: 0
            model:
              expr: >-
                max by (path) (max_over_time(authentik_blueprint_status{status="error"}[75m]))
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
              refId: C
      - uid: authentik-blueprint-collector-down
        title: AuthentikBlueprintCollectorDown
        condition: C
        # A missing series (pod down, scrape failing) is itself a failure, so
        # noDataState is Alerting; for: 10m bounds the pre-first-poll window
        # at deploy. A 200 with an *empty* list also reports up = 0, not a
        # healthy zero — that is what a token whose RBAC role never bound
        # returns (list endpoints filter by object permission), so this rule
        # catches a dead permission too.
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            authentik blueprint exporter is down or its last poll failed
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-authentik-blueprint
        labels:
          severity: warning
          service: authentik
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                authentik_blueprint_collector_up
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C
      - uid: authentik-blueprint-instance-count-low
        title: AuthentikBlueprintInstanceCountLow
        condition: C
        # Floor below the live count (42 on 2026-10-13, all instantiate:true
        # built-ins plus the custom docs): catches a permission-filtered or
        # truncated list that collector_up alone would miss, e.g. a role
        # bound to only part of the instances. noDataState Alerting: no
        # series means the exporter is not reporting at all.
        for: 10m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            authentik blueprint exporter sees fewer than 30 instances
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-authentik-blueprint
        labels:
          severity: warning
          service: authentik
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                authentik_blueprint_instances
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 30
                  operator:
                    type: and
              refId: C

templates:
  - orgId: 1
    name: ntfy-infra
    template: |
      {{ define "ntfy-infra.payload" -}}
      {{- $msg := "" -}}
      {{- range .Alerts -}}
        {{- $msg = (printf "%s%s\n" $msg .Annotations.summary) -}}
      {{- end -}}
      {{- $title := (printf "[%s] %s" (.Status | toUpper) .CommonLabels.alertname) -}}
      {{- $actions := coll.Slice -}}
      {{- range .Alerts -}}
        {{- if .Annotations.runbook_url -}}
          {{- $actions = coll.Append (coll.Dict "action" "view" "label" "Open Runbook" "url" .Annotations.runbook_url) $actions -}}
        {{- end -}}
      {{- end -}}
      {{- coll.Dict "topic" "infra-alerts" "title" $title "message" $msg "priority" 3 "actions" $actions | data.ToJSON -}}
      {{- end }}
