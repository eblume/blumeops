apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy-infra
    receivers:
      - uid: ntfy-infra-webhook
        type: webhook
        settings:
          url: https://ntfy.ops.eblu.me
          httpMethod: POST
          maxAlerts: "0"
          payload:
            template: >-
              {{ template "ntfy-infra.payload" . }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: ntfy-infra
    group_by:
      - alertname
      - service
    group_wait: 1m
    group_interval: 12h
    repeat_interval: 24h

groups:
  - orgId: 1
    name: service-health
    folder: Infrastructure Alerts
    interval: 30s
    rules:
      - uid: service-probe-failure
        title: ServiceProbeFailure
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            {{ index $labels "service" }} health check is failing
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-service-probe-failure
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                label_replace(probe_success, "service",
                "$1", "job", "integrations/blackbox/(.*)")
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: textfile-freshness
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: textfile-stale
        title: TextfileStale
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            Metrics textfile {{ index $labels "file" }} has not been updated in over 2 hours
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-textfile-stale
        labels:
          severity: warning
          service: indri-metrics
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              # ringtail's seed-secrets textfile is weekly; the 2h threshold
              # would trip on it, so this rule is indri-only.
              expr: >-
                time() - node_textfile_mtime_seconds{cluster="indri"}
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      # 2h, not 1h. borgmatic.prom is written by an HOURLY
                      # LaunchAgent, so a 1h threshold equals its refresh
                      # period: any scheduling jitter makes it "stale" for a
                      # moment every single hour. The five continuously-written
                      # textfiles sit at 20-50s, so they lose nothing here.
                      - 7200
                  operator:
                    type: and
              refId: C

  # The weekly vault-free seed-secrets --check drift gate on ringtail
  # (nixos/ringtail/seed-secrets-check.nix) writes ok + timestamp gauges to
  # /var/lib/seed-secrets/seed-secrets.prom, scraped by ringtail's Alloy
  # textfile collector. Failed = the last run was red; Stale = no series, or
  # none fresh within 8d (7d timer + 1d margin).
  - orgId: 1
    name: seed-secrets-check
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: seed-secrets-check-failed
        title: SeedSecretsCheckFailed
        condition: C
        # The metric is rewritten once a week, so a red run stays red until
        # the next run; 15m is just debounce.
        for: 15m
        # A missing series means no check ran — the stale rule owns that.
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            The weekly seed-secrets --check on ringtail reported a drifted secret file
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-seed-secrets-check
        labels:
          severity: warning
          service: seed-secrets
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                seed_secrets_check_ok{cluster="ringtail"}
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C
      - uid: seed-secrets-check-stale
        title: SeedSecretsCheckStale
        condition: C
        # 8 days = 7d timer period + 1d margin for the weekly run.
        for: 1h
        # No series at all is exactly the failure: the timer never ran.
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            The weekly seed-secrets --check on ringtail has not run in over 8 days
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-seed-secrets-check
        labels:
          severity: warning
          service: seed-secrets
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                time() - seed_secrets_check_timestamp_seconds{cluster="ringtail"}
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      # 691200s = 8d.
                      - 691200
                  operator:
                    type: and
              refId: C

  # Forgejo Actions runners and the collector that measures them
  # (darwin/indri/mcquack-forgejo-metrics.sh reads Forgejo's DB).
  - orgId: 1
    name: forgejo-ci
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: forgejo-runner-offline
        title: ForgejoRunnerOffline
        condition: C
        for: 10m
        # OK, not Alerting: absent series mean the collector is not
        # deployed yet or not writing at all, and TextfileStale owns that.
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            Forgejo runner {{ index $labels "runner" }} has not polled the forge in over 10 minutes
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-forgejo-ci
        labels:
          severity: warning
          service: forgejo-actions
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                (time() - forgejo_ci_runner_last_online_timestamp_seconds) and on(runner) forgejo_ci_runner_capacity
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      # Runners poll every few seconds; Forgejo stamps
                      # last_online at most once a minute. Only runners with a
                      # capacity entry (the six configured ones) are watched,
                      # so retired registrations stay quiet.
                      - 600
                  operator:
                    type: and
              refId: C
      - uid: forgejo-ci-collector-down
        title: ForgejoCICollectorDown
        condition: C
        for: 15m
        # OK, not Alerting: absent series mean the collector is not
        # deployed yet or not writing at all, and TextfileStale owns that.
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            The Forgejo CI metrics collector on indri cannot read the Forgejo DB
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-forgejo-ci
        labels:
          severity: warning
          service: forgejo-actions
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                1 - forgejo_ci_collector_up
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      # The .prom file is still rewritten when only the DB
                      # read fails, so TextfileStale would not catch this.
                      - 0
                  operator:
                    type: and
              refId: C

      - uid: forgejo-ci-queue-stuck
        title: ForgejoCIQueueStuck
        condition: C
        for: 5m
        # OK, not Alerting: no series means nothing is waiting, and
        # ForgejoCICollectorDown owns the collector itself.
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            Forgejo CI jobs on label {{ index $labels "label" }} have waited over 30 minutes with nothing running on that label
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-forgejo-ci
        labels:
          severity: warning
          service: forgejo-actions
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              # Age of the oldest job waiting for a runner, per label, but
              # only on labels with no job running. A label with something
              # running is served and merely saturated: the one-slot
              # nix-container-builder has queued jobs behind a long build
              # for over two hours five times (cumulative wait histogram,
              # 2026-10-12), and those are capacity, not a stall. A label
              # with a queue and nothing running has no runner serving it
              # (never advertised, as on 2026-10-10 — run 7132 waited 30
              # minutes on indri-priv — or the runner is offline, which
              # ForgejoRunnerOffline also reports).
              expr: >-
                forgejo_ci_queue_oldest_age_seconds unless on(label) (sum by(label) (forgejo_ci_jobs_running) > 0)
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      # Runs blocked on "Approve and run" are status blocked,
                      # not waiting, so they never appear in this series.
                      - 1800
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: borgmatic-freshness
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: borgmatic-stale
        title: BorgmaticStale
        condition: C
        # Backups run daily (main 02:00, photos 04:00); healthy last-archive age
        # peaks near 24h. 30h + for:1h fires ~7h after a missed nightly run —
        # well before BorgBase's own 2-missed-runs email. Per-repo (repo label),
        # so the offsite repo alone going stale is caught. The operational repo
        # is excluded — BorgmaticOpsStale is its sole alert, so a missed 03:00
        # run fires one rule, not two. See [[borgmatic]].
        for: 1h
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            Borgmatic repo {{ index $labels "repo" }} has no new backup in over 30h
          runbook_url: https://docs.eblu.me/reference/services/borgmatic
        labels:
          severity: warning
          service: borgmatic
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                time() - borgmatic_last_archive_timestamp{repo!="sifaka-operational"}
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 108000
                  operator:
                    type: and
              refId: C
      - uid: borgmatic-verify-stale
        title: BorgmaticVerifyStale
        condition: C
        # Weekly verification cadence; 10 days gives one full missed cycle.
        # noDataState OK: repos without verification emit no series.
        for: 1h
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            No successful borg check of {{ index $labels "repo" }} in over 10 days
          runbook_url: https://docs.eblu.me/reference/services/borgmatic
        labels:
          severity: warning
          service: borgmatic
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                time() - borgmatic_last_verified_timestamp
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 864000
                  operator:
                    type: and
              refId: C

      - uid: borgmatic-test-restore-stale
        title: BorgmaticTestRestoreStale
        condition: C
        # Weekly test-restore cadence; 14 days spans two missed cycles. Unlike
        # BorgmaticVerifyStale (noDataState OK), a missing series is the failure
        # this rule exists to catch, the restore has never succeeded while the
        # series is absent, so noDataState is Alerting; for: 1h bounds the
        # pre-first-success window to one hour of pending after deploy.
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No successful test restore of {{ index $labels "repo" }} in over 14 days
          runbook_url: https://docs.eblu.me/reference/services/borgmatic
        labels:
          severity: warning
          service: borgmatic
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                time() - borgmatic_last_test_restore_timestamp
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 1209600
                  operator:
                    type: and
              refId: C

      - uid: borgmatic-stale-talos-data
        title: BorgmaticStaleTalosData
        condition: C
        # Per-source staleness for the never-pruned talos-data-* archives,
        # the signal the talos session reaper checks before sweeping.
        # noDataState is Alerting (inverse of BorgmaticStale): until the
        # first archive lands, no series exists at all and the rule alerts.
        # Once any repo reports, staleness drives it; a per-repo series
        # vanishing while others report is not detectable this way.
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            Borgmatic repo {{ index $labels "repo" }} has no new talos-data archive in over 30h
          runbook_url: https://docs.eblu.me/reference/services/borgmatic
        labels:
          severity: warning
          service: borgmatic
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                time() - borgmatic_talos_data_last_success_timestamp
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 108000
                  operator:
                    type: and
              refId: C
      - uid: borgmatic-ops-stale
        title: BorgmaticOpsStale
        condition: C
        # NoData alerting for the operational tier (inverse of BorgmaticStale):
        # a never-created or vanished repo emits no
        # borgmatic_last_archive_timestamp series, and BorgmaticStale
        # (noDataState: OK) would stay silent forever. The operational repo is
        # excluded from BorgmaticStale, so this is its only alert. Once
        # archives exist the 30h threshold fires ~6h after a missed 03:00 run.
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            Borgmatic operational repo {{ index $labels "repo" }} has no archive at all, or no new one in over 30h
          runbook_url: https://docs.eblu.me/reference/services/borgmatic
        labels:
          severity: warning
          service: borgmatic
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                time() - borgmatic_last_archive_timestamp{repo="sifaka-operational"}
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 108000
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: frigate-health
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: frigate-camera-down
        title: FrigateCameraDown
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            Frigate camera {{ index $labels "camera_name" }} has 0 FPS
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-frigate-camera-down
        labels:
          severity: warning
          service: frigate
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: frigate_camera_fps
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: database-health
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: postgres-cluster-unhealthy
        title: PostgresClusterUnhealthy
        condition: C
        for: 3m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          # `instance` is the CNPG cluster name — the cnpg-postgres scrape job
          # sets it per target (blumeops-pg, immich-pg). `cluster` is the
          # Prometheus-wide "ringtail" label every metric here carries, so it
          # cannot distinguish the two.
          summary: >-
            PostgreSQL cluster {{ index $labels "instance" }} is unhealthy
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-postgres-unhealthy
        labels:
          severity: critical
          service: postgresql
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: cnpg_collector_up
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: pod-health
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: pod-not-ready
        title: PodNotReady
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            Pod {{ index $labels "pod" }} in {{ index $labels "namespace" }} is not ready
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-pod-not-ready
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 60
              to: 0
            model:
              expr: >-
                kube_pod_status_ready{condition="true"} == 0
                unless on (namespace, pod)
                kube_pod_owner{owner_kind="Job"}
                unless on (namespace, pod)
                (kube_pod_status_phase{phase=~"Failed|Succeeded"} == 1)
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: argocd-health
    folder: Infrastructure Alerts
    interval: 60s
    rules:
