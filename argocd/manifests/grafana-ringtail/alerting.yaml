apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy-infra
    receivers:
      - uid: ntfy-infra-webhook
        type: webhook
        settings:
          url: https://ntfy.ops.eblu.me
          httpMethod: POST
          maxAlerts: "0"
          payload:
            template: >-
              {{ template "ntfy-infra.payload" . }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: ntfy-infra
    group_by:
      - alertname
      - service
    group_wait: 1m
    group_interval: 12h
    repeat_interval: 24h

groups:
  - orgId: 1
    name: service-health
    folder: Infrastructure Alerts
    interval: 30s
    rules:
      - uid: service-probe-failure
        title: ServiceProbeFailure
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            {{ index $labels "service" }} health check is failing
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-service-probe-failure
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                label_replace(probe_success, "service",
                "$1", "job", "integrations/blackbox/(.*)")
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: textfile-freshness
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: textfile-stale
        title: TextfileStale
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            Metrics textfile {{ index $labels "file" }} has not been updated in over 2 hours
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-textfile-stale
        labels:
          severity: warning
          service: indri-metrics
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                time() - node_textfile_mtime_seconds
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      # 2h, not 1h. borgmatic.prom is written by an HOURLY
                      # LaunchAgent, so a 1h threshold equals its refresh
                      # period: any scheduling jitter makes it "stale" for a
                      # moment every single hour. The five continuously-written
                      # textfiles sit at 20-50s, so they lose nothing here.
                      - 7200
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: borgmatic-freshness
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: borgmatic-stale
        title: BorgmaticStale
        condition: C
        # Backups run daily (main 02:00, photos 04:00); healthy last-archive age
        # peaks near 24h. 30h + for:1h fires ~7h after a missed nightly run —
        # well before BorgBase's own 2-missed-runs email. Per-repo (repo label),
        # so the offsite repo alone going stale is caught. See [[borgmatic]].
        for: 1h
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            Borgmatic repo {{ index $labels "repo" }} has no new backup in over 30h
          runbook_url: https://docs.eblu.me/reference/services/borgmatic
        labels:
          severity: warning
          service: borgmatic
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                time() - borgmatic_last_archive_timestamp
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 108000
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: frigate-health
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: frigate-camera-down
        title: FrigateCameraDown
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            Frigate camera {{ index $labels "camera_name" }} has 0 FPS
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-frigate-camera-down
        labels:
          severity: warning
          service: frigate
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: frigate_camera_fps
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: database-health
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: postgres-cluster-unhealthy
        title: PostgresClusterUnhealthy
        condition: C
        for: 3m
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          # `instance` is the CNPG cluster name — the cnpg-postgres scrape job
          # sets it per target (blumeops-pg, immich-pg). `cluster` is the
          # Prometheus-wide "ringtail" label every metric here carries, so it
          # cannot distinguish the two.
          summary: >-
            PostgreSQL cluster {{ index $labels "instance" }} is unhealthy
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-postgres-unhealthy
        labels:
          severity: critical
          service: postgresql
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: cnpg_collector_up
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: pod-health
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: pod-not-ready
        title: PodNotReady
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            Pod {{ index $labels "pod" }} in {{ index $labels "namespace" }} is not ready
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-pod-not-ready
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 60
              to: 0
            model:
              expr: >-
                kube_pod_status_ready{condition="true"} == 0
                unless on (namespace, pod)
                kube_pod_owner{owner_kind="Job"}
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: argocd-health
    folder: Infrastructure Alerts
    interval: 60s
    rules:
      - uid: argocd-app-out-of-sync
        title: ArgoCDAppOutOfSync
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            ArgoCD app {{ index $labels "name" }} is {{ index $labels "sync_status" }}
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-argocd-out-of-sync
        labels:
          severity: warning
          service: argocd
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 60
              to: 0
            model:
              expr: >-
                argocd_app_info{sync_status!="Synced"}
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
              refId: C

  - orgId: 1
    name: flyio-proxy-health
    folder: Infrastructure Alerts
    interval: 30s
    rules:
      - uid: flyio-upstream-unreachable
        title: FlyioUpstreamUnreachable
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: >-
            Fly.io proxy returning elevated 502s — upstream DNS may be stale. Run: mise run fly-reload
          runbook_url: https://docs.eblu.me/how-to/operations/manage-flyio-proxy
        labels:
          severity: warning
          service: flyio-proxy
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: >-
                sum(rate(flyio_nginx_http_requests_total{instance="flyio-proxy",status="502"}[5m]))
                / sum(rate(flyio_nginx_http_requests_total{instance="flyio-proxy"}[5m]))
                > 0.5
              interval: ""
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
              refId: C

  # Log shipping end-to-end: alloy on indri tails LaunchAgent log files and
  # pushes them to Loki, and the failure mode seen in practice is total
  # silence — a stream stops arriving and nothing notices (the forge's own
  # log was absent for two months before anyone looked). Each rule asks Loki
  # for one stream's line count over a window sized to that stream's
  # guaranteed traffic. A stream with no lines returns no series at all, so
  # detection rides on noDataState: Alerting, and the summaries are static
  # text — a NoData instance carries no query labels to template with. One
  # rule per stream, because NoData is rule-level: folding the streams into
  # one query would let any single live stream mask the silence of the rest.
  #
  # Only streams with guaranteed daily traffic are watched. Host inspection
  # of the declared-but-unwatched files shows they either write nothing
  # anymore (alloy.out, borgmatic.out, forgejo-runner.out, forgejo.err) or
  # too sparsely to distinguish "quiet day" from "broken" without a window
  # so wide the alert stops being useful (jellyfin.{out,err}, alloy.err,
  # borgmatic.err). borgmatic freshness has BorgmaticStale. One exception:
  # zot.err is actively written and its lines do not reach Loki — a broken
  # tail under investigation (heph 01KZKPRWGHH301688YP32Z7BC0); add a rule
  # for it once it ships. If alloy itself dies, all four rules go NoData
  # together — that pattern is the "alloy is down" signature, and the
  # runbook leads with it.
  - orgId: 1
    name: log-shipping
    folder: Infrastructure Alerts
    interval: 300s
    rules:
      - uid: log-silent-forgejo
        title: LogStreamSilentForgejo
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No lines from indri's forgejo log (mcquack.forgejo.out.log)
            reached Loki in 24h. The forge logs every request, so shipping
            is broken: alloy tail, Loki push, or ingest.
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-log-stream-silent
        labels:
          severity: warning
          service: forgejo
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: >-
                sum(count_over_time({host="indri", service="forgejo", stream="stdout"}[24h]))
              queryType: range
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

      - uid: log-silent-forgejo-runner
        title: LogStreamSilentForgejoRunner
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No lines from indri's forgejo-runner log
            (mcquack.forgejo-runner.err.log) reached Loki in 48h. The runner
            logs every CI job to stderr and scheduled workflows run daily, so
            either CI is not running or its log is not shipping.
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-log-stream-silent
        labels:
          severity: warning
          service: forgejo-runner
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: >-
                sum(count_over_time({host="indri", service="forgejo-runner", stream="stderr"}[48h]))
              queryType: range
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

      - uid: log-silent-zot
        title: LogStreamSilentZot
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No lines from indri's zot log (mcquack.zot.out.log) reached Loki
            in 24h. The registry logs steadily (pull-through cache + CI
            traffic), so shipping is broken.
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-log-stream-silent
        labels:
          severity: warning
          service: zot
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: >-
                sum(count_over_time({host="indri", service="zot", stream="stdout"}[24h]))
              queryType: range
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

      - uid: log-silent-tailscaled
        title: LogStreamSilentTailscaled
        condition: C
        for: 1h
        noDataState: Alerting
        execErrState: Alerting
        annotations:
          summary: >-
            No lines from indri's tailscaled log
            (/opt/homebrew/var/log/tailscaled.log) reached Loki in 24h.
            tailscaled logs constantly, so shipping is broken.
          runbook_url: https://docs.eblu.me/how-to/runbooks/runbook-log-stream-silent
        labels:
          severity: warning
          service: tailscale
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              expr: >-
                sum(count_over_time({host="indri", service="tailscale"}[24h]))
              queryType: range
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
              refId: C

templates:
  - orgId: 1
    name: ntfy-infra
    template: |
      {{ define "ntfy-infra.payload" -}}
      {{- $msg := "" -}}
      {{- range .Alerts -}}
        {{- $msg = (printf "%s%s\n" $msg .Annotations.summary) -}}
      {{- end -}}
      {{- $title := (printf "[%s] %s" (.Status | toUpper) .CommonLabels.alertname) -}}
      {{- $actions := coll.Slice -}}
      {{- range .Alerts -}}
        {{- if .Annotations.runbook_url -}}
          {{- $actions = coll.Append (coll.Dict "action" "view" "label" "Open Runbook" "url" .Annotations.runbook_url) $actions -}}
        {{- end -}}
      {{- end -}}
      {{- coll.Dict "topic" "infra-alerts" "title" $title "message" $msg "priority" 3 "actions" $actions | data.ToJSON -}}
      {{- end }}
