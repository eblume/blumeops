---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tailscale

resources:
  - ../tailscale-operator-base
  - proxygroup-ingress.yaml
  - external-secret.yaml

# Rewrite the operator image to the locally nix-built (amd64) mirror.
# The name must match the post-base-render image (base already rewrites
# tailscale/k8s-operator -> docker.io/tailscale/k8s-operator).
images:
  - name: docker.io/tailscale/k8s-operator
    newName: registry.ops.eblu.me/blumeops/tailscale-operator
    newTag: v1.98.5-623e89a-nix

# Rewrite the proxyclass and DNSConfig nameserver images to our local nix-built
# mirrors. A strategic merge patch is used instead of kustomize's `images:`
# directive because that directive only rewrites images in standard k8s
# container fields, not custom-resource fields like
# ProxyClass.spec.statefulSet.pod.tailscaleContainer.image and
# DNSConfig.spec.nameserver.image.
patches:
  - path: proxyclass-image.yaml
    target:
      group: tailscale.com
      version: v1alpha1
      kind: ProxyClass
      name: default
  - path: dnsconfig-image.yaml
    target:
      group: tailscale.com
      version: v1alpha1
      kind: DNSConfig
      name: ts-dns
