# Pod security checks — k3s system pods, operator-managed pods, and accepted
# operational needs. Each check ID appears once with all matching resources.
# Mutes are keyed per-resource-name so a new workload deployed insecurely under
# a new name surfaces as a fresh unmuted FAIL rather than being auto-suppressed.
Mutelist:
  Accounts:
    "*":
      Checks:
        "core_minimize_privileged_containers":
          Regions: ["*"]
          Resources:
            # Tailscale operator-managed proxies
            - "^ts-"
            - "^ingress-"
            # k3s node agents
            - "^alloy-tracing-"
            - "^nvidia-device-plugin-"
          Description: >-
            ts-*/ingress-*: Tailscale operator-managed. alloy-tracing:
            node profiling agent needs privileged host access.
            nvidia-device-plugin: requires privileged access to GPU
            device nodes. Single-user cluster reachable only via tailnet.
        "core_seccomp_profile_docker_default":
          Regions: ["*"]
          Resources:
            # k3s system pods
            - "^coredns-"
            - "^local-path-provisioner-"
            # Tailscale operator-managed pods
            - "^ts-"
            - "^operator-"
            - "^nameserver-"
            - "^ingress-"
            # k3s node agents (upstream-managed securityContext)
            - "^alloy"
            - "^nvidia-device-plugin-"
          Description: >-
            System pods managed by k3s and the Tailscale operator;
            seccomp profiles set by upstream. alloy/local-path-provisioner/
            nvidia-device-plugin: node-level agents with upstream-managed
            securityContext. Single-user cluster limits exploit surface.
            App-pod seccomp findings on workloads we control (authentik,
            frigate-notify) were remediated with seccompProfile:
            RuntimeDefault rather than muted.
        "core_minimize_hostPID_containers":
          Regions: ["*"]
          Resources:
            - "^prowler-"
            # k3s node agents
            - "^alloy-tracing-"
          Description: >-
            Prowler CIS scanner requires hostPID for file permission
            checks (CronJob with 7-day TTL). alloy-tracing: node profiling
            agent needs hostPID to attribute profiles to host processes.
        "core_minimize_root_containers_admission":
          Regions: ["*"]
          Resources:
            - "^grafana-"
            # k3s node agents / scanners
            - "^alloy-tracing-"
            - "^prowler-"
          Description: >-
            grafana: root limited to init-chown-data container; runtime
            containers run as UID 472 with caps dropped. alloy-tracing:
            node profiling agent needs root for host access. prowler:
            CIS scanner CronJob, ephemeral.
        "core_minimize_containers_added_capabilities":
          Regions: ["*"]
          Resources:
            # k3s system pods
            - "^coredns-"
            # Grafana init-chown-data
            - "^grafana-"
          Description: >-
            coredns: capabilities required by function (k3s-managed).
            Grafana: CHOWN limited to init phase; runtime containers
            drop ALL.
        "core_minimize_containers_capabilities_assigned":
          Regions: ["*"]
          Resources:
            - "^coredns-"
            - "^grafana-"
          Description: >-
            See core_minimize_containers_added_capabilities.
