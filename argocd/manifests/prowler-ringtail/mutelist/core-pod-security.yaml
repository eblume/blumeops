# Pod security checks — system pods, operator-managed pods, and accepted
# operational needs. Each check ID appears once with all matching resources.
Mutelist:
  Accounts:
    "*":
      Checks:
        "core_minimize_hostNetwork_containers":
          Regions: ["*"]
          Resources:
            # Minikube control plane
            - "^etcd-minikube$"
            - "^kube-apiserver-minikube$"
            - "^kube-controller-manager-minikube$"
            - "^kube-scheduler-minikube$"
            # Minikube system pods
            - "^kube-proxy-"
            - "^kindnet-"
            - "^storage-provisioner$"
          Description: >-
            Control-plane and networking pods require hostNetwork by design.
            Host network itself is only reachable via tailnet.
        "core_minimize_privileged_containers":
          Regions: ["*"]
          Resources:
            # Minikube system
            - "^kube-proxy-"
            # Tailscale operator-managed proxies
            - "^ts-"
            - "^ingress-"
            # Forgejo runner
            - "^forgejo-runner-"
            # k3s node agents
            - "^alloy-tracing-"
            - "^nvidia-device-plugin-"
          Description: >-
            kube-proxy: system pod, single-user cluster. ts-*/ingress-*:
            Tailscale operator-managed. forgejo-runner: DinD limited to
            trusted private forge repos. alloy-tracing: node profiling
            agent needs privileged host access. nvidia-device-plugin:
            requires privileged access to GPU device nodes.
        "core_seccomp_profile_docker_default":
          Regions: ["*"]
          Resources:
            # Minikube system pods
            - "^coredns-"
            - "^kube-proxy-"
            - "^kindnet-"
            - "^storage-provisioner$"
            # Tailscale operator-managed pods
            - "^ts-"
            - "^operator-"
            - "^nameserver-"
            - "^ingress-"
            # k3s system pods / node agents (upstream-managed securityContext)
            - "^alloy"
            - "^local-path-provisioner-"
            - "^nvidia-device-plugin-"
          Description: >-
            System pods managed by k3s and the Tailscale operator;
            seccomp profiles set by upstream. alloy/local-path-provisioner/
            nvidia-device-plugin: node-level agents with upstream-managed
            securityContext. Single-user cluster limits exploit surface.
            App-pod seccomp findings on workloads we control (authentik,
            frigate-notify) were remediated with seccompProfile:
            RuntimeDefault rather than muted.
        "core_minimize_hostPID_containers":
          Regions: ["*"]
          Resources:
            - "^prowler-"
            # k3s node agents
            - "^alloy-tracing-"
          Description: >-
            Prowler CIS scanner requires hostPID for file permission
            checks (CronJob with 7-day TTL). alloy-tracing: node profiling
            agent needs hostPID to attribute profiles to host processes.
        "core_minimize_root_containers_admission":
          Regions: ["*"]
          Resources:
            - "^grafana-"
            # k3s node agents / scanners
            - "^alloy-tracing-"
            - "^prowler-"
          Description: >-
            grafana: root limited to init-chown-data container; runtime
            containers run as UID 472 with caps dropped. alloy-tracing:
            node profiling agent needs root for host access. prowler:
            CIS scanner CronJob, ephemeral.
        "core_minimize_containers_added_capabilities":
          Regions: ["*"]
          Resources:
            # Minikube system pods
            - "^coredns-"
            - "^kindnet-"
            # Grafana init-chown-data
            - "^grafana-"
          Description: >-
            System pods: capabilities required by function
            (minikube-managed). Grafana: CHOWN limited to init phase;
            runtime containers drop ALL.
        "core_minimize_containers_capabilities_assigned":
          Regions: ["*"]
          Resources:
            - "^coredns-"
            - "^kindnet-"
            - "^grafana-"
          Description: >-
            See core_minimize_containers_added_capabilities.
