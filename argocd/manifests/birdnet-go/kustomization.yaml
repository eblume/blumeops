---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: birdnet-go
resources:
  - pvc-data.yaml
  - deployment.yaml
  - service.yaml
  - ingress-tailscale.yaml

images:
  - name: busybox
    newTag: "1.37"
  # Upstream pin by digest (release 20260823); localization to a nix-built
  # registry.ops.eblu.me image is a deliberate follow-up, not part of the MVP.
  - name: ghcr.io/tphakala/birdnet-go
    # pinned by digest only (kustomize rejects newTag + digest together)
    digest: sha256:233b94f1d3b27b261ec8d997364db0cb953f3e3b3362a89e9e22ad4a589143d6

configMapGenerator:
  - name: birdnet-go-config
    files:
      - config.yml=birdnet-go-config.yml
