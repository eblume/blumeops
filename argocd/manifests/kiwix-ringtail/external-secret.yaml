---
# Transmission RPC credentials for the torrent-sync sidecar — same 1P item
# as the torrent namespace's transmission-rpc secret (secrets are
# namespaced, so each consumer namespace materializes its own copy).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transmission-rpc
  namespace: kiwix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: transmission-rpc
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: transmission
        property: username
    - secretKey: password
      remoteRef:
        key: transmission
        property: password
