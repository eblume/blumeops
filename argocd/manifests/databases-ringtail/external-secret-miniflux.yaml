# ExternalSecret for the miniflux database user password
# ([[retire-minikube]] phase 1).
#
# 1Password item: "Miniflux DB" in blumeops vault
# Field: "db_password"
#
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blumeops-pg-miniflux
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: blumeops-pg-miniflux
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: miniflux
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: Miniflux DB
      property: db_password
