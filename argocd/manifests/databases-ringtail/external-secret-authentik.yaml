# ExternalSecret for the authentik database user password
# ([[retire-minikube]] phase 2).
#
# Sources the same 1Password field the authentik app itself reads
# (authentik/external-secret.yaml), so the managed role on ringtail
# blumeops-pg gets the identical password the minikube-side role had —
# the cutover is then only a postgresql-host flip in the 1P item.
#
# 1Password item: "Authentik (blumeops)" in blumeops vault
# Field: "postgresql-password"
#
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blumeops-pg-authentik
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: blumeops-pg-authentik
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: authentik
        password: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: "Authentik (blumeops)"
      property: postgresql-password
