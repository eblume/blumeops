---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-redis
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik
      component: redis
  template:
    metadata:
      labels:
        app: authentik
        component: redis
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/library/redis:kustomized
          # Overrides the image Cmd (--protected-mode no), so repeat it.
          # --save "" disables RDB snapshots: redis-server's built-in default
          # is `save 3600 1 300 100 60 10000` with
          # stop-writes-on-bgsave-error=yes, and as uid 1000 with no writable
          # dir the first BGSAVE to / would fail and flip the server read-only
          # (MISCONF) — an authentik outage. This redis is a stateless
          # cache/broker per docs/reference/operations/security.md, so a
          # snapshot buys nothing anyway.
          args: ["--protected-mode", "no", "--save", ""]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
