# Deletion queue for retired Authentik principals. Normally empty.
#
# Each entry renders an `is_active: false` user record (plus its group, if
# declared) into the blueprint's `retiring.yaml` key, so the blueprint keeps
# owning the record until the reconcile task deletes it from live Authentik.
# After the delete, remove the entry and re-render. Queue seeded from the
# eblume/blumeops#1167 roster check (2026-10-16): three identities
# deactivated but never deleted.
#
# Retiring a principal: docs/how-to/authentik/manage-authentik-principals.md.
#
# Schema: username (required), name (required — rendered as attrs.name),
# type? (rendered when present; omit when unknown to leave the live value),
# retired (date), issue (where the retirement was decided),
# keys_revoked? (required `true` for zot identities — the reconcile refuses
# to delete one without it), group? (a paired group rendered alongside the
# user; its bindings are not rendered).

[]
