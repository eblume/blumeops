# ExternalSecret for the UniFi API key (1Password item "unpoller").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller-unifi
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: unpoller-unifi
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: unpoller
        property: credential
