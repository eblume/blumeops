# UnPoller on ringtail k3s ([[retire-minikube]] phase 1).
# Stateless lift-and-shift; polls the UX7 at 192.168.1.1 (ringtail is on
# the same LAN). Scraped by alloy-ringtail, which remote_writes to
# prometheus — minikube prometheus's in-cluster unpoller job retires.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  namespace: monitoring
  labels:
    app: unpoller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unpoller
  template:
    metadata:
      labels:
        app: unpoller
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unpoller
          image: registry.ops.eblu.me/blumeops/unpoller:kustomized
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 9130
              name: metrics
          env:
            - name: UP_UNIFI_DEFAULT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unpoller-unifi
                  key: api-key
          volumeMounts:
            - name: config
              mountPath: /etc/unpoller
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: unpoller-config
