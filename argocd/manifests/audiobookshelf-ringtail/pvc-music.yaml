# PersistentVolumeClaim for Audiobookshelf music library
# Binds to the NFS PV for sifaka:/volume1/music
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-music
  namespace: audiobookshelf
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  volumeName: audiobookshelf-music-nfs-pv-ringtail
  resources:
    requests:
      storage: 1Ti
