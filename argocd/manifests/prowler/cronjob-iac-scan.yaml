---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowler-iac-scan
  namespace: prowler
spec:
  schedule: "0 2 * * 6"  # Saturday 2am
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800  # Auto-delete after 7 days
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: clone-repo
              image: alpine/git:kustomized
              command:
                - git
                - clone
                - --depth
                - "1"
                - https://forge.ops.eblu.me/eblume/blumeops.git
                - /repo
              volumeMounts:
                - name: repo
                  mountPath: /repo
          containers:
            - name: prowler
              image: registry.ops.eblu.me/blumeops/prowler:kustomized
              args:
                - iac
                - --directory
                - /repo
                - -z
                - --output-formats
                - html
                - csv
                - json-ocsf
                - --output-directory
                - /reports/prowler-iac
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: repo
                  mountPath: /repo
                  readOnly: true
          restartPolicy: OnFailure
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: prowler-reports
            - name: repo
              emptyDir: {}
