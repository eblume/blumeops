---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowler-iac-scan
  namespace: prowler
spec:
  schedule: "0 2 * * 6"  # Saturday 2am
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800  # Auto-delete after 7 days
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prowler
              image: registry.ops.eblu.me/blumeops/prowler:kustomized
              args:
                - iac
                - --scan-repository-url
                - https://forge.ops.eblu.me/eblume/blumeops.git
                - -z
                - --output-formats
                - html
                - csv
                - json-ocsf
                - --output-directory
                - /reports/prowler-iac
              volumeMounts:
                - name: reports
                  mountPath: /reports
          restartPolicy: OnFailure
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: prowler-reports
