---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowler-image-scan
  namespace: prowler
spec:
  schedule: "0 3 * * 6"  # Saturday 3am
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 604800  # Auto-delete after 7 days
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Workaround: Prowler's --registry flag is broken (registry args
            # not passed to provider constructor). Generate image list from
            # zot catalog API instead.
            - name: enumerate-images
              image: registry.ops.eblu.me/blumeops/kubectl:kustomized
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  REGISTRY="https://registry.ops.eblu.me"
                  repos=$(curl -sf "${REGISTRY}/v2/_catalog" | python3 -c "
                  import json, sys
                  for r in json.load(sys.stdin)['repositories']:
                      if r.startswith('blumeops/'):
                          print(r)
                  ")
                  > /shared/images.txt
                  for repo in $repos; do
                      tags=$(curl -sf "${REGISTRY}/v2/${repo}/tags/list" | python3 -c "
                  import json, sys
                  for t in (json.load(sys.stdin).get('tags') or []):
                      print(t)
                  ")
                      for tag in $tags; do
                          echo "registry.ops.eblu.me/${repo}:${tag}" >> /shared/images.txt
                      done
                  done
                  echo "Discovered $(wc -l < /shared/images.txt) images"
                  cat /shared/images.txt
              volumeMounts:
                - name: shared
                  mountPath: /shared
          containers:
            - name: prowler
              image: registry.ops.eblu.me/blumeops/prowler:kustomized
              args:
                - image
                - --image-list
                - /shared/images.txt
                - -z
                - --output-formats
                - html
                - csv
                - json-ocsf
                - --output-directory
                - /reports/prowler-images
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: shared
                  mountPath: /shared
                  readOnly: true
          restartPolicy: OnFailure
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: prowler-reports
            - name: shared
              emptyDir: {}
