# ExternalSecret for the OpenRouter management key (1Password item "openrouter management (blumeops)").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openrouter-management
  namespace: openrouter-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: openrouter-management
    creationPolicy: Owner
  data:
    - secretKey: management-key
      remoteRef:
        key: openrouter management (blumeops)
        property: credential
