# OpenRouter usage/spend exporter on ringtail k3s. The management key lives
# only in this namespace's openrouter-management Secret (ExternalSecret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrouter-exporter
  labels:
    app: openrouter-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openrouter-exporter
  template:
    metadata:
      labels:
        app: openrouter-exporter
    spec:
      # Otherwise kubelet injects OPENROUTER_EXPORTER_PORT=tcp://<clusterIP>:9102 from the
      # Service of the same name, which the exporter parses as its listen port.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openrouter-exporter
          image: registry.ops.eblu.me/blumeops/openrouter-exporter:kustomized
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 9102
              name: metrics
          env:
            - name: OPENROUTER_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: openrouter-management
                  key: management-key
          # tcpSocket, not /metrics: an HTTP probe runs the upstream poll in the request.
          readinessProbe:
            tcpSocket:
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
