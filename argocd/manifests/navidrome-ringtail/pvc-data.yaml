# PersistentVolumeClaim for Navidrome data (SQLite database, config, cache)
# Uses the cluster default storage class (k3s local-path) for local provisioning
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: navidrome
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
