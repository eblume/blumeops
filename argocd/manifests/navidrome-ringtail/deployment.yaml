---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
spec:
  replicas: 1
  # SQLite single-writer: never leave the old pod holding the DB while the
  # new pod runs startup migrations (the 0.63.2 rollout migrated with the
  # 0.61.1 pod still live).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: navidrome
          image: registry.ops.eblu.me/blumeops/navidrome:kustomized
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 4533
              name: http
          env:
            - name: ND_SCANNER_SCHEDULE
              value: "@every 1h"
            - name: ND_LOGLEVEL
              value: "info"
            - name: ND_MUSICFOLDER
              value: "/music"
            - name: ND_DATAFOLDER
              value: "/data"
            # v0.63.0 flipped the sharing default to enabled; pin the
            # pre-upgrade behaviour (local accounts only, nothing shared
            # anonymously — v0.62.0's security fixes were share-related).
            - name: ND_ENABLE_SHARING
              value: "false"
            # Native DB backup (users, play counts, playlists) — borgmatic on
            # indri ferries the newest snapshot off this PVC. Schedule runs an
            # hour before borgmatic's 02:00 run so a fresh copy is waiting.
            - name: ND_BACKUP_PATH
              value: "/data/backup"
            - name: ND_BACKUP_SCHEDULE
              value: "0 1 * * *"
            - name: ND_BACKUP_COUNT
              value: "7"
          volumeMounts:
            - name: music
              mountPath: /music
              readOnly: true
            - name: data
              mountPath: /data
            # The Nix image ships no /tmp; SQLite needs a writable temp dir
            # for statement journals on large migrations (the 0.63.2
            # bpm/bit_depth migration died with "disk I/O error: permission
            # denied" without one). Same fix as paperless.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /ping
              port: 4533
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 4533
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: tmp
          emptyDir: {}
