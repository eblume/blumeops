# Immich Helm values for blumeops
# Chart: https://github.com/immich-app/immich-charts (v0.10.3)
#
# Immich requires:
# - PostgreSQL with VectorChord extension (separate immich-pg cluster)
# - Redis/Valkey (included in chart)
# - Library storage PVC (photos directory from sifaka NFS)

# Shared environment variables
env:
  TZ: "America/Los_Angeles"

# Shared controller settings - image tag and DB connection
controllers:
  main:
    containers:
      main:
        image:
          tag: v2.5.6
        env:
          DB_HOSTNAME: "immich-pg-rw.databases.svc.cluster.local"
          DB_PORT: "5432"
          DB_DATABASE_NAME: "immich"
          DB_USERNAME: "immich"
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db
                key: password

# Immich server configuration
immich:
  persistence:
    library:
      existingClaim: immich-library

# Machine Learning service
machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "4Gi"
          probes:
            liveness:
              spec:
                timeoutSeconds: 5
            readiness:
              spec:
                timeoutSeconds: 5
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi

# Valkey (Redis fork) - included in chart
valkey:
  enabled: true
  persistence:
    data:
      enabled: true
      type: emptyDir
      size: 1Gi

# Server configuration
server:
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
          probes:
            liveness:
              spec:
                timeoutSeconds: 5
            readiness:
              spec:
                timeoutSeconds: 5
