# ExternalSecret for Transmission RPC credentials
# Used by Homepage Transmission widget
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-transmission
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: homepage-transmission
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: transmission
        property: username
    - secretKey: password
      remoteRef:
        key: transmission
        property: password
