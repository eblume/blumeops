# Ingress fence for the egress gateway: only the talos agent pod may reach
# it. Without this the gateway would be an open forward proxy (and an
# unauthenticated session-tag control API) for every pod in the cluster.
# All ports from the agent pod are admitted — that also reaches the ts
# sidecar's /healthz on 9002 (harmless: health only, no metrics).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-gateway-ingress
  namespace: talos
spec:
  podSelector:
    matchLabels:
      app: egress-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: talos
