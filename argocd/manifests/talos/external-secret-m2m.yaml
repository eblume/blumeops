# The fleet's talos-m2m app password, from the "Authentik (blumeops)" item (ID oor7os5kapczgpbwv7obkca4y4).
# Mounted into the talos server container only (deployment.yaml), as a file:
# the server reads it for the M2M bearer (TALOS_M2M_PASSWORD_REF). It is not
# mounted into the executor container, which runs every session tool call.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-m2m
  namespace: talos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: talos-m2m
    creationPolicy: Owner
  data:
    - secretKey: app-password
      remoteRef:
        # The item ID (as the op:// ref in blumeops#2513 names it).
        key: oor7os5kapczgpbwv7obkca4y4
        property: talos-m2m-app-password
