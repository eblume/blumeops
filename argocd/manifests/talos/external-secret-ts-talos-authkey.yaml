# tag:talos Tailscale auth key for the sidecar — minted by Pulumi
# (talos_authkey) and synced into the blumeops-vault item by
# `mise run talos-authkey-sync`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ts-talos-authkey
  namespace: talos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: ts-talos-authkey
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: talos Tailscale Auth Key
        property: authkey
