# App secrets, from the 1Password blumeops vault:
# - OIDC client secret: talos-client-secret field on the shared
#   "Authentik (blumeops)" item (the Authentik worker blueprint reads the
#   same field via !Env)
# - OpenRouter API key: "openrouter (blumeops)" — currently a copy of the
#   personal key; replace with a dedicated spend-limited key
# - Forgejo webhook secret: "talos forge webhook (blumeops)" — HMAC key for
#   the PR-label webhook; the same value is the hook secret on the forge
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-secrets
  namespace: talos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: talos-secrets
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: "Authentik (blumeops)"
        property: talos-client-secret
    - secretKey: openrouter-api-key
      remoteRef:
        key: "openrouter (blumeops)"
        property: credential
    - secretKey: forge-webhook-secret
      remoteRef:
        key: "talos forge webhook (blumeops)"
        property: credential
