# The agents-ringtail-rw 1Password service-account token — the pod's
# bootstrap secret: with it the pod reads everything else it needs from the
# *agents* vault at runtime via `op`, so nothing agents-vault-scoped is
# staged in etcd.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-op-token
  namespace: talos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: talos-op-token
    creationPolicy: Owner
  data:
    - secretKey: OP_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: agents-ringtail Service Account
        property: credential
