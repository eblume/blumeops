# tag:agent Tailscale auth key for the sidecar — the same reusable key
# agent-ws uses (minted by Pulumi agent_ws_authkey, synced into the
# blumeops-vault item by `mise run agent-ws-authkey-sync`). If the key ever
# becomes single-use, mint a talos-specific one in Pulumi.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ts-agent-authkey
  namespace: talos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: ts-agent-authkey
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: agent-ws Tailscale Auth Key
        property: authkey
