# tag:agent Tailscale auth key for the sidecar — minted by Pulumi
# (agent_authkey) and synced into the blumeops-vault item by
# `mise run agent-authkey-sync`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ts-agent-authkey
  namespace: talos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: ts-agent-authkey
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: agent Tailscale Auth Key
        property: authkey
