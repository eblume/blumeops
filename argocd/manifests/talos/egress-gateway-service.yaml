# Fixed cluster IP: the agent pod's proxy env and EGRESS_GATEWAY_URL point
# at this address (stage 2), and with dnsPolicy: None the pod has no other
# way to find the gateway. Must stay stable for the lifetime of the
# deployment; moving it means editing the agent pod's env in the same PR.
