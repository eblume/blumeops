apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: talos

resources:
  - serviceaccount.yaml
  - external-secret.yaml
  - external-secret-op-token.yaml
  - external-secret-ts-authkey.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - egress-gateway-deployment.yaml
  - egress-gateway-service.yaml
  - egress-gateway-networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - ingress-tailscale.yaml

# Repo-pool policy ([[agents-forgejo-bot]]): repos.json lives HERE so
# kustomize can generate it into a ConfigMap. The hash-suffixed name changes
# the Deployment's volume ref on every edit, so a merged policy change rolls
# the pod by itself — the merge IS the deploy, no restart to remember. Also
# consumed in place by the agent-repo-access reconciler (CI + mise task).
configMapGenerator:
  - name: talos-repos
    files:
      - repos.json

# First-party Nix image, built from eblume/talos (default.nix there). Every
# merge to talos main auto-releases and opens a pin-bump PR against this tag;
# merging that PR is the deploy gate.
images:
  - name: registry.ops.eblu.me/blumeops/talos
    newTag: v0.4.153-5872295-nix@sha256:a5df75ee22144b19ba955ac0314c2bb22fa923a0b96b85fcb995b9bf6d2f6f13
