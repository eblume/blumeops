apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: talos

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - external-secret.yaml
  - external-secret-op-token.yaml
  - external-secret-ts-talos-authkey.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - egress-gateway-deployment.yaml
  - egress-gateway-service.yaml
  - egress-gateway-networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - ingress-tailscale.yaml
  - ../../../forge

# Repo-pool policy ([[principals]]): repos.json lives in forge/ (its generator
# is ../../../forge, merged here) and lanes.json lives HERE. The hash-suffixed
# name changes the Deployment's volume ref on every edit, so a merged policy
# change rolls the pod by itself — the merge IS the deploy, no restart to
# remember.
configMapGenerator:
  - name: talos-repos
    behavior: merge
    files:
      - lanes.json

# First-party Nix image, built from eblume/talos (default.nix there). Every
# merge to talos main auto-releases and opens a pin-bump PR against this tag;
# merging that PR is the deploy gate.
images:
  - name: registry.ops.eblu.me/blumeops/talos
    newTag: v0.4.378-519a630-nix@sha256:22baea663cb4dd598c10a4ae307d0a53cef5b859f250b0d3571974ae7fd710c4
