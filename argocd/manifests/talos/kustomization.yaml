apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: talos

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - external-secret.yaml
  - external-secret-op-token.yaml
  - external-secret-ts-talos-authkey.yaml
  - pvc.yaml
  - networkpolicy.yaml
  - egress-gateway-deployment.yaml
  - egress-gateway-service.yaml
  - egress-gateway-networkpolicy.yaml
  - deployment.yaml
  - service.yaml
  - ingress-tailscale.yaml

# Repo-pool policy ([[principals]]): repos.json and lanes.json live HERE so
# kustomize can generate them into a ConfigMap. The hash-suffixed name changes
# the Deployment's volume ref on every edit, so a merged policy change rolls
# the pod by itself — the merge IS the deploy, no restart to remember. Also
# consumed in place by the forge-reconcile reconciler (CI + mise task).
configMapGenerator:
  - name: talos-repos
    files:
      - repos.json
      - lanes.json

# First-party Nix image, built from eblume/talos (default.nix there). Every
# merge to talos main auto-releases and opens a pin-bump PR against this tag;
# merging that PR is the deploy gate.
images:
  - name: registry.ops.eblu.me/blumeops/talos
    newTag: v0.4.291-a5bb131-nix@sha256:d0c3f0f864bca97ae3307916da7a586ae26d809f7b4601fdcaf1ac7f7c6057fc
