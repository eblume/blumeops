# Least-priv grant so the warrant-gated `forge-bot-pat-rotate` CI path can
# roll the talos Deployment: `rollout restart` is `get`+`patch` by name, and
# `rollout status` observes the Deployment through an informer
# (`list`+`watch`), which the single named rule still covers — kubectl
# scopes both list and watch to the object with a `metadata.name=talos`
# field selector.
# The credential is the `run-script` ServiceAccount in namespace `horkos`
# (bound token in blumeops-ci as `k3s-run-script/kubeconfig`, ringtail
# priv runner). The only write surface is `patch` on the single named
# `talos` deployment; nothing cluster-wide, nothing in other namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: run-script-talos-rollout
  namespace: talos
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["talos"]
    verbs: ["get", "list", "patch", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: run-script-talos-rollout
  namespace: talos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: run-script-talos-rollout
subjects:
  - kind: ServiceAccount
    name: run-script
    namespace: horkos
