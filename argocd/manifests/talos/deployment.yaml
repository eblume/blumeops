# Talos: browser-driven pi agent sessions.
#   talos — Bun server (sessions, SSE, OIDC, /api/transcribe) + pi runtime.
#           Tailnet egress routes through the egress-gateway pod (which holds
#           the tag:agent identity) via EGRESS_GATEWAY_URL; the gateway
#           resolves proxied hostnames itself, so the pod runs dnsPolicy: None.
#
# RWO PVC → Recreate strategy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos
  namespace: talos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: talos
  template:
    metadata:
      labels:
        app: talos
    spec:
      serviceAccountName: talos
      automountServiceAccountToken: false
      # The service is named 'talos', so k8s service links would inject
      # TALOS_PORT=tcp://... — colliding with the app's own env contract.
      enableServiceLinks: false
      # The egress gateway resolves every proxied hostname, and the pod's
      # few direct egresses (op → 1Password) use FQDNs — cluster DNS plus the
      # standard search paths covers the rest. If verification finds a client
      # that genuinely needs more, the fallback is ClusterFirst
      # (eblume/talos#69 stage 2).
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "10.43.0.10"
        searches:
          - "talos.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      securityContext:
        fsGroup: 1500
      initContainers:
        # local-path PV root is created root-owned; fsGroup fixes group but
        # not owner, and op wants HOME owned by uid 1500
        # ([[lesson_op_and_pvc_in_container]]).
        - name: fix-home-ownership
          image: registry.ops.eblu.me/blumeops/talos:kustomized
          command:
            - bash
            - -c
            - |
              mkdir -p /home/talos/workspace /home/talos/data
              chown 1500:1500 /home/talos /home/talos/workspace /home/talos/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: home
              mountPath: /home/talos
      containers:
        - name: talos
          image: registry.ops.eblu.me/blumeops/talos:kustomized
          ports:
            - containerPort: 3000
            - containerPort: 9464
              name: metrics
          env:
            - name: HOME
              value: /home/talos
            - name: TALOS_DATA_DIR
              value: /home/talos/data
            - name: TALOS_WORKSPACE
              value: /home/talos/workspace
            - name: TALOS_PUBLIC_URL
              value: "https://talos.ops.eblu.me"
            - name: TALOS_MODEL
              # 27B over max: ~4.4x cheaper input ($0.45/M vs $2/M), ~2x
              # cheaper output, and Willison's review found it excellent for
              # coding-agent loops once reasoning effort is kept low. The
              # server synthesizes the catalog entry from OpenRouter's live
              # listing (it postdates pi-ai's shipped catalog).
              value: "qwen/qwen3.8-27b"
            - name: TALOS_STT_MODEL
              value: "google/gemini-3.7-flash"
            - name: TALOS_STT_HINTS
              value: "talos, blumeops, heph, Forgejo, ArgoCD, OpenRouter, ringtail, indri"
            - name: TALOS_OIDC_INTERNAL_URL
              value: "http://authentik.authentik.svc.cluster.local:9000"
            # Repo-pool policy, delivered as the talos-repos ConfigMap (see
            # kustomization.yaml) — its hashed name rolls this pod on every
            # policy merge. The entrypoint falls back to curling the forge
            # raw path only when this env/mount is absent.
            - name: TALOS_REPOS_FILE
              value: /etc/talos/repos.json
            # Trust the fleet's shared agents-m2m machine identity for bearer
            # auth, so agents drive the API (e.g. cron jobs) with the same
            # credential agent-health uses — no browser session, no new secret.
            # aud defaults to agents-m2m in the server. See talos README (Auth).
            - name: TALOS_OIDC_M2M_ISSUER
              value: "https://authentik.ops.eblu.me/application/o/agents-m2m/"
            - name: TALOS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: talos-secrets
                  key: oidc-client-secret
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: talos-secrets
                  key: openrouter-api-key
            # HMAC key for the Forgejo PR-label webhook (POST
            # /api/webhooks/forge). Must equal the secret on the forge
            # hook; empty means the endpoint is disabled (404).
            - name: TALOS_FORGE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: talos-secrets
                  key: forge-webhook-secret
            # Identities (Authentik sub or email, comma-separated) allowed to
            # RELEASE the emergency stop (eblume/talos#38) — arm is open to any
            # signed-in user, release is admin-gated, and with OIDC on and this
            # empty no one could release (fail closed). See heph
            # 01M0RB6W2N2GZE2FH16EQC21QG.
            - name: TALOS_ADMINS
              value: "blume.erich@gmail.com"
            # The egress-gateway Service's fixed clusterIP (scheme+host[:port]
            # is the contract the entrypoint, wrappers, and server parse). IP
            # literal, so it resolves under dnsPolicy: None without a lookup.
            - name: EGRESS_GATEWAY_URL
              value: "http://10.43.254.1:8080"
          envFrom:
            - secretRef:
                name: talos-op-token # OP_SERVICE_ACCOUNT_TOKEN
          securityContext:
            runAsNonRoot: true
            runAsUser: 1500
            runAsGroup: 1500
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # /auth/login answers 302 in both OIDC and open modes — a liveness
          # signal that needs no cookie.
          livenessProbe:
            httpGet:
              path: /auth/login
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /auth/login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
              # nix builds write to the container's writable layer (the
              # canonical /nix/store is uid-1500-writable in the image);
              # this caps how far a build spree can eat the node's disk.
              ephemeral-storage: 10Gi
          volumeMounts:
            - name: home
              mountPath: /home/talos
            # Shared hephd spoke socket (uid 1500 == host agent user).
            - name: heph-socket
              mountPath: /home/talos/.local/share/heph
            - name: repos-policy
              mountPath: /etc/talos
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: talos-home
        - name: heph-socket
          hostPath:
            path: /home/agent/.local/share/heph
            type: Directory
        - name: repos-policy
          configMap:
            name: talos-repos
