# Talos: browser-driven pi agent sessions.
#   talos — Bun server (sessions, SSE, OIDC, /api/transcribe) + pi runtime.
#           Tailnet egress routes through the egress-gateway pod (which holds
#           the tag:talos identity) via EGRESS_GATEWAY_URL; the gateway
#           resolves proxied hostnames itself, so the pod runs dnsPolicy: None.
#
# RWO PVC → Recreate strategy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: talos
  namespace: talos
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: talos
  template:
    metadata:
      labels:
        app: talos
    spec:
      serviceAccountName: talos
      automountServiceAccountToken: false
      # The service is named 'talos', so k8s service links would inject
      # TALOS_PORT=tcp://... — colliding with the app's own env contract.
      enableServiceLinks: false
      # The egress gateway resolves every proxied hostname, and the pod's
      # few direct egresses (op → 1Password) use FQDNs — cluster DNS plus
      # the standard search paths covers the rest.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - "10.43.0.10"
        searches:
          - "talos.svc.cluster.local"
          - "svc.cluster.local"
          - "cluster.local"
      securityContext:
        fsGroup: 1500
        # see fix-home-ownership init container; avoids a full-PVC chgrp on mount
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # local-path PV root is created root-owned; fsGroup fixes group but
        # not owner, and op wants HOME owned by uid 1500
        # ([[lesson_op_and_pvc_in_container]]).
        - name: fix-home-ownership
          image: registry.ops.eblu.me/blumeops/talos:kustomized
          command:
            - bash
            - -c
            - |
              mkdir -p /home/talos/workspace /home/talos/data
              chown 1500:1500 /home/talos /home/talos/workspace /home/talos/data
              # Executor sidecar (V5-21, eblume/talos#365): uid 1600 in group
              # 1500 writes the pool object stores, the sessions' linked
              # worktrees, and the shared cargo target dir. The subPath dirs
              # are created and chown'd here: kubelet makes missing subPath
              # targets root-owned at 0755, so without this the group bits
              # would depend on the PVC root's setgid bit.
              mkdir -p /home/talos/sessions /home/talos/.cache/cargo-target \
                /home/talos/.local/share/mise /home/talos/.config/mise
              chown 1500:1500 /home/talos/sessions /home/talos/.cache/cargo-target \
                /home/talos/.local/share/mise /home/talos/.config/mise
              # One-shot (marker): the recursive group-write repair. From the
              # new image on, both entrypoints run umask 002, so everything
              # created afterwards is group-rw at birth.
              if [ ! -f /home/talos/.executor-shared-repair.done ]; then
                chmod -R g+rwX /home/talos/workspace /home/talos/sessions \
                  /home/talos/.cache/cargo-target \
                  /home/talos/.local/share/mise /home/talos/.config/mise
                touch /home/talos/.executor-shared-repair.done
              fi
              # Idempotent and cheap (a handful of repos): runs every pod
              # start, so repos cloned after first repair still get it.
              # core.sharedRepository=group makes that hold — the executor's
              # safe.directory * only defeats git's ownership check.
              (cd /home/talos/workspace && \
                for r in */; do \
                  [ -d "$r" ] || continue; \
                  git -C "$r" config core.sharedRepository group \
                    || echo "warn: git config failed in $r" >&2; \
                done)
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: home
              mountPath: /home/talos
      containers:
        - name: talos
          image: registry.ops.eblu.me/blumeops/talos:kustomized
          ports:
            - containerPort: 3000
            - containerPort: 9464
              name: metrics
          env:
            - name: HOME
              value: /home/talos
            - name: TALOS_DATA_DIR
              value: /home/talos/data
            - name: TALOS_WORKSPACE
              value: /home/talos/workspace
            # One shared incremental tree on the PVC for every Rust build in
            # every session (hephaestus is the only Rust repo in the pool):
            # without it each worktree builds cold and leaves a 5-20 GB
            # target/ behind (eblume/blumeops#813). On the PVC, so the tree
            # is warm across pod replacement; cargo's directory lock
            # serializes concurrent builds.
            - name: CARGO_TARGET_DIR
              value: /home/talos/.cache/cargo-target
            # Executor sidecar (V5-21, eblume/talos#365): set → every session
            # tool call is forwarded to the executor container over this
            # socket (shared emptyDir); unset → today's in-process behaviour.
            # Fail-fast, no silent fallback — a dead executor is a tool
            # error, not a security hole.
            - name: TALOS_EXECUTOR_SOCKET
              value: /run/talos/executor.sock
            - name: TALOS_PUBLIC_URL
              value: "https://talos.ops.eblu.me"
            - name: TALOS_MODEL
              # 27B over max: ~4.4x cheaper input ($0.45/M vs $2/M), ~2x
              # cheaper output, and excellent for coding-agent loops at low
              # reasoning effort. The server synthesizes the catalog entry
              # from OpenRouter's live listing (it postdates pi-ai's shipped
              # catalog).
              value: "qwen/qwen3.8-27b"
            - name: TALOS_STT_MODEL
              value: "google/gemini-3.7-flash"
            - name: TALOS_STT_HINTS
              value: "talos, blumeops, heph, Forgejo, ArgoCD, OpenRouter, ringtail, indri"
            - name: TALOS_OIDC_INTERNAL_URL
              value: "http://authentik.authentik.svc.cluster.local:9000"
            # Repo-pool policy, delivered as the talos-repos ConfigMap (see
            # kustomization.yaml) — its hashed name rolls this pod on every
            # policy merge.
            - name: TALOS_REPOS_FILE
              value: /etc/talos/repos.json
            # Lane-shaping policy (eblume/talos#252) — same ConfigMap/mount
            # as repos.json.
            - name: TALOS_LANES
              value: /etc/talos/lanes.json
            # Trust the fleet's shared talos-m2m machine identity for bearer auth,
            # so agents drive the API (e.g. cron jobs) with the same credential
            # agent-health uses — no browser session, no new secret.
            # List-valued: each entry is a bare issuer URL (audience derived
            # from the client id in the last path segment). See talos README (Auth).
            - name: TALOS_OIDC_M2M_ISSUER
              value: "https://authentik.ops.eblu.me/application/o/talos-m2m/"
            - name: TALOS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: talos-secrets
                  key: oidc-client-secret
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: talos-secrets
                  key: openrouter-api-key
            # HMAC key for the Forgejo PR-label webhook (POST
            # /api/webhooks/forge). Must equal the secret on the forge
            # hook; empty means the endpoint is disabled (404).
            - name: TALOS_FORGE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: talos-secrets
                  key: forge-webhook-secret
            # Identities (Authentik sub or email, comma-separated) allowed to
            # RELEASE the emergency stop (eblume/talos#38) — arm is open to
            # any signed-in user; release is admin-gated and fail-closed.
            - name: TALOS_ADMINS
              value: "blume.erich@gmail.com"
            # The egress-gateway Service's fixed clusterIP (scheme+host[:port]
            # is the contract the entrypoint, wrappers, and server parse). IP
            # literal, so it resolves under dnsPolicy: None without a lookup.
            - name: EGRESS_GATEWAY_URL
              value: "http://10.43.254.1:8080"
            # Cluster-internal destinations are not egress: the OIDC
            # discovery fetch (TALOS_OIDC_INTERNAL_URL) must not route
            # through the gateway (private address). The server appends its
            # own loopback + gateway entries to this list.
            - name: no_proxy
              value: ".cluster.local,authentik.authentik.svc.cluster.local"
            # Unattended pod: the heph CLI must print the stale-sync warning, not block on its interactive re-login prompt (eblume/hephaestus#66).
            - name: HEPH_NO_AUTO_RELOGIN
              value: "1"
            # Downward API: the pod's own ephemeral-storage limit, consumed by the store-watermark gc (eblume/talos#250).
            - name: TALOS_EPHEMERAL_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  resource: limits.ephemeral-storage
            # Session reaper (eblume/talos#295): daily sweep.
            - name: TALOS_SESSION_REAPER_DAYS
              value: "30"
            - name: TALOS_SESSION_REAPER_DRY_RUN
              value: "0"
            # Instance identity (eblume/talos#314) — required by the talos
            # image at boot (entrypoint and server) once that code merges.
            - name: TALOS_FORGE_URL
              value: "https://forge.ops.eblu.me"
            - name: TALOS_FORGE_OWNER
              value: "eblume"
            - name: TALOS_FORGE_BOT
              value: "talos"
            - name: TALOS_CREATOR_ALLOWLIST
              value: "eblume"
            # Trusted as human input equivalent to the owner's (the
            # cli-agent principal series, eblume/blumeops#1583).
            - name: TALOS_HUMAN_PROXY_PRINCIPALS
              value: "cli-agent"
            - name: TALOS_DEFAULT_ASSIGNEE
              value: "eblume"
            - name: TALOS_HORKOS_URL
              value: "https://horkos.ops.eblu.me"
            - name: TALOS_ARGOCD_SERVER
              value: "argocd.ops.eblu.me"
            - name: TALOS_OIDC_ISSUER
              value: "https://authentik.ops.eblu.me/application/o/talos/"
            - name: TALOS_OR_REFERER
              value: "https://talos.ops.eblu.me"
            - name: TALOS_PROMETHEUS_URL
              value: "https://prometheus.ops.eblu.me"
            - name: TALOS_GIT_AUTHOR_NAME
              value: "talos"
            - name: TALOS_GIT_AUTHOR_EMAIL
              value: "blume.erich+talos@gmail.com"
          envFrom:
            - secretRef:
                name: talos-op-token # OP_SERVICE_ACCOUNT_TOKEN
          securityContext:
            runAsNonRoot: true
            runAsUser: 1500
            runAsGroup: 1500
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # /healthz on the metrics server (:9464, same process and event
          # loop as the main server — a wedged process fails both); :3000 has
          # no /healthz and /auth/login there redirects. Thresholds err on
          # patience: a busy loop under multi-session load can stall for
          # minutes, and with one replica a liveness kill takes every session
          # down; a truly hung server still dies in ~4 minutes.
          #
          # Boot is not covered by that budget: the entrypoint's pool repair,
          # pre-warm, and cache cleanup run before the server listens (158s on
          # 2026-10-12, and the liveness probe killed the first container just
          # as :9464 came up). The startup probe owns boot, up to 10 minutes;
          # liveness and readiness only begin once it passes.
          startupProbe:
            httpGet:
              path: /healthz
              port: 9464
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9464
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9464
            periodSeconds: 10
            timeoutSeconds: 15
          # Sized for tens of concurrent sessions: every session's tool
          # processes (bash, cargo, nix, subagent pi) share this cgroup with
          # the single Bun event loop, so a CPU limit that binds starves the
          # server itself. ringtail has 16 cores / 64Gi; 16Gi leaves room
          # for ~30 sessions.
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "8"
              memory: 16Gi
              # nix builds write to the container's writable layer (the
              # canonical /nix/store is uid-1500-writable in the image); /tmp
              # is off the layer (home subPath mount below). The actual bound
              # is the watermark gc in the talos hourly sweep
              # (eblume/talos#250); this is the backstop capping how far a
              # build spree can eat the node's disk.
              ephemeral-storage: 40Gi
          volumeMounts:
            - name: home
              mountPath: /home/talos
            # /tmp off the writable layer: the same directory the entrypoint's
            # TMPDIR=$HOME/.tmp names, wiped at boot (contents only — never the
            # directory itself, or this mount pins a dead inode).
            - name: home
              mountPath: /tmp
              subPath: .tmp
            # Shared hephd spoke socket (uid 1500 == host agent user).
            - name: heph-socket
              mountPath: /home/talos/.local/share/heph
            # Executor socket (V5-21, eblume/talos#365): the executor
            # container binds /run/talos/executor.sock here (0660, gid 1500);
            # this container dials it.
            - name: talos-socket
              mountPath: /run/talos
            - name: repos-policy
              mountPath: /etc/talos
              readOnly: true
        # Executor (V5-21, eblume/talos#365): the session tool layer. Same
        # image, command overridden to the executor entry (the egress-gateway
        # same-image precedent). uid 1600 in the server's group 1500,
        # separate PID namespace from the server, no secrets, no envFrom, no
        # SA token (pod-wide automount off), and the only PVC window is the
        # subPath mounts — data/ and every token-holding path are never
        # mounted. Serves the seven file/shell tools over the Unix socket in
        # the shared talos-socket emptyDir; k8s restarts this container alone
        # when the socket stops answering (its own probe).
        # Contract: eblume/talos docs/executor-protocol.md (container contract).
        - name: executor
          image: registry.ops.eblu.me/blumeops/talos:kustomized
          command: ["/bin/dumb-init", "--", "/bin/talos-executor-entry"]
          env:
            # Plain scalars only — the entry hard-fails without the forge
            # config pair (it writes the executor's own git setup from them;
            # the askpass prints FORGEJO_TOKEN from the per-request env, so
            # no secret is baked in here).
            - name: TALOS_EXECUTOR_SOCKET
              value: /run/talos/executor.sock
            - name: CARGO_TARGET_DIR
              value: /home/talos/.cache/cargo-target
            - name: TALOS_FORGE_URL
              value: "https://forge.ops.eblu.me"
            - name: TALOS_FORGE_BOT
              value: "talos"
            # Same gateway base as the server: the executor's git forge
            # proxy rides the gateway's system port (eblume/talos#365).
            - name: EGRESS_GATEWAY_URL
              value: "http://10.43.254.1:8080"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1600
            runAsGroup: 1500
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # Liveness = the socket answers. The ping/pong frames exist for
          # this: the exec probe speaks the protocol's ping frame and exits
          # 0 on pong (no in-image probe helper — bun -e, the image's own
          # runtime). The startup probe owns boot (nix store registration)
          # the way the server's does.
          startupProbe:
            exec:
              command:
                - /bin/bun
                - -e
                - (async()=>{try{const t=setTimeout(()=>process.exit(2),5000);let b="";const s=await Bun.connect({unix:"/run/talos/executor.sock",socket:{data(_s,c){b+=Buffer.from(c).toString();const n=b.indexOf("\n");if(n<0)return;clearTimeout(t);try{if(JSON.parse(b.slice(0,n)).type==="pong"){s.end();process.exit(0)}process.exit(1)}catch{process.exit(1)}}}});s.write(JSON.stringify({v:1,type:"ping"})+"\n")}catch{process.exit(2)}})()
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - /bin/bun
                - -e
                - (async()=>{try{const t=setTimeout(()=>process.exit(2),5000);let b="";const s=await Bun.connect({unix:"/run/talos/executor.sock",socket:{data(_s,c){b+=Buffer.from(c).toString();const n=b.indexOf("\n");if(n<0)return;clearTimeout(t);try{if(JSON.parse(b.slice(0,n)).type==="pong"){s.end();process.exit(0)}process.exit(1)}catch{process.exit(1)}}}});s.write(JSON.stringify({v:1,type:"ping"})+"\n")}catch{process.exit(2)}})()
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          # The executor runs real session work (rg, fd, bash, and Rust/nix
          # builds into the shared cargo target); the server keeps its own
          # envelope — this is a second cgroup, not a slice of the server's.
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            # HOME is an emptyDir, never the server's PVC; the subPath mounts
            # are the executor's only window into the PVC.
            - name: executor-home
              mountPath: /home/talos
            - name: home
              mountPath: /home/talos/sessions
              subPath: sessions
            - name: home
              mountPath: /home/talos/workspace
              subPath: workspace
            - name: home
              mountPath: /home/talos/.cache/cargo-target
              subPath: .cache/cargo-target
            - name: home
              mountPath: /home/talos/.local/share/mise
              subPath: .local/share/mise
            - name: home
              mountPath: /home/talos/.config/mise
              subPath: .config/mise
            # /tmp off the writable layer (same reason as the server's).
            - name: executor-tmp
              mountPath: /tmp
            - name: talos-socket
              mountPath: /run/talos
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: talos-home
        - name: heph-socket
          hostPath:
            path: /home/agent/.local/share/heph
            type: Directory
        - name: repos-policy
          configMap:
            name: talos-repos
        # V5-21 executor sidecar (eblume/talos#365): the socket the server
        # dials, private to the pod.
        - name: talos-socket
          emptyDir: {}
        # The executor's HOME (gitconfig, askpass, nix store scratch) —
        # rebuilt at every container start; the subPath mounts above are its
        # only durable state.
        - name: executor-home
          emptyDir: {}
        - name: executor-tmp
          emptyDir: {}
