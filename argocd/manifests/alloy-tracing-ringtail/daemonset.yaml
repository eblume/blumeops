apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-tracing
  namespace: alloy
  labels:
    app: alloy-tracing
spec:
  selector:
    matchLabels:
      app: alloy-tracing
  template:
    metadata:
      labels:
        app: alloy-tracing
    spec:
      serviceAccountName: alloy-tracing
      hostPID: true
      containers:
        - name: alloy
          image: registry.ops.eblu.me/blumeops/alloy:kustomized
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12346
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - containerPort: 12346
              name: http
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # ~80% of the 2Gi limit; caps the Go allocator in the beyla
            # subprocess before the cgroup OOMs it (grafana/beyla#1354).
            - name: GOMEMLIMIT
              value: "1600MiB"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
          securityContext:
            privileged: true
            runAsUser: 0
      tolerations:
        - operator: Exists
      volumes:
        - name: config
          configMap:
            name: alloy-tracing-config
        - name: data
          emptyDir: {}
