# Paperless-ngx on ringtail k3s — Nix image, multi-process.
#
# The upstream s6 image ran web + worker + scheduler + consumer (and DB
# migrations) in one container. The Nix image (containers/paperless/
# default.nix) ships the binaries but no supervisor, so we run those as
# four containers in one pod, sharing the local data/consume dirs
# (emptyDir) and the NFS media volume; redis is colocated so
# PAPERLESS_REDIS=localhost works for all. A migrate initContainer runs
# DB migrations once before the app containers start.
#
# DB points in-cluster at the ringtail blumeops-pg (was pg.ops.eblu.me on
# indri). PAPERLESS_{DATA_DIR,MEDIA_ROOT,CONSUMPTION_DIR} are set
# explicitly because the Nix package does not default to the upstream
# /usr/src/paperless paths.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # redis as a native sidecar (restartPolicy: Always): starts before
        # the migrate init and stays running for the app containers, so all
        # of them reach PAPERLESS_REDIS=localhost:6379.
        - name: redis
          image: docker.io/library/redis:kustomized
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
        - name: migrate
          image: registry.ops.eblu.me/blumeops/paperless:kustomized
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["paperless-ngx", "migrate", "--no-input"]
          env: &paperless-env
            - name: PAPERLESS_URL
              value: "https://paperless.ops.eblu.me"
            - name: PAPERLESS_REDIS
              value: "redis://localhost:6379"
            - name: PAPERLESS_DBHOST
              value: "blumeops-pg-rw.databases.svc.cluster.local"
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              value: "paperless"
            - name: PAPERLESS_DBUSER
              value: "paperless"
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: db-password
            # Explicit port to override the k8s-injected PAPERLESS_PORT
            # (service named 'paperless' would set PAPERLESS_PORT=tcp://...)
            - name: PAPERLESS_PORT
              value: "8000"
            - name: PAPERLESS_DATA_DIR
              value: "/usr/src/paperless/data"
            - name: PAPERLESS_MEDIA_ROOT
              value: "/usr/src/paperless/media"
            - name: PAPERLESS_CONSUMPTION_DIR
              value: "/usr/src/paperless/consume"
            # Scratch must be SHARED across web and worker: API uploads are
            # written into SCRATCH_DIR by web (which mkdirs it) and read back
            # by the worker's consume_file (which doesn't) — so point it at
            # the root of a shared emptyDir, which always exists. Unset, it
            # resolved to /paperless: the Nix image has no /tmp, so Python's
            # gettempdir() falls back to the cwd (/), and the dir was neither
            # present in the worker nor shared from web. See the paperless
            # service card.
            - name: PAPERLESS_SCRATCH_DIR
              value: "/usr/src/paperless/scratch"
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: secret-key
            - name: PAPERLESS_TIME_ZONE
              value: "America/Los_Angeles"
            - name: PAPERLESS_OCR_LANGUAGE
              value: "eng"
            - name: PAPERLESS_TASK_WORKERS
              value: "1"
            - name: PAPERLESS_ADMIN_USER
              value: "eblume"
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: admin-password
            - name: PAPERLESS_ADMIN_MAIL
              value: "blume.erich@gmail.com"
            - name: PAPERLESS_APPS
              value: "allauth.socialaccount.providers.openid_connect"
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: socialaccount-providers
            - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
              value: "true"
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            - name: PAPERLESS_ACCOUNT_ALLOW_SIGNUPS
              value: "false"
            - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
              value: "false"
          volumeMounts: &paperless-mounts
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: scratch
              mountPath: /usr/src/paperless/scratch
            # The Nix image ships no /tmp; without one, gettempdir() falls
            # back to / and general temp files (celery multiprocessing,
            # etc.) land on the container overlay.
            - name: tmp
              mountPath: /tmp
      containers:
        - name: web
          image: registry.ops.eblu.me/blumeops/paperless:kustomized
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          env: *paperless-env
          volumeMounts: *paperless-mounts
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10

        - name: worker
          image: registry.ops.eblu.me/blumeops/paperless:kustomized
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["celery", "--app", "paperless", "worker", "--loglevel", "INFO"]
          env: *paperless-env
          volumeMounts: *paperless-mounts
          # OCR (ocrmypdf/tesseract) rasterizes pages and blows past 1Gi even
          # for small multi-page scans — the 1Gi cap from the indri→ringtail
          # migration OOMKilled consume_file mid-import, stranding uploads and
          # freezing the auto-incrementing ASN. 3Gi gives OCR real headroom.
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "3Gi"
              cpu: "1000m"

        - name: beat
          image: registry.ops.eblu.me/blumeops/paperless:kustomized
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["celery", "--app", "paperless", "beat", "--loglevel", "INFO"]
          env: *paperless-env
          volumeMounts: *paperless-mounts
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"

        - name: consumer
          image: registry.ops.eblu.me/blumeops/paperless:kustomized
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["paperless-ngx", "document_consumer"]
          env: *paperless-env
          volumeMounts: *paperless-mounts
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"

      volumes:
        - name: data
          emptyDir: {}
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media
        - name: consume
          emptyDir: {}
        - name: scratch
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: redis-data
          emptyDir:
            sizeLimit: 1Gi
