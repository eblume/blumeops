---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: torrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      # Cap the termination window for ringtail reboots — eblume/blumeops#906.
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        # The Nix image has a fixed uid-1000 user (no PUID/su-exec dance);
        # fsGroup makes the /config emptyDir writable for it. Matches the
        # ownership of the existing NFS download dirs.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transmission
          image: registry.ops.eblu.me/blumeops/transmission:kustomized
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Los_Angeles"
            - name: TRANSMISSION_RPC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: transmission-rpc
                  key: username
            - name: TRANSMISSION_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transmission-rpc
                  key: password
          # Stop in-flight transfers on shutdown so the daemon flushes NFS
          # with nothing in flight — eblume/blumeops#906.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # Session-id handshake (409 header), then transmission.control
                    # stop: halts transfers without pausing, so the queue resumes
                    # on next boot.
                    sid=$(curl -s --max-time 2 -o /dev/null -D - \
                          -u "${TRANSMISSION_RPC_USERNAME}:${TRANSMISSION_RPC_PASSWORD}" \
                          http://localhost:9091/transmission/rpc | tr -d '\r' | \
                          awk 'tolower($1) == "x-transmission-session-id:" { print $2 }')
                    [ -n "$sid" ] && curl -s --max-time 3 -o /dev/null \
                          -u "${TRANSMISSION_RPC_USERNAME}:${TRANSMISSION_RPC_PASSWORD}" \
                          -H "X-Transmission-Session-Id: $sid" \
                          -d '{"method":"transmission.control","arguments":["stop"]}' \
                          http://localhost:9091/transmission/rpc
                    sleep 2
          ports:
            - containerPort: 9091
              name: web
            - containerPort: 51413
              name: peer-tcp
            - containerPort: 51413
              protocol: UDP
              name: peer-udp
          volumeMounts:
            - name: downloads
              mountPath: /downloads
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          # tcpSocket rather than httpGet: with RPC auth on, every HTTP path
          # (including /transmission/web/) answers 401, which httpGet counts
          # as probe failure.
          livenessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: transmission-exporter
          image: registry.ops.eblu.me/blumeops/transmission-exporter:kustomized
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # exporter.py parses user:pass out of the ADDR URL; $(VAR) is
            # kubelet env interpolation of the two secret-sourced vars above.
            - name: TRANSMISSION_RPC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: transmission-rpc
                  key: username
            - name: TRANSMISSION_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transmission-rpc
                  key: password
            - name: TRANSMISSION_ADDR
              value: "http://$(TRANSMISSION_RPC_USERNAME):$(TRANSMISSION_RPC_PASSWORD)@localhost:9091"
          ports:
            - containerPort: 19091
              name: metrics
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: torrents-storage
        - name: config
          emptyDir: {}  # Config is ephemeral; torrents persist in NFS
