---
# Transmission RPC credentials ([[heph]] 01KXXDXF68RRJ4ASEA886DTAKV):
# the daemon reads these via TRANSMISSION_RPC_USERNAME/_PASSWORD in the
# entrypoint; the exporter sidecar embeds them in TRANSMISSION_ADDR.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transmission-rpc
  namespace: torrent
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: transmission-rpc
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: transmission
        property: username
    - secretKey: password
      remoteRef:
        key: transmission
        property: password
