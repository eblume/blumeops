database:
  path: /db/frigate.db

mqtt:
  enabled: false

go2rtc:
  streams:
    # GableCam IP is reserved in UX7 DHCP config
    gablecam:
      - "rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@192.168.1.159:554/h264Preview_01_main"
    gablecam_sub:
      - "rtsp://{FRIGATE_CAMERA_USER}:{FRIGATE_CAMERA_PASSWORD}@192.168.1.159:554/h264Preview_01_sub"

cameras:
  gablecam:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/gablecam
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/gablecam_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: true
      stationary:
        max_frames:
          default: 1500
    motion:
      mask:
        - 0.401,0.026,0.4,0.078,0.587,0.072,0.585,0.02
        - 0.881,0.422,0.789,0.245,0.595,0.054,0.531,0,0.634,0,0.824,0.192,0.892,0.307
    zones:
      driveway_entrance:
        coordinates: 0.818,0.362,0.735,0.344,0.662,0.196,0.74,0.236
        objects: [car, dog, person]
        inertia: 3
        loitering_time: 0
      driveway:
        coordinates: 0.728,0.367,0.645,0.2,0.218,0.25,0.128,0.296,0.003,0.565,0.001,0.992,0.826,0.992,0.897,0.665,0.869,0.608,0.792,0.377
        objects: [person, dog, cat]
    review:
      alerts:
        labels: [person, car]
        required_zones:
          - driveway_entrance
          - driveway
      detections:
        required_zones:
          - driveway
          - driveway_entrance
    objects:
      track: [person, car, dog, cat, bird]
      filters:
        person:
          # Ignore "person" false-positives over the bottom-right planter (a
          # newly-planted Japanese maple, ~2026-06-20) that yolov9 reads as a
          # person at 0.57-0.84 score — too high to threshold out. This corner is
          # the front deck stairs, so the trade-off is that we no longer alert on
          # someone actually on the stairs; in practice they should trip an alert
          # as soon as they step off into the driveway. Driveway coverage is
          # otherwise unaffected. Frigate filters an object when its box
          # bottom-center falls inside the mask.
          mask:
            - 0.78,0.66,0.90,0.66,0.90,0.90,0.78,0.90

detectors:
  onnx:
    type: onnx

model:
  model_type: yolo-generic
  width: 640
  height: 640
  input_tensor: nchw
  input_dtype: float
  path: /media/frigate/models/yolov9-c-640.onnx
  labelmap_path: /labelmap/coco-80.txt

record:
  enabled: true
  preview:
    quality: very_low
  continuous:
    days: 30
  motion:
    days: 365
  alerts:
    retain:
      days: 730
      mode: active_objects
  detections:
    retain:
      days: 30
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14
