---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shower-app-secrets
  namespace: shower
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: shower-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: "Shower (blumeops)"
        property: secret-key
