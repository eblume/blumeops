---
# The zot-cv API key (create,update on blumeops/cv only — see the
# zot role accessControl), consumed by the horkos publisher when it pushes
# the cv release tarball as blumeops/cv:<version> (eblume/horkos#17). The
# master copy lives in the Forgejo Secrets item, field zot-cv-api, maintained
# by `mise run zot-apikey-rotate zot-cv`. The horkos deployment has no
# reloader: after a rotation the pod must be recycled to pick up the key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: horkos-zot
  namespace: horkos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: horkos-zot
    creationPolicy: Owner
  data:
    - secretKey: HORKOS_ZOT_API_KEY
      remoteRef:
        key: Forgejo Secrets
        property: zot-cv-api
