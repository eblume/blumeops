---
# The horkos publisher's zot identity — username and API key
# (create,update on blumeops/cv only, see the zot role accessControl),
# consumed by the horkos publisher when it pushes the cv release tarball as
# blumeops/cv:<version> (eblume/horkos#17; horkos tier of
# eblume/blumeops#1039 step 2b). The master copy lives in the Forgejo
# Secrets item, field horkos-zot-api, maintained by
# `mise run zot-apikey-rotate horkos-zot`. The horkos deployment has no
# reloader: after a rotation the pod must be recycled to pick up the key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: horkos-zot
  namespace: horkos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: horkos-zot
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Username templated in alongside the key so both appear atomically:
        # horkos sends zot auth whenever the user is set, and zot answers bad
        # credentials with 401 — a user without its key would break every
        # horkos/talos image pin (eblume/horkos#17).
        HORKOS_ZOT_USER: horkos-zot
        HORKOS_ZOT_API_KEY: "{{ .apiKey }}"
  data:
  - secretKey: apiKey
    remoteRef:
      key: Forgejo Secrets
      property: horkos-zot-api
