---
# The forge→horkos release webhook signing secret: one shared secret across
# all release repos (talos, horkos, cv, blumeops). Until the 'horkos forge
# webhook' item exists in the blumeops vault (the named human step of
# eblume/horkos#17) this ExternalSecret cannot fetch and the app shows it
# degraded — the expected pre-arm state. The horkos route 404s while the env
# is unset, so deploying this is inert until the item and the hook are
# provisioned.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: horkos-forge-hook
  namespace: horkos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: horkos-forge-hook
    creationPolicy: Owner
  data:
    - secretKey: HORKOS_FORGE_HOOK_SECRET
      remoteRef:
        key: horkos forge webhook
        property: credential
