---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horkos
  namespace: horkos
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC (SQLite)
  selector:
    matchLabels:
      app: horkos
  template:
    metadata:
      labels:
        app: horkos
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1500
      containers:
        - name: horkos
          image: registry.ops.eblu.me/blumeops/horkos:kustomized
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HORKOS_DB
              value: /data/horkos.db
            # Armed from day one — horkos inherits warrant's armed state
            # (warrant armed 2026-08-03). Approving a request dispatches its
            # workflow as horkos-forge. To disarm, set "0" and sync — the
            # credential stays in place but is ignored.
            - name: HORKOS_DISPATCH_ENABLED
              value: "1"
            # Tailnet name — the public forge.eblu.me static mirror has no
            # API, so an in-cluster dispatch would fail silently.
            - name: HORKOS_FORGE_API
              value: https://forge.ops.eblu.me/api/v1
            # Pinned explicitly: the app's built-in defaults predate the blumeops#1039 step-4
            # rename of the M2M principal; the fleet identity is talos-m2m.
            - name: HORKOS_ISSUER
              value: https://authentik.ops.eblu.me/application/o/talos-m2m/
            - name: HORKOS_CLIENT_ID
              value: talos-m2m
            # Instance config (eblume/horkos#52): the app's per-instance
            # identity, delivered here instead of in code. Inert on the
            # current image (it ignores these names); the instance-document
            # release requires every one of them at boot.
            - name: HORKOS_OIDC_URL
              value: https://authentik.ops.eblu.me
            - name: HORKOS_HUMAN_ISSUER
              value: https://authentik.ops.eblu.me/application/o/horkos/
            - name: HORKOS_HUMAN_CLIENT_ID
              value: horkos
            - name: HORKOS_PUBLIC_URL
              value: https://horkos.ops.eblu.me
            - name: HORKOS_REGISTRY
              value: registry.ops.eblu.me
            - name: HORKOS_REPO_OWNER
              value: eblume
            - name: HORKOS_REPO_NAME
              value: blumeops
            - name: HORKOS_POLICY_FILE
              value: warrant-policy.yaml
            - name: HORKOS_PR_ASSIGNEE
              value: eblume
            # Author email for the release publisher's pin-PR commits —
            # horkos's own principal identity, not the talos bot's.
            - name: HORKOS_GIT_EMAIL
              value: blume.erich+horkos@gmail.com
            # Release publisher topology — the horkos-release-targets
            # ConfigMap generated in kustomization.yaml; its hash-suffixed
            # name rolls the pod on every topology change.
            - name: HORKOS_RELEASE_TARGETS_FILE
              value: /etc/horkos/release-targets.json
          envFrom:
            - secretRef:
                name: horkos-oidc
                optional: true  # human door degrades to 503 on /auth/login, API unaffected
            - secretRef:
                name: horkos-dispatch
                optional: true  # dispatch stays inert without the token
            - secretRef:
                name: horkos-forge-hook
                optional: true  # release webhook stays inert (route 404s) until the secret is provisioned
            - secretRef:
                name: horkos-forge-read
                optional: true  # cv release-asset fetch stays inert without the token
            - secretRef:
                name: horkos-zot
                optional: true  # cv artifact push stays inert; user and key land atomically
          securityContext:
            runAsNonRoot: true
            runAsUser: 1500
            runAsGroup: 1500
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: release-targets
              mountPath: /etc/horkos
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: horkos-data
        - name: tmp
          emptyDir: {}
        - name: release-targets
          configMap:
            name: horkos-release-targets
