---
# The agents-bot Forgejo PAT (read collaborator on eblume/cv), ESO-mounted
# for the horkos publisher's cv release-asset fetch (eblume/horkos#17).
# The 'horkos forge read' item (field 'token') in the blumeops vault holds a
# copy of op://agents/agents-forgejo-token/api-token — a human step. Until
# it exists this ExternalSecret cannot fetch and the app shows it degraded —
# the expected pre-arm state; the cv flow fails loud and is retryable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: horkos-forge-read
  namespace: horkos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: horkos-forge-read
    creationPolicy: Owner
  data:
    - secretKey: HORKOS_FORGE_READ_TOKEN
      remoteRef:
        key: horkos forge read
        property: token
