---
# The dispatch credential: horkos-forge's write:repository,write:issue PAT, minted by
# `mise run horkos-forge-provision` and stored at op://blumeops/horkos-forge-token.
# Present in the pod but inert until HORKOS_DISPATCH_ENABLED=1 — deploying
# the capability and arming it are separate decisions.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: horkos-dispatch
  namespace: horkos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: horkos-dispatch
    creationPolicy: Owner
  data:
    - secretKey: HORKOS_DISPATCH_TOKEN
      remoteRef:
        key: horkos-forge-token
        property: token
