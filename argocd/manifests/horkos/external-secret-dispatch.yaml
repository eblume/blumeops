---
# The dispatch credential: warrant-bot's write:repository PAT, minted by
# `mise run warrant-bot-provision` (the bot identity keeps its name — the
# service renamed, its forge account did not). Present in the pod but inert
# until HORKOS_DISPATCH_ENABLED=1 — deploying the capability and arming it
# are separate decisions.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: horkos-dispatch
  namespace: horkos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: horkos-dispatch
    creationPolicy: Owner
  data:
    - secretKey: HORKOS_DISPATCH_TOKEN
      remoteRef:
        key: warrant-dispatch-token
        property: token
