---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: horkos
resources:
  - deployment.yaml
  - pvc.yaml
  - service.yaml
  - ingress-tailscale.yaml
  - rbac.yaml
  - external-secret-oidc.yaml
  - external-secret-dispatch.yaml
  - external-secret-forge-hook.yaml
  - external-secret-forge-read.yaml
  - external-secret-zot.yaml
# First-party Nix image, built from eblume/horkos (default.nix there). Every
# merge to horkos main auto-releases and opens a pin-bump PR against this
# tag; merging that PR is the deploy (the app auto-syncs, like talos —
# see argocd/apps/horkos.yaml).
# v0.5.0-unbuilt-nix is a pre-first-release placeholder: nothing to sync
# until the first release PR replaces it.
# Release-publisher topology (eblume/horkos#52): release-targets.json lives
# HERE so kustomize generates it into a ConfigMap. The hash-suffixed name
# changes the Deployment's volume ref on every edit, so a merged topology
# change rolls the pod by itself — the merge IS the deploy.
configMapGenerator:
  - name: horkos-release-targets
    files:
      - release-targets.json
images:
  - name: registry.ops.eblu.me/blumeops/horkos
    newTag: v0.5.42-30493d5-nix@sha256:4eb7b497ae1a7cb09509c20ed908ecd2cc8e669f54c571ffe7c9dfbfb5d8c783
