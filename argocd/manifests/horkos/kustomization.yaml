---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: horkos
resources:
  - deployment.yaml
  - pvc.yaml
  - service.yaml
  - ingress-tailscale.yaml
  - rbac.yaml
  - external-secret-oidc.yaml
  - external-secret-dispatch.yaml
  - external-secret-forge-hook.yaml
  - external-secret-forge-read.yaml
  - external-secret-zot.yaml
# First-party Nix image, built from eblume/horkos (default.nix there). Every
# merge to horkos main auto-releases and opens a pin-bump PR against this
# tag; merging that PR is the deploy (the app auto-syncs, like talos —
# see argocd/apps/horkos.yaml).
# v0.5.0-unbuilt-nix is a pre-first-release placeholder: nothing to sync
# until the first release PR replaces it.
images:
  - name: registry.ops.eblu.me/blumeops/horkos
    newTag: v0.5.31-a168059-nix@sha256:1544d4ba7ee04ca6b30a5f94cd8f7c2b54afa7f7affae70bd5884642ae47a52d
