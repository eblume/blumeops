# Persistent HOME for the agent: the self-installed claude binary, the OAuth
# credential (refreshed in place), the per-session git worktrees, and the repo
# pool under ~/code/personal. Survives pod restarts so the OAuth login is
# seeded once, not every boot.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-ws-home
  namespace: agent-ws
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
