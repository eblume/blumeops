# The agents-ringtail-rw 1Password service-account token — the pod's ONE
# bootstrap secret. With it the agent reads everything else it needs from the
# *agents* vault at runtime via `op` (FORGEJO_TOKEN, etc.), so nothing
# agents-vault-scoped is staged in k8s etcd. The token itself lives in the
# blumeops vault (external-secrets can only read blumeops), same item ansible
# reads for the host's /etc/agents/op-token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-ws-op-token
  namespace: agent-ws
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: agent-ws-op-token
    creationPolicy: Owner
  data:
    - secretKey: OP_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: agents-ringtail Service Account
        property: credential
