# The tag:agent Tailscale auth key for the sidecar. Minted by Pulumi
# (agent_ws_authkey) and synced into this blumeops-vault item by
# `mise run agent-ws-authkey-sync`; external-secrets projects it here. The
# sidecar can't `op read` for itself, so this must be a real k8s Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ts-agent-authkey
  namespace: agent-ws
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-blumeops
  target:
    name: ts-agent-authkey
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: agent-ws Tailscale Auth Key
        property: authkey
