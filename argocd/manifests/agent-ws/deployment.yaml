# Containerized ringtail-agent workspace. Two containers:
#   agent — claude Remote Control + curated toolchain (self-installs claude onto
#           the PVC at pod-start); reaches the forge/heph via the sidecar SOCKS.
#   ts    — userspace Tailscale sidecar; the pod's OWN tag:agent identity and the
#           only path to the tailnet (enforced by the egress NetworkPolicy).
#
# RWO PVC → Recreate strategy (no two pods contending for the volume).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ws
  namespace: agent-ws
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent-ws
  template:
    metadata:
      labels:
        app: agent-ws
    spec:
      serviceAccountName: agent-ws
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1500
      initContainers:
        # The local-path PV root (/home/agent) is created root-owned; fsGroup
        # fixes group + setgid but NOT the owner, and op wants HOME owned by uid
        # 1500 (see [[lesson_op_and_pvc_in_container]]). Chown it once at pod
        # start, as root, so this holds on a fresh PVC without a manual chown.
        # Uses the agent-ws image (chown is on the baked config.Env PATH).
        - name: fix-home-ownership
          image: registry.ops.eblu.me/blumeops/agent-ws:kustomized
          command: ["chown", "1500:1500", "/home/agent"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: home
              mountPath: /home/agent
      containers:
        # ── the agent ────────────────────────────────────────────────────────
        - name: agent
          image: registry.ops.eblu.me/blumeops/agent-ws:kustomized
          env:
            - name: HOME
              value: /home/agent
          envFrom:
            - secretRef:
                name: agent-ws-op-token # OP_SERVICE_ACCOUNT_TOKEN
          securityContext:
            runAsNonRoot: true
            runAsUser: 1500
            runAsGroup: 1500
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/agent
            # Shared hephd: the pod runs no hephd of its own — it mounts the host
            # agent-heph-spoke's socket dir and the baked `heph` CLI connects to
            # it at the default path ($HOME/.local/share/heph/hephd.sock). uid
            # 1500 == the host agent user, so the socket is reachable. heph is the
            # deliberate in-boundary substrate (see agent-containerization.md).
            - name: heph-socket
              mountPath: /home/agent/.local/share/heph
        # ── userspace Tailscale sidecar (tag:agent) ──────────────────────────
        - name: ts
          image: registry.ops.eblu.me/blumeops/tailscale:v1.98.5-623e89a-nix
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-agent-authkey
                  key: TS_AUTHKEY
            - name: TS_USERSPACE
              value: "true"
            - name: TS_SOCKS5_SERVER
              value: "localhost:1055"
            - name: TS_STATE_DIR
              value: "/tmp/ts"
            # Disable containerboot's k8s-Secret state backend (would need RBAC
            # on a "tailscale" Secret + Events); use filesystem state instead.
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_HOSTNAME
              value: "agent-ws"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: ts-tmp
              mountPath: /tmp
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: agent-ws-home
        - name: ts-tmp
          emptyDir: {}
        # The host agent-heph-spoke's socket dir (uid 1500). Shared, not per-pod
        # hephd — see the agent container's volumeMount.
        - name: heph-socket
          hostPath:
            path: /home/agent/.local/share/heph
            type: Directory
