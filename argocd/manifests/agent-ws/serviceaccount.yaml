# Restricted ServiceAccount for the agent workspace pod.
# Deliberately grants NO Kubernetes API access — no Role/RoleBinding exists, and
# the token is not mounted. The agent must never be able to reach the cluster
# API (that would reopen a deploy path); its only outward reach is the tag:agent
# tailnet fence. See [[agent-containerization]].
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-ws
  namespace: agent-ws
automountServiceAccountToken: false
