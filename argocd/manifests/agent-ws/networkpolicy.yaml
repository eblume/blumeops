# The load-bearing egress fence — PROVEN on-box 2026-07-30.
#
# A k3s pod NATs out through the node, so without this the agent reaches indri's
# tailnet IP as *ringtail's* tag:homelab identity (the node-NAT trap), silently
# defeating the tag:agent fence. Blocking the tailnet CGNAT range forces ALL
# tailnet access through the sidecar's own WireGuard (which egresses to real
# endpoints / DERP, never 100.64/10), so indri only ever sees the pod as
# tag:agent. Everything else (Claude relay, 1Password, claude.ai, forge.eblu.me,
# in-cluster DNS) egresses normally — none of it carries a tailnet identity.
#
# Verified: with this applied, the SOCKS path to indri:8787 still returns 200
# while a direct (no-proxy) hit is refused in ~4ms. k3s enforces NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-ws-egress-fence
  namespace: agent-ws
spec:
  podSelector:
    matchLabels:
      app: agent-ws
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 100.64.0.0/10
