# Gitleaks configuration — see .forgejo/workflows/lint.yaml (secret-scan job).
#
# Extends the builtin ruleset; entries here only suppress, never detect less
# elsewhere. Keep every allowlist narrow enough to state its false-positive
# class in one line.

[extend]
useDefault = true

# Locally-built image tags follow `<name>:v<version>-<git-hash>-nix`
# (containers/README: nix dockerTools builds pushed to registry.ops.eblu.me).
# The 7-hex-char hash segment trips generic-api-key on every image bump, in
# manifests and in changelog prose quoting them. Match the bare tag as the
# captured secret rather than `name:tag` in the surrounding text: prose like
# "valkey, v3.20.1-f403fce-nix" has no colon, and a comma after a keyword
# ("valkey", "authentik-redis") is enough for generic-api-key to fire.
[[allowlists]]
description = "nix-built container image tags (vX.Y.Z-<hash>-nix)"
regexTarget = "secret"
regexes = ['''^v[\w.]+-[0-9a-f]{5,40}-nix$''']

# 1Password item ids are 26 lowercase-alphanumeric characters — a stable
# identifier, not a credential. Pinned ids (e.g. hephTokenItemId in
# nixos/ringtail/agent-heph-spoke.nix) trip generic-api-key when a keyword
# like "Token" precedes the quoted id.
[[allowlists]]
description = "1Password item ids (26-char lowercase alphanumeric)"
regexTarget = "secret"
regexes = ['^[a-z0-9]{26}$']
