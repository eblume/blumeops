# network/unifi/networks.yaml: exported from the UX7 by `mise run unifi export`.
# Ids are rewritten to names; secrets are op:// references.
networks:
- management: GATEWAY
  name: Default
  enabled: true
  vlanId: 1
  isolationEnabled: false
  cellularBackupEnabled: true
  zone: Internal
  internetAccessEnabled: true
  mdnsForwardingEnabled: true
  ipv4Configuration:
    autoScaleEnabled: true
    hostIpAddress: 192.168.1.1
    prefixLength: 24
    dhcpConfiguration:
      mode: SERVER
      ipAddressRange:
        start: 192.168.1.6
        stop: 192.168.1.254
      leaseTimeSeconds: 86400
      domainName: localdomain
      pingConflictDetectionEnabled: true
  default: true
- management: GATEWAY
  name: Guest
  enabled: true
  vlanId: 2
  isolationEnabled: false
  cellularBackupEnabled: true
  zone: Internal
  internetAccessEnabled: true
  mdnsForwardingEnabled: true
  ipv4Configuration:
    autoScaleEnabled: true
    hostIpAddress: 192.168.2.1
    prefixLength: 24
    dhcpConfiguration:
      mode: SERVER
      ipAddressRange:
        start: 192.168.2.6
        stop: 192.168.2.254
      leaseTimeSeconds: 86400
      domainName: ''
      pingConflictDetectionEnabled: true
  default: false
- management: GATEWAY
  name: IoT
  enabled: true
  vlanId: 3
  isolationEnabled: false
  cellularBackupEnabled: true
  zone: Internal
  internetAccessEnabled: true
  mdnsForwardingEnabled: true
  ipv4Configuration:
    autoScaleEnabled: true
    hostIpAddress: 192.168.3.1
    prefixLength: 24
    dhcpConfiguration:
      mode: SERVER
      ipAddressRange:
        start: 192.168.3.6
        stop: 192.168.3.254
      leaseTimeSeconds: 86400
      domainName: ''
      pingConflictDetectionEnabled: true
  default: false
