# Warrant policy — the agent-autonomy boundary as a reviewed artifact.
# Phase 4 seed of [[warrant-approval-gated-runs]].
#
# `mise run request-run` reads THIS FILE FROM main (never the local
# checkout — the same definitions-from-main rule as invariant 3) and
# refuses to file requests that don't conform. The future Warrant broker
# enforces the same policy server-side.
#
# Classes:
#   warrant — requestable; a human approval is required to execute
#   auto    — reserved: auto-approved with post-hoc audit (nothing uses
#             this yet; moving an action here is a reviewed policy change)
#   deny    — not requestable at all, with or without approval
#
# Unknown actions are implicitly `deny` — adding a privileged workflow
# means adding its policy entry in the same PR.
#
# `binds_sha: <input>` names the dispatch input that carries the approved
# SHA — the payload half of invariant 3. request-run refuses a request
# whose bound SHA does not reach that input, so an approval can no longer
# read "build bcb2b55" while CI builds main. Every warrant-class action
# needs one: a privileged run free to ignore the SHA is precisely what the
# approval was meant to constrain.
#
# A binding input's `pattern` stays looser than that rule (it still admits
# `main`) because the pattern is the floor for a manual UI dispatch and for
# the future server-side check. request-run holds the tighter line.
version: 1

actions:
  argocd-deploy.yaml:
    class: warrant
    binds_sha: revision
    inputs:
      app:
        required: true
        # validated against argocd/apps/<app>.yaml on main at request time
        validate: argocd-app
      revision:
        required: true
        # `declared` syncs the app at the revision its Application on main
        # already declares (tag-tracking apps): the bound SHA is then the
        # blumeops commit declaring the revision, not a revision itself.
        pattern: "^(main|declared|[0-9a-f]{40})$"
      sync:
        required: false
        pattern: "^(true|false)$"
      # The only input in this policy that DELETES live resources. It stays
      # warrant-class with no shortcut: the approver reads which app is being
      # pruned, and the run log names what went.
      prune:
        required: false
        pattern: "^(true|false)$"

  argocd-sync-apps.yaml:
    class: warrant
    note: >-
      Sync the app-of-apps root (apps) from a bound SHA: pin the root to the
      SHA, sync, wait healthy, then reset the root to tracking main.
      argocd-deploy.yaml cannot do this without leaving the root pinned — a
      pinned root reads Synced against the pin and silently ignores later
      argocd/apps/ merges.
    binds_sha: revision
    inputs:
      revision:
        required: true
        pattern: "^(main|[0-9a-f]{40})$"

  deploy-fly.yaml:
    class: warrant
    binds_sha: revision
    inputs:
      revision:
        required: true
        pattern: "^(main|[0-9a-f]{40})$"

  ringtail-rebuild.yaml:
    class: warrant
    note: >-
      Apply a bound blumeops SHA to ringtail: nixos-rebuild switch via the root
      ringtail-apply@<sha> unit the priv runner may start (polkit). First
      decomposition step toward provision-ringtail (which stays deny: its
      ansible pre_tasks read the blumeops vault).
    binds_sha: revision
    inputs:
      revision:
        required: true
        pattern: "^[0-9a-f]{40}$"

  # One-off script execution (heph eblume/horkos#6): the script body travels
  # in the request inputs as (script, script_sha256), horkos binds the pair
  # at filing and freezes it in the warrant, and the executor workflow
  # verifies the hash before running and reports the full run back to horkos.
  run-script.yaml:
    class: warrant
    binds_sha: revision
    inputs:
      revision:
        required: true
        pattern: "^(main|[0-9a-f]{40})$"
      script:
        required: true
      script_sha256:
        required: true
        pattern: "^[0-9a-f]{64}$"

  provision-indri.yaml:
    class: warrant
    note: >-
      Apply a bound blumeops SHA's nix-darwin generation to indri: darwin-rebuild
      switch via the zero-prompt `--tags rebuild` path (task guards, checkout to
      a root-owned /etc/blumeops, detached sudo -n -H darwin-rebuild), from the
      host-mode indri runner (erichblume + NOPASSWD sudo). The job is
      fire-and-forget (#1266): it launches the detached switch, exits green, and
      dispatches provision-indri-verify.yaml, which polls the .status sidecar
      and is the true verdict — verify-runs closes the tracking task from that
      verify run, never the apply run. The rebuild path reads no vault — every
      `op read` in the play is role-tagged — so the old Phase-2 gate
      (blumeops-ci vault split + priv runner) never applied to the generation
      flip; the full ansible provision (roles, secrets) stays a human window.
    binds_sha: revision
    inputs:
      revision:
        required: true
        pattern: "^[0-9a-f]{40}$"
      pr:
        required: false
        pattern: "^[0-9]+$"
  # The full provision still reads the blumeops vault in its ansible pre_tasks,
  # and its root paths beyond the rebuild unit are open (the narrow rebuild
  # warrant is ringtail-rebuild.yaml).
  provision-ringtail.yaml:
    class: deny
    note: "Full provision: its ansible pre_tasks read the blumeops vault, and the priv-runner decomposition beyond the rebuild unit is open"
