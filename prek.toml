# prek.toml - Git hooks configuration
# Run: prek run --all-files
# Install: prek install && prek install --hook-type commit-msg

# Built-in hooks (fast, Rust-native — no external dependencies)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files", args = [
    "--maxkb=1000",
  ] },
  { id = "check-merge-conflict" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-case-conflict" },
  { id = "detect-private-key" },
  { id = "check-executables-have-shebangs" },
]

# check-yaml with --unsafe (builtin fast path doesn't support --unsafe yet)
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"        # v6.0.0
hooks = [{ id = "check-yaml", args = ["--unsafe"] }]

# Note: `mise-tasks/prek-full-run-check` reads the repo paths passed in hook
# `args` (like `-c .yamllint.yaml` below) as config files whose change forces
# a full lint run — pass any new hook config by path and that stays true.
# YAML linting
[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "cba56bcde1fdd01c1deb3f945e69764c291a6530"               # v1.38.0
hooks = [{ id = "yamllint", args = ["-c", ".yamllint.yaml"] }]

# Ansible linting
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ansible-lint"
name = "ansible-lint"
entry = "env ANSIBLE_ROLES_PATH=ansible/roles ansible-lint ansible/"
language = "python"
# One project-wide run instead of per-file batches: `pass_filenames = false`
# so CI's file list never reaches the entry, and the entry names the project.
# `files` only gates WHEN it runs (any `ansible/` file, or its own config,
# including config-only PRs). `require_serial` keeps it from linting a tree
# while a hook is rewriting files mid-pass.
files = '^ansible/|\.ansible-lint$|^prek\.toml$'
pass_filenames = false
require_serial = true
additional_dependencies = ["ansible-lint==26.10.1", "ansible-core==2.21.5"]

# Python - ruff for linting and formatting
#
# The first two hooks select by content type and cover Python everywhere.
#
# mise-tasks/ is invisible to that selection: every task is an extensionless
# file, and `identify` reads `#!/usr/bin/env -S uv run --script` as the
# interpreter `uv`, so it never tags the file `python`. The third hook selects
# that directory by path instead. It is where most of this repo's logic lives,
# so it is the last place that should go unlinted.
#
# mise-tasks/ is mixed bash and uv-python and ruff cannot parse the bash.
# `exclude_types = ["shell"]` is the split: bash tasks are tagged `shell` from
# their shebang, uv scripts are tagged only `executable, file, text`. It needs
# no maintenance as tasks are added in either language.
#
# There is deliberately no ruff-format pass over mise-tasks/. The formatter
# normalizes `#COMMENT` to `# COMMENT`, and mise matches its task metadata
# comments — `#MISE description=`, `#MISE alias=` — without a space. Formatting
# the directory drops every task description from `mise tasks`, including the
# `[human]` prefixes AGENTS.md keys the agent fence off, and breaks aliases.
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "38bfb07c0c64c304f47eb52090f8288150c77730" # v0.17.1
hooks = [
  { id = "ruff", args = [
    "--fix",
  ] },
  { id = "ruff-format" },
  { id = "ruff", alias = "ruff-mise-tasks", name = "ruff (mise-tasks)", args = [
    "--fix",
  ], types = [
    "text",
  ], types_or = [
    "text",
  ], exclude_types = [
    "shell",
  ], files = '^mise-tasks/' },
]

# Shell scripts - shellcheck and shfmt
#
# The generic shellcheck hook runs at warning severity. nixos/ringtail/ holds
# ringtail-apply.sh, the sudo target of the ringtail-rebuild warrant — the one
# script in this repo that runs as root on ringtail — so it is linted at the
# strictest severity to keep the bar visible and pinned there. See
# [[warrant-approval-gated-runs]].
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "745eface02aef23e168a8afb6b5737818efbea95" # v0.11.0.1
hooks = [
  { id = "shellcheck", args = [
    "--severity=warning",
  ] },
  { id = "shellcheck", alias = "shellcheck-ringtail", name = "shellcheck (ringtail, style)", args = [
    "--severity=style",
  ], files = '^nixos/ringtail/.*\.sh$' },
]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "479be5958357ba5ab65ce47172117348516860e9"             # v3.14.1-1
hooks = [{ id = "shfmt", args = ["-i", "2", "-ci", "-bn"] }]

# TOML - taplo
[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "ade0f95ddcf661c697d4670d2cfcbe95d0048a0a"                                 # v0.9.3
hooks = [{ id = "taplo-format" }, { id = "taplo-lint", args = ["--no-schema"] }]

# JSON formatting (prettier for consistent style)
# darwin/indri/zot-config.json is excluded: it is the byte-identical copy of
# indri's rendered config.json (V5-83 link 2, eblume/blumeops#1782), and its
# whitespace is the jinja2 render's — reformatting it would change the on-disk
# bytes and restart zot on the first apply. check-json still validates it.
[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "331f33fa4dfbcbca7c3da3620c137fde0faab273" # v3.9.10
hooks = [
  { id = "prettier", types_or = [
    "json",
  ], args = [
    "--tab-width",
    "2",
  ], exclude = '^darwin/indri/zot-config\.json$' },
]

# GitHub/Forgejo Actions workflow linting
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # v1.7.12
hooks = [
  { id = "actionlint-system", args = [
    "-config-file",
    ".github/actionlint.yaml",
  ], files = '\.forgejo/workflows/' },
]

# Custom local hooks
# Local checks don't use `mise run` to avoid installing tools that aren't
# needed in the CI context.

# Container version consistency
[[repos]]
repo = "local"

[[repos.hooks]]
id = "container-version-check"
name = "container-version-check"
entry = "./mise-tasks/container-version-check"
language = "system"
files = "^(containers/|service-versions\\.yaml)"
pass_filenames = false

# Changelog fragment validation (no subdirectories)
[[repos]]
repo = "local"

[[repos.hooks]]
id = "changelog-check"
name = "changelog-check"
entry = "./mise-tasks/changelog-check"
language = "system"
files = '^docs/changelog\.d/'
pass_filenames = false

# Ntfy topic declaration (ntfy/topics.json): shape + no undeclared topic
# literal anywhere in the tree
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ntfy-lint"
name = "ntfy-lint"
entry = "./mise-tasks/ntfy-lint"
language = "system"
files = '.*'
pass_filenames = false

# Public forge name hard-coding check (whole repo; allowlist in
# mise-tasks/forge-name-lint.allowlist.yaml)
[[repos]]
repo = "local"

[[repos.hooks]]
id = "forge-name-lint"
name = "forge-name-lint"
entry = "./mise-tasks/forge-name-lint"
language = "system"
files = '.*'
pass_filenames = false

# The Authentik principal roster (principals.yaml + retiring.yaml) must match
# the rendered blueprint ConfigMap — the renderer-owned entries drift-proof
# the migration (eblume/blumeops#1194).
[[repos]]
repo = "local"

[[repos.hooks]]
id = "render-authentik-principals"
name = "render-authentik-principals"
entry = "./mise-tasks/render-authentik-principals --check"
language = "system"
files = '^argocd/manifests/authentik/(principals\.yaml|retiring\.yaml|configmap-blueprint\.yaml)$'
pass_filenames = false

# The zot accessControl template keeps its own copy of the group names it
# grants to; the lint closes that coupling without joining the files —
# every grant must name a group the roster declares (eblume/blumeops#1194).
[[repos]]
repo = "local"

[[repos.hooks]]
id = "zot-accesscontrol-lint"
name = "zot-accesscontrol-lint"
entry = "./mise-tasks/zot-accesscontrol-lint"
language = "system"
files = '^(darwin/indri/zot-config\.json|argocd/manifests/authentik/principals\.yaml)$'
pass_filenames = false

# Documentation validation
[[repos]]
repo = "local"

[[repos.hooks]]
id = "docs-check-links"
name = "docs-check-links"
entry = "./mise-tasks/docs-check-links"
language = "system"
files = '^docs/.*\.md$'
pass_filenames = false

[[repos.hooks]]
id = "docs-check-frontmatter"
name = "docs-check-frontmatter"
entry = "./mise-tasks/docs-check-frontmatter"
language = "system"
files = '^docs/.*\.md$'
pass_filenames = false

# Type-checking with ty
#
# ty's own file walk only discovers *.py / *.pyi, so the extensionless
# uv scripts in mise-tasks/ would go untyped. The script enumerates them by
# their uv shebang and passes them to `ty check` explicitly, on top of the
# .py project walk. It runs `uv run --group dev ty check` — the project env
# carries the `dev` dependency group (pyproject.toml) that mirrors the uv
# scripts' inline pins, so it works in a fresh checkout with no .ty-env.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ty-check"
name = "ty-check"
entry = "./mise-tasks/ty-check"
language = "system"
files = '(\.py$|^mise-tasks/)'
pass_filenames = false
