# prek.toml - Git hooks configuration
# Run: prek run --all-files
# Install: prek install && prek install --hook-type commit-msg

# Built-in hooks (fast, Rust-native — no external dependencies)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files", args = [
    "--maxkb=1000",
  ] },
  { id = "check-merge-conflict" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-case-conflict" },
  { id = "detect-private-key" },
  { id = "check-executables-have-shebangs" },
]

# check-yaml with --unsafe (builtin fast path doesn't support --unsafe yet)
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"        # v6.0.0
hooks = [{ id = "check-yaml", args = ["--unsafe"] }]

# YAML linting
[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "cba56bcde1fdd01c1deb3f945e69764c291a6530"               # v1.38.0
hooks = [{ id = "yamllint", args = ["-c", ".yamllint.yaml"] }]

# Ansible linting
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ansible-lint"
name = "ansible-lint"
entry = "env ANSIBLE_ROLES_PATH=ansible/roles ansible-lint"
language = "python"
files = "^ansible/"
additional_dependencies = ["ansible-lint==26.4.0", "ansible-core==2.21.1"]

# Python - ruff for linting and formatting
#
# The first two hooks select by content type and cover Python everywhere.
#
# mise-tasks/ is invisible to that selection: every task is an extensionless
# file, and `identify` reads `#!/usr/bin/env -S uv run --script` as the
# interpreter `uv`, so it never tags the file `python`. The third hook selects
# that directory by path instead. It is where most of this repo's logic lives,
# so it is the last place that should go unlinted.
#
# mise-tasks/ is mixed bash and uv-python and ruff cannot parse the bash.
# `exclude_types = ["shell"]` is the split: bash tasks are tagged `shell` from
# their shebang, uv scripts are tagged only `executable, file, text`. It needs
# no maintenance as tasks are added in either language.
#
# There is deliberately no ruff-format pass over mise-tasks/. The formatter
# normalizes `#COMMENT` to `# COMMENT`, and mise matches its task metadata
# comments — `#MISE description=`, `#MISE alias=` — without a space. Formatting
# the directory drops every task description from `mise tasks`, including the
# `[human]` prefixes AGENTS.md keys the agent fence off, and breaks aliases.
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "77039ccbba72c8aede339c5f8ae29b42aced0a2e" # v0.15.18
hooks = [
  { id = "ruff", args = [
    "--fix",
  ] },
  { id = "ruff-format" },
  { id = "ruff", alias = "ruff-mise-tasks", name = "ruff (mise-tasks)", args = [
    "--fix",
  ], types = [
    "text",
  ], types_or = [
    "text",
  ], exclude_types = [
    "shell",
  ], files = '^mise-tasks/' },
]

# Shell scripts - shellcheck and shfmt
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "745eface02aef23e168a8afb6b5737818efbea95"               # v0.11.0.1
hooks = [{ id = "shellcheck", args = ["--severity=warning"] }]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "05c1426671b9237fb5e1444dd63aa5731bec0dfb"             # v3.13.1-1
hooks = [{ id = "shfmt", args = ["-i", "2", "-ci", "-bn"] }]

# TOML - taplo
[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "ade0f95ddcf661c697d4670d2cfcbe95d0048a0a"                                 # v0.9.3
hooks = [{ id = "taplo-format" }, { id = "taplo-lint", args = ["--no-schema"] }]

# JSON formatting (prettier for consistent style)
[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "06507ab9500d4a9919b5ebd76d9d5b7074f15c1f"                                # v3.8.4
hooks = [{ id = "prettier", types_or = ["json"], args = ["--tab-width", "2"] }]

# GitHub/Forgejo Actions workflow linting
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # v1.7.12
hooks = [
  { id = "actionlint-system", args = [
    "-config-file",
    ".github/actionlint.yaml",
  ], files = '\.forgejo/workflows/' },
]

# Custom local hooks
#
# The four hooks below run their script directly rather than through
# `mise run <task>`. `mise run` installs the whole `[tools]` block before it
# executes anything, so every one of these paid for pulumi, ansible-core,
# borgmatic and ty — and on a Forgejo runner that install is not merely slow,
# it fails: mise reads GITHUB_TOKEN, Forgejo Actions sets it to the forge job
# token, and api.github.com answers 401. These scripts need bash and uv, both
# already present, so taking mise out of the path removes the failure instead
# of authenticating around it. `.forgejo/workflows/docs-checks.yaml` has
# invoked three of them this way since it landed, which is why it never hit
# the 401 that the prek copies of the same checks did.
#
# The shebangs are what make the bare path work, and they are the same ones
# `mise run` honours. Nothing here reads a `usage_*` variable, so the `#USAGE`
# directive that mise would have parsed costs nothing when it is skipped.
# prek runs hooks from the repo root, so `./` resolves there whatever directory
# the invocation started in.
#
# One tool does move out from under mise: `container-version-check` shells to
# `dagger` for containers that track an unmodified nixpkgs package. The runner
# has it globally (`forgejo_runner_host_tools`), and an activated mise shell on
# gilbert has it from `[tools]`. Neither is silent if it is missing — the script
# reports the container as failing to resolve a version, and the hook fails.

# Container version consistency
[[repos]]
repo = "local"

[[repos.hooks]]
id = "container-version-check"
name = "container-version-check"
entry = "./mise-tasks/container-version-check"
language = "system"
files = "^(containers/|service-versions\\.yaml)"
pass_filenames = false

# Changelog fragment validation (no subdirectories)
[[repos]]
repo = "local"

[[repos.hooks]]
id = "changelog-check"
name = "changelog-check"
entry = "./mise-tasks/changelog-check"
language = "system"
files = '^docs/changelog\.d/'
pass_filenames = false

# Documentation validation
[[repos]]
repo = "local"

[[repos.hooks]]
id = "docs-check-links"
name = "docs-check-links"
entry = "./mise-tasks/docs-check-links"
language = "system"
files = '^docs/.*\.md$'
pass_filenames = false

[[repos.hooks]]
id = "docs-check-frontmatter"
name = "docs-check-frontmatter"
entry = "./mise-tasks/docs-check-frontmatter"
language = "system"
files = '^docs/.*\.md$'
pass_filenames = false
