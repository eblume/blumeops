# BlumeOps Release Workflow
#
# Creates a versioned release of BlumeOps with all build artifacts.
# Currently includes:
#   - Documentation site (Quartz static build)
#   - Changelog (built from towncrier fragments)
#
# RELEASES ARE PAUSED (eblume/blumeops#1628): the `release` job below
# hard-fails. The old release job pushed the changelog and the docs_version
# bump to main with a PAT; that push is retired, and its replacement — a
# release created from the version bump on main — lands at migration step 9.
# The `version` and `docs-build` jobs still run, so a paused run keeps its
# docs tarball as a run artifact.
#
# Every job runs credential-free on the unprivileged `indri-build` runner
# (colima): CI no longer pushes `main`, so no job holds a main-push PAT or
# a vault token.
#
# Usage (until the pause lifts at step 9):
#   1. Go to Actions > Build BlumeOps > Run workflow
#   2. Select version bump type (patch/minor/major) or choose specific version
#   3. The release job fails with the pause reason
#
# Documentation asset URL:
#   https://forge.ops.eblu.me/eblume/blumeops/releases/download/<tag>/docs-<version>.tar.gz

name: Build BlumeOps

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'BUMP_PATCH'
        type: choice
        options:
          - BUMP_PATCH
          - BUMP_MINOR
          - BUMP_MAJOR
          - SPECIFIC_VERSION
      specific_version:
        description: 'Specific version (only used when version_type is SPECIFIC_VERSION, e.g., v1.2.0)'
        required: false
        default: ''
        type: string

jobs:
  version:
    runs-on: indri-build
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_date: ${{ steps.version.outputs.release_date }}
    steps:
      - name: Verify forge server URL
        run: |
          # The runner serves GITHUB_SERVER_URL from the forge's ROOT_URL, and
          # this workflow's runner-side API calls hard-code forge.ops.eblu.me.
          # The ROOT_URL flip (eblume/blumeops#1208) made the ops name the
          # canonical one, so a mismatch is a real regression: hard-fail.
          echo "GITHUB_SERVER_URL=${GITHUB_SERVER_URL:-unset}"
          if [ "${GITHUB_SERVER_URL%/}" != "https://forge.ops.eblu.me" ]; then
            echo "::error::GITHUB_SERVER_URL is not https://forge.ops.eblu.me — the forge's ROOT_URL has drifted from the tailnet name (eblume/blumeops#1208)."
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          VERSION_TYPE="${{ inputs.version_type }}"
          SPECIFIC_VERSION="${{ inputs.specific_version }}"

          # Fetch latest release
          echo "Fetching latest release..."
          LATEST=$(curl -s "https://forge.ops.eblu.me/api/v1/repos/eblume/blumeops/releases/latest" | jq -r '.tag_name // empty' || true)

          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
            echo "No previous releases found, using base version: $LATEST"
          else
            echo "Latest release: $LATEST"
          fi

          # Parse current version components (strip 'v' prefix)
          CURRENT="${LATEST#v}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          case "$VERSION_TYPE" in
            BUMP_MAJOR)
              VERSION="v$((MAJOR + 1)).0.0"
              echo "Bumping major: $LATEST -> $VERSION"
              ;;
            BUMP_MINOR)
              VERSION="v${MAJOR}.$((MINOR + 1)).0"
              echo "Bumping minor: $LATEST -> $VERSION"
              ;;
            BUMP_PATCH)
              VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              echo "Bumping patch: $LATEST -> $VERSION"
              ;;
            SPECIFIC_VERSION)
              if [ -z "$SPECIFIC_VERSION" ]; then
                echo "Error: specific_version is required when version_type is SPECIFIC_VERSION"
                exit 1
              fi
              # Validate format
              if [[ ! "$SPECIFIC_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Error: Version must be in format vX.Y.Z (e.g., v1.0.0)"
                exit 1
              fi
              VERSION="$SPECIFIC_VERSION"
              echo "Using specific version: $VERSION"
              ;;
            *)
              echo "Error: Unknown version_type: $VERSION_TYPE"
              exit 1
              ;;
          esac

          # Check if this version already exists
          if curl -sf "https://forge.ops.eblu.me/api/v1/repos/eblume/blumeops/releases/tags/$VERSION" > /dev/null 2>&1; then
            echo "Error: Release $VERSION already exists"
            echo "See: https://forge.ops.eblu.me/eblume/blumeops/releases/tag/$VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Resolve the changelog header date here, once, for docs-build's
          # towncrier run, so a run straddling midnight cannot leave the docs
          # page and the committed CHANGELOG.md with different dates.
          echo "release_date=$(date +%F)" >> "$GITHUB_OUTPUT"
          echo "Building BlumeOps release: $VERSION"

  docs-build:
    needs: [version]
    runs-on: indri-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build changelog
        run: |
          VERSION="${{ needs.version.outputs.version }}"

          # Changelog is built here so the Quartz docs contain this
          # release's notes.
          # Check if there are any changelog fragments
          FRAGMENTS=$(find docs/changelog.d -name "*.md" -not -name ".gitkeep" 2>/dev/null | wc -l)

          if [ "$FRAGMENTS" -gt 0 ]; then
            echo "Found $FRAGMENTS changelog fragments, building changelog..."
            uvx --from towncrier==26.9.0 towncrier build --version "$VERSION" --date "${{ needs.version.outputs.release_date }}" --yes
          else
            echo "No changelog fragments found, skipping towncrier"
          fi

      - name: Build docs
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TARBALL="docs-${VERSION}.tar.gz"
          echo "Building docs in a node:22-slim container..."
          # Towncrier ran in the previous step of this job, so the working tree
          # has an up-to-date CHANGELOG.md. The task only runs the Quartz
          # static site build (no towncrier).
          mise run docs-build-tarball "./$TARBALL"
          echo "Build complete!"
          ls -lh "$TARBALL"

      - name: Upload docs tarball
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: docs-tarball
          path: docs-${{ needs.version.outputs.version }}.tar.gz

  release:
    runs-on: indri-build
    steps:
      - name: Releases paused
        # No `needs`: a paused dispatch must fail fast with the pause reason,
        # not after a full version + docs build. Step 9 (eblume/blumeops#1628)
        # replaces this job with the release-PR model's release creation.
        run: |
          echo "::error::BlumeOps releases are paused until the release-PR model lands (eblume/blumeops#1628, migration step 9): the old release job pushed the changelog and the docs_version bump to main, and that push is retired with no replacement until step 9."
          exit 1
