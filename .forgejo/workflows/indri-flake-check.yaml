# Builds indri's nix-darwin configuration on the indri runner, when the
# flake tree (or this workflow) changes.
#
# The flake must be evaluated and built on aarch64-darwin: ringtail (the nix
# runner) cannot evaluate it, so the check is coupled to indri's own store -
# the same store the darwin-rebuild uses.
#
# The runner's PATH carries /nix/var/nix/profiles/default/bin for this
# (generation-owned launchd unit in darwin/indri/configuration.nix);
# erichblume is not a trusted nix user, which is fine for a flake build.
#
# Runs-on split (#1358): pull_request runs execute from the PR's own
# checkout, so they go to the unprivileged indri-build runner, which builds
# through the multi-user nix daemon as an untrusted user (never a trusted
# Nix user). Everything else stays on the privileged indri runner, which
# only starts on a main push or a dispatch by a write collaborator.
#
# As with the other workflows, on an agent PR this sits pending until a human
# clicks "Approve and run" (the agents bot is read-only on canonical). See
# [[agent-change-process]].
name: Indri Flake Check

on:
  pull_request:
    paths:
      - 'darwin/indri/**'
      - '.forgejo/workflows/indri-flake-check.yaml'
  push:
    branches: [main]
    paths:
      - 'darwin/indri/**'
      - '.forgejo/workflows/indri-flake-check.yaml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ github.event_name == 'pull_request' && 'indri-build' || 'indri' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the darwin system
        run: |
          set -o pipefail
          cd darwin/indri
          nix build .#darwinConfigurations.indri.system
