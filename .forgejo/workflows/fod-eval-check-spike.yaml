name: FOD eval check spike

# Informational spike for the eval-based FOD check (blumeops#1860, PR 1).
# Settles the runner decision: does indri-build permit eval-time network
# fetches (the #1358 constraint is about privileges, presumably not
# network), and what does instantiation cost? Not a gate.
# Trigger: workflow_dispatch only (agent PRs can't rely on
# approve-and-run for a dispatch-only workflow) — dispatch from main
# after the merge, on both runners, and record the timings + verdict in
# docs/explanation/talos-v0.5/fod-eval-check.md.
# Credential-free on both runners, like the Aspects job: GITHUB_TOKEN is
# blanked, checkout does not persist credentials, and no secrets are
# used. Today actions/checkout persists the default token into
# .git/config before any step runs — the checkout step here must stay
# persist-credentials: false, because the steps evaluate repo Nix.

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [indri-build, nix-container-builder]
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The probes measure what the real check hits: eval-time network
      # fetches of both kinds (a public fetchurl, and a forge-mirror
      # fetchGit as in teslamate's src). Each probe records its own rc;
      # a blocked runner must not stop the rest of the evidence.
      - name: eval-time network probes (public fetchurl, forge fetchGit)
        run: |
          probe() {
            local name=$1; shift
            local start end
            start=$(date +%s)
            echo "== probe: $name"
            rc=0
            "$@" 2>&1 | tail -5 || rc=${PIPESTATUS[0]}
            end=$(date +%s)
            echo "verdict: $name rc=$rc time=$((end-start))s"
          }
          probe "fetchurl public (raw.githubusercontent.com)" \
            nix eval --extra-experimental-features 'nix-command' --impure --expr \
              'builtins.readFile
               (builtins.fetchurl "https://raw.githubusercontent.com/NixOS/nixpkgs/master/README.md")'
          probe "fetchGit forge mirror (forge.ops.eblu.me)" \
            nix eval --extra-experimental-features 'nix-command' --impure --expr \
              'builtins.fetchGit {
                url = "https://forge.ops.eblu.me/mirrors/alloy.git";
                rev = "v1.19.2";
                hash = "sha256-GllAidIhgLx9ciQ/57wV1cKyzsXvEAGRgv3+8x6Uq9M=";
              }'

      # Resolves <nixpkgs> from the in-repo pin (containers/flake.lock),
      # the same shape as the Build Container workflow.
      - name: Resolve nixpkgs (containers pin)
        id: nixpkgs
        run: |
          if [ ! -f containers/flake.lock ]; then
            echo "Error: containers/flake.lock is missing — the in-repo nixpkgs pin is gone"
            exit 1
          fi
          NIXPKGS_PATH=$(nix eval --extra-experimental-features 'nix-command flakes' --raw ./containers#nixpkgsPath || true)
          if [ -z "$NIXPKGS_PATH" ] || [ ! -d "$NIXPKGS_PATH" ]; then
            echo "Error: could not resolve the pinned nixpkgs from containers/flake.lock"
            exit 1
          fi
          echo "Resolved nixpkgs: $NIXPKGS_PATH"
          echo "path=$NIXPKGS_PATH" >> "$GITHUB_OUTPUT"

      # The mechanism being timed: instantiate each container entry
      # point (which is what the check does — evaluating an image
      # derivation only prints it), then walk the resulting derivations
      # recursively. IFD off, as the check will run it: an
      # import-from-derivation becomes an eval error, which the check
      # reads as red.
      - name: Per-container instantiation + derivation walk (every container)
        env:
          NIX_PATH: "nixpkgs=${{ steps.nixpkgs.outputs.path }}"
        run: |
          total_start=$(date +%s)
          for c in alloy audiobookshelf authentik authentik-blueprint-exporter authentik-redis \
                   external-secrets frigate-notify grafana grafana-sidecar homepage kiwix-serve \
                   kube-state-metrics kubectl loki mealie miniflux navidrome ntfy paperless \
                   prometheus prowler pulumi-stack-backup tailscale tailscale-k8s-nameserver \
                   tailscale-operator tempo teslamate transmission transmission-exporter \
                   unpoller valkey; do
            echo "== $c"
            rc=0
            drv=$(nix-instantiate "containers/$c/default.nix" \
                  --option allow-import-from-derivation false 2>&1) || rc=$?
            if [ $rc -ne 0 ]; then
              echo "instantiate FAILED ($c):"; echo "$drv" | tail -10
              continue
            fi
            echo "$drv"
            t1=$(date +%s)
            rc2=0
            nix derivation show -r "$drv" 2>&1 | tail -5 || rc2=${PIPESTATUS[0]}
            t2=$(date +%s)
            echo "walk rc=$rc2 time=$((t2-t1))s"
          done
          echo "total time=$(( $(date +%s) - total_start ))s"

      # The host flake dominates the cost. Eval is arch-agnostic, so this
      # works cross-arch from either runner (a build would not). The
      # derivation walk over the printed drvPath is the unknown: it may
      # need the .drv materialised in the local store — record the
      # outcome, it decides how the check walks the host flake.
      - name: ringtail host flake — eval to drvPath, then derivation walk
        run: |
          t1=$(date +%s)
          rc=0
          drvpath=$(nix eval --extra-experimental-features 'nix-command flakes' --raw \
            ./nixos/ringtail#nixosConfigurations.ringtail.config.system.build.toplevel.drvPath \
            --option allow-import-from-derivation false) || rc=$?
          t2=$(date +%s)
          echo "eval rc=$rc time=$((t2-t1))s"
          echo "drvPath: $drvpath"
          t3=$(date +%s)
          rc2=0
          nix derivation show -r "$drvpath" 2>&1 | tail -30 || rc2=${PIPESTATUS[0]}
          t4=$(date +%s)
          echo "walk rc=$rc2 time=$((t4-t3))s"
