# ArgoCD Deploy — the first approval-gated privileged workflow
# ([[warrant-approval-gated-runs]] Phase 1). Manual dispatch only: a human
# dispatching this IS the approval (workflow_dispatch is write-gated and the
# agents bot is read-only on canonical). Definitions execute from main
# (invariant 3); the revision input is the approved, immutable payload.
#
# Agents request a run with:
#   mise run request-run argocd-deploy.yaml <full-sha> --pr N \
#       -i app=<app> -i revision=<full-sha> [-i prune=true] [--why ...]
#
# Tag-tracking apps (external-secrets-crds-ringtail, cloudnative-pg-ringtail)
# request -i revision=declared instead: the run syncs the app at the revision
# its Application on main already declares and never touches the spec —
# revision=main would repoint the app at the MIRROR's main. The bound SHA is
# the blumeops commit whose argocd/apps/<app>.yaml declares the revision, and
# the run fails if the live Application's targetRevision differs from it
# (file an argocd-sync-apps.yaml warrant first so the root picks up the bump).
#
# prune is the one input here that DELETES. Apps sync with `prune: false`, so a
# kustomize configMapGenerator — whose every content edit mints a new
# hash-suffixed ConfigMap — leaves the old one behind, and ArgoCD counts that
# orphan as pending-prune and reads OutOfSync forever. Clearing it is the
# documented `argocd app sync --prune`, which needed a human on gilbert until
# this input existed. Default false, and the run log records a dry-run preview
# of exactly what a prune removed.
#
# runs-on: priv — the privileged runner label (invariant 3). Until the
# dedicated Phase-2 runner exists, the indri runner advertises `priv`
# alongside `indri` (see forgejo_runner role defaults); the label split is
# what matters now, the host split comes later.
#
# Revision reachability: a pre-merge PR head is exposed on canonical as
# refs/pull/N/head and is git-fetchable by full SHA when it is the PR's
# current head (verified — see docs/reference/services/argocd.md "SHA
# reachability"). Whether the ArgoCD server's own go-git fetch path resolves a
# raw full SHA that way is still unverified from a cluster with access; bind
# to post-merge main SHAs or "main" by default, which always work.
name: ArgoCD Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'ArgoCD Application name (must exist as argocd/apps/<app>.yaml on main)'
        required: true
        type: string
      revision:
        description: 'FULL 40-char commit SHA to deploy from, "main" to reset to tracking main, or "declared" to sync at the revision the Application on main already declares (tag-tracking apps)'
        required: true
        type: string
      sync:
        description: 'Sync (and wait healthy) after setting the revision'
        required: false
        default: true
        type: boolean
      prune:
        description: 'Also delete live resources absent from the target revision (requires sync)'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: priv
    steps:
      # Inputs are passed through env vars everywhere below — never
      # interpolated into shell text — so a crafted input cannot inject
      # commands into a privileged job.
      - name: Validate revision input
        env:
          REV: ${{ inputs.revision }}
        run: |
          if [ "$REV" != "main" ] && [ "$REV" != "declared" ] && ! echo "$REV" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::revision must be 'main', 'declared', or a FULL 40-char SHA (got: $REV)"
            exit 1
          fi

      # Pruning happens inside the sync, so prune-without-sync is a request that
      # cannot do what it says. Refuse it rather than silently no-op: an approval
      # that reads "prune the orphans" must not come back green having pruned
      # nothing.
      - name: Reject prune without sync
        env:
          SYNC: ${{ inputs.sync }}
          PRUNE: ${{ inputs.prune }}
        run: |
          if [ "$PRUNE" = "true" ] && [ "$SYNC" != "true" ]; then
            echo "::error::prune=true requires sync=true — pruning is an option on the sync, not a separate operation"
            exit 1
          fi

      - name: Checkout main (app allowlist comes from reviewed state)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate app is a declared Application
        env:
          APP: ${{ inputs.app }}
        run: |
          # The app-of-apps root is a pointer, not an app: `argocd app set apps
          # --revision <sha>` pins it and it reads Synced against the pin
          # forever, silently ignoring later argocd/apps/ merges. The guarded
          # argocd-sync-apps.yaml is the only route to the root.
          if [ "$APP" = "apps" ]; then
            echo "::error::'apps' is the app-of-apps root — sync it with argocd-sync-apps.yaml, not argocd-deploy (which would pin the root to a SHA and leave it silently stale)"
            exit 1
          fi
          if ! [ -f "argocd/apps/$APP.yaml" ]; then
            echo "::error::'$APP' is not a declared Application (argocd/apps/$APP.yaml missing on main). Note most apps carry a -ringtail suffix. Declared apps:"
            find argocd/apps -name '*.yaml' -exec basename {} .yaml \;
            exit 1
          fi

      # `declared` has no payload to bind, so the binding the approval names is
      # different: the run syncs what the Application on main already declares.
      # Guard the one case where that is not what was approved — a live spec
      # that lags main's declaration (a merged tag bump the apps root has not
      # synced yet) would otherwise deploy the stale revision silently. Fail,
      # pointing at the warrant that fixes it.
      - name: Verify declared revision matches main
        if: ${{ inputs.revision == 'declared' }}
        env:
          APP: ${{ inputs.app }}
          ARGOCD_SERVER: argocd.ops.eblu.me
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BLUMEOPS_CI_OP_TOKEN }}
          ARGOCD_OPTS: --grpc-web
        run: |
          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "::error::BLUMEOPS_CI_OP_TOKEN is not provisioned as an Actions secret — see [[blumeops-ci-item-migration]]"
            exit 1
          fi
          ARGOCD_AUTH_TOKEN=$(op read 'op://blumeops-ci/argocd-workflow-bot/token')
          echo "::add-mask::$ARGOCD_AUTH_TOKEN"
          export ARGOCD_AUTH_TOKEN
          unset GITHUB_TOKEN GITHUB_API_TOKEN
          acd() { if command -v argocd >/dev/null 2>&1; then argocd "$@"; else mise x argocd@3.3.12 -- argocd "$@"; fi; }
          LIVE_REV=$(acd app get "$APP" -o json | jq -r '.spec.source.targetRevision // empty')
          DECLARED_REV=$(sed -n 's/^[[:space:]]*targetRevision:[[:space:]]*//p' "argocd/apps/$APP.yaml" | head -n1)
          echo "revision=declared: live targetRevision=$LIVE_REV; argocd/apps/$APP.yaml on main declares $DECLARED_REV"
          if [ -z "$LIVE_REV" ] || [ -z "$DECLARED_REV" ]; then
            echo "::error::could not resolve the declared targetRevision (live='$LIVE_REV', main='$DECLARED_REV') — refusing to sync blind"
            exit 1
          fi
          if [ "$LIVE_REV" != "$DECLARED_REV" ]; then
            echo "::error::live targetRevision $LIVE_REV != main's declaration $DECLARED_REV — file an argocd-sync-apps.yaml warrant so the root syncs the Application to its reviewed manifest first"
            exit 1
          fi

      # The ArgoCD token is read from the blumeops-ci vault at job time
      # ([[blumeops-ci-item-migration]]): BLUMEOPS_CI_OP_TOKEN is the one
      # Actions secret privileged jobs keep, and rotation is an `op item
      # edit` away — no provisioning round-trip.
      # Gated off for `declared`: the Application on main is the source of
      # truth there, and the step above verified the live spec agrees.
      - name: Set target revision
        if: ${{ inputs.revision != 'declared' }}
        env:
          APP: ${{ inputs.app }}
          REV: ${{ inputs.revision }}
          ARGOCD_SERVER: argocd.ops.eblu.me
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BLUMEOPS_CI_OP_TOKEN }}
          ARGOCD_OPTS: --grpc-web
        run: |
          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "::error::BLUMEOPS_CI_OP_TOKEN is not provisioned as an Actions secret — see [[blumeops-ci-item-migration]]"
            exit 1
          fi
          ARGOCD_AUTH_TOKEN=$(op read 'op://blumeops-ci/argocd-workflow-bot/token')
          echo "::add-mask::$ARGOCD_AUTH_TOKEN"
          export ARGOCD_AUTH_TOKEN
          # Forgejo injects GITHUB_TOKEN (a *forge* token); mise would send it
          # to api.github.com and get a 401. Unset before any mise x call.
          unset GITHUB_TOKEN GITHUB_API_TOKEN
          # System argocd on the priv runner (nixpkgs); mise-x fallback on
          # host-mode runners.
          acd() { if command -v argocd >/dev/null 2>&1; then argocd "$@"; else mise x argocd@3.3.12 -- argocd "$@"; fi; }
          acd app set "$APP" --revision "$REV"

      - name: Sync and wait healthy
        if: ${{ inputs.sync }}
        env:
          APP: ${{ inputs.app }}
          PRUNE: ${{ inputs.prune }}
          ARGOCD_SERVER: argocd.ops.eblu.me
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BLUMEOPS_CI_OP_TOKEN }}
          ARGOCD_OPTS: --grpc-web
        run: |
          ARGOCD_AUTH_TOKEN=$(op read 'op://blumeops-ci/argocd-workflow-bot/token')
          echo "::add-mask::$ARGOCD_AUTH_TOKEN"
          export ARGOCD_AUTH_TOKEN
          unset GITHUB_TOKEN GITHUB_API_TOKEN
          acd() { if command -v argocd >/dev/null 2>&1; then argocd "$@"; else mise x argocd@3.3.12 -- argocd "$@"; fi; }
          if [ "$PRUNE" = "true" ]; then
            # A prune deletes live resources, so name them in the log before
            # doing it — this run log is the audit record, and "what did that
            # prune actually remove" has to be answerable after the fact.
            echo "::group::Prune preview (dry-run)"
            acd app sync "$APP" --prune --dry-run --timeout 600
            echo "::endgroup::"
            acd app sync "$APP" --prune --timeout 600
          else
            acd app sync "$APP" --timeout 600
          fi
          acd app wait "$APP" --health --timeout 600

      # Always show final state in the run log — this is the audit record
      # until Phase 2's heph plumbing lands.
      - name: Report application state
        if: always()
        env:
          APP: ${{ inputs.app }}
          ARGOCD_SERVER: argocd.ops.eblu.me
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BLUMEOPS_CI_OP_TOKEN }}
          ARGOCD_OPTS: --grpc-web
        run: |
          ARGOCD_AUTH_TOKEN=$(op read 'op://blumeops-ci/argocd-workflow-bot/token')
          echo "::add-mask::$ARGOCD_AUTH_TOKEN"
          export ARGOCD_AUTH_TOKEN
          unset GITHUB_TOKEN GITHUB_API_TOKEN
          acd() { if command -v argocd >/dev/null 2>&1; then argocd "$@"; else mise x argocd@3.3.12 -- argocd "$@"; fi; }
          acd app get "$APP" || true
