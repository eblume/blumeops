# Deploy Fly.io Proxy — a privileged workflow per [[warrant-approval-gated-runs]]
# invariant 3: workflow_dispatch only, runs-on: priv, definition executes from
# main. The revision input is the approved, immutable payload — the fly/ tree
# actually deployed. A human dispatching from the forge UI IS the approval;
# agents request a dispatch with:
#
#   mise run request-run deploy-fly.yaml <full-sha> --pr N \
#       -i revision=<full-sha> [--why ...]
#
# runs-on: priv — the ringtail-priv-runner, a sandboxed NixOS runner whose
# toolbox is the hostPackages list in nixos/ringtail/configuration.nix.
# flyctl comes from there (nixpkgs); builds go through Fly.io's remote
# builders, so the sandbox needs no docker.
#
# Revision reachability caveat (same as argocd-deploy): checkout fetches from
# canonical, so a SHA that only exists on the agents fork (pre-merge PR head)
# will not resolve. Post-merge SHAs and "main" always work — start there.
name: Deploy Fly.io Proxy

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'FULL 40-char commit SHA to deploy fly/ from, or "main" for the current tip'
        required: true
        type: string

jobs:
  deploy:
    runs-on: priv
    steps:
      # Inputs pass through env vars — never interpolated into shell text —
      # so a crafted input cannot inject commands into a privileged job.
      - name: Validate revision input
        env:
          REV: ${{ inputs.revision }}
        run: |
          if [ "$REV" != "main" ] && ! echo "$REV" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::revision must be 'main' or a FULL 40-char SHA (got: $REV) — approvals bind to immutable SHAs"
            exit 1
          fi

      - name: Checkout approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      # The Fly deploy token is read from the blumeops-ci vault at job time
      # ([[blumeops-ci-item-migration]]); BLUMEOPS_CI_OP_TOKEN is the one
      # Actions secret this job needs.
      - name: Deploy to Fly.io
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BLUMEOPS_CI_OP_TOKEN }}
        run: |
          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "::error::BLUMEOPS_CI_OP_TOKEN is not provisioned as an Actions secret — see [[blumeops-ci-item-migration]]"
            exit 1
          fi
          FLY_API_TOKEN=$(op read 'op://blumeops-ci/fly-deploy/token')
          echo "::add-mask::$FLY_API_TOKEN"
          export FLY_API_TOKEN
          cd fly
          flyctl deploy

      # Always show final state in the run log — this is the audit record.
      # The health check is FATAL: strategy=immediate (fly.toml) tears down the
      # old machine before the new one proves itself, so a machine that never
      # comes up is a live outage — the run must not report success. Seen
      # 2026-08-15 (run 957): expired TS_AUTHKEY crash-looped the new machine
      # while the job passed. Retries cover the cold start (tailscaled →
      # MagicDNS → nginx, ~30-60s).
      - name: Verify health
        if: always()
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BLUMEOPS_CI_OP_TOKEN }}
        run: |
          FLY_API_TOKEN=$(op read 'op://blumeops-ci/fly-deploy/token')
          echo "::add-mask::$FLY_API_TOKEN"
          export FLY_API_TOKEN
          flyctl status -a blumeops-proxy
          echo ""
          echo "Health check (up to 120s for cold start):"
          for _ in $(seq 1 12); do
            if curl -sf https://blumeops-proxy.fly.dev/healthz; then
              echo ""
              echo "Proxy healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Proxy not serving /healthz after deploy — machine likely failed to boot. First suspect: expired TS_AUTHKEY (90-day Tailscale key; see manage-flyio-proxy.md §Rotate Tailscale Auth Key). Check 'flyctl logs -a blumeops-proxy'."
          exit 1
