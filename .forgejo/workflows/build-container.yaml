# Container build workflow (nix-only)
# Manual dispatch only — use `mise run container-build-and-release <name>`.
# Shared Dagger helpers (src/blumeops/) make path-based auto-triggers unreliable,
# so all container builds are triggered explicitly.
# A lightweight classify job runs on k8s (indri), then the container's
# default.nix is built on nix-container-builder (ringtail) via nix-build + skopeo.
name: Build Container

on:
  workflow_dispatch:
    inputs:
      container:
        description: 'Container name (directory under containers/)'
        required: true
        type: string
      ref:
        description: 'FULL 40-char commit SHA to build (defaults to current HEAD; short SHAs fail — checkout treats them as branch names)'
        required: false
        type: string

jobs:
  detect:
    runs-on: k8s
    outputs:
      nix: ${{ steps.classify.outputs.nix }}
    steps:
      # Fail fast on short SHAs: actions/checkout only fetches by commit for
      # full 40-hex SHAs; anything else is fetched as refs/heads/<ref>*, which
      # silently matches nothing for a short SHA (see run #665). The mise task
      # container-build-and-release expands short SHAs before dispatching —
      # this guards manual UI dispatches.
      - name: Validate ref input
        run: |
          REF="${{ inputs.ref }}"
          if [ -n "$REF" ] && echo "$REF" | grep -qE '^[0-9a-f]{4,39}$'; then
            echo "::error::'ref' looks like a SHORT commit SHA ($REF). Pass the full 40-char SHA (or a branch name) — actions/checkout treats short SHAs as branch names and the fetch fails."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Classify container build type
        id: classify
        run: |
          CHANGED='["${{ inputs.container }}"]'
          echo "Building container: $CHANGED"

          # Nix-only since [[retire-minikube]] phase 6 — the dagger/arm64
          # build path retired with the minikube cluster.
          NIX='[]'
          for name in $(echo "$CHANGED" | jq -r '.[]'); do
            if [ -f "containers/$name/default.nix" ]; then
              NIX=$(echo "$NIX" | jq -c --arg n "$name" '. + [$n]')
            else
              echo "Warning: $name has no default.nix — skipping"
            fi
          done

          echo "nix=$NIX" >> "$GITHUB_OUTPUT"
          echo "Nix builds: $NIX"

  build-nix:
    needs: detect
    if: needs.detect.outputs.nix != '[]'
    runs-on: nix-container-builder
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect.outputs.nix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Extract version and SHA
        id: meta
        run: |
          CONTAINER="${{ matrix.container }}"
          NIX_FILE="containers/$CONTAINER/default.nix"

          # Extract version = "..." from the nix file
          VERSION=$(grep -m1 '^\s*version\s*=\s*"' "$NIX_FILE" \
            | sed 's/.*"\(.*\)".*/\1/' || true)

          if [ -z "$VERSION" ]; then
            echo "Error: No version declaration found in $NIX_FILE"
            exit 1
          fi

          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then
            REF="${GITHUB_SHA}"
          fi
          SHORT_SHA=$(echo "$REF" | head -c 7)

          # Ensure version starts with 'v'
          case "$VERSION" in
            v*) ;;
            *) VERSION="v${VERSION}" ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, SHA: $SHORT_SHA"

      - name: Resolve nixpkgs
        id: nixpkgs
        run: |
          NIXPKGS_PATH=$(nix flake metadata nixpkgs --json | jq -r '.path')
          echo "Resolved nixpkgs: $NIXPKGS_PATH"
          echo "path=$NIXPKGS_PATH" >> "$GITHUB_OUTPUT"

      - name: Build with nix
        env:
          NIX_PATH: "nixpkgs=${{ steps.nixpkgs.outputs.path }}"
        run: |
          echo "Building containers/${{ matrix.container }}/default.nix"
          echo "NIX_PATH=$NIX_PATH"
          # Tee the build output so the failure-report step below can read it.
          set -o pipefail
          nix-build "containers/${{ matrix.container }}/default.nix" -o result 2>&1 \
            | tee /tmp/nix-build.log
          echo "Build complete: $(readlink result)"

      - name: Report build failure to PR
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Post the tail of the nix build log as a comment on the open PR for
          # this branch (if any). This makes hash-TOFU rounds readable without
          # runner-log access — remote-agent sessions drive rebuilds from the
          # PR comment alone (nix prints 'specified:'/'got:' hash mismatches).
          [ -f /tmp/nix-build.log ] || { echo "no build log captured"; exit 0; }
          BRANCH="${GITHUB_REF_NAME}"
          API="${GITHUB_SERVER_URL:-https://forge.eblu.me}/api/v1"
          REPO="${{ github.repository }}"

          PR_INDEX=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "$API/repos/$REPO/pulls?state=open&limit=50" \
            | jq -r --arg ref "$BRANCH" '.[] | select(.head.ref == $ref) | .number' | head -1)
          if [ -z "$PR_INDEX" ]; then
            echo "No open PR for branch $BRANCH; skipping comment"
            exit 0
          fi

          {
            echo "**Build Container failed** — \`${{ matrix.container }}\` on \`$BRANCH\` (run ${GITHUB_RUN_NUMBER})"
            echo ""
            echo '```'
            grep -E "hash mismatch|specified:|got:|error:" /tmp/nix-build.log | tail -20
            echo '---'
            tail -30 /tmp/nix-build.log
            echo '```'
          } > /tmp/pr-comment.md

          jq -n --rawfile body /tmp/pr-comment.md '{body: $body}' \
            | curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/json" -d @- \
                "$API/repos/$REPO/issues/$PR_INDEX/comments" \
            | jq -r '"Commented: " + (.html_url // .message)'

      - name: Push to registry
        env:
          ZOT_CI_API_KEY: ${{ secrets.ZOT_CI_API_KEY }}
        run: |
          CONTAINER="${{ matrix.container }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHORT_SHA="${{ steps.meta.outputs.sha }}"
          IMAGE="registry.ops.eblu.me/blumeops/$CONTAINER:${VERSION}-${SHORT_SHA}-nix"

          echo "Pushing to $IMAGE"
          skopeo copy \
            --dest-creds="zot-ci:$ZOT_CI_API_KEY" \
            "docker-archive:result" \
            "docker://$IMAGE"
          echo "Push complete: $IMAGE"
