# Container build + release workflow (nix-only).
#
# Merge is the release: a push to main touching containers/<name>/ builds the
# container and pushes the image to zot. The horkos release publisher (push
# webhook) opens the kustomization pin PR — no warrant, no dispatch
# (eblume/horkos#17 step 5).
#
# PRs touching containers/ run the build as a check (never the registry push —
# fork runs carry no secrets) so the nix hash-TOFU round stays readable from
# the PR alone (the shared report-failure action posts the build log tail).

name: Build Container

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
  pull_request:
    paths:
      - 'containers/**'

jobs:
  detect:
    runs-on: indri
    outputs:
      nix: ${{ steps.classify.outputs.nix }}
    steps:
      # Full history: the diff below needs the pre-merge (push) or base (PR)
      # tree, both reachable from the checkout.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed containers
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            OLD="$BEFORE"
            # First push to the repo has no prior head to diff against.
            if ! echo "$OLD" | grep -qE '^[0-9a-f]{40}$'; then
              echo "No prior head to diff against — building nothing"
              echo "nix=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            OLD="$BASE"
          fi
          CHANGED=$(git diff --name-only "$OLD" HEAD -- containers/ \
            | awk -F/ 'NF >= 3 { print $2 }' | sort -u)
          NIX='[]'
          for name in $CHANGED; do
            if [ -f "containers/$name/default.nix" ]; then
              NIX=$(echo "$NIX" | jq -c --arg n "$name" '. + [$n]')
            else
              echo "Warning: $name has no default.nix — skipping"
            fi
          done
          echo "nix=$NIX" >> "$GITHUB_OUTPUT"
          echo "Nix builds: $NIX"

  build-nix:
    needs: detect
    if: needs.detect.outputs.nix != '[]'
    runs-on: nix-container-builder
    strategy:
      matrix:
        container: ${{ fromJson(needs.detect.outputs.nix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Extract version and SHA
        id: meta
        run: |
          CONTAINER="${{ matrix.container }}"
          NIX_FILE="containers/$CONTAINER/default.nix"

          # Extract version = "..." from the nix file
          VERSION=$(grep -m1 '^\s*version\s*=\s*"' "$NIX_FILE" \
            | sed 's/.*"\(.*\)".*/\1/' || true)

          if [ -z "$VERSION" ]; then
            echo "Error: No version declaration found in $NIX_FILE"
            exit 1
          fi

          REF="${GITHUB_SHA}"
          SHORT_SHA=$(echo "$REF" | head -c 7)

          # Ensure version starts with 'v'
          case "$VERSION" in
            v*) ;;
            *) VERSION="v${VERSION}" ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, SHA: $SHORT_SHA"

          # State the commit actually built where a reviewer will see it.
          {
            echo "### Built \`$CONTAINER\` $VERSION"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Commit built** | \`$REF\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve nixpkgs
        id: nixpkgs
        run: |
          NIXPKGS_PATH=$(nix flake metadata nixpkgs --json | jq -r '.path')
          echo "Resolved nixpkgs: $NIXPKGS_PATH"
          echo "path=$NIXPKGS_PATH" >> "$GITHUB_OUTPUT"

      - name: Build with nix
        env:
          NIX_PATH: "nixpkgs=${{ steps.nixpkgs.outputs.path }}"
        run: |
          echo "Building containers/${{ matrix.container }}/default.nix"
          echo "NIX_PATH=$NIX_PATH"
          set -o pipefail
          # Derivations that accept a buildHash arg (e.g. authentik) get the
          # image-tag short sha so their build identifier changes per rebuild.
          NIX_ARGS=()
          if grep -qE '^[[:space:]]*buildHash[[:space:]]*\?' "containers/${{ matrix.container }}/default.nix"; then
            NIX_ARGS=(--argstr buildHash "${{ steps.meta.outputs.sha }}")
          fi
          # Tee the build output so the failure-report step below can read it.
          # Per-leg file: concurrent matrix legs must not clobber each other.
          nix-build "containers/${{ matrix.container }}/default.nix" -o result "${NIX_ARGS[@]}" 2>&1 \
            | tee /tmp/nix-build-${{ matrix.container }}.log
          echo "Build complete: $(readlink result)"

      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        uses: ./.forgejo/actions/report-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          log-file: /tmp/nix-build-${{ matrix.container }}.log
          filter: 'hash mismatch|specified:|got:|error:'
          matrix: ${{ matrix.container }}

      # The zot push key is read from the blumeops-ci vault at job time
      # ([[blumeops-ci-item-migration]]); BLUMEOPS_CI_OP_TOKEN is the one
      # Actions secret this job needs. Push runs on main only — fork PR runs
      # never see it.
      - name: Push to registry
        if: success() && github.event_name == 'push'
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.BLUMEOPS_CI_OP_TOKEN }}
        run: |
          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "::error::BLUMEOPS_CI_OP_TOKEN is not provisioned as an Actions secret — see [[blumeops-ci-item-migration]]"
            exit 1
          fi
          ZOT_CI_API_KEY=$(op read 'op://blumeops-ci/zot-ci/api-key')
          echo "::add-mask::$ZOT_CI_API_KEY"
          CONTAINER="${{ matrix.container }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHORT_SHA="${{ steps.meta.outputs.sha }}"
          IMAGE="registry.ops.eblu.me/blumeops/$CONTAINER:${VERSION}-${SHORT_SHA}-nix"

          echo "Pushing to $IMAGE"
          # The runner's sandbox (DynamicUser implies PrivateTmp) mounts
          # /tmp and /var/tmp as a small tmpfs (~3.2G); skopeo unpacks the
          # whole docker-archive into its tmpdir, so large images die there
          # with 'short write' (run 1659). Use the disk-backed workspace.
          mkdir -p .skopeo-tmp
          skopeo --tmpdir "$PWD/.skopeo-tmp" copy \
            --dest-creds="zot-ci:$ZOT_CI_API_KEY" \
            "docker-archive:result" \
            "docker://$IMAGE"
          echo "Push complete: $IMAGE"
