# Weekly drift gate for ringtail's on-host secret files (eblume/blumeops#1524).
#
# Runs `seed-secrets ringtail --check` on the nix-container-builder runner
# (ringtail in host mode — the same box the files live on). The check is
# vault-free, so the job holds no credentials at all: no `op`, no repo
# secret; the auto-injected GITHUB_TOKEN is kept out of the git config at
# checkout and blanked in the check step's environment. A compromised
# workflow cannot read what it checks.
#
# The script is invoked directly, not through `mise run`: the task is
# [human]-fenced for agent pods, and --check is the part that is safe
# unattended (the same split forge-reconcile.yaml uses).
#
# The check needs an ssh + passwordless-sudo route from the runner to
# ringtail. The runner runs as the DynamicUser `gitea-runner`, which has
# neither today — until a route is granted, runs fail loudly with
# `UNKNOWN ssh + sudo route to ringtail`. A check that cannot see is a
# failure (mise-tasks/seed-secrets); the loud red is the point, because the
# silent gap is what blumeops#1515 was. The route grant is the follow-on.
#
# Scheduled Sunday 05:30 UTC, after ringtail-flake-update (05:00); it also
# verifies the host on every main push that touches the manifest or the
# script, so a merge cannot leave the two out of sync.

name: Seed Secrets Check

on:
  schedule:
    - cron: '30 5 * * 0' # Sunday 05:30 UTC, after ringtail-flake-update
  push:
    branches: [main]
    paths:
      - 'nixos/ringtail/secrets.json'
      - 'mise-tasks/seed-secrets'
      - '.forgejo/workflows/seed-secrets-check.yaml'
  workflow_dispatch:

concurrency:
  group: seed-secrets-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: nix-container-builder
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job holds no credentials; keep the token out of .git/config.
          persist-credentials: false

      - name: Check ringtail secret files (vault-free)
        env:
          GITHUB_TOKEN: ""
        run: |
          set -eo pipefail
          uv run --script mise-tasks/seed-secrets ringtail --check
