# Builds ringtail's NixOS configuration on the nix-container-builder runner
# (ringtail itself), when the flake tree (or this workflow) changes.
#
# The check runs on the same nix that consumes the flake - the same nix the
# ringtail-apply unit rebuilds with - so a build failure here means
# ringtail-apply would fail too.
#
# As with the other workflows, on an agent PR this sits pending until a human
# clicks "Approve and run" (the talos bot is read-only on canonical). See
# [[agent-change-process]].
name: Ringtail Flake Check

on:
  pull_request:
    paths:
      - 'nixos/ringtail/**'
      # Shared flake inputs: the config imports forge/runners.nix and
      # ntfy/topics.nix (each into its .json), so an edit there can
      # break the eval without touching the host tree.
      - 'ntfy/**'
      - 'forge/runners.*'
      - '.forgejo/workflows/ringtail-flake-check.yaml'
  push:
    branches: [main]
    paths:
      - 'nixos/ringtail/**'
      # Shared flake inputs: the config imports forge/runners.nix and
      # ntfy/topics.nix (each into its .json), so an edit there can
      # break the eval without touching the host tree.
      - 'ntfy/**'
      - 'forge/runners.*'
      - '.forgejo/workflows/ringtail-flake-check.yaml'
  workflow_dispatch:

jobs:
  # Gates the build below: a hostile FOD runs on the nix builder during the
  # build, so the verdict must come first. Eval only (IFD off, nothing
  # realised), so it runs on indri-build, off the builder.
  fod-eval:
    runs-on: indri-build
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the plain path flake refs need revCount.
          fetch-depth: 0
          persist-credentials: false

      - name: FOD check (ringtail)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP"
          mise run fod-eval-check -- --ringtail 2>&1 | tee "$RUNNER_TEMP/fod-eval-check.log"

      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        uses: ./.forgejo/actions/report-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          log-file: fod-eval-check.log
          filter: '^violation:|^FAILED|AssertionError|error:'

  check:
    needs: fod-eval
    runs-on: nix-container-builder
    # First run after the heph flake input landed cold-compiles heph (~11 min,
    # eblume/blumeops#1541) on top of the toplevel build; leave headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the nixos system
        run: |
          set -o pipefail
          cd nixos/ringtail
          nix build .#nixosConfigurations.ringtail.config.system.build.toplevel
