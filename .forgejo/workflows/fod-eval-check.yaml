# The eval-based FOD check (blumeops#1860, PR 2): nothing downloaded executes
# inside a FOD, read from evaluated derivations.
#
# Same credential-free shape as the Aspects job and the runner spike: GITHUB_TOKEN
# is blanked, checkout does not persist credentials, and no secrets are used.
# This is load-bearing — the steps evaluate repo Nix (nixpkgs resolution via
# containers#nixpkgsPath into NIX_PATH; the entry-point list comes from a glob,
# so a new container can't be skipped) — and checkout persists the default
# token into .git/config before any step runs, so the checkout step must stay
# persist-credentials: false.
#
# Informational: does NOT touch forge/branch-protections.json. A later PR
# registers the context "FOD Eval Check / check (pull_request)"; until then
# the job is expected-red on main (authentik's import-from-derivation,
# blumeops#1867, is still open).
name: FOD Eval Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: indri-build
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fast feedback on pull requests: the fixture meta-tests (every red
      # fixture rejected, every green accepted, the red set non-empty) run
      # nix evals only, no full tree.
      - name: FOD check self-test
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP"
          mise run fod-eval-check -- --self-test 2>&1 | tee "$RUNNER_TEMP/fod-eval-check-self-test.log"

      # The full tree: every entry point (ringtail toplevel, darwin/indri
      # toplevel, every containers/*/default.nix), walked and classified.
      - name: FOD check (full tree)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP"
          mise run fod-eval-check 2>&1 | tee "$RUNNER_TEMP/fod-eval-check.log"
