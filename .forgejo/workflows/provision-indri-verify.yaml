# provision-indri-verify — the true verdict for a provision-indri apply.
#
# The provision-indri.yaml apply job is fire-and-forget (#1266): it launches
# the detached darwin-rebuild and exits green, then dispatches this job. A
# plist-changing apply reloads the forgejo-runner LaunchAgent, and launchd
# clamps ExitTimeOut to 60 s in the per-user gui domain — any job waiting
# on the switch would be SIGKILLed with the agent while the detached
# switch (AbandonProcessGroup) keeps running. A FRESH job started after
# the reload is not: this one polls /var/log/indri-rebuild/<sha>.status
# and reports the true outcome. verify-runs closes the warrant tracking
# task from THIS run, so a failed switch is a failed verify run with the
# nix log, not a lost verdict.
#
# Dispatch: POST /repos/eblume/blumeops/actions/workflows/
# provision-indri-verify.yaml/dispatches by the apply job, with the same
# bound SHA (revision) and the origin PR (pr) the apply ran for. Manual
# dispatch is supported (re-verify an old SHA; pr optional).
#
# Injection posture: revision reaches this job only as an environment
# variable and is validated fail-closed before anything runs; pr is
# validated as a bare positive integer and used only inside a JSON body
# built with jq (never shell-interpolated).
#
# Docs: docs/how-to/indri/provision.md (warrant-gated apply),
# docs/explanation/warrant-approval-gated-runs.md.
name: provision-indri-verify

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full 40-char blumeops commit the apply launched a switch for'
        required: true
        type: string
      pr:
        description: 'PR or issue number in eblume/blumeops to post the breadcrumb to (optional)'
        required: false
        type: string

jobs:
  verify:
    runs-on: indri
    steps:
      - name: Validate inputs
        env:
          REVISION: ${{ inputs.revision }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ "${#REVISION}" -ne 40 ] || ! printf '%s' "$REVISION" | grep -qxE '^[0-9a-f]{40}$'; then
            echo "::error::revision must be a full 40-char lowercase sha (input length: ${#REVISION})"
            exit 1
          fi
          # pr, when present, is a bare issue/PR number — validated here so
          # it can only ever be digits; it is also only used inside a jq-
          # built JSON body, never interpolated into a URL by hand.
          if [ -n "${PR}" ] && ! printf '%s' "$PR" | grep -qxE '^[0-9]+$'; then
            echo "::error::pr must be a bare issue or PR number (input length: ${#PR})"
            exit 1
          fi

      - name: Poll the switch verdict
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          STATUS_FILE="/var/log/indri-rebuild/${REVISION}.status"
          LOG_FILE="/var/log/indri-rebuild/${REVISION}.log"
          if [ ! -e "$STATUS_FILE" ] && [ ! -e "$LOG_FILE" ]; then
            echo "::error::no /var/log/indri-rebuild/${REVISION}.{status,log} on indri — no switch was launched for ${REVISION}"
            exit 1
          fi
          # The same bounded window the old in-play wait had (120 x 30 s).
          # A timeout here does not kill the switch; re-dispatch re-polls.
          for _ in $(seq 1 120); do
            if [ -f "$STATUS_FILE" ]; then
              break
            fi
            sleep 30
          done
          if [ ! -f "$STATUS_FILE" ]; then
            echo "::error::switch for ${REVISION} still running after 60 min — it is detached and will finish; re-dispatch this workflow to collect the verdict"
            tail -c 4000 "$LOG_FILE" 2>/dev/null || true
            exit 1
          fi
          echo "---- /var/log/indri-rebuild/${REVISION}.log (tail) ----"
          tail -c 4000 "$LOG_FILE" 2>/dev/null || true
          echo "---- verdict ----"
          cat "$STATUS_FILE"
          STATUS=$(cat "$STATUS_FILE")
          if [ "$STATUS" != "0" ]; then
            echo "::error::darwin-rebuild switch for ${REVISION} exited ${STATUS} — log above"
            exit 1
          fi
          echo "switch for ${REVISION} exited 0 — apply is confirmed"

      - name: Post breadcrumb (only while the switch is still running)
        if: failure()
        env:
          REVISION: ${{ inputs.revision }}
          PR: ${{ inputs.pr }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # A failure here means EITHER a timed-out switch OR a genuinely
          # failed one — both are cases where the reader is left waiting.
          # The breadcrumb tells them the job is still executing (or died)
          # and how to get the output. The verdict is in the run log above
          # and in the .log/.status files; this comment only points.
          [ -n "${PR}" ] || { echo "no pr input — nothing to breadcrumb"; exit 0; }
          API="${GITHUB_API_URL:-${GITHUB_SERVER_URL:-https://forge.eblu.me}}/api/v1"
          AUTH="Authorization: token $GITHUB_TOKEN"
          # One jq string gives exactly the intended body (the spec as a
          # single jq program; $rev/$pr/$run via --arg, never shell-spliced).
          BODY=$(jq -n --arg run "https://forge.eblu.me/eblume/blumeops/actions" \
            --arg rev "$REVISION" --arg pr "$PR" \
            '"**indri switch status for `" + $rev + "`:** the warrant apply run for PR #" + $pr
            + " launched the detached darwin-rebuild and exited; its true verdict lives in the `provision-indri-verify` run, and the switch log at `/var/log/indri-rebuild/" + $rev
            + ".log` on indri (status sidecar: `." + $rev + ".status`). See the actions page: " + $run
            + ". If that run is red or missing, the switch itself may still be running — this is expected for a long switch, and the verdict is the verify run, not the apply run."')
          HTTP_CODE=$(curl -s -o /tmp/breadcrumb-response.txt -w '%{http_code}' \
            -X POST -H "$AUTH" -H 'Content-Type: application/json' -d "$BODY" \
            "$API/repos/$GITHUB_REPOSITORY/issues/$PR/comments")
          if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "breadcrumb posted to #$PR"
          else
            echo "::warning::breadcrumb post failed (HTTP $HTTP_CODE): $(cat /tmp/breadcrumb-response.txt)"
          fi
