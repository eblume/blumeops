# provision-indri — apply a bound blumeops SHA's nix-darwin generation to indri.
#
# Not requestable: it is `class: auto` in warrant-policy.yaml, so `mise run
# request-run` refuses it. Its real path is push-to-main auto-apply on its
# watched paths — the merge commit is the approval (see
# docs/explanation/auto-apply.md) — with `workflow_dispatch` as the manual
# fallback; the full story is in the header paragraphs below.
# The job runs on indri's own runner (host-mode erichblume with NOPASSWD sudo —
# the documented, accepted runner story for this box, so no polkit or
# template-unit dance; contrast ringtail-rebuild) and drives the proven
# zero-prompt path: `mise run provision-indri -- --tags rebuild`. That runs
# the task-side guards (flake-lock check, pushed-HEAD/ancestry
# guard) and the play's rebuild-tagged pre_tasks: checkout the bound SHA into
# a root-owned /etc/blumeops, detached `sudo -n -H nohup sh -c 'cd /;
# darwin-rebuild switch --flake /etc/blumeops/darwin/indri#indri'`. The
# rebuild path reads
# no vault: every `op read` in the play is role-tagged, so `--tags rebuild`
# runs none. The full ansible provision (roles, secrets) stays a human
# window — the ringtail-rebuild-vs-provision-ringtail decomposition, applied
# to indri.
#
# Injection posture: the dispatch input reaches this job only as an
# environment variable — never into a checkout ref or shell text. The
# validate step is the first place it is interpreted and fails closed; the
# checkout is of main (reviewed state); the apply step re-validates, then
# detaches onto the bound SHA (a main ancestor — its objects are already in
# the object database).
#
# The contract is "apply a commit merged to main": the workflow pre-flights
# it unprivileged, and the task's pushed-HEAD guard (detached-aware)
# re-checks origin/main ancestry as the task-side authority.
#
# FIRE-AND-FORGET (#1266): the job passes indri_rebuild_wait=false, so the
# play launches the switch and exits. Green means "switch launched", not
# "switch succeeded". Waiting is not an option: a switch that changes the
# forgejo-runner agent reloads it, and launchd kills any job still running
# ~60 s later. The outcome lives on indri — /var/log/indri-rebuild/<sha>.status
# (exit code, written when the switch ends) and <sha>.log; read them if a
# change does not show up. See docs/how-to/indri/provision.md.
#
# The privileged-label invariant (#1358) is bounded by label and by gate:
# this is the only workflow on the dedicated `indri-priv` label, so no
# `pull_request`-triggerable job can ever reach this runner. Push events run
# main's reviewed definition only, and the gate job refuses them unless
# `github.sha` is the merge commit of a merged PR ([[auto-apply]]);
# workflow_dispatch remains the manual fallback, and dispatching it still
# takes a write collaborator (eblume, or horkos-forge under a warrant).
#
# Docs: docs/explanation/warrant-approval-gated-runs.md,
# docs/how-to/indri/provision.md (warrant-gated apply).
#
# Pushes to main touching darwin/indri/** auto-apply: the merge commit is
# the approval (class: auto, see docs/explanation/auto-apply.md). The gate
# job refuses anything that is not the merge commit of a merged PR
# (fail-closed, 404 = refuse); the preflight job refuses when no online
# runner serves `indri-priv`. workflow_dispatch remains the manual fallback
# and runs the same gate/preflight. Runs of the workflow are serialized by
# its top-level `concurrency` group (`cancel-in-progress: false`).
name: provision-indri

on:
  push:
    branches: [main]
    paths:
      - 'darwin/indri/**'
      # Shared forge-runner inputs: the host config imports forge/runners.nix
      # (-> forge/runners.json), so a change there ships on the next apply —
      # trigger that apply here (docs/explanation/auto-apply.md).
      - 'forge/runners.nix'
      - 'forge/runners.json'
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full 40-char blumeops commit whose nix-darwin generation to apply to indri'
        required: true
        type: string

concurrency:
  group: provision-indri
  cancel-in-progress: false

jobs:
  gate:
    runs-on: nix-container-builder
    steps:
      - name: Refuse non-merge-commit pushes
        env:
          SHA: ${{ github.sha }}
          FORGE_SERVER_URL: ${{ github.server_url }}
          FORGE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The gate applies to push events only; on workflow_dispatch there
          # is no push to check.
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            exit 0
          fi
          base="$FORGE_SERVER_URL"
          repo="$FORGE_REPOSITORY"
          sha="$SHA"
          refuse() {
            echo "::error::$1"
            # Best-effort notification; a failed post must not change the verdict.
            curl -s -X POST \
              -H "Title: auto-apply refused" \
              -H "Tags: warning" \
              -d "$2" \
              https://ntfy.ops.eblu.me/ops-approvals || true
            exit 1
          }
          # curl -f would turn a 404 into a silent failure; capture the
          # status separately from the body instead.
          code=$(curl -s -o /tmp/pull.json -w '%{http_code}' \
            "$base/api/v1/repos/$repo/commits/$sha/pull" || true)
          [ "$code" = "200" ] || refuse \
            "merge-commit gate: $sha is not the merge commit of a merged PR (HTTP $code) — refusing auto-apply" \
            "provision-indri: auto-apply refused for $sha — not the merge commit of a merged PR (HTTP $code)"
          merged=$(jq -r '.merged // false' /tmp/pull.json)
          [ "$merged" = "true" ] || refuse \
            "merge-commit gate: $sha is not a merged PR (merged=$merged) — refusing auto-apply" \
            "provision-indri: auto-apply refused for $sha (merged=$merged)"
          msha=$(jq -r '.merge_commit_sha // ""' /tmp/pull.json)
          [ "$msha" = "$sha" ] || refuse \
            "merge-commit gate: $sha is not the merge commit of its PR (merge_commit_sha=$msha) — refusing auto-apply" \
            "provision-indri: auto-apply refused for $sha (merge_commit_sha=$msha)"

  preflight:
    needs: gate
    runs-on: nix-container-builder
    env:
      FORGE_ACTIONS_RO_TOKEN: ${{ secrets.FORGE_ACTIONS_RO }}
      FORGE_SERVER_URL: ${{ github.server_url }}
      FORGE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Refuse when no online runner serves the indri-priv label
        env:
          SHA: ${{ github.sha }}
          LABEL: indri-priv
        run: |
          set -euo pipefail
          base="$FORGE_SERVER_URL"
          repo="$FORGE_REPOSITORY"
          sha="$SHA"
          label="$LABEL"
          refuse() {
            echo "::error::$1"
            curl -s -X POST \
              -H "Title: auto-apply preflight refused" \
              -H "Tags: warning" \
              -d "$2" \
              https://ntfy.ops.eblu.me/ops-approvals || true
            exit 1
          }
          if [ -z "$FORGE_ACTIONS_RO_TOKEN" ]; then
            refuse \
              "preflight: FORGE_ACTIONS_RO is not provisioned as an Actions secret — cannot confirm a runner serves '$label' (fail closed)" \
              "provision-indri: preflight refused for $sha — FORGE_ACTIONS_RO secret missing"
          fi
          code=$(curl -s -o /tmp/runners.json -w '%{http_code}' \
            -H "Authorization: Bearer $FORGE_ACTIONS_RO_TOKEN" \
            "$base/api/v1/repos/$repo/actions/runners" || true)
          [ "$code" = "200" ] || refuse \
            "preflight: runners API unreachable (HTTP $code) — cannot confirm a runner serves '$label' (fail closed)" \
            "provision-indri: preflight refused for $sha — runners API unreachable (HTTP $code)"
          # The endpoint returns a bare array of runners (verified against the
          # running instance's swagger and Forgejo source, 2026-10-13);
          # unwrap a hypothetical {"runners": [...]} wrapper defensively. A
          # runner is online when status is idle or active (the API's own
          # server-side online status);
          # labels carry the form <name>:<execution-mode> (e.g. indri-priv:host),
          # so match the part before the colon. The `?` guards keep a
          # non-array response (e.g. an API error object) fail-closed: count 0.
          runners=$(jq -c 'if type == "object" and has("runners") then .runners else . end' /tmp/runners.json)
          count=$(jq -r --arg want "$label" '
            [.[] | select(
              (any((.labels? // [])[]?; (. | split(":")[0]) == $want))
              and ((.status? // "") == "idle" or (.status? // "") == "active")
            )] | length
          ' <<<"$runners")
          if [ "$count" -eq 0 ]; then
            echo "::error::preflight: no online runner serves the '$label' label — refusing (fail closed)"
            echo "::error::runners: $(jq -c '[.[] | {name: (.name? // ""), status: (.status? // ""), labels: (.labels? // [])}]' <<<"$runners")"
            curl -s -X POST \
              -H "Title: auto-apply preflight refused" \
              -H "Tags: warning" \
              -d "provision-indri: preflight refused for $sha — no online runner serves '$label'" \
              https://ntfy.ops.eblu.me/ops-approvals || true
            exit 1
          fi

  rebuild:
    needs: [gate, preflight]
    runs-on: indri-priv
    steps:
      # The raw dispatch input reaches this job only as an environment
      # variable. This step is the single fail-closed shape gate: a value
      # that is not exactly 40 lowercase hex chars stops the job before
      # anything privileged or networked runs. The error names the input
      # length, not the value — the value is untrusted text and must not
      # reach the run log.
      - name: Validate revision input
        env:
          REVISION: ${{ github.event_name == 'push' && github.sha || inputs.revision }}
        run: |
          set -euo pipefail
          # Length and whole-line content together close the newline hole a
          # bare line-based regex leaves: a value shorter or longer than 40
          # chars, or split across lines, cannot pass both.
          if [ "${#REVISION}" -ne 40 ] || ! printf '%s' "$REVISION" | grep -qxE '^[0-9a-f]{40}$'; then
            echo "::error::revision must be a full 40-char lowercase sha (input length: ${#REVISION})"
            echo "::error::approvals bind to immutable SHAs — see docs/how-to/operations/request-a-privileged-run.md"
            exit 1
          fi

      # The bound revision never reaches a git ref: the checkout is of main.
      # Full history — the ancestry pre-flight below needs main's line, and a
      # depth-1 fetch would make it pass only for main's live tip.
      - name: Check out main (reviewed state)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Fail fast, unprivileged, before indri is touched: the SHA must be an
      # ancestor of main. Not the authority — the task's guard re-checks
      # origin/main from the detached checkout, and /etc/blumeops is what
      # the rebuild actually runs.
      - name: Verify bound revision is on main
        env:
          REVISION: ${{ github.event_name == 'push' && github.sha || inputs.revision }}
        run: |
          set -euo pipefail
          if ! git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$REVISION^{commit}" origin/main; then
            echo "::error::$REVISION is not a commit merged to main"
            echo "::error::the approved SHA must be merged to main before it can be applied"
            exit 1
          fi

      - name: Apply to indri
        env:
          REVISION: ${{ github.event_name == 'push' && github.sha || inputs.revision }}
        run: |
          set -euo pipefail
          # Re-validate at the privileged boundary; the task's guard
          # re-checks the ancestry contract as the task-side authority.
          if [ "${#REVISION}" -ne 40 ] || ! printf '%s' "$REVISION" | grep -qxE '^[0-9a-f]{40}$'; then
            echo "::error::revision failed re-validation"
            exit 1
          fi
          # The generation the switch starts from — the system profile is the
          # durable pointer to it (no /run/current-system assumptions).
          echo "Generation before: $(readlink /nix/var/nix/profiles/system)"
          # Detach onto the bound SHA — a main ancestor, so its objects are
          # in this full-history checkout. The task's guards and the play's
          # indri_commit then bind to the approved commit, not main's tip.
          git -C "$GITHUB_WORKSPACE" checkout --detach "$REVISION"
          # The runner is erichblume on indri itself (host-mode, NOPASSWD
          # sudo): run the play over a local connection. SSH-to-self is
          # impossible here — a connect to the node's own tailnet IP is
          # delivered by the local kernel and never reaches tailscaled's
          # SSH server (Remote Login is off by design) — proven by the
          # failed 4737 run. Human windows from other controllers keep
          # the SSH inventory as-is.
          # ansible discovers the module python from the runner's PATH —
          # the mise shim first — and under a local connection the shim
          # dies under sudo's env_reset (untrusted mise.toml in the act
          # workspace; run 4874). Pin it to the uv-built venv python that
          # uvx already runs ansible from: real path, not a shim.
          #
          # The override reaches ansible's *modules* only — a become step
          # that calls a shimmed tool by bare name still fails. None do:
          # git is Homebrew's, sh/nohup/tail/cat/readlink are system
          # binaries, nix is its profile's, darwin-rebuild is called by
          # full path. Keep it that way.
          #
          # indri_rebuild_wait=false: launch and exit (see the header).
          mise run provision-indri -- --tags rebuild -e ansible_connection=local \
              -e "ansible_python_interpreter={{ ansible_playbook_python }}" \
              -e indri_rebuild_wait=false
          echo "Switch launched for $REVISION; outcome: /var/log/indri-rebuild/$REVISION.status on indri"
