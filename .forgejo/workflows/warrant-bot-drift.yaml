# Assert that warrant-bot — the identity Warrant dispatches approved runs as —
# still holds exactly write on eblume/blumeops and nothing more.
#
# Read-only. This job changes nothing; it only fails. Minting the credential
# stays a human ceremony on gilbert (`mise run warrant-bot-provision`, see that
# script for why automating it would defeat the point). Noticing that the
# ceremony's result has since drifted is the part a machine should do.
#
# Everything it checks lives in the forge, not in this repo, so a change made in
# the UI leaves no diff for review to catch. That is the whole reason for a
# scheduled job rather than a PR check alone.
#
# Needs FORGE_ADMIN_TOKEN: collaborator permissions and branch protections are
# admin-only reads. Same secret and same provisioning path as Agent Repo Access.
#
# That credential is also why there is no `pull_request` trigger. Fork PRs get
# no secrets, every agent PR is a fork PR, and the token is what this job needs
# to see anything — so as a PR check it could only ever hit --skip-if-no-token,
# which exits 0 and renders as a passing tick. A green check that verified
# nothing is worse than no check. Editing the script is covered by the `push`
# run on main, which is the first run with a real token, plus the weekly
# schedule; both fail loudly and neither can pass by abstaining.
name: Warrant Bot Drift

on:
  schedule:
    # Weekly, Monday 07:00 UTC — shortly after the 06:00 branch-cleanup slot so
    # the two scheduled jobs don't contend for the runner.
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'mise-tasks/warrant-bot-drift'
      - 'mise-tasks/warrant-bot-provision'
      - '.forgejo/workflows/warrant-bot-drift.yaml'
  workflow_dispatch:

jobs:
  drift:
    runs-on: indri
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --skip-if-no-token logs a loud yellow SKIPPED and exits 0 rather than
      # failing on a missing credential, matching Agent Repo Access. An
      # insufficient token is a different case and DOES fail: the script reports
      # every unreadable check as UNKNOWN and exits 1, because a check that
      # cannot see is not a check that passed.
      - name: Check warrant-bot scope
        env:
          FORGE_ADMIN_TOKEN: ${{ secrets.FORGE_ADMIN_TOKEN }}
        run: uv run --script mise-tasks/warrant-bot-drift --skip-if-no-token
