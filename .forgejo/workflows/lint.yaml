# The lint gate, on every PR: the prek hook set, workflow schema validation,
# and a full-history secret scan.
#
# The hooks existed and ran nowhere. Enforcement was whoever remembered to run
# `prek run --all-files` on gilbert, which is why drift keeps being found by
# accident: five Python files had silently fallen out of ruff-format shape, and
# ruff had never once looked at `mise-tasks/` — the directory holding most of
# this repo's logic.
#
# Same shape and the same invariant as Docs Checks: no token, no vault, no
# cluster, no network beyond fetching hook environments. That is what makes it
# safe on every PR including from a fork. Keep it that way — a check needing a
# secret belongs in a different workflow.
# The report-failure step is the one exception: failure-only, automatic per-run token (no repo secret).
#
# The three jobs are required status contexts on `main` — `Lint / prek`,
# `Lint / workflows-validate`, `Lint / secret-scan` (pull_request contexts,
# #1013). The context string is `workflow name / job name (event)`, so
# renaming a job silently un-requires it: update the branch protection and
# the list in
# docs/explanation/agent-change-process.md ("The residual problem").
#
# The runner already carries everything this needs. `prek`, `actionlint` and
# `dagger` are in `forgejo_runner_host_tools` (ansible/roles/forgejo_runner),
# installed globally with mise; `uv` runs the extensionless mise-tasks. Note
# that a `*-system` hook runs whatever is on PATH, so if a host tool goes
# missing the hook does not skip — prek reports it FAILED. The version pins
# there mirror this repo's `prek.toml` revs and must be bumped together.
#
# The prek job is the enforcement point for the hook set, so `prek.toml`
# holds only hooks that can run in a clean checkout. Two capabilities that
# rule pushed out of prek run here as sibling jobs instead:
# `workflows-validate` (as a prek hook it needed Docker Desktop and a dagger
# engine; the runner's own binary does the same validation in milliseconds)
# and `secret-scan` (the old trufflehog hook was pinned to an incremental
# range that scanned nothing in CI; gitleaks covers the full history).
# `ty-check` is one of the prek hooks: it type-checks the whole repo,
# including the extensionless uv scripts in mise-tasks/ that ruff also covers.
# It runs in a clean checkout because it must work where the project env has
# never been built — `uv run --group dev` boots the env and resolves the
# `dev` group (pyproject.toml) that mirrors the scripts' inline pins.
# (heph 01KZP4MRGSTEM63V0TQFDP7BRF).
#
# On an agent PR this sits `pending` with no run until a human clicks
# "Approve and run" — the agents bot is read-only on canonical, so its PRs are
# outside contributions. Do not switch to `pull_request_target` to skip it:
# that trigger gets secrets and a write token.
# See [[agent-change-process#Why agent PRs need an approval click]].
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  prek:
    runs-on: indri
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A missing prek must not look like a passing lint job. Same reasoning as
      # mise-tasks/_require: refuse with an explanation rather than degrade.
      - name: prek is on PATH
        run: |
          if ! command -v prek >/dev/null 2>&1; then
            echo "::error::prek not found on the runner." >&2
            echo "It is declared in forgejo_runner_host_tools" >&2
            echo "(ansible/roles/forgejo_runner/defaults/main.yml) and installed" >&2
            echo "by 'mise use --global'. Re-run provision-indri --tags forgejo_runner." >&2
            exit 1
          fi
          prek --version

      # No SKIP list. Every hook in prek.toml runs here, so this job's result is
      # the whole of what the hook set checks — nothing is quietly excluded, and the
      # config cannot drift into holding hooks that no longer run anywhere.
      # Adding a hook that cannot run in a clean checkout re-opens that gap.
      #
      # GITHUB_TOKEN is blanked to make this job's credential-free claim literal.
      # Forgejo Actions puts the FORGE job token in the environment under that
      # name — act writes every `github.*` value under a `GITHUB_` prefix — so
      # without this line all 25 hooks, half of them third-party code fetched at
      # run time, execute with a live forge credential they have no use for.
      #
      # It arrived as a workaround for a different problem: mise honours
      # GITHUB_TOKEN for api.github.com, offered the Forgejo credential to GitHub
      # and took a 401 on every tool it had to resolve, failing the four hooks
      # whose entry was `mise run`. Those entries now invoke their script
      # directly, so no hook reaches for mise or the GitHub API at all and the
      # 401 cannot recur — see the header comment in `prek.toml`. The line stays
      # for the reason above, which is the stronger one.
      #
      # A hook that genuinely needs mise to resolve a tool wants the runner-wide
      # MISE_GITHUB_TOKEN in `envs` (heph 01KZKP8893WM8DQT5N97QF6PBD), not this
      # job's forge token.
      - name: prek run --all-files
        env:
          GITHUB_TOKEN: ""
        run: |
          set -o pipefail
          prek run --all-files --show-diff-on-failure 2>&1 | tee /tmp/lint-prek.log

      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        uses: ./.forgejo/actions/report-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          log-file: /tmp/lint-prek.log

  # Schema validation against the runner's own parser — the check actionlint
  # cannot do, since it validates against GitHub's schema and misses
  # forgejo-specific keys (and forgejo-specific rejections). `validate` is a
  # plain subcommand of the runner binary (v9.0+), so no docker and no
  # dagger; this job replaces the retired validate_workflows dagger function.
  # To validate by hand off-runner, see
  # docs/how-to/forgejo-runner/validate-forgejo-workflows.md.
  workflows-validate:
    runs-on: indri
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Upstream ships no darwin release binaries, which is why indri's runner
      # is a source build — and why this step runs that same binary rather
      # than downloading one. The path mirrors `forgejo_runner_binary` in
      # ansible/roles/forgejo_runner/defaults/main.yml, and the role verifies
      # both its existence and its version pin on every provision. The daemon
      # executing this job is that binary, so it validates against exactly the
      # schema the workflows will run under.
      - name: forgejo-runner validate
        run: |
          set -o pipefail
          {
            runner_bin="$HOME/code/3rd/forgejo-runner/forgejo-runner"
            if [ ! -x "$runner_bin" ]; then
              echo "::error::forgejo-runner not found at $runner_bin." >&2
              echo "The path mirrors forgejo_runner_binary in" >&2
              echo "ansible/roles/forgejo_runner/defaults/main.yml." >&2
              echo "Re-run provision-indri --tags forgejo_runner." >&2
              exit 1
            fi
            "$runner_bin" --version
            "$runner_bin" validate --directory .
          } 2>&1 | tee /tmp/lint-workflows-validate.log

      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        uses: ./.forgejo/actions/report-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          log-file: /tmp/lint-workflows-validate.log

  # gitleaks over the FULL git history, not the PR range. This repo is public
  # and its first rule is never commit secrets, so a credential that landed
  # ten merges ago matters exactly as much as one this PR introduces — and the
  # whole scan takes ~7s on ~1500 commits, so there is nothing to save by
  # scoping down. False positives are allowlisted by class in `.gitleaks.toml`.
  #
  # Replaces the removed trufflehog prek hook, whose `--since-commit HEAD`
  # range scanned nothing in CI (heph 01KZP8ADGMQ6TSXVAQ9YAWM2Z9).
  secret-scan:
    runs-on: indri
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history is the point

      # `mise x` resolves gitleaks from GitHub releases using the runner-wide
      # MISE_GITHUB_TOKEN (a zero-permission public-read PAT) and caches it on
      # the host, so only the first run downloads anything. GITHUB_TOKEN is
      # blanked for the same reason as in the prek job: gitleaks is
      # third-party code reading every byte this repo has ever committed, and
      # it has no use for a live forge credential. `--redact` keeps any real
      # hit out of the CI log, which a finder could otherwise read.
      - name: gitleaks (full history)
        env:
          GITHUB_TOKEN: ""
        run: |
          set -o pipefail
          mise x gitleaks@8.30.1 -- gitleaks git . \
            --no-banner --redact --config .gitleaks.toml 2>&1 | tee /tmp/lint-secret-scan.log

      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        uses: ./.forgejo/actions/report-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          log-file: /tmp/lint-secret-scan.log

  # Every Application under argocd/apps/ is a pointer ArgoCD tracks forever
  # (automated sync + self-heal). Refuse any source the agents bot can move —
  # its own fork on a branch — so a mutable pointer is caught at PR time,
  # before the root is ever synced. Shares the validator with the
  # argocd-sync-apps.yaml payload check, so the PR check and the run-time check
  # cannot drift. Runs on every PR including from a fork: it reads only local
  # files, no token, vault, or cluster.
  argocd-apps-validate:
    runs-on: indri
    # Runs this job's validator from the PR checkout, so a fork PR could ship a
    # neutered copy and pass this gate. The backstop is the argocd-sync-apps
    # payload check, which runs MAIN's reviewed copy over the payload — main
    # moves only via a human-merged PR. Making this a required context (see
    # [[agent-change-process]]) closes most of the gap at PR time.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Application sources
        env:
          GITHUB_TOKEN: ""
        run: |
          set -o pipefail
          uv run --script mise-tasks/validate-argocd-apps 2>&1 | tee /tmp/lint-argocd-apps.log

      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        uses: ./.forgejo/actions/report-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          log-file: /tmp/lint-argocd-apps.log
