# The instance aspect suite (mise-tasks/aspects over aspects/), in the home
# that matches the name: an Aspects workflow.
#
# Same shape as Tests: the check is pure local reads over the target repo
# (default: this blumeops checkout), so GITHUB_TOKEN is blanked and the job
# stays safe on every PR including from a fork. The report-failure step is
# the one exception: failure-only, automatic per-run token (no repo secret).
#
# Its context is required by name on main (forge/branch-protections.json):
# the `* (pull_request)` glob only blocks a check that actually ran, so the
# named entry is what holds the merge on an unapproved agent PR.
#
# On an agent PR this sits `pending` with no run until a human clicks
# "Approve and run" — the talos bot is read-only on canonical, so its PRs
# are outside contributions. Do not switch to `pull_request_target` to skip
# it: that trigger gets secrets and a write token.
# See [[agent-change-process#Why agent PRs need an approval click]].
name: Aspects

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  aspects:
    runs-on: indri-build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aspects
        env:
          GITHUB_TOKEN: ""
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP"
          mise run aspects 2>&1 | tee "$RUNNER_TEMP/aspects.log"

      - name: Red fixtures
        if: always()
        env:
          GITHUB_TOKEN: ""
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP"
          mise run red-fixtures 2>&1 | tee -a "$RUNNER_TEMP/aspects.log"

      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        uses: ./.forgejo/actions/report-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          log-file: aspects.log
