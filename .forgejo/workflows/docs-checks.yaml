# The repo's own doc and changelog validators, on every PR.
#
# All three already existed as mise tasks and none of them ran anywhere. That
# gap is not theoretical: seven changelog fragments accumulated in
# `docs/changelog.d/agent/` before this workflow's PR found them, and towncrier
# would have dropped every one from the next release without a word.
#
# Deliberately credential-free — no token, no vault, no cluster, no network.
# That is what makes it safe to run on every PR including from a fork, and it
# is the same property that lets an agent run all three locally before pushing.
# Keep it that way: a check that needs a secret belongs in a different workflow.
# The report-failure step is the one exception: failure-only, automatic per-run token (no repo secret).
#
# On an agent PR this sits `pending` with no run until a human clicks
# "Approve and run" — the agents bot is read-only on canonical, so its PRs are
# outside contributions. That click also decides WHICH workflow files run
# (target branch for untrusted authors, the PR's own for trusted ones), so it
# is a security control, not just friction. Do not switch this to
# `pull_request_target` to skip it: that trigger gets secrets and a write
# token. See [[agent-change-process#Why agent PRs need an approval click]].
name: Docs Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: indri
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `if: always()` on the later steps: these are independent validators, so
      # reporting all three failures in one run beats making someone push a fix
      # to discover the next one.
      - name: Changelog fragments are flat files
        run: |
          set -o pipefail
          ./mise-tasks/changelog-check 2>&1 | tee /tmp/docs-checks-checks.log

      - name: Docs have required frontmatter
        if: always()
        run: |
          set -o pipefail
          uv run --script mise-tasks/docs-check-frontmatter 2>&1 | tee -a /tmp/docs-checks-checks.log

      - name: Wiki-links resolve
        if: always()
        run: |
          set -o pipefail
          uv run --script mise-tasks/docs-check-links 2>&1 | tee -a /tmp/docs-checks-checks.log

      # A PR body ends at the merge: after-merge steps live in the linked issue's
      # Human steps comment, not in the body (#1233).
      - name: PR body has no after-merge section
        if: always() && github.event_name == 'pull_request'
        run: |
          set -o pipefail
          body="$(jq -r '.pull_request.body // empty' "$GITHUB_EVENT_PATH")"
          if printf '%s\n' "$body" | grep -inE '^#{1,6}[[:space:]]+(after merge|post-merge|remaining steps \(human\))' ; then
            echo "::error::PR body carries an after-merge section heading (After merge / Post-merge / Remaining steps (human)). PR bodies end at the merge: after-merge steps belong in the linked issue's '## Human steps' comment (eblume/blumeops#1233). Move the section out of the body and re-run." | tee -a /tmp/docs-checks-checks.log
            exit 1
          fi

      - name: Report failure to PR
        if: failure() && github.event_name == 'pull_request'
        uses: ./.forgejo/actions/report-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          log-file: /tmp/docs-checks-checks.log
