# Reconcile the agents bot's forge collaborations against
# argocd/manifests/talos/repos.json — the same file the talos pod mounts to
# build its clone loop, so "share a repo with the agent" is one edit, not two.
#
# RECONCILE IS AUTHORITATIVE: a repo absent from repos.json has its `agents`
# collaboration removed. The PR job runs --check so the revocations are visible
# in review *before* the merge that applies them.
#
# Needs FORGE_REPO_WRITE_TOKEN — an eblume PAT scoped to write:repository
# (collaborator management needs repo-admin *permission*, which eblume has as
# owner; the token *scope* only needs the repository category — verified
# 2026-08-22, replacing the admin PAT that sat here before). Provisioned the
# same way as every other blumeops CI secret: declared in the
# `forgejo_actions_secrets` ansible role and pushed by a human from gilbert with
#   mise run provision-indri -- --tags forgejo_actions_secrets
# That human step IS the gate — CI gets a curated subset of the blumeops vault,
# never the vault itself. Locally the task falls back to `op read` on the same
# 1Password item.
name: Agent Repo Access

on:
  push:
    branches: [main]
    paths:
      - 'argocd/manifests/talos/repos.json'
      - 'mise-tasks/agent-repo-access'
      - '.forgejo/workflows/agent-repo-access.yaml'
  pull_request:
    paths:
      - 'argocd/manifests/talos/repos.json'
      - 'mise-tasks/agent-repo-access'
      - '.forgejo/workflows/agent-repo-access.yaml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — do not change any grants'
        required: false
        default: false
        type: boolean

jobs:
  reconcile:
    runs-on: indri
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --skip-if-no-token is the bootstrap allowance: the secret is provisioned
      # by the ansible role in this same change, so it cannot exist until after
      # the first merge. Both steps log a loud yellow SKIPPED when it's unset.
      # Once provisioned they behave normally; do the first real reconcile with a
      # manual dispatch after `provision-indri`.

      # On a PR: report drift and fail, so the diff's real-world effect (notably
      # any revocation) is on screen before anyone merges it. Never mutates.
      - name: Check (pull request)
        if: github.event_name == 'pull_request'
        env:
          FORGE_REPO_WRITE_TOKEN: ${{ secrets.FORGE_REPO_WRITE_TOKEN }}
        run: uv run --script mise-tasks/agent-repo-access --check --skip-if-no-token

      - name: Apply
        if: github.event_name != 'pull_request'
        env:
          FORGE_REPO_WRITE_TOKEN: ${{ secrets.FORGE_REPO_WRITE_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run --script mise-tasks/agent-repo-access --dry-run --skip-if-no-token
          else
            uv run --script mise-tasks/agent-repo-access --skip-if-no-token
          fi
