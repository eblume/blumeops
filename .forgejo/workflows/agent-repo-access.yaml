# Reconcile the `agents` bot's forge access — collaborator grants, talos
# webhooks, issue-scope labels — against argocd/manifests/talos/repos.json,
# the file the talos pod's clone loop reads; a repo absent from repos.json is
# revoked. PRs run --check so revocations are visible in review before the
# merge that applies them.
#
# Hook creation and the label half need secrets CI does not carry, so they
# skip loudly in CI and a human follows up from gilbert with
# `mise run agent-repo-access`. FORGE_REPO_WRITE_TOKEN is an eblume PAT
# (write:repository,read:user) provisioned by the forgejo_actions_secrets
# ansible role. Details: the script docstring in mise-tasks/agent-repo-access.
name: Agent Repo Access

on:
  push:
    branches: [main]
    paths:
      - 'argocd/manifests/talos/repos.json'
      - 'mise-tasks/agent-repo-access'
      - '.forgejo/workflows/agent-repo-access.yaml'
  pull_request:
    paths:
      - 'argocd/manifests/talos/repos.json'
      - 'mise-tasks/agent-repo-access'
      - '.forgejo/workflows/agent-repo-access.yaml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — do not change any grants'
        required: false
        default: false
        type: boolean

jobs:
  reconcile:
    runs-on: indri
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --skip-if-no-token is the bootstrap allowance: the secret is provisioned
      # by the ansible role in this same change, so it cannot exist until after
      # the first merge. Both steps log a loud yellow SKIPPED when it's unset.
      # Once provisioned they behave normally; do the first real reconcile with a
      # manual dispatch after `provision-indri`.

      # On a PR: report drift and fail, so the diff's real-world effect (notably
      # any revocation) is on screen before anyone merges it. Never mutates.
      - name: Check (pull request)
        if: github.event_name == 'pull_request'
        env:
          FORGE_REPO_WRITE_TOKEN: ${{ secrets.FORGE_REPO_WRITE_TOKEN }}
        run: uv run --script mise-tasks/agent-repo-access --check --skip-if-no-token

      - name: Apply
        if: github.event_name != 'pull_request'
        env:
          FORGE_REPO_WRITE_TOKEN: ${{ secrets.FORGE_REPO_WRITE_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            uv run --script mise-tasks/agent-repo-access --dry-run --skip-if-no-token
          else
            uv run --script mise-tasks/agent-repo-access --skip-if-no-token
          fi
