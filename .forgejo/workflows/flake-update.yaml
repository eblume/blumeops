# Ringtail Flake Update
#
# Runs `nix flake update` in a nixos/nix container (see [[manage-lockfile]])
# on the runner and pushes the refreshed nixos/ringtail/flake.lock back to
# the branch the workflow was dispatched on.
#
# This exists so remote-agent sessions (which have no nix, docker, or deploy
# access) can author a flake update by PR: the agent opens a branch/PR, a
# human dispatches this workflow on that branch, and the lockfile bump lands
# as a commit on the PR for review. Deployment stays human-only:
# `mise run provision-ringtail` from gilbert after merge.
#
# Usage:
#   1. Go to Actions > Ringtail Flake Update > Run workflow
#   2. Select the branch to update (e.g. the open PR branch)
#   3. Review the resulting lockfile commit on the branch

name: Ringtail Flake Update

on:
  workflow_dispatch:

jobs:
  flake-update:
    runs-on: indri
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update flake.lock via docker
        run: |
          echo "Updating nixos/ringtail/flake.lock (all inputs except nixpkgs-services)..."
          docker run --rm -i -v "$PWD":/workspace -w /workspace/nixos/ringtail \
            -e SKIP_INPUTS=nixpkgs-services nixos/nix:2.34.4 sh -s <<'SH'
          set -e;
          # Double quotes: single quotes would keep $SKIP_INPUTS literal and
          # silently disable the skip filter (letting `nix flake update`
          # bump the deliberately-pinned nixpkgs-services input).
          SKIP="$SKIP_INPUTS";
          # Land the metadata in a real file: nix-instantiate cannot
          # readFile a pipe (/dev/stdin canonicalizes to
          # /proc/<pid>/fd/pipe:[...] and readFile fails), which made
          # discovery silently empty for as long as this pipeline existed.
          # No stderr suppression — metadata failures should be visible.
          nix --extra-experimental-features 'nix-command flakes' \
            flake metadata --json > /tmp/flake-meta.json;
          ALL=$(nix-instantiate --eval -E "builtins.concatStringsSep \" \" (builtins.attrNames (builtins.fromJSON (builtins.readFile /tmp/flake-meta.json)).locks.nodes.root.inputs)" | tr -d '"');
          INPUTS='';
          for i in $ALL; do
            case ",$SKIP," in *",$i,"*) continue ;; esac;
            INPUTS="$INPUTS $i";
          done;
          echo "Updating inputs:$INPUTS";
          echo "Skipping: $SKIP";
          # Empty INPUTS would make `nix flake update` update *all* inputs,
          # including the ones we meant to skip — fail loudly instead.
          [ -n "$INPUTS" ] || { echo "no inputs discovered; refusing bare flake update" >&2; exit 1; };
          nix --extra-experimental-features 'nix-command flakes' \
            flake update $INPUTS --accept-flake-config
          SH

      - name: Commit and push lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet nixos/ringtail/flake.lock; then
            echo "flake.lock is already up to date; nothing to push"
            exit 0
          fi

          git config user.name "Forgejo Actions"
          git config user.email "actions@forge.ops.eblu.me"
          git add nixos/ringtail/flake.lock
          git commit -m "Update ringtail flake inputs (flake-update workflow)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Pushed lockfile update to ${GITHUB_REF_NAME}"

      - name: Summary
        run: |
          echo "================================================"
          echo "Ringtail flake update on branch: ${GITHUB_REF_NAME}"
          echo "================================================"
          echo ""
          git --no-pager log -1 --stat -- nixos/ringtail/flake.lock || true
          echo ""
          echo "Next steps (human, from gilbert, after merge):"
          echo "  mise run provision-ringtail"
          echo "Then check for a pending kernel update (see manage-lockfile docs)."
