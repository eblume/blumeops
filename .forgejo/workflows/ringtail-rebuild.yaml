# ringtail-rebuild — apply a bound blumeops SHA to ringtail (nixos-rebuild switch).
#
# Request via `mise run request-run ringtail-rebuild.yaml <full-sha> -i revision=<sha>`.
# The job runs on the priv runner (ringtail itself); its only root path is
# starting the root template unit ringtail-apply@<sha>.service, which a polkit
# rule in nixos/ringtail/configuration.nix permits for exactly that unit shape
# (the runner is a DynamicUser service — NoNewPrivileges is implied, so sudo
# cannot work from a job). The unit runs /etc/ringtail-apply/apply, which
# checks out the bound SHA in /etc/blumeops and drives the detached
# blumeops-nixos-rebuild unit, the same pattern as ansible/playbooks/ringtail.yml.
# Full provision-ringtail stays class: deny.
#
# Injection posture: the dispatch input is only ever read through `env:` —
# never into a checkout ref or shell text. The validate step is the first
# place it is interpreted and fails closed; the checkout is of main
# (reviewed state), never of the bound revision; and the apply wrapper
# re-validates as the root-side authority.
#
# The contract is "apply a commit merged to main": the workflow pre-flights it
# unprivileged, and the wrapper enforces it as the authority (ancestry of
# origin/main after its fetch).
# If the applied commit restarts the priv runner unit itself, this job is
# killed mid-rebuild; the rebuild continues detached — re-run to confirm the outcome.
#
# Docs: docs/explanation/warrant-approval-gated-runs.md
name: ringtail-rebuild

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full 40-char blumeops commit to apply to ringtail'
        required: true
        type: string

jobs:
  rebuild:
    runs-on: priv
    steps:
      # The raw dispatch input reaches this job only as an environment
      # variable. This step is the single fail-closed shape gate: a value
      # that is not exactly 40 lowercase hex chars stops the job before
      # anything privileged or networked runs. The error names the input
      # length, not the value — the value is untrusted text and must not
      # reach the run log.
      - name: Validate revision input
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          # Length and whole-line content together close the newline hole a
          # bare line-based regex leaves: a value shorter or longer than 40
          # chars, or split across lines, cannot pass both.
          if [ "${#REVISION}" -ne 40 ] || ! printf '%s' "$REVISION" | grep -qxE '^[0-9a-f]{40}$'; then
            echo "::error::revision must be a full 40-char lowercase sha (input length: ${#REVISION})"
            echo "::error::approvals bind to immutable SHAs — see docs/how-to/operations/request-a-privileged-run.md"
            exit 1
          fi

      # The bound revision never reaches a git ref: the checkout is of main.
      # Full history — the ancestry pre-flight below needs main's line, and a
      # depth-1 fetch would make it pass only for main's live tip.
      - name: Check out main (reviewed state)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Fail fast, unprivileged, before ringtail is touched: the SHA must be
      # an ancestor of main. Not the authority — the wrapper re-checks
      # origin/main in /etc/blumeops as root, and that checkout is what the
      # rebuild actually runs.
      - name: Verify bound revision is on main
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if ! git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$REVISION^{commit}" origin/main; then
            echo "::error::$REVISION is not a commit merged to main"
            echo "::error::the approved SHA must be merged to main before it can be applied"
            exit 1
          fi

      - name: Apply to ringtail
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          # Re-validate at the privileged boundary; the wrapper validates
          # again as the root-side authority.
          if [ "${#REVISION}" -ne 40 ] || ! printf '%s' "$REVISION" | grep -qxE '^[0-9a-f]{40}$'; then
            echo "::error::revision failed re-validation"
            exit 1
          fi
          systemctl=/run/current-system/sw/bin/systemctl
          unit="ringtail-apply@${REVISION}.service"
          log="/var/log/ringtail-apply/${REVISION}.log"
          # The log appends across runs of the same sha; remember where this
          # run's output starts so only it is echoed below.
          before=$(stat -c %s "$log" 2>/dev/null || echo 0)
          # Root boundary: polkit lets gitea-runner *start* this instance and
          # nothing else. --wait blocks until the oneshot finishes and exits
          # non-zero if it failed; a denial ("interactive authentication
          # required") fails here too, before any verdict is read.
          rc=0
          "$systemctl" start --wait "$unit" || rc=$?
          if [ -r "$log" ]; then
            echo "--- $log"
            tail -c +"$((before + 1))" "$log"
          fi
          result=$("$systemctl" show -p Result --value "$unit")
          if [ "$rc" -ne 0 ] || [ "$result" != "success" ]; then
            echo "::error::$unit did not succeed (systemctl rc=$rc, Result=$result)"
            exit 1
          fi
